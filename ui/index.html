<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="CardDemo — mainframe-modernization walking skeleton" />
    <title>CardDemo</title>

    <!-- MUI default typography: Roboto (weights 300/400/500/700 used by the MUI v9 theme in app/theme/theme.ts). Loaded from the Google Fonts CDN; no npm font packages are used. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    />
  </head>
  <body>
    <!-- React mount node. app/main.tsx calls createRoot(document.getElementById('root')!). -->
    <div id="root"></div>
    <!-- Vite-root-relative ES module entry (root is ui/); bootstraps the React 19 SPA. -->
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
