# =============================================================================
# CardDemo Walking Skeleton — shared nginx security response headers
# -----------------------------------------------------------------------------
# Installed into the UI image at /etc/nginx/snippets/security-headers.conf and
# pulled in with `include` from ui/nginx.conf.
#
# WHY THIS FILE EXISTS (nginx add_header inheritance):
#   nginx inherits `add_header` directives into a location ONLY IF that location
#   declares NO add_header of its own — inheritance is all-or-nothing per level.
#   The moment a location adds its own header (e.g. a per-asset `Cache-Control`
#   for finding P7-PERF), it STOPS inheriting the server-level security headers,
#   which would silently drop CSP, X-Frame-Options, X-Content-Type-Options,
#   Referrer-Policy and Permissions-Policy from that response. Losing
#   `Referrer-Policy: no-referrer` is especially dangerous here because it is the
#   header that stops a card-number-bearing URL from leaking as a Referer.
#
#   Rather than copy-paste the header set into every such location, it is defined
#   ONCE here and `include`d at the server scope AND inside every location that
#   sets its own add_header. This keeps the security posture identical across all
#   responses (finding M06) while allowing per-location caching/logging tuning.
#
# These headers were previously declared inline in nginx.conf; the values are
# preserved verbatim (single source of truth — edit them here only).
# =============================================================================

# Content-Security-Policy tuned for this exact stack (React 19 + MUI v9 +
# Emotion, built by Vite and served same-origin):
#   * script-src 'self'            — Vite emits EXTERNAL module scripts; no
#                                     inline <script> is used.
#   * style-src 'self' 'unsafe-inline'
#                                  — Emotion (MUI's styling engine) injects
#                                     runtime <style> tags with inline CSS, so
#                                     'unsafe-inline' for STYLES is required.
#   * img-src / font-src 'self' data:
#                                  — allow data: URIs (inlined SVG icons,
#                                     favicon, and any base64 assets/fonts).
#   * connect-src 'self'           — the SPA only calls the same-origin /api.
#   * object-src 'none', base-uri 'self', form-action 'self',
#     frame-ancestors 'none'       — lock down plugins, base-tag hijacking,
#                                     form exfiltration, and framing.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Defense-in-depth clickjacking protection alongside CSP frame-ancestors.
add_header X-Frame-Options "DENY" always;
# Disable MIME sniffing so browsers honor the declared Content-Type.
add_header X-Content-Type-Options "nosniff" always;
# Do not leak the current URL (which may contain a card number) as a referrer.
add_header Referrer-Policy "no-referrer" always;
# Deny access to powerful browser features the skeleton never uses.
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
