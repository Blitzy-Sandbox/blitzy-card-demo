# =============================================================================
# CardDemo Walking Skeleton — UI production nginx server configuration
# -----------------------------------------------------------------------------
# Installed into the nginx:alpine "serve" stage of ui/Dockerfile at
#   /etc/nginx/conf.d/default.conf
# The stock /etc/nginx/nginx.conf `http {}` block does
#   include /etc/nginx/conf.d/*.conf;
# so this standalone `server {}` block is the correct scope (it replaces the
# image's default.conf).
#
# Responsibilities:
#   1. Serve the built React 19 SPA as static files, with client-side-routing
#      (React Router) deep-link fallback to index.html.
#   2. Reverse-proxy same-origin /api requests to the BFF aggregation service so
#      the browser never talks to a domain service directly (the UI binds ONLY
#      to the BFF). This is the production analog of the Vite dev-server proxy.
#
# Topology / coordination facts (verified against docker-compose.yml):
#   * This container listens on port 80 internally; compose maps
#     ${UI_PORT:-3000}:80 (host 3000 -> container 80).
#   * The BFF is the compose service `bff`, listening on 8080; every UI-facing
#     BFF path lives under /api (e.g. /api/cards/{cardNumber}, /api/auth/login,
#     /api/menu). `ui` depends_on `bff` (condition: service_healthy), so the
#     upstream name `bff` resolves at nginx startup.
# =============================================================================

# -----------------------------------------------------------------------------
# Access-log PAN suppression map (finding P7-LOG-PAN).
# Card-number-bearing URLs must never be written to the access log. `map` runs
# in the http context (this file is included inside the stock `http {}` block)
# and keys on $request_uri — the ORIGINAL request line, which is preserved
# across the try_files internal redirect that serves the SPA shell. The
# server-level `access_log ... if=$carddemo_loggable` below then skips the log
# entry whenever this evaluates to 0:
#   * ^/cards/     — SPA deep-links /cards/{cardNumber} and /cards/{...}/edit
#   * ^/api/cards/ — the BFF card-detail proxy route (its location also sets
#                    access_log off as belt-and-suspenders; covered here too)
# Everything else logs normally (default 1), preserving operational visibility
# for non-PAN routes (/, /signon, /assets, the card LIST /cards, other /api).
# -----------------------------------------------------------------------------
map $request_uri $carddemo_loggable {
    ~^/cards/       0;
    ~^/api/cards/   0;
    default         1;
}

server {
    # Container-internal listen port. docker-compose maps the host UI_PORT to
    # this port; do NOT listen on 3000 inside the container.
    listen       80;

    # Catch-all server name — this is the only/default server in the image.
    server_name  _;

    # Do not advertise the nginx version in responses or on error pages.
    server_tokens off;

    # Root of the compiled SPA. Matches the ui/Dockerfile COPY target (the Vite
    # build output is copied to /usr/share/nginx/html) and the nginx:alpine
    # default document root.
    root   /usr/share/nginx/html;
    index  index.html;

    # -------------------------------------------------------------------------
    # Security response headers (finding M06) are maintained in a single shared
    # snippet and pulled in with `include`. Declared here at the server scope so
    # every response carries them, including error pages and the proxied /api and
    # /api/cards/ responses (those locations set no add_header of their own, so
    # they inherit these unchanged).
    #
    # They are ALSO re-`include`d inside the SPA/asset locations below, which
    # must set their own Cache-Control/access_log: nginx drops all inherited
    # add_header directives from any location that declares even one add_header,
    # so without re-including here those responses would silently lose CSP,
    # X-Content-Type-Options, and (critically) Referrer-Policy: no-referrer — the
    # header that stops a card-number URL from leaking as a Referer. See the
    # snippet's header comment for the full rationale.
    # -------------------------------------------------------------------------
    include /etc/nginx/snippets/security-headers.conf;

    # -------------------------------------------------------------------------
    # Access logging with PAN suppression (finding P7-LOG-PAN). Overrides the
    # stock http-level access_log for this (only) server: log every request in
    # the standard `main` format EXCEPT those whose $request_uri the
    # $carddemo_loggable map flagged 0 (card-number-bearing routes), which are
    # dropped so no PAN is ever persisted to the access log. Error logging is
    # unaffected.
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/access.log main if=$carddemo_loggable;

    # -------------------------------------------------------------------------
    # Compression — a cheap bandwidth win for the JS/CSS/JSON/SVG the SPA ships.
    # (gzip is disabled in the stock nginx.conf, so it is enabled here.)
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain
                      text/css
                      application/javascript
                      application/json
                      image/svg+xml;

    # -------------------------------------------------------------------------
    # robots.txt — serve a real, valid static robots document (finding P5-SEO-01)
    # so GET /robots.txt returns robots text instead of falling through to the
    # SPA index.html (which crawlers/Lighthouse parse as an invalid robots file,
    # producing parse errors and a degraded SEO score). The file is COPYed into
    # the document root by ui/Dockerfile; this exact-match location serves it
    # ahead of the SPA catch-all. It carries no PAN, so it may be logged and is
    # safe to cache briefly. Security headers are re-included (this location sets
    # its own add_header).
    # -------------------------------------------------------------------------
    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Fingerprinted, content-addressed build assets (finding P7-PERF).
    # Vite hashes every filename under /assets (e.g. index-Bag6lAuY.js), so a
    # given URL's bytes never change — the assets are safe to cache permanently.
    # A long-lived immutable policy fixes the cold-cache penalty (assets
    # previously shipped with an ETag/Last-Modified but NO Cache-Control/Expires,
    # scoring 0 on the cold cache-lifetime audit). `=404` (NOT the SPA fallback)
    # so a missing hashed asset is a real 404 rather than silently returning
    # index.html. Security headers are re-included (this location sets its own
    # add_header — see the server-scope note above).
    # -------------------------------------------------------------------------
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # SPA client-side routing (catch-all).
    # Serve the requested file if it exists, else a matching directory, else fall
    # back to index.html so React Router deep links (e.g. /signon, /accounts/{id},
    # /transactions, /cards/{cardNumber}) render the SPA instead of returning 404.
    #
    # PAN-bearing deep-links (/cards/{cardNumber}[/edit]) are ALSO served here,
    # and their access logging is suppressed at the server scope via the
    # `$carddemo_loggable` map + `access_log ... if=` above (finding P7-LOG-PAN).
    # A per-location `access_log off` here would NOT work: try_files does an
    # internal redirect to /index.html, so nginx logs the request under whichever
    # location finally serves index.html using the ORIGINAL $request_uri (the one
    # carrying the PAN). Keying suppression off $request_uri — which is invariant
    # across the internal redirect — is the reliable fix.
    #
    # index.html is the SPA shell: it references the content-hashed assets above
    # and is rewritten on every deploy, so it must be REVALIDATED rather than
    # cached (finding P7-PERF: "short/no-cache for index"). `no-cache` = a client
    # may store it but must revalidate with the server before reuse. The security
    # headers are re-included because this location sets its own add_header.
    # -------------------------------------------------------------------------
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Reverse-proxy API traffic to the BFF.
    #
    # `proxy_pass http://bff:8080;` has NO URI part and NO trailing slash, and
    # there is NO `rewrite`, so nginx forwards the FULL original request URI
    # unchanged: /api/cards/1234 is proxied to http://bff:8080/api/cards/1234 —
    # the /api prefix is PRESERVED because the BFF serves its routes under /api.
    # (Writing `proxy_pass http://bff:8080/;` would replace the matched /api/
    #  prefix with "/" and break every BFF call, including the tracer.)
    #
    # nginx forwards inbound client request headers to the upstream by default,
    # so the correlation-ID hop (X-Correlation-ID) and the auth token
    # (Authorization: Bearer ...) survive this proxy on the way
    # UI -> BFF -> card-svc. The proxy_set_header lines below only ADD standard
    # forwarding metadata; they do NOT strip or override those headers.
    # -------------------------------------------------------------------------
    # -------------------------------------------------------------------------
    # Sensitive-route access-log suppression (finding P4-m05).
    #
    # The card-detail tracer path /api/cards/{cardNumber} carries the full card
    # number (PAN) in the request URI, and nginx's default access_log would record
    # that PAN in plaintext on every request line. This MORE-SPECIFIC prefix
    # location wins over /api/ (nginx selects the longest matching prefix), so
    # PAN-bearing card requests are proxied to the BFF exactly as /api/ below but
    # with access logging DISABLED — no card number is ever written to the access
    # log. Error logging is unaffected, and non-PAN /api routes still log via /api/.
    #
    # It must proxy IDENTICALLY to /api/ (nginx does not inherit proxy_* directives
    # between sibling locations); keep the two blocks in sync.
    # -------------------------------------------------------------------------
    location /api/cards/ {
        access_log off;

        proxy_pass          http://bff:8080;
        proxy_http_version  1.1;

        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;
    }

    location /api/ {
        proxy_pass          http://bff:8080;
        proxy_http_version  1.1;

        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # Explicit, conservative upstream timeouts for the real network hop to
        # the BFF (nginx's default 60s, stated here for operability).
        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;
    }
}
