#
# PROVENANCE. Supersedes the frozen z/OS build tooling: the compile
# procedures samples/proc/BUILDBAT.prc, BUILDBMS.prc and BUILDONL.prc
# and the templates samples/jcl/BATCMP.jcl, BMSCMP.jcl and CICCMP.jcl,
# none of which is ported. Authored per the Agent Action Plan in
# docs/technical-specifications.md sections 0.3.1.4, 0.4.1.1 and
# 0.5.1.1, at traceability anchor commit 7756d89.
#
# WHAT IT DOES. Single source of truth for this repository's Maven
# version. The launchers mvnw and mvnw.cmd read this exact path, fetch
# the pinned distribution, verify its SHA-256, cache it under
# MAVEN_USER_HOME/wrapper/dists and run Maven from there, so no Maven
# installation is required on the host.
#
# BUILD AND TEST.
#   ./mvnw --version           confirm Maven 3.9.11 on Java 25
#   ./mvnw clean compile -B    compile the Java sources
#   ./mvnw test -B             run the unit test tier
#   ./mvnw clean verify -B     full build with coverage and scans
#   mvnw.cmd clean verify      the same build on Windows
#
# KEYS AND DEFAULTS. All four values are explicit; none is derived.
#   wrapperVersion        provenance emitted by maven-wrapper-plugin
#                         for minimal-diff regeneration; the launchers
#                         do not read it.
#   distributionType      only-script keeps the lite launchers, so NO
#                         maven-wrapper.jar is committed or needed.
#   distributionUrl       immutable Maven Central coordinate over
#                         HTTPS, no mirror; must end in -bin.zip.
#   distributionSha256Sum 64 LOWERCASE hex digits, checked before
#                         Maven runs. mvnw.cmd lowercases the computed
#                         hash and compares verbatim, so uppercase
#                         breaks Windows yet passes on Linux.
# Credentials and mirror overrides come only from the environment
# (MVNW_USERNAME, MVNW_PASSWORD, MVNW_REPOURL, MVNW_VERBOSE); this
# file holds no secrets. Line endings are governed by .gitattributes.
#
# TROUBLESHOOTING.
#   checksum mismatch  build aborts and Maven never runs; when the
#                      pinned version changes, update the URL and this
#                      checksum together. Never blank or delete the
#                      checksum: an empty value silently disables
#                      verification altogether.
#   download failure   network or proxy blocked; nothing is installed.
#   wrong JDK          "release version 25 not supported" means
#                      JAVA_HOME is not a JDK 25.
#   permission denied  run chmod +x mvnw.
#   slow first build   a cold cache fetches about 9 MB once.
#   unzip missing      on Unix mvnw retargets the .tar.gz variant
#                      while this checksum pins the .zip, so
#                      verification fails although nothing is wrong.
#                      Install unzip; never repoint this file at
#                      .tar.gz, which the launcher rejects.
# ******************************************************************
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.zip
distributionSha256Sum=0d7125e8c91097b36edb990ea5934e6c68b4440eef4ea96510a0f6815e7eeadb
