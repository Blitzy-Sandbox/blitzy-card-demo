#
# Run `./mvnw --version` to report the pinned Maven and the JDK, then
# `./mvnw clean verify -B` for the full build; mvnw.cmd is the Windows
# launcher. Both read this exact path, cache the distribution under
# MAVEN_USER_HOME/wrapper/dists and run Maven from there. No version is
# repeated in prose anywhere, so nothing here can drift from the URL.
#
# All four keys below are explicit; none is derived.
#   wrapperVersion        emitted by maven-wrapper-plugin so that
#                         regeneration produces a minimal diff. The
#                         launchers do not read it.
#   distributionType      only-script keeps the lite launchers, so no
#                         maven-wrapper.jar is committed or needed.
#   distributionUrl       immutable Maven Central coordinate over
#                         HTTPS, no mirror. Must end in -bin.zip:
#                         the launchers expand a zip and never retarget
#                         a .tar.gz, falling back to the JDK jar tool
#                         when unzip is absent.
#   distributionSha256Sum 64 LOWERCASE hex digits, checked before Maven
#                         runs. mvnw.cmd lowercases the computed hash
#                         and compares verbatim, so an uppercase value
#                         breaks Windows while still passing on Linux.
#                         Never blank it: an empty value silently
#                         disables verification altogether. When the
#                         pinned version changes, update the URL and
#                         this checksum together.
#
# Credentials and mirror overrides come only from the environment
# (MVNW_USERNAME, MVNW_PASSWORD, MVNW_REPOURL, MVNW_VERBOSE); this file
# holds no secret. Line endings are governed by .gitattributes.
# COMPANION FILE: ../jvm.config. The distribution pinned below bundles
# Guice 5.1.0, which calls the terminally deprecated
# sun.misc.Unsafe::staticFieldBase and so emits four JVM warnings on
# every plugin invocation under JDK 25. Those warnings come from the
# build tool, not from the code being compiled, so a repository
# controlled JVM option in ../jvm.config suppresses them; both bin/mvn
# and bin/mvn.cmd read that file, which is why the default invocation
# is warning free on Unix and on Windows alike. That option is
# TEMPORARY and is deleted when this file is repointed at the first
# Maven 3.9.x release bundling Guice 7 or newer, which no longer calls
# the terminal API. Change distributionUrl, distributionSha256Sum and
# ../jvm.config in ONE commit; the full rationale and the tracked
# removal plan live in pom.xml under "Repository controlled JVM
# configuration".
#
# TROUBLESHOOTING.
#   checksum mismatch  build aborts and Maven never runs; when the
#                      pinned version changes, update the URL and this
#                      checksum together. Never blank or delete the
#                      checksum: an empty value silently disables
#                      verification altogether.
#   download failure   network or proxy blocked; nothing is installed.
#   wrong JDK          "release version 25 not supported" means
#                      JAVA_HOME is not a JDK 25.
#   permission denied  run chmod +x mvnw.
#   slow first build   a cold cache fetches about 9 MB once.
#   unzip missing      on Unix mvnw retargets the .tar.gz variant
#                      while this checksum pins the .zip, so
#                      verification fails although nothing is wrong.
#                      Install unzip; never repoint this file at
#                      .tar.gz, which the launcher rejects.
#   sun.misc.Unsafe    "WARNING: A terminally deprecated method in
#   warnings returned  sun.misc.Unsafe has been called" means
#                      ../jvm.config was not read: it is missing, or
#                      Maven was started outside the project base
#                      directory, or a launcher other than mvn/mvn.cmd
#                      started the JVM. Restore the file and run from
#                      the repository root; never redirect stderr to
#                      hide it, because the warning is the signal that
#                      tells you when the option is still needed.
#   "Could not find or "a comment or blank line was added to
#   load main class #" ../jvm.config. Every line there is passed to the
#                      JVM verbatim as a raw option, so that file holds
#                      one option and nothing else - unlike THIS file,
#                      which is a java.util.Properties file and does
#                      support # comments.
# ******************************************************************
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.zip
distributionSha256Sum=0d7125e8c91097b36edb990ea5934e6c68b4440eef4ea96510a0f6815e7eeadb
