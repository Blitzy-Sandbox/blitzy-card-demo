#
# USE. `./mvnw --version` reports the pinned Maven and the JDK; `./mvnw -B
# clean verify` runs the full build. mvnw.cmd is the Windows launcher. Both
# read this exact path and cache the distribution under
# MAVEN_USER_HOME/wrapper/dists.
#
# THE FOUR KEYS, all explicit and none derived.
#   wrapperVersion        emitted by maven-wrapper-plugin so regeneration
#                         produces a minimal diff; the launchers ignore it.
#   distributionType      only-script keeps the lite launchers, so no
#                         maven-wrapper.jar is committed or needed.
#   distributionUrl       immutable Maven Central coordinate over HTTPS, no
#                         mirror. MUST end in -bin.zip: the launchers expand a
#                         zip and fall back to the JDK jar tool when unzip is
#                         absent. Never repoint it at .tar.gz.
#   distributionSha256Sum 64 LOWERCASE hex digits, verified before Maven runs.
#                         mvnw.cmd lowercases the computed hash and compares
#                         verbatim, so an uppercase value breaks Windows while
#                         still passing on Linux. Never blank it - an empty
#                         value silently disables verification.
# Whenever the pinned version moves, change distributionUrl,
# distributionSha256Sum and ../jvm.config in ONE commit.
#
# JDK CONSTRAINT. The build targets release 25 and the enforcer requires
# [25,), so JAVA_HOME must be a JDK 25 or newer.
#
# COMPANION FILE ../jvm.config. The pinned distribution bundles a Guice that
# calls the terminally deprecated sun.misc.Unsafe::staticFieldBase, which emits
# JVM warnings on every plugin invocation under JDK 25. Those warnings come
# from the build tool, not the compiled code, so a repository-controlled option
# in ../jvm.config suppresses them; bin/mvn and bin/mvn.cmd both read it. The
# option is needed only for as long as the pinned distribution bundles such a
# Guice. Full rationale and retirement condition: pom.xml, "Repository
# controlled JVM configuration".
#
# TROUBLESHOOTING.
#   checksum mismatch   build aborts and Maven never runs - the URL and the
#                       checksum have drifted apart.
#   download failure    network or proxy blocked; nothing is installed.
#   wrong JDK           "release version 25 not supported" means JAVA_HOME is
#                       not a JDK 25.
#   permission denied   run chmod +x mvnw.
#   slow first build    a cold cache fetches about 9 MB once.
#   unzip missing       ordinarily nothing happens: ../../mvnw expands the
#                       pinned zip with $JAVA_HOME/bin/jar instead, and a JDK
#                       25 is already required, so the build proceeds and this
#                       checksum still governs. Only when NEITHER unzip nor the
#                       jar tool is reachable does the launcher stop, naming
#                       both. UPSTREAM Unix mvnw retargets the .tar.gz variant
#                       while the checksum pins the .zip, so verification there
#                       fails for no real fault; the committed launcher
#                       deliberately diverges from that - see mvnw:99-105 for the
#                       divergence, :374-395 for the jar fallback and :696-703
#                       for the refusal of any URL that does not end in
#                       apache-maven-<version>-bin.zip. Two consequences follow
#                       from the real behaviour: a checksum mismatch here means
#                       what it says and must not be diagnosed as a missing
#                       unzip, and pinning the .tar.gz is not an available
#                       workaround because the launcher rejects the URL.
#   sun.misc.Unsafe     ../jvm.config was not read: it is missing, Maven was
#   warnings appear     started outside the project base directory, or another
#                       launcher started the JVM. Never redirect stderr to hide
#                       it - the warning is the signal that the option is still
#                       needed.
#   "Could not find or  a comment or blank line was added to ../jvm.config.
#   load main class #"  Every line there is passed to the JVM verbatim as a raw
#                       option, unlike THIS file, which is a
#                       java.util.Properties file and does support # comments.
#
# Credentials and mirror overrides come only from the environment
# (MVNW_USERNAME, MVNW_PASSWORD, MVNW_REPOURL, MVNW_VERBOSE); this file holds
# no secret. Line endings are governed by .gitattributes.
# ******************************************************************
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.zip
distributionSha256Sum=0d7125e8c91097b36edb990ea5934e6c68b4440eef4ea96510a0f6815e7eeadb
