# =============================================================================
# Apache Maven Wrapper properties for the CardDemo COBOL -> Java/Spring Boot
# migration.
#
# This file pins the Apache Maven version used by `./mvnw` (POSIX) and
# `mvnw.cmd` (Windows) across every build environment touched by the project:
#
#   * developer laptops (macOS, Linux, Windows)
#   * GitHub Actions Linux runners (.github/workflows/build.yml)
#   * the multi-stage Docker build (`Dockerfile`)
#   * AWS Batch Fargate compute environments (Spring Batch jobs)
#   * the ECS Fargate runtime image (Spring Boot application)
#
# It is the single source of truth for Maven version consistency.
#
# -----------------------------------------------------------------------------
# AAP traceability
# -----------------------------------------------------------------------------
#
#   * AAP S0.2.1 / S0.3.1  -- `.mvn/wrapper/maven-wrapper.properties` is a
#                             CREATE target alongside `mvnw`, `mvnw.cmd`, and
#                             `.mvn/wrapper/maven-wrapper.jar`.
#   * AAP S0.5.1            -- "Apache Maven 3.8+" required as the build
#                             system. We pin to the 3.9.x stable line
#                             (currently 3.9.9) which satisfies the floor and
#                             is fully compatible with Spring Boot 3.x and
#                             Java 17+.
#   * AAP S0.7.1 / S0.7.3   -- Reproducibility discipline. The
#                             `distributionType=bin` mode (JAR-driven download)
#                             was deliberately selected over `only-script` for
#                             supply-chain integrity: the wrapper JAR is
#                             committed and verifies the Maven distribution
#                             via the SHA-256 below before unpacking.
#
# -----------------------------------------------------------------------------
# How the wrapper uses these properties
# -----------------------------------------------------------------------------
#
#   1. `mvnw` / `mvnw.cmd` find `.mvn/wrapper/maven-wrapper.jar` (committed to
#      the repository for reproducibility) and invoke
#      `java -cp .mvn/wrapper/maven-wrapper.jar org.apache.maven.wrapper.MavenWrapperMain`.
#   2. The wrapper JAR (org.apache.maven.wrapper.WrapperExecutor) loads this
#      file, reads `distributionUrl`, downloads the Maven distribution ZIP
#      into `~/.m2/wrapper/dists/<dist>/<hash>/` if not already cached.
#   3. The wrapper JAR verifies the downloaded ZIP against
#      `distributionSha256Sum`. A mismatch aborts the build with a
#      supply-chain integrity error -- this is intentional protection
#      against tampered Maven distributions.
#   4. The wrapper JAR unpacks the distribution and delegates to the
#      Apache Maven launcher.
#
# `wrapperVersion` and `distributionType` are metadata read by the
# `maven-wrapper-plugin` when regenerating the wrapper (`mvn wrapper:wrapper`)
# and are not consumed at runtime by the wrapper itself.
#
# -----------------------------------------------------------------------------
# How to bump the pinned Maven version
# -----------------------------------------------------------------------------
#
# Coordinated three-line update -- never edit any one of these in isolation:
#
#   1. Update `distributionUrl` to the new version's ZIP URL on
#      https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/
#      (HTTPS only; the official Apache Maven Central is the only acceptable
#      source).
#   2. Fetch the new SHA-256 with one of:
#        curl -sSL <distributionUrl> | sha256sum
#        # or compare against the Apache SHA-512 published at
#        # https://downloads.apache.org/maven/maven-3/<ver>/binaries/
#   3. Update `distributionSha256Sum` with the new lowercase 64-hex value.
#   4. (Optional) If also rotating the wrapper itself, regenerate via
#        ./mvnw wrapper:wrapper -Dtype=bin -Dmaven=<new-version>
#      which will refresh `wrapperVersion` and `.mvn/wrapper/maven-wrapper.jar`
#      in lockstep.
#   5. Verify locally with `./mvnw --version` (it should print the new
#      "Apache Maven <new-version>"), then commit all updated lines together
#      with a single descriptive commit message.
#
# DO NOT use Maven below 3.8.x (the AAP floor). Recommended floor is 3.9.x.
# DO NOT downgrade the wrapper JAR or change `distributionType` without
# regenerating the wrapper to keep the JAR and properties in lockstep.
# =============================================================================

wrapperVersion=3.3.4
distributionType=bin
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
distributionSha256Sum=4ec3f26fb1a692473aea0235c300bd20f0f9fe741947c82c1234cefd76ac3a3c
