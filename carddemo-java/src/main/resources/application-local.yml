# =====================================================================================
# CardDemo (Java) - 'local' Spring Profile (Docker Compose stack + LocalStack)
# =====================================================================================
# Activated by `SPRING_PROFILES_ACTIVE=local` (the docker-compose `app` service and the
# Dockerfile default both set it) or `-Dspring.profiles.active=local` /
# `./mvnw spring-boot:run -Plocal`. This file OVERLAYS application.yml: Spring Boot merges
# it over the base at the PROPERTY level, so only the keys that concretize local
# development are declared here. Everything else - application name, Hibernate dialect +
# UTC timestamps, HikariCP pool, Flyway baseline/validate, Spring Batch settings, actuator
# exposure (health,info,prometheus) + metric percentiles, CORS, JWT expiry, root log level
# - is inherited from application.yml. No COBOL equivalent (cross-cutting runtime config);
# traceability to the source workload is via commit SHA 27d6c6f.
#
# -------------------------------------------------------------------------------------
# ENDPOINT DEFAULTS = HOST-RUN LOCALHOST (published Docker Compose ports)
# -------------------------------------------------------------------------------------
# The defaults below target localhost so the documented host-run flow works out of the box
# with NO extra environment configuration, matching README / docs/onboarding-guide.md /
# docs/validation-gates.md (which run the app on the host JVM against infra in Docker):
#       docker compose up -d
#       ./mvnw spring-boot:run -Dspring.profiles.active=local
# The app then reaches the published compose ports on localhost
# (PostgreSQL 5432 | LocalStack 4566 | Jaeger OTLP/HTTP 4318), and the AWS endpoint resolves to
# http://localhost:4566 exactly as the onboarding/validation docs describe. The S3 bucket /
# SQS FIFO / SNS topic names still match ../../../localstack-init/init-aws.sh verbatim.
#
# IN-NETWORK (compose) RUN: when the app itself runs as the `app` service inside the compose
# network, ../../../docker-compose.yml injects the service-name overrides for every endpoint
# (SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/carddemo, AWS_ENDPOINT=
# http://localstack:4566, OTLP_ENDPOINT=http://jaeger:4318/v1/traces), so the in-network run needs no
# change to this file either:
#       docker compose --profile app up -d --build
# Every endpoint here is `${ENV_VAR:localhost-default}`, so the compose env-var injection (or
# a single manual export) switches a value without editing this file.
#
# -------------------------------------------------------------------------------------
# SECURITY (AAP 0.8.1 - no hardcoded credentials)
# -------------------------------------------------------------------------------------
# No secret is committed. The JWT signing key resolves solely from ${JWT_SECRET:} (empty
# default) and MUST be supplied via the JWT_SECRET env var before startup - SecurityConfig
# fails fast when the resolved key is shorter than the HS256 minimum (32 bytes). The AWS
# credentials are the well-known NON-SECRET LocalStack dummies (test/test). The only other
# literal is the local PostgreSQL password fallback (`carddemo`), a non-secret local-dev
# convenience matching the docker-compose POSTGRES_PASSWORD default; real environments
# inject SPRING_DATASOURCE_PASSWORD. The LocalStack PRO auth token (a container concern in
# docker-compose.yml) is NOT read by the app and is intentionally absent from this file.
#
# SCOPE: AWS-only (Environment 1 / LocalStack). The second attached emulator environment
# (Environment 2) is out of scope (AAP 0.3.2, 0.7.8, D-019); none of its keys appear here.
# Zero live AWS: every AWS endpoint targets LocalStack :4566.
# =====================================================================================

spring:
  # --- Datasource: PostgreSQL 16 published by docker-compose.yml ----------------------
  # Host-run default targets localhost:5432 (the published compose port), so the documented
  # `./mvnw spring-boot:run -Dspring.profiles.active=local` flow connects out of the box. The
  # docker-compose `app` service injects SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/
  # carddemo for the in-network run (see header). Replaces the VSAM KSDS datasets (ACCTDAT,
  # CARDDAT, CUSTDAT, CARDXREF, TRANSACT, USRSEC, ...) the z/OS DEFINE CLUSTER JCL provisioned.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${SPRING_DATASOURCE_USERNAME:carddemo}
    # Local-only, non-secret default. Prefers SPRING_DATASOURCE_PASSWORD, then the
    # POSTGRES_PASSWORD the postgres service reads, then the `carddemo` docker-compose
    # default - so a clean checkout connects out of the box. No production secret embedded.
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:carddemo}}
    driver-class-name: org.postgresql.Driver

  # --- JPA / Hibernate ----------------------------------------------------------------
  # Flyway owns the schema (VSAM->PostgreSQL). Hibernate must NEVER create or alter it -
  # only validate that the JPA entities match the Flyway-provisioned tables. SQL logging
  # stays off; logback-spring.xml handles structured output (keeps Gate-2 build clean).
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # --- Flyway (VSAM->PostgreSQL provisioning) -----------------------------------------
  # Runs on startup BEFORE the JPA EntityManagerFactory initializes, applying
  # V1__create_schema.sql -> V2__create_indexes.sql -> V3__seed_data.sql in strict order so
  # the schema (and the 9 ASCII seed fixtures) exist before any online or batch flow.
  flyway:
    enabled: true
    locations: classpath:db/migration

  # --- Spring Cloud AWS -> LocalStack (S3 / SQS / SNS) --------------------------------
  # Point every AWS client at the LocalStack container. Host-run default
  # http://localhost:4566 (the published compose port, exactly as the onboarding/validation
  # docs describe); the docker-compose `app` service injects AWS_ENDPOINT=http://localstack:4566
  # for the in-network run (see header). AwsConfig.java reads the GLOBAL
  # spring.cloud.aws.endpoint for all three clients; the per-service keys are declared for
  # Spring Cloud AWS 3.x autoconfig parity. Region and the non-secret LocalStack dummy
  # credentials (test/test) are restated here for local explicitness.
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      endpoint: ${AWS_ENDPOINT:http://localhost:4566}
      s3:
        endpoint: ${AWS_ENDPOINT:http://localhost:4566}
        # Mandatory for LocalStack: path-style addressing avoids the virtual-host
        # "bucket-name.<s3-host>" DNS form, which does not resolve against the emulator.
        path-style-access-enabled: true
      sqs:
        endpoint: ${AWS_ENDPOINT:http://localhost:4566}
      sns:
        endpoint: ${AWS_ENDPOINT:http://localhost:4566}

# --- Actuator & observability (local convenience) ------------------------------------
# The base profile guards health details (when_authorized); for local development show
# full component details so an unauthenticated `curl /actuator/health` returns the
# composite db / postgres / s3 / sqs indicators. Trace sampling is full (1.0) locally. The
# OTLP/HTTP exporter's host-run default targets the Jaeger OTLP/HTTP receiver on
# localhost:4318 at the /v1/traces path (the published compose port); the docker-compose `app`
# service injects OTLP_ENDPOINT=http://jaeger:4318/v1/traces for the in-network run (see header).
# Actuator endpoint exposure (health,info,prometheus) and metric percentiles are inherited from application.yml.
management:
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# --- Logging (local) -----------------------------------------------------------------
# Richer application-package output during local development; the root logger stays at INFO
# (inherited from application.yml). The structured JSON encoder / console layout is defined
# in logback-spring.xml (profile-aware), not here.
logging:
  level:
    com.carddemo: ${LOG_LEVEL_APP:DEBUG}

# =====================================================================================
# Application-scoped (carddemo.*) properties - bound by @ConfigurationProperties in the
# config/ layer (SecurityConfig, AwsConfig). These are NOT Spring framework keys. The AWS
# resource names are restated here for local explicitness and MUST match
# ../../../localstack-init/init-aws.sh and ../../../docker-compose.yml verbatim.
# =====================================================================================
carddemo:
  # --- Security / JWT (stateless; consumed by config/SecurityConfig.java) -------------
  # No signing key is committed (AAP 0.8.1 / CWE-798): the secret resolves solely from the
  # JWT_SECRET env var (empty default). Export a key of at least 32 bytes (the HS256 minimum)
  # before a local run. The token expiry (carddemo.security.jwt.expiration-seconds) is
  # inherited from application.yml and remains env-overridable.
  security:
    jwt:
      secret: ${JWT_SECRET:}

  # --- AWS resource names (consumed by config/AwsConfig.java + services) --------------
  # S3 replaces GDG/batch staging (DEFGDGB.jcl generation-data-groups -> versioned S3
  # objects); the SQS FIFO queue replaces the CICS TDQ WRITEQ TD report-submission bridge
  # (CORPT00C); SNS carries notification fan-out. Created by init-aws.sh on `docker compose up`.
  aws:
    s3:
      bucket-input: ${S3_BUCKET_INPUT:carddemo-batch-input}
      bucket-output: ${S3_BUCKET_OUTPUT:carddemo-batch-output}
      bucket-statements: ${S3_BUCKET_STATEMENTS:carddemo-statements}
    sqs:
      report-queue: ${SQS_REPORT_QUEUE:carddemo-report-jobs.fifo}
    sns:
      notifications-topic: ${SNS_NOTIFICATIONS_TOPIC:carddemo-notifications}
