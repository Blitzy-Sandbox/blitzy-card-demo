# transaction-svc — CardDemo walking skeleton
# Transaction bounded-context typed-stub service (List/View/Add endpoints are [DEFERRED]).
# Request-serving + health-gated + long-running (NOT reporting-exempt).
# Provenance: [SRC: COTRN00C/COTRN01C/COTRN02C | TRANSACT]
#   CT00 -> COTRN00C (List), CT01 -> COTRN01C (View), CT02 -> COTRN02C (Add)
#   over the TRANSACT VSAM KSDS (app/csd/CARDDEMO.CSD).
# All values are env-parameterized to match the root docker-compose.yml / .env.example;
# benign local defaults let the service also run standalone.
spring:
  application:
    name: transaction-svc
  mvc:
    problemdetails:
      # RFC 7807 rendering for Spring MVC error responses. With this enabled, framework-handled
      # validation failures (e.g. MethodArgumentNotValidException on request bodies) are rendered
      # as application/problem+json 400s, matching the frozen OpenAPI contract's error shape. The
      # sibling web/GlobalExceptionHandler additionally maps path/query ConstraintViolationException
      # (which the framework does NOT handle) to the same 400 problem+json envelope.
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@oracle:1521/FREEPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:carddemo}
    # No usable default: the password is REQUIRED and injected at runtime by
    # docker-compose from .env (APP_USER_PASSWORD). An EMPTY default makes the
    # datasource fail fast rather than run on a committed secret (finding P4-M11;
    # matches card/account/auth/useradmin/reporting).
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      # This service OWNS NO SCHEMA and declares NO @Entity. Never create/migrate/validate.
      ddl-auto: none
    # Set explicitly so the EntityManagerFactory does NOT require a live DB connection to
    # auto-detect the dialect at startup (starter-data-jpa is present but there are zero entities).
    database-platform: org.hibernate.dialect.OracleDialect
    open-in-view: false
  flyway:
    # The dedicated /db docker-compose Flyway step owns schema + seed. This service never migrates.
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  jackson:
    mapper:
      # QA API-04 (validation/security). Reject silent scalar coercion on inbound @RequestBody
      # deserialization (JSON number -> String, string "true" -> boolean, etc.) so a contract-invalid
      # request body is rejected with 400 rather than coerced and accepted as 200/201.
      allow-coercion-of-scalars: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # /actuator/health backs the docker-compose healthcheck and the service_healthy gate.
      # 'never' keeps the committed config conservative; the dev override may set 'always'.
      show-details: never

# Correlation-ID header name consumed by the sibling config/CorrelationIdFilter (OncePerRequestFilter + MDC).
# Standardized 'carddemo.correlation.header' key across every service in the topology
# (auth/account/card/payment/useradmin/reporting/bff); the filter reads it via
# @Value("${carddemo.correlation.header:X-Correlation-ID}"). Compose env CORRELATION_HEADER binds here.
carddemo:
  correlation:
    header: ${CORRELATION_HEADER:X-Correlation-ID}

logging:
  pattern:
    # %X{correlationId} surfaces the MDC correlation id (set by CorrelationIdFilter) on every log line,
    # making the real UI -> BFF -> transaction-svc hop observable. Default to '-' when absent.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name:transaction-svc}] [%X{correlationId:-}] %logger{36} - %msg%n"

---
# 'docker' profile (docker-compose sets SPRING_PROFILES_ACTIVE=docker). This document
# carries NO meaningful deltas: every runtime value is supplied by environment variables
# injected by docker-compose (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD, SPRING_FLYWAY_ENABLED, CORRELATION_HEADER, SERVER_PORT).
# It exists only to document intent and to avoid any "profile not found" confusion.
spring:
  config:
    activate:
      on-profile: docker
