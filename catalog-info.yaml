apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: blitzy-card-demo
  description: "AWS CardDemo COBOL/CICS/VSAM mainframe application migrated to Java 17+ / Spring Boot 3.x on AWS-native services (ECS Fargate, RDS Multi-AZ PostgreSQL, MSK, ElastiCache, S3, Step Functions, AWS Batch). PCI-DSS aligned. Demo-ready by May 20, 2026."
  tags:
    # Generic platform tags
    - java
    - spring-boot
    - aws
    - cobol-migration
    - mainframe-modernization
    - postgresql
    - kafka
    - terraform
    - docker
    # Specific version / platform tags (QA CP12 Issue 10):
    # surfaced separately so Backstage facet search can filter the
    # catalog by Java major version, Spring Boot major version, and the
    # AWS-native deployment paradigm.
    - java-17
    - spring-boot-3
    - aws-native
  labels:
    blitzy.com/language: java
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: Blitzy-Sandbox/blitzy-card-demo
    backstage.io/source-location: url:https://github.com/Blitzy-Sandbox/blitzy-card-demo/tree/main/
  links:
    - url: https://github.com/Blitzy-Sandbox/blitzy-card-demo
      title: GitHub Repository
    - url: https://github.com/Blitzy-Sandbox/blitzy-card-demo/pull/1
      title: "PR #1: COBOL to Java 17+ / Spring Boot 3.x Migration"
      icon: github
    # QA CP12 Issue 9: previous link pointed to a non-existent
    # blitzy/documentation/ tree path (returned 404). The actual
    # documentation root is docs/ (mkdocs-served via docs/index.md,
    # docs/project-guide.md, docs/technical-specifications.md).
    - url: https://github.com/Blitzy-Sandbox/blitzy-card-demo/tree/main/docs
      title: Project Documentation (docs/)
      icon: docs
    - url: https://github.com/Blitzy-Sandbox/blitzy-card-demo/blob/main/infrastructure/README.md
      title: Infrastructure-as-Code Reference (Terraform)
      icon: docs
spec:
  type: service
  lifecycle: experimental
  owner: blitzy-sandbox
  system: card-demo-migration
