---

# Every mainframe dataset name, record width and batch job contract the module ADDRESSES is configured
# here and nowhere else: no dataset name and no record width is configured in Java, so a deployment
# relocates a dataset or corrects a width by editing this document alone (gate G46).
#
# Java is not silent about widths and DD names, and deliberately so. A writer states the LRECL its JCL
# declares - DalyRejectWriter 430, TranReportWriter 133 - and a job states the DD names its own JCL step
# names, and each is checked against the binding at startup: a DALYREJS bound at 429 is refused with the
# source line that fixes the number, rather than writing a record no mainframe step could read. Those
# constants are cross-checks on this document, never a second place a value is chosen. One dataset name
# does appear in Java, in ReportRequestController: AWS.M2.CARDDEMO.PROC is a card inside the 80-byte JCL
# skeleton CORPT00C composes (app/cbl/CORPT00C.cbl:90), so it is submitted text this migration reproduces
# byte for byte - not a dataset this module opens.
spring:
  application:
    name: carddemo

  datasource:
    # Deployment-time inputs, empty by design: this module pins no JDBC driver, because the CardDemo
    # datasets are VSAM and sequential files and indexed VSAM has no published driver. With no URL the
    # application refuses to start rather than falling back to an embedded database.
    url: "${CARDDEMO_DATASOURCE_URL:}"
    username: "${CARDDEMO_DATASOURCE_USERNAME:}"
    password: "${CARDDEMO_DATASOURCE_PASSWORD:}"
    driver-class-name: "${CARDDEMO_DATASOURCE_DRIVER_CLASS_NAME:}"
    hikari:
      pool-name: carddemo-pool
      maximum-pool-size: ${CARDDEMO_DATASOURCE_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${CARDDEMO_DATASOURCE_MINIMUM_IDLE:2}
      connection-timeout: ${CARDDEMO_DATASOURCE_CONNECTION_TIMEOUT_MS:30000}
    # Pool sizes are left at their defaults: this is a like-for-like translation, not a tuning exercise.
      auto-commit: false

  # No job runs on context start; each job is launched explicitly, as its JCL invoked its program. The
  # Batch metadata schema is never created here either: this module issues no DDL at all.
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
      table-prefix: BATCH_

  sql:
    init:
      mode: never

  jackson:
    default-property-inclusion: always
    serialization:
      indent-output: false
      write-dates-as-timestamps: false
    deserialization:
    # An unrecognised payload member is refused rather than ignored, so a client cannot silently send a
    # field this screen does not have.
      fail-on-unknown-properties: true

# address defaults to loopback rather than to every interface: this artifact refuses to start without a
# deployment-supplied datasource, so it is not turn-key by design, and it authenticates nothing of its
# own. forward-headers-strategy defaults to none, so X-Forwarded-* is ignored unless a deployment states
# it sits behind a terminator it trusts. No keystore can ship in a repository, so ssl.enabled defaults to
# false and the rest of the TLS contract is read from the environment (SERVER_SSL_KEY_STORE and friends);
# TLS is REQUIRED for any deployment carrying real cardholder data. The bounds below are the container's
# half of the request limits - config/WebConfig.java's StreamReadConstraints are the parser's half, and
# every value sits far above anything a 24x80 screen can produce.
server:
  port: ${CARDDEMO_SERVER_PORT:8080}
  address: ${CARDDEMO_SERVER_ADDRESS:127.0.0.1}
  forward-headers-strategy: ${CARDDEMO_FORWARD_HEADERS_STRATEGY:none}
  max-http-request-header-size: ${CARDDEMO_MAX_REQUEST_HEADER_SIZE:16KB}
  ssl:
    enabled: ${CARDDEMO_SERVER_SSL_ENABLED:false}
  tomcat:
    max-http-form-post-size: ${CARDDEMO_MAX_FORM_POST_SIZE:64KB}
    max-swallow-size: ${CARDDEMO_MAX_SWALLOW_SIZE:2MB}
    max-parameter-count: ${CARDDEMO_MAX_PARAMETER_COUNT:64}
    connection-timeout: ${CARDDEMO_CONNECTION_TIMEOUT:20s}
  servlet:
    context-path: ${CARDDEMO_SERVER_CONTEXT_PATH:/}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    whitelabel:
      enabled: false

carddemo:

  # Named explicitly, never taken from the platform default: IBM037 for EBCDIC datasets, US-ASCII for
  # the ASCII fixtures.
  charset:
    ebcdic: IBM037
    ascii: US-ASCII
    dataset: IBM037

  cics:
    applid: ${CARDDEMO_CICS_APPLID}
    sysid: ${CARDDEMO_CICS_SYSID}

  # The key that seals a program's own communication area. COACTUPC and COCRDUPC are two-phase writers:
  # the first turn records that every edit passed and the second writes on that record, so the state
  # travels to the client and back and must return unforged. At least 32 characters; never committed,
  # never defaulted.
  conversation-state:
    secret: ${CARDDEMO_CONVERSATION_STATE_SECRET}

  # CHARACTER requires the backend to give the record-image column a bytewise collation, because a keyed
  # read composes a positional LIKE over it and a browse composes ORDER BY it. BINARY needs no such
  # guarantee. Bound with a bare placeholder and no ":" fallback, exactly as the JDBC URL is: a default
  # would let a deployment that never named its driver's record-image type start anyway and hand every
  # record to a conversion nobody chose. See docs/project-guide.md for the deployment checklist.
  record-image:
    form: ${CARDDEMO_RECORD_IMAGE_FORM}

  # The ordinal that reproduces physical-sequential read order. Required and defaulted for the same
  # reason: a default would let a deployment that never named its ordinal read every PS dataset in
  # whatever order its backend happened to scan.
  physical-sequence:
    expression: ${CARDDEMO_PHYSICAL_SEQUENCE_EXPRESSION}

  # Keyed by DD name. Each entry's record-length is the copybook width or the JCL LRECL, and both are
  # load-bearing: a wrong width shifts every field offset in the record.
  datasets:

    ACCTDAT:
      dsname: ${CARDDEMO_DATASET_ACCTDAT:AWS.M2.CARDDEMO.ACCTDATA.VSAM.KSDS}
      organization: ksds
      record-format: FB
      record-length: 300
      copybook: CVACT01Y
      key-length: 11

    CARDDAT:
      dsname: ${CARDDEMO_DATASET_CARDDAT:AWS.M2.CARDDEMO.CARDDATA.VSAM.KSDS}
      organization: ksds
      record-format: FB
      record-length: 150
      copybook: CVACT02Y
      key-length: 16

    CARDAIX:
      dsname: ${CARDDEMO_DATASET_CARDAIX:AWS.M2.CARDDEMO.CARDDATA.VSAM.AIX.PATH}
      organization: aix-path
      base: CARDDAT
      alternate-key: CARD-ACCT-ID
      record-format: FB
      record-length: 150
      copybook: CVACT02Y
      key-length: 11
      key-offset: 16

    CCXREF:
      dsname: ${CARDDEMO_DATASET_CCXREF:AWS.M2.CARDDEMO.CARDXREF.VSAM.KSDS}
      organization: ksds
      record-format: FB
      record-length: 50
      copybook: CVACT03Y
      key-length: 16

    CXACAIX:
      dsname: ${CARDDEMO_DATASET_CXACAIX:AWS.M2.CARDDEMO.CARDXREF.VSAM.AIX.PATH}
      organization: aix-path
      base: CCXREF
      alternate-key: XREF-ACCT-ID
      record-format: FB
      record-length: 50
      copybook: CVACT03Y
      key-length: 11
      key-offset: 25

    CUSTDAT:
      dsname: ${CARDDEMO_DATASET_CUSTDAT:AWS.M2.CARDDEMO.CUSTDATA.VSAM.KSDS}
      organization: ksds
      record-format: FB
      record-length: 500
      copybook: CVCUS01Y
      key-length: 9

    TRANSACT:
      dsname: ${CARDDEMO_DATASET_TRANSACT:AWS.M2.CARDDEMO.TRANSACT.VSAM.KSDS}
      organization: ksds
      record-format: FB
      record-length: 350
      copybook: CVTRA05Y
      key-length: 16
      reusable: false

    USRSEC:
      dsname: ${CARDDEMO_DATASET_USRSEC:AWS.M2.CARDDEMO.USRSEC.VSAM.KSDS}
      organization: ksds
      record-format: FB
      record-length: 80
      copybook: CSUSR01Y
      key-length: 8
      reusable: true

    ACCTFILE:
      dsname: ${CARDDEMO_DATASET_ACCTFILE:AWS.M2.CARDDEMO.ACCTDATA.VSAM.KSDS}
      organization: ksds
      record-format: FB
      record-length: 300
      copybook: CVACT01Y
      key-length: 11

    CARDFILE:
      dsname: ${CARDDEMO_DATASET_CARDFILE:AWS.M2.CARDDEMO.CARDDATA.VSAM.KSDS}
      organization: ksds
      record-format: FB
      record-length: 150
      copybook: CVACT02Y
      key-length: 16

    CUSTFILE:
      dsname: ${CARDDEMO_DATASET_CUSTFILE:AWS.M2.CARDDEMO.CUSTDATA.VSAM.KSDS}
      organization: ksds
      record-format: FB
      record-length: 500
      copybook: CVCUS01Y
      key-length: 9

    XREFFILE:
      dsname: ${CARDDEMO_DATASET_XREFFILE:AWS.M2.CARDDEMO.CARDXREF.VSAM.KSDS}
      organization: ksds
      record-format: FB
      record-length: 50
      copybook: CVACT03Y
      key-length: 16

    XREFFIL1:
      dsname: ${CARDDEMO_DATASET_XREFFIL1:AWS.M2.CARDDEMO.CARDXREF.VSAM.AIX.PATH}
      organization: aix-path
      base: CCXREF
      alternate-key: XREF-ACCT-ID
      record-format: FB
      record-length: 50
      copybook: CVACT03Y
      key-length: 11
      key-offset: 25

    CARDXREF:
      dsname: ${CARDDEMO_DATASET_CARDXREF:AWS.M2.CARDDEMO.CARDXREF.VSAM.KSDS}
      organization: ksds
      record-format: FB
      record-length: 50
      copybook: CVACT03Y
      key-length: 16

    TRANFILE:
      dsname: ${CARDDEMO_DATASET_TRANFILE:AWS.M2.CARDDEMO.TRANSACT.VSAM.KSDS}
      organization: ksds
      record-format: FB
      record-length: 350
      copybook: CVTRA05Y
      key-length: 16
      reusable: false

    DALYTRAN:
      dsname: ${CARDDEMO_DATASET_DALYTRAN:AWS.M2.CARDDEMO.DALYTRAN.PS}
      organization: sequential
      record-format: FB
      record-length: 350
      copybook: CVTRA06Y

    DALYREJS:
      dsname: ${CARDDEMO_DATASET_DALYREJS:AWS.M2.CARDDEMO.DALYREJS(+1)}
      organization: sequential
      gdg: true
      record-format: F
      block-size: 0
      record-length: 430

    TCATBALF:
      dsname: ${CARDDEMO_DATASET_TCATBALF:AWS.M2.CARDDEMO.TCATBALF.VSAM.KSDS}
      organization: ksds
      record-format: FB
      record-length: 50
      key-length: 17
      copybook: CVTRA01Y

    DISCGRP:
      dsname: ${CARDDEMO_DATASET_DISCGRP:AWS.M2.CARDDEMO.DISCGRP.VSAM.KSDS}
      organization: ksds
      record-format: FB
      record-length: 50
      copybook: CVTRA02Y
      key-length: 16

    TRANTYPE:
      dsname: ${CARDDEMO_DATASET_TRANTYPE:AWS.M2.CARDDEMO.TRANTYPE.VSAM.KSDS}
      organization: ksds
      record-format: FB
      record-length: 60
      copybook: CVTRA03Y
      key-length: 2

    TRANCATG:
      dsname: ${CARDDEMO_DATASET_TRANCATG:AWS.M2.CARDDEMO.TRANCATG.VSAM.KSDS}
      organization: ksds
      record-format: FB
      record-length: 60
      copybook: CVTRA04Y
      key-length: 6

    DATEPARM:
      dsname: ${CARDDEMO_DATASET_DATEPARM:AWS.M2.CARDDEMO.DATEPARM}
      organization: sequential
      record-length: 80

    TRNXFILE:
      dsname: ${CARDDEMO_DATASET_TRNXFILE:AWS.M2.CARDDEMO.TRXFL.VSAM.KSDS}
      organization: ksds
      record-format: FB
      record-length: 350
      key-length: 32
      copybook: COSTM01

    TRANREPT:
      dsname: ${CARDDEMO_DATASET_TRANREPT:AWS.M2.CARDDEMO.TRANREPT(+1)}
      organization: sequential
      gdg: true
      record-format: FB
      block-size: 0
      record-length: 133
      copybook: CVTRA07Y

    STMTFILE:
      dsname: ${CARDDEMO_DATASET_STMTFILE:AWS.M2.CARDDEMO.STATEMNT.PS}
      organization: sequential
      record-format: FB
      block-size: 8000
      record-length: 80

    HTMLFILE:
      dsname: ${CARDDEMO_DATASET_HTMLFILE:AWS.M2.CARDDEMO.STATEMNT.HTML}
      organization: sequential
      record-format: FB
      block-size: 800
      record-length: 100

    SYSTRAN:
      dsname: ${CARDDEMO_DATASET_SYSTRAN:AWS.M2.CARDDEMO.SYSTRAN(+1)}
      organization: sequential
      gdg: true
      record-format: F
      block-size: 0
      record-length: 350
      copybook: CVTRA05Y

  # One entry per batch job, with the steps of its JCL in order. require-preceding-exit-code-zero is the
  # COND=(0,NE) gate: the step runs only if every prior step ended with exit code zero.
  jobs:

    account-balance-job:
      program: CBACT01C
      parameters: []
      steps:
        - name: STEP05
          program: CBACT01C
          require-preceding-exit-code-zero: false

    account-balance-reader-job:
      program: CBACT02C
      parameters: []
      steps:
        - name: STEP05
          program: CBACT02C
          require-preceding-exit-code-zero: false

    account-balance-update-job:
      program: CBACT03C
      parameters: []
      steps:
        - name: STEP05
          program: CBACT03C
          require-preceding-exit-code-zero: false

    customer-file-reader-job:
      program: CBCUS01C
      parameters: []
      steps:
        - name: STEP05
          program: CBCUS01C
          require-preceding-exit-code-zero: false

    account-interest-calc-job:
      program: CBACT04C
      parameters:
        - name: parmDate
          type: string
          value: ${CARDDEMO_JOB_PARM_DATE:2022071800}
      steps:
        - name: STEP15
          program: CBACT04C
          require-preceding-exit-code-zero: false
      datasets:
        TRANSACT:
          alias: SYSTRAN

    transaction-validation-job:
      program: CBTRN02C
      parameters: []
      steps:
        - name: STEP15
          program: CBTRN02C
          require-preceding-exit-code-zero: false
      datasets:
        TRANFILE:
          alias: TRANSACT

    transaction-report-job:
      program: CBTRN03C
      parameters: []
      date-range-source: DATEPARM
      steps:
        - name: STEP01R
          program: IDCAMS
          require-preceding-exit-code-zero: false
        - name: STEP05R
          program: SORT
          require-preceding-exit-code-zero: false
        - name: STEP10R
          program: CBTRN03C
          require-preceding-exit-code-zero: false
      datasets:
        FILEIN:
          alias: TRANSACT
        FILEOUT:
          dsname: ${CARDDEMO_DATASET_TRANSACT_BKUP:AWS.M2.CARDDEMO.TRANSACT.BKUP(+1)}
          organization: sequential
          gdg: true
          record-format: FB
          block-size: 0
          record-length: 350
          copybook: CVTRA05Y
        SORTIN:
          dsname: ${CARDDEMO_DATASET_TRANSACT_BKUP:AWS.M2.CARDDEMO.TRANSACT.BKUP(+1)}
          organization: sequential
          gdg: true
          record-format: FB
          block-size: 0
          record-length: 350
          copybook: CVTRA05Y
        SORTOUT:
          dsname: ${CARDDEMO_DATASET_TRANSACT_DALY:AWS.M2.CARDDEMO.TRANSACT.DALY(+1)}
          organization: sequential
          gdg: true
          record-format: FB
          block-size: 0
          record-length: 350
          copybook: CVTRA05Y
        TRANFILE:
          dsname: ${CARDDEMO_DATASET_TRANSACT_DALY:AWS.M2.CARDDEMO.TRANSACT.DALY(+1)}
          organization: sequential
          gdg: true
          record-format: FB
          block-size: 0
          record-length: 350
          copybook: CVTRA05Y

    statement-generation-job-a:
      program: CBSTM03A
      parameters: []
      steps:
        - name: DELDEF01
          program: IDCAMS
          require-preceding-exit-code-zero: false
        - name: STEP010
          program: SORT
          require-preceding-exit-code-zero: false
        - name: STEP020
          program: IDCAMS
          require-preceding-exit-code-zero: true
        - name: STEP030
          program: IEFBR14
          require-preceding-exit-code-zero: true
        - name: STEP040
          program: CBSTM03A
          require-preceding-exit-code-zero: true
      datasets:
        SORTIN:
          alias: TRANSACT
        SORTOUT:
          dsname: ${CARDDEMO_DATASET_TRXFL_SEQ:AWS.M2.CARDDEMO.TRXFL.SEQ}
          organization: sequential
          record-format: FB
          block-size: 3500
          record-length: 350
          copybook: COSTM01
        INFILE:
          dsname: ${CARDDEMO_DATASET_TRXFL_SEQ:AWS.M2.CARDDEMO.TRXFL.SEQ}
          organization: sequential
          record-format: FB
          block-size: 3500
          record-length: 350
          copybook: COSTM01
        OUTFILE:
          alias: TRNXFILE

    transaction-posting-job:
      program: CBTRN01C
      parameters: []
      steps:
        - name: STEP01
          program: CBTRN01C
          require-preceding-exit-code-zero: false

  # CICS had a transient data queue here; the port writes the same 80-byte records instead. MOD because
  # the CSD defines the queue as append-mode, and approved-root confines where a submission may land.
  job-submission:
    queue-name: JOBS
    dd-name: INREADER
    record-length: 80
    record-format: FIXED
    block-format: UNBLOCKED
    disposition: MOD
    charset: ${CARDDEMO_JOB_SUBMISSION_CHARSET:IBM037}
    approved-root: ${CARDDEMO_JOB_SUBMISSION_ROOT:}
    destination: ${CARDDEMO_JOB_SUBMISSION_DESTINATION:}

logging:
  level:
    root: INFO
    com.vsergeychik.carddemo: INFO
    org.springframework.batch: INFO
