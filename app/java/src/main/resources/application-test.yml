# ---------------------------------------------------------------------------------------------
# AWS CardDemo - 'test' profile: fixture-backed configuration for unit tests, the parity harness
# and local runs.
#
# Every dataset binding points at a fixture derived from app/data/ASCII/*.txt (AAP 0.4.2). H2 runs
# in-memory purely to host the Spring Batch JobRepository metadata tables and the seeded parity
# datasets - it is a TEST-scope dependency and never a production database (AAP 0.5.5).
#
# NOTE on the cardxref fixture: app/data/ASCII/cardxref.txt is 36 bytes per record while CVACT03Y
# declares 50 (the trailing FILLER X(14) is absent from the fixture). The harness right-pads to 50
# before comparison - see AAP gate G16 / risk R-F.
# ---------------------------------------------------------------------------------------------
spring:
  batch:
    job:
      enabled: false
    jdbc:
      # Creates ONLY the Spring Batch metadata tables inside the in-memory H2 instance. This is
      # test infrastructure, not a migration of the application's data model.
      initialize-schema: always

  datasource:
    url: jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=LEGACY
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: carddemo-test-pool
      maximum-pool-size: 5
      auto-commit: false

server:
  port: ${SERVER_PORT:8080}

carddemo:
  charset:
    ebcdic: IBM037
    ascii: US-ASCII

  # Fixture-backed dataset bindings. Paths resolve on the test classpath
  # (app/java/src/test/resources/fixtures/) which is derived from app/data/ASCII/.
  #
  # A profile override restates ONLY the "dsname" of an entry, keyed by the same upper-case DD
  # name application.yml declares. Everything else in an entry - record-length, record-format,
  # block-size, copybook, key-length, base, alternate-key - is copybook-fixed or JCL-fixed and is
  # deliberately NOT repeated here: the location of a dataset is environmental, its geometry is
  # not (gates G19, G20). Replacing a whole entry with a bare scalar would break the binding.
  #
  # Where two DD names address the same physical dataset - the CICS name used by the online
  # programs and the batch name used by the JCL - both are bound to the same fixture, because
  # application.yml resolves both to one DSNAME: ACCTDAT/ACCTFILE, CARDDAT/CARDFILE,
  # CCXREF/CARDXREF/XREFFILE, CXACAIX/XREFFIL1, CUSTDAT/CUSTFILE and TRANSACT/TRANFILE.
  datasets:
    # --- Account master, 300 B, CVACT01Y ---------------------------------------------------
    ACCTDAT:
      dsname: classpath:fixtures/acctdata.txt
    ACCTFILE:
      dsname: classpath:fixtures/acctdata.txt

    # --- Card master, 150 B, CVACT02Y (CARDAIX is the alternate-index path over CARDDAT) ---
    CARDDAT:
      dsname: classpath:fixtures/carddata.txt
    CARDFILE:
      dsname: classpath:fixtures/carddata.txt
    CARDAIX:
      dsname: classpath:fixtures/carddata.txt

    # --- Card cross-reference, CVACT03Y. The fixture is 36 B per record where the copybook
    #     declares 50: app/data/ASCII/cardxref.txt omits the trailing FILLER X(14) and the
    #     harness right-pads to 50 before comparison (gate G16, risk R-F).
    #     CXACAIX and XREFFIL1 are alternate-index paths over the same base.
    CCXREF:
      dsname: classpath:fixtures/cardxref.txt
    CARDXREF:
      dsname: classpath:fixtures/cardxref.txt
    XREFFILE:
      dsname: classpath:fixtures/cardxref.txt
    CXACAIX:
      dsname: classpath:fixtures/cardxref.txt
    XREFFIL1:
      dsname: classpath:fixtures/cardxref.txt

    # --- Customer master, 500 B, CVCUS01Y --------------------------------------------------
    CUSTDAT:
      dsname: classpath:fixtures/custdata.txt
    CUSTFILE:
      dsname: classpath:fixtures/custdata.txt

    # --- Transaction master, 350 B, CVTRA05Y. No ASCII fixture exists for it: the parity
    #     harness seeds this dataset itself, so the location is declared but not shipped.
    TRANSACT:
      dsname: classpath:fixtures/transact.txt
    TRANFILE:
      dsname: classpath:fixtures/transact.txt

    # --- Security file, 80 B, CSUSR01Y. Harness-seeded, as above. -------------------------
    USRSEC:
      dsname: classpath:fixtures/usrsec.txt

    # --- Batch-only inputs -----------------------------------------------------------------
    DISCGRP:
      dsname: classpath:fixtures/discgrp.txt
    TCATBALF:
      dsname: classpath:fixtures/tcatbal.txt
    DALYTRAN:
      dsname: classpath:fixtures/dailytran.txt
    TRANTYPE:
      dsname: classpath:fixtures/trantype.txt
    TRANCATG:
      dsname: classpath:fixtures/trancatg.txt
    # 80-byte report date-range dataset and the statement extract, both harness-seeded.
    DATEPARM:
      dsname: classpath:fixtures/dateparm.txt
    TRNXFILE:
      dsname: classpath:fixtures/trnxfile.txt

    # --- Batch outputs. Written during a test run, so they resolve to a writable temp path
    #     rather than the classpath. Widths stay in application.yml (DALYREJS 430,
    #     TRANREPT 133, STMTFILE 80, HTMLFILE 100, SYSTRAN 350).
    DALYREJS:
      dsname: ${java.io.tmpdir}/carddemo-test/dalyrejs.txt
    TRANREPT:
      dsname: ${java.io.tmpdir}/carddemo-test/tranrept.txt
    STMTFILE:
      dsname: ${java.io.tmpdir}/carddemo-test/statement.txt
    HTMLFILE:
      dsname: ${java.io.tmpdir}/carddemo-test/statement.html
    SYSTRAN:
      dsname: ${java.io.tmpdir}/carddemo-test/systran.txt

logging:
  level:
    root: WARN
    com.vsergeychik.carddemo: DEBUG
    org.springframework.batch: INFO
