---
# =============================================================================================
#  AWS CardDemo - Java 21 / Spring Boot 3.5.16 migration module
#  'test' PROFILE - CREDENTIALS AND FIXTURE SEED DATA
# =============================================================================================
#
#  WHAT THIS FILE IS, AND WHY IT IS SEPARATE
#  -----------------------------------------
#  The 'test' profile itself is app/java/src/main/resources/application-test.yml, where AAP
#  0.2.5, 0.3.1 and 0.4.2 place it and where gate G5 pins it. That document ships inside the
#  distributable jar, because Maven packages everything under src/main/resources.
#
#  This document holds the two parts of the profile that must NEVER ship:
#
#    * spring.datasource.* - the in-memory H2 database, its driver and its conventional "sa"
#      account, together with the Spring Batch JobRepository schema initialisation that only
#      makes sense against a throwaway database;
#    * carddemo.test.fixtures.* - the fixture inventory, including the ten plaintext USRSEC seed
#      rows transcribed from app/jcl/DUSRSECJ.jcl.
#
#  Neither value guards anything and neither leaves the test JVM, but a credential-shaped value
#  packaged into an artifact is indistinguishable from a real one to a scanner and is the first
#  thing an operator would try against a production endpoint (CWE-798). src/test/resources is
#  copied to target/test-classes and is never packaged, so keeping them here removes that risk
#  without moving the profile off the path the plan declares.
#
#  HOW IT IS LOADED
#  ----------------
#  application-test.yml imports it with
#      spring.config.import: optional:classpath:/carddemo-test-fixtures.yml
#  The import is OPTIONAL, so the packaged artifact - where this file is absent - simply has no
#  DataSource under the 'test' profile and refuses to start, which is the intended outcome.
#  On the test classpath the import resolves, and an imported document takes precedence over the
#  document that imported it, so nothing here is shadowed.
#
#  THE FILE NAME IS DELIBERATELY NOT application-test.yml. Two documents of that name, one per
#  classpath root, would leave Spring resolving classpath:/application-test.yml to whichever root
#  came first and silently ignoring the other. There is exactly one application-test.yml in this
#  module, in the main tree; this document has a name of its own.
# =============================================================================================
spring:

  # -------------------------------------------------------------------------------------------
  # DataSource - in-memory H2, and the ONLY working DataSource anywhere in this build.
  #
  # application.yml deliberately ships a driver-free, credential-free, deployment-bound block
  # (AAP 0.5.5, risk R-E): there is not one EXEC SQL statement in any of the 28 COBOL programs,
  # indexed VSAM has no Maven-published JDBC driver, and app/java/pom.xml pins no driver
  # coordinate. That block cannot start a context. This one can, which is why gate G3's
  # context-load test runs under this profile and not the default one.
  #
  # H2 serves exactly two purposes here, both from AAP 0.5.5:
  #   1. it backs the Spring Batch JobRepository - Spring Batch 5 requires a DataSource-backed
  #      repository, so without it no job can be launched at all;
  #   2. it hosts the parity harness's seeded fixture data.
  # It is a TEST-scope dependency in app/java/pom.xml (com.h2database:h2:2.3.232, resolved by
  # the Boot 3.5.16 BOM) and is never promoted to compile or runtime scope.
  #
  # ISOLATION AND DETERMINISM (practice B7, and gate G18 depends on it)
  # A "jdbc:h2:mem:" database is private to the JVM that opens it, so two Maven runs - in
  # parallel clones or one after another - cannot see each other's rows. That handles the JVM
  # boundary. It does NOT handle the boundary that actually matters inside one surefire JVM,
  # which is the SPRING CONTEXT: a test run builds many contexts, and a fixed database name plus
  # DB_CLOSE_DELAY=-1 would give every one of them the same database.
  #
  # ONE DATABASE PER CONTEXT, VIA ${random.uuid} IN THE NAME. Two distinct problems are solved:
  #   1. A HARD FAILURE. classpath:org/springframework/batch/core/schema-h2.sql contains 9 bare
  #      CREATE statements and NOT ONE "IF NOT EXISTS" - verified by reading it inside
  #      spring-batch-core-5.2.6.jar. With initialize-schema: always below, the second context to
  #      refresh against a shared database would fail on "table BATCH_JOB_INSTANCE already
  #      exists". Today no context in this module both activates this profile and enables Batch,
  #      so the defect is latent rather than visible - which is precisely why it is worth removing
  #      now rather than after a later test trips it.
  #   2. CROSS-CONTEXT STATE. BATCH_JOB_EXECUTION rows and seeded application rows written by one
  #      context would otherwise be visible to the next, making an outcome depend on test order.
  #
  # WHY THE NAME IS RANDOM WHILE NOTHING ELSE HERE IS. Reproducibility is a property of the
  # OBSERVED OUTPUT, and no assertion, fixture, record or report in this module reads the database
  # name - it is addressing, not data. Every value that a comparison can see stays fixed. The
  # random element is resolved EXACTLY ONCE per context, when Spring binds spring.datasource.url
  # into DataSourceProperties, which is what makes it a per-context identity rather than a
  # per-lookup one: ${random.uuid} yields a NEW value on every resolution, so it must never be
  # placed in a value that is referenced more than once (see carddemo.test.work-dir, which
  # deliberately uses stable discriminators instead).
  #
  # NOTE FOR ANYONE BUILDING A CONTEXT BY HAND. ${random.uuid} comes from Spring Boot's
  # RandomValuePropertySource, which SpringApplication installs - so it is present under a real
  # run, under spring-boot:run and under @SpringBootTest, but NOT in a bare
  # ApplicationContextRunner. A hand-built context that binds spring.datasource.url from this
  # profile must call RandomValuePropertySource.addToEnvironment(environment) first, exactly as
  # ConfigBranchCoverageTest does.
  #
  # DB_CLOSE_DELAY=-1 is RETAINED rather than traded for close-on-last-connection. It keeps the
  # database alive for the JVM's lifetime, so the JobRepository metadata created once at context
  # refresh survives even if the pool drops every connection - i.e. it removes a timing-dependent
  # failure mode. Because the name is now unique per context, keeping it costs no isolation.
  # DB_CLOSE_ON_EXIT=FALSE lets the JVM shut down without H2 racing the Spring lifecycle.
  #
  # Per-CASE isolation within one context remains the harness's job: it seeds and clears the
  # datasets it touches for each of the 20 cases.
  #
  # NO SQL COMPATIBILITY MODE IS SET, deliberately. H2 runs in its standard (REGULAR) mode:
  # Spring Batch's bundled schema-h2.sql targets standard H2, and a compatibility mode would
  # change SQL semantics underneath a harness whose entire purpose is byte-level parity.
  #
  # NO SECRET IS COMMITTED HERE (practice B1). H2's conventional in-memory account is the user
  # "sa" with an empty password; it grants access to a database that exists only inside the test
  # JVM and holds only fixture data. It is a test-only non-secret, not a credential.
  # -------------------------------------------------------------------------------------------
  datasource:
    url: jdbc:h2:mem:carddemo_test_${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
    hikari:
      # Named distinctly from application.yml's "carddemo-pool" so a thread dump or a JMX view
      # makes it obvious at a glance which profile is live.
      pool-name: carddemo-test-pool
      # Small on purpose. AAP 0.8.6: this is not a performance refactoring, and several jobs
      # depend on strict record ordering, so there is nothing to gain from a larger pool.
      maximum-pool-size: 5
      # At least one connection is always retained. Combined with DB_CLOSE_DELAY=-1 this makes
      # the lifetime of the in-memory database independent of pool eviction timing - i.e. it
      # removes a timing-dependent failure mode rather than relying on a default (B7, B8).
      minimum-idle: 1
      # UNCHANGED FROM application.yml, AND THAT MATTERS. Commit boundaries belong to the Spring
      # Batch step and the service layer, mirroring where the COBOL performs its REWRITE; a
      # driver that committed on its own would break that mapping. Verified safe against the
      # schema initializer: Spring Framework 6.2.19's DatabasePopulatorUtils.execute checks
      # Connection.getAutoCommit() and DataSourceUtils.isConnectionTransactional() and issues an
      # explicit Connection.commit(), so the BATCH_* DDL below is committed even with
      # auto-commit disabled.
      auto-commit: false

  # -------------------------------------------------------------------------------------------
  # Spring Batch.
  #
  # THE G44 BOUNDARY, DRAWN EXPLICITLY.
  # Gate G44 forbids DDL, schema migration files, entity annotations, generated table
  # definitions, version columns and new indexes; the prompt forbids any database migration at
  # all. The BATCH_* tables are none of those things - they are Spring Batch's own JobRepository
  # metadata, framework infrastructure that the framework itself owns. So:
  #   * application.yml sets initialize-schema: never, because nothing in this module may ever
  #     issue DDL against the real backend;
  #   * this profile sets it to always, because the only database this profile can reach is the
  #     throwaway in-memory H2 instance configured above.
  # The tables therefore exist in H2 and nowhere else. Do not set "always" in application.yml.
  #
  # "always" IS ONLY SAFE BECAUSE THE DATABASE IS NEW. schema-h2.sql issues 9 bare CREATE
  # statements with no "IF NOT EXISTS", and the initializer has no notion of "already applied": it
  # runs the script at every context refresh. That is correct against a database this context has
  # to itself, and a hard failure against one it shares. So the ${random.uuid} in the datasource
  # URL above is not a tidiness measure - it is the precondition for this setting. Removing the
  # per-context name without also changing this key would fail the second context to refresh.
  #
  # THE SCRIPT IS THE FRAMEWORK'S, NOT OURS - and it is named rather than left to @@platform@@
  # substitution so that claim is verifiable by inspection. classpath:org/springframework/batch/
  # core/schema-h2.sql ships inside spring-batch-core-5.2.6.jar; its first line reads
  # "-- Autogenerated: do not edit this file" and it creates 6 tables and 3 sequences. This
  # module authors NO .sql file and creates no db/ or migration/ directory, and no Flyway or
  # Liquibase artifact exists anywhere in the build.
  #
  # job.enabled stays false, exactly as application.yml sets it. Restated here because it is a
  # published contract (README.md documents explicit per-job launch) and because it is precisely
  # what keeps "mvn -B clean verify" unattended: no job may auto-run on context refresh, so a
  # job runs only when a test deliberately launches it - just as a job runs only when JCL
  # submits an EXEC PGM= step (practice B7, gate G54).
  # -------------------------------------------------------------------------------------------
  batch:
    jdbc:
      initialize-schema: always
      schema: classpath:org/springframework/batch/core/schema-h2.sql


# =============================================================================================
#  carddemo.test.fixtures - the nine fixed-width fixtures, and the one dataset seeded inline
# =============================================================================================
carddemo:
  test:
    # -----------------------------------------------------------------------------------------
    # THE NINE FIXTURES, WITH MEASURED GEOMETRY.
    #
    # Every "records" and "bytes-per-record" value below was MEASURED, not inferred, from
    # app/data/ASCII/*.txt and re-measured on the classpath copies under
    # app/java/src/test/resources/fixtures/, which are byte-for-byte identical to them. Each
    # file is LF-terminated, one record per line, with exactly ONE distinct line length - no
    # ragged records. They are stated here so a context-load test can ASSERT the geometry rather
    # than assume it (practice B8): these fixtures are the only genuine production-shaped input
    # the harness has, because AAP 0.7.6 establishes that executing the legacy COBOL is
    # impossible in this environment and the expected values are derived statically instead.
    #
    # FIELD MEANINGS
    #   resource          the classpath location, i.e. what carddemo.datasets.<DD>.dsname is
    #                     bound to below. It MUST resolve: a path that does not resolve yields a
    #                     silently EMPTY dataset and a parity diff that is expensive to trace
    #                     back to its cause (practice B1). All nine are verified present.
    #   records           the number of records the file contains.
    #   bytes-per-record  the fixture's MEASURED ON-DISK width. This is NOT the copybook width -
    #                     that is carddemo.datasets.<DD>.record-length in application.yml, and it
    #                     is never restated here. Declaring both is what makes the two of them
    #                     comparable, which is the whole point.
    #   pad-to            present ONLY where the fixture is short of its copybook width. Its
    #                     absence means the fixture already matches its copybook exactly, so the
    #                     set of deviations is machine-enumerable: exactly two entries carry it.
    #
    #                     THE PAD HAS EXACTLY ONE OWNER, AND IT IS THE SEEDING SIDE.
    #                     Every record is right-padded with spaces (0x20) to this width ONCE, at
    #                     SEED TIME, BEFORE anything decodes it - by the single validated
    #                     normaliser on ParityCase.DatasetNormalisation, which a case reaches
    #                     through its dataset-bound "normalisations" entry. What a repository
    #                     receives is therefore already the full copybook width, which is exactly
    #                     what SecUserRecord.decode and CardXrefRecord.decode require: a
    #                     fixed-width record is never partially decoded.
    #                     NOTHING PADS AGAIN AT COMPARISON TIME. FieldDiffer treats any width
    #                     disagreement as a difference and never makes one up, so a case that
    #                     forgets to declare its normalisation fails loudly at seeding instead of
    #                     being quietly repaired during the comparison. Two owners for one pad
    #                     would mean neither could be audited: a 57-byte row reaching a decoder
    #                     would look like a seeding bug from one side and a differ bug from the
    #                     other, and an expectation written at the short width would be silently
    #                     accepted.
    #   datasets          the DD names this one file serves. Several DD names address one
    #                     physical dataset - the CICS name used by the online programs and the
    #                     batch name used by the JCL - and an alternate-index PATH is a finder
    #                     over its base cluster, never a second table (gate G45).
    #   seed              inline records, used ONLY where no fixture file exists at all.
    # -----------------------------------------------------------------------------------------
    fixtures:

      # Account master. app/cpy/CVACT01Y.cpy declares 300; the fixture is 300. No pad needed.
      acctdata:
        resource: classpath:fixtures/acctdata.txt
        records: 50
        bytes-per-record: 300
        datasets: [ACCTDAT, ACCTFILE]

      # Card master. CVACT02Y declares 150; the fixture is 150.
      # CARDAIX is the alternate-index PATH over CARDDAT keyed by account id, so it reads THIS
      # file through a different DD name - not a second table (gate G45).
      carddata:
        resource: classpath:fixtures/carddata.txt
        records: 50
        bytes-per-record: 150
        datasets: [CARDDAT, CARDFILE, CARDAIX]

      # Card-to-account cross reference - DEVIATION 1 OF 2 (gate G16, risk R-F).
      #
      # app/cpy/CVACT03Y.cpy, whose own header reads "(RECLN 50)", declares:
      #     05 XREF-CARD-NUM PIC X(16).   16
      #     05 XREF-CUST-ID  PIC 9(09).    9
      #     05 XREF-ACCT-ID  PIC 9(11).   11
      #     05 FILLER        PIC X(14).   14   <- the fixture stops before this
      #                                   --
      #                                   50
      # The fixture supplies the first three fields only, 16+9+11 = 36 bytes, and omits the
      # trailing FILLER X(14). README.md:L73 independently declares the dataset as 50.
      #
      # So the fixture is normalised UP to the copybook, never the copybook down to the fixture:
      # application.yml keeps record-length 50 and pad-to below restores the missing 14 bytes as
      # spaces. Configuring 36 anywhere would shift every downstream offset and break the total
      # record width (gate G21). app/data/ASCII/cardxref.txt is reference-only and is NOT edited
      # to make the numbers line up - the deviation is recorded, not absorbed (practices B3, B12).
      #
      # CXACAIX and XREFFIL1 are both alternate-index PATHs over the CCXREF base and resolve to
      # the same physical dataset as each other; INTCALC.jcl proves it by opening the cross
      # reference twice in one step, as XREFFILE on the base and XREFFIL1 on the path.
      cardxref:
        resource: classpath:fixtures/cardxref.txt
        records: 50
        bytes-per-record: 36
        pad-to: 50
        datasets: [CCXREF, CARDXREF, XREFFILE, CXACAIX, XREFFIL1]

      # Customer master. CVCUS01Y declares 500; the fixture is 500.
      custdata:
        resource: classpath:fixtures/custdata.txt
        records: 50
        bytes-per-record: 500
        datasets: [CUSTDAT, CUSTFILE]

      # Daily transactions awaiting posting - the input CBTRN02C validates and posts or rejects.
      # CVTRA06Y declares 350; the fixture is 350, and 300 records is the volume the four-stage
      # Card / Account / Credit Limit / Expiration cascade is exercised against.
      dailytran:
        resource: classpath:fixtures/dailytran.txt
        records: 300
        bytes-per-record: 350
        datasets: [DALYTRAN]

      # Disclosure groups - the interest-rate lookup CBACT04C drives, including the DEFAULT
      # group it falls back to. CVTRA02Y declares 50; the fixture is 50. DIS-INT-RATE is
      # PIC S9(04)V99, so it decodes at scale 2 like every other monetary field.
      discgrp:
        resource: classpath:fixtures/discgrp.txt
        records: 51
        bytes-per-record: 50
        datasets: [DISCGRP]

      # Transaction category balances, on a 17-byte composite key. CVTRA01Y declares 50.
      tcatbal:
        resource: classpath:fixtures/tcatbal.txt
        records: 50
        bytes-per-record: 50
        datasets: [TCATBALF]

      # Transaction categories. CVTRA04Y declares 60; the fixture is 60.
      trancatg:
        resource: classpath:fixtures/trancatg.txt
        records: 18
        bytes-per-record: 60
        datasets: [TRANCATG]

      # Transaction types. CVTRA03Y declares 60; the fixture is 60.
      trantype:
        resource: classpath:fixtures/trantype.txt
        records: 7
        bytes-per-record: 60
        datasets: [TRANTYPE]

      # -------------------------------------------------------------------------------------
      # SECURITY USER FILE - THERE IS NO ASCII FIXTURE FOR IT, SO IT IS SEEDED INLINE.
      #
      # app/data/ASCII/ holds exactly nine files and none of them is a usrsec fixture; the
      # USRSEC data exists in the repository only as the EBCDIC binary. README.md:L69 names the
      # source as "See DEFUSR01.jcl (inline)", but NO app/jcl/DEFUSR01.jcl exists - that README
      # reference is stale. The real job is app/jcl/DUSRSECJ.jcl, whose STEP01 IEBGENER carries
      # the seed in stream at SYSUT1 DD *, lines 35-44: exactly ten records, transcribed below
      # VERBATIM. The stale README reference is recorded here and left uncorrected, because
      # README.md's dataset table is parity reference material (practices B3, B12).
      #
      # Corroboration: README.md:L156-L157 documents signing on as ADMIN001 or USER0001 with
      # password PASSWORD, which is what these records contain.
      #
      # DEVIATION 2 OF 2 - the same class as cardxref, found by measurement rather than assumed.
      # app/cpy/CSUSR01Y.cpy declares:
      #     05 SEC-USR-ID     PIC X(08).    8
      #     05 SEC-USR-FNAME  PIC X(20).   20
      #     05 SEC-USR-LNAME  PIC X(20).   20
      #     05 SEC-USR-PWD    PIC X(08).    8
      #     05 SEC-USR-TYPE   PIC X(01).    1
      #     05 SEC-USR-FILLER PIC X(23).   23   <- the in-stream data stops before this
      #                                    --
      #                                    80
      # Every one of the ten records below measures exactly 57 bytes, 8+20+20+8+1, and omits
      # SEC-USR-FILLER X(23). pad-to restores it as spaces, precisely as for cardxref, and it does
      # so ONCE at seed time through ParityCase.DatasetNormalisation.USRSEC_FILLER_PAD_57_TO_80 -
      # the single owner named in the FIELD MEANINGS block above. A case seeding USRSEC must declare
      # that normalisation against the USRSEC dataset, because the 57-byte rows below are NOT
      # decodable as they stand: SecUserRecord.decode requires exactly 80 bytes and rejects a short
      # row rather than partially decoding it.
      # DUSRSECJ.jcl corroborates the 80 twice - SYSUT2 at L46-L49 is
      # DCB=(LRECL=80,RECFM=FB,DSORG=PS,BLKSIZE=0), and the DEFINE CLUSTER at L64-L73 is
      # KEYS(8,0) RECORDSIZE(80,80) INDEXED - which is also where USRSEC's 8-byte key comes from.
      #
      # SEC-USR-PWD PIC X(08) IS PLAINTEXT, AND STAYS PLAINTEXT (practice B6, gate G41).
      # COSGN00C compares it byte-for-byte with no hashing, so hashing it here would change
      # observable behaviour, and Spring Security is out of scope in any case. The literal
      # PASSWORD below is 2022-vintage demo seed data reproduced from a committed sample job so
      # the sign-on path can be exercised - it is NOT a credential being introduced, it guards
      # nothing, and it reaches only an in-memory database that is discarded when the test JVM
      # exits. No secret is added to this repository by this file.
      #
      # Layout of each record, by column: 1-8 id, 9-28 first name, 29-48 last name, 49-56
      # password, 57 user type - 'A' for the five administrators, 'U' for the five regular
      # users.
      #
      # THE PASSWORD COLUMN IS PLAINTEXT, and that is the legacy design rather than a defect
      # here: SEC-USR-PWD is PIC X(08) in app/cpy/CSUSR01Y.cpy and app/cbl/COSGN00C.cbl
      # compares it directly, so hashing it would change observable behaviour (practice B6,
      # gate G41). These ten rows are transcribed from app/jcl/DUSRSECJ.jcl and exist only to
      # seed an in-memory H2 database inside the test JVM. They live under src/test/resources
      # precisely so they are NOT packaged into the distributable jar - see the note at the top
      # of this file. Single-quoted so every run of interior spaces is preserved exactly as the JCL has
      # it; the field alignment below IS the data and must not be reflowed.
      # -------------------------------------------------------------------------------------
      usrsec:
        records: 10
        bytes-per-record: 57
        pad-to: 80
        datasets: [USRSEC]
        # app/jcl/DUSRSECJ.jcl:L35-L44, verbatim.
        seed:
          - 'ADMIN001MARGARET            GOLD                PASSWORDA'
          - 'ADMIN002RUSSELL             RUSSELL             PASSWORDA'
          - 'ADMIN003RAYMOND             WHITMORE            PASSWORDA'
          - 'ADMIN004EMMANUEL            CASGRAIN            PASSWORDA'
          - 'ADMIN005GRANVILLE           LACHAPELLE          PASSWORDA'
          - 'USER0001LAWRENCE            THOMAS              PASSWORDU'
          - 'USER0002AJITH               KUMAR               PASSWORDU'
          - 'USER0003LAURITZ             ALME                PASSWORDU'
          - 'USER0004AVERARDO            MAZZI               PASSWORDU'
          - 'USER0005LEE                 TING                PASSWORDU'
