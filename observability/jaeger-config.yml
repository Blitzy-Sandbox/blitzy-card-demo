# ****************************************************************************
# Program     : jaeger-config.yml
# Application : CardDemo
# Type        : Jaeger v2 (OpenTelemetry Collector) configuration
# Function    : Preserves the three settings the retired v1 all-in-one image
#               carried as environment variables - OTLP ingestion enabled,
#               in-memory span storage, and a 50,000-trace ceiling - and
#               narrows the ingest surface to OTLP alone.
# Capability  : NEW - additive. The frozen COBOL corpus exports no traces at
#               all; its entire instrumentation is DISPLAY to SYSOUT plus the
#               four-character status renderer at
#               app/cbl/CBTRN02C.cbl:L714-L731. There is therefore no COBOL
#               artefact this file translates. It exists because
#               jaegertracing/all-in-one:1.62.0 reached end of life
#               (CWE-1104, use of an unmaintained component) and the
#               supported successor, jaegertracing/jaeger v2, is an
#               OpenTelemetry Collector distribution that is configured by
#               file rather than by environment variable.
# Derived from : the default all-in-one configuration compiled into
#               jaegertracing/jaeger:2.20.0, read out of the binary at
#               remediation time rather than copied from documentation, then
#               reduced. Validated by `jaeger validate --config=file:...`.
