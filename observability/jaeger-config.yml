#
# ============================================================================
# WHY THIS FILE HAS TO EXIST
# ============================================================================
# The v1 image took MEMORY_MAX_TRACES=50000 from the environment. v2 takes no
# such variable: the ceiling lives at extensions.jaeger_storage.backends.*.
# memory.max_traces and its built-in default is 100000. Migrating without
# this file would therefore have DOUBLED the span buffer of a stack that is
# routinely left running, silently - the opposite of the bounded-growth
# property the v1 setting existed to provide. COLLECTOR_OTLP_ENABLED and
# SPAN_STORAGE_TYPE are likewise gone; both are expressed structurally below.
#
# ============================================================================
# WHAT WAS DELIBERATELY REMOVED FROM THE DEFAULT
# ============================================================================
# The shipped default enables three trace receivers - otlp, jaeger and zipkin
# - and three auxiliary extensions. CardDemo speaks exactly one protocol:
# src/main/resources/application.yml sets management.otlp.tracing.endpoint,
# and pom.xml resolves io.opentelemetry:opentelemetry-exporter-otlp. So:
#
#   - the `jaeger` receiver (ports 14250 gRPC and 14268 HTTP) is REMOVED;
#   - the `zipkin` receiver (port 9411) is REMOVED;
#   - `remote_sampling` (5778/5779) is REMOVED - the application samples at a
#     fixed probability set in application.yml and asks no collector;
#   - `expvar` (27777) and `zpages` (27778) are REMOVED - debug surfaces
#     nothing in this project reads.
#
# Each removal closes a listening port that would otherwise accept spans or
# expose internals with no authentication. Rule 1 Clause D, least privilege.
# What remains is the minimum that carries a trace from the application to
# the query UI: an OTLP receiver, a batch processor, memory storage, the query
# extension and the health extension the container probe needs.
#
# ============================================================================
# LISTEN ADDRESS
# ============================================================================
# Every endpoint interpolates ${env:JAEGER_LISTEN_HOST:-localhost}, exactly as
# the shipped default does. docker-compose.yml sets it to 0.0.0.0 so the
# receivers and the UI are reachable from sibling containers - a process bound
# to localhost inside its own network namespace is reachable by nothing else.
# CONTAINER-INTERNAL REACHABILITY IS NOT HOST EXPOSURE: docker-compose.yml
# binds the published ports to the loopback interface, so the UI and the OTLP
# receivers are not offered to the network the host sits on.
#
# ============================================================================
# TROUBLESHOOTING
# ============================================================================
#   - Container never reports healthy: the probe targets 13133, the v2
#     healthcheckv2 port. v1 used 14269. A probe left on 14269 fails forever
#     against a perfectly healthy container.
#   - Spans do not appear in the UI: confirm the application posts to
#     http://jaeger:4318/v1/traces. The v2 OTLP HTTP receiver keeps v1's port
#     numbers, so only the path and the host name are usual suspects.
#   - "unknown type: jaeger" or "unknown type: zipkin" on start: something is
#     still sending over a protocol whose receiver this file removes. Restore
#     the receiver only with a reason recorded; the default position is OTLP
#     only.
#   - Editing this file: run
#     `docker run --rm -v "$PWD/observability:/cfg:ro" jaegertracing/jaeger:2.20.0
#      validate --config=file:/cfg/jaeger-config.yml`
#     before bringing the stack up. An invalid config fails at start, and the
#     validator says which key is wrong.

service:
  # Five extensions, down from six. jaeger_storage and jaeger_query are the
  # storage backend and the UI; healthcheckv2 is what the container probe
  # reads. remote_sampling, expvar and zpages are not enabled - see above.
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      # OTLP only. This single line is what replaces v1's
      # COLLECTOR_OTLP_ENABLED=true and simultaneously closes the jaeger and
      # zipkin ingest ports.
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      # `basic` rather than the default `detailed`. Nothing scrapes this
      # endpoint - observability/prometheus.yml declares exactly one job, the
      # application, and deliberately no self-scrape or collector job - so
      # detailed collector cardinality would be paid for and never read.
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: "${env:JAEGER_LISTEN_HOST:-localhost}"
                port: 8888
    logs:
      level: info

extensions:
  jaeger_query:
    storage:
      traces: carddemo_span_storage
    ai:
      # OFF, against the shipped default of true. It publishes a tool-calling
      # surface under /api/ai/mcp/ that lets a caller query trace content.
      # Spans carry request metadata for a system that handles account,
      # card, customer and transaction records, so an unauthenticated
      # machine-callable query interface is a disclosure surface this project
      # has no use for. Rule 1 Clause D.
      enable_mcp: false

  jaeger_storage:
    backends:
      carddemo_span_storage:
        memory:
          # THE SETTING THIS FILE EXISTS FOR. Carried over verbatim from the
          # retired image's MEMORY_MAX_TRACES=50000. The v2 default is
          # 100000; leaving it implicit would have doubled the buffer of a
          # stack that is routinely left up for days.
          max_traces: 50000

  healthcheckv2:
    use_v2: true
    http:
      # Port 13133. v1's admin port was 14269; docker-compose.yml's probe
      # targets this one, and the port is not published to the host because
      # nothing outside the container needs it.
      endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:13133"
    grpc:

receivers:
  otlp:
    protocols:
      # ONE PROTOCOL, HTTP ONLY. The OTLP/gRPC receiver on 4317 was removed and
      # must not be restored without a named consumer, because nothing in this
      # project speaks gRPC: management.otlp.tracing.endpoint in application.yml
      # and OTEL_EXPORTER_OTLP_ENDPOINT in docker-compose.yml both name the
      # /v1/traces HTTP path on 4318, and application-local.yml records the same
      # choice twice.
      #
      # Why removing the receiver matters even though 4317 was never published to
      # the host: an unpublished port is still reachable from every other
      # container on the compose bridge network. Declining to forward a listener
      # narrows the HOST surface; declining to open it narrows the NETWORK
      # surface too, and an unauthenticated span ingest that no client uses is
      # exactly the kind of listener least privilege exists to close.
      #
      # Should a gRPC exporter ever be configured, three edits go together: this
      # receiver, the compose port mapping, and the assertion in
      # EnvironmentTemplateContractTest that records the omission.
      http:
        endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:4318"

processors:
  # Default batching, exactly as the shipped configuration leaves it. Stated
  # explicitly because the pipeline above names it, and a named processor with
  # no entry here is a start-up error.
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: carddemo_span_storage
