# ============================================================================
# WHAT THIS FILE DOES
# ============================================================================
# One datasource. Grafana has to be told where Prometheus is, and nothing else
# in the stack tells it. At start-up Grafana reads every file under
# /etc/grafana/provisioning/datasources and creates or updates the datasources
# it finds there. This file declares exactly one, of type prometheus, and
# publishes it under the fixed identifier carddemo-prometheus.
#
# That identifier is a contract, not a convenience.
# observability/grafana/dashboards/carddemo-dashboard.json references
# "uid": "carddemo-prometheus" on every panel and inside every targets[]
# entry. This file PUBLISHES the uid; the dashboard CONSUMES it. Were the two
# to diverge, the dashboard would still load and every single panel would fail
# to resolve its datasource - which is precisely why the value is written out
# explicitly here instead of being left for Grafana to generate.
#
# Ownership boundary - four artefacts, four responsibilities, no overlap:
#   * src/main/java/com/cardemo/observability/MetricsConfig.java DEFINES the
#     measurements. Their names are its own constants.
#   * src/main/resources/application.yml EXPOSES them on the actuator surface,
#     whose exposure list that file alone owns (application.yml:801). Spring
#     Boot's Micrometer and Actuator auto-configuration performs the
#     registration, so no project class is required for it.
#   * observability/prometheus.yml SCRAPES that surface.
#   * observability/grafana/dashboards/carddemo-dashboard.json DISPLAYS the
#     resulting series.
# THIS FILE only locates Prometheus. It therefore names no measurement, sets
# no management.* property, carries no scrape configuration and embeds no
# dashboard. Each of those belongs to exactly one artefact above, and
# restating any of them here would duplicate an owner and go stale the moment
# that owner changed. Availability, re-measured at this commit: MetricsConfig
# .java exists; ObservabilityConfig does NOT exist and is Not available. An
# earlier revision of this comment named ObservabilityConfig as a co-owner of
# registration and exposure and said it "is added by a separate unit of the
# migration", which pointed a reader at a file that is not there; the owner is
# application.yml. Severity of what that left in place: Medium. Corrected
# above rather than refreshed.
#
# ============================================================================
# HOW TO RUN AND VALIDATE
# ============================================================================
# Bring the service up from the repository root, which is what mounts this
# directory read-only into the container:
#
#   docker compose up -d grafana
#
# Grafana reads datasource provisioning at start-up, so restart the service
# after editing this file:
#
#   docker compose restart grafana
#
# Then assert the outcome through the Grafana HTTP API rather than by eye. The
# two variables below are supplied from the environment by docker-compose.yml
# and .env; no credential value is ever written into this file.
#
#   curl -s -u "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" \
#        http://localhost:3000/api/datasources
#
# The response must contain exactly one entry, carrying
# "uid": "carddemo-prometheus", "type": "prometheus", "isDefault": true and
# "readOnly": true - readOnly is how editable: false surfaces over the API.
# Then confirm Grafana can actually reach Prometheus through the proxy:
#
#   curl -s -u "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" \
#        http://localhost:3000/api/datasources/uid/carddemo-prometheus/health
#
# A healthy result there is the evidence the integration sign-off gate records.
#
# ============================================================================
# KEY CONFIGS AND DEFAULTS
# ============================================================================
#   apiVersion: 1        The datasource provisioning schema version. Verified
#                        against the exact pinned image grafana/grafana:11.3.1
#                        declared by the repository-root docker-compose.yml,
#                        not assumed from documentation alone.
#   name: Prometheus     Display name only. Panels bind by uid, never by name.
#   uid                  carddemo-prometheus - the published contract above.
#                        Deterministic, and consistent with the carddemo-*
#                        family already fixed elsewhere in this migration: the
#                        carddemo-app scrape job, the carddemo-report-jobs
#                        FIFO queue and carddemo-dashboard.json.
#   type: prometheus     The only datasource type this project provisions.
#   access: proxy        The Grafana backend queries Prometheus, so the
#                        browser never connects to it directly and no
#                        Prometheus port needs to be reachable from the
#                        operator's machine.
#   url                  http://prometheus:9090 - internal Compose DNS. The
#                        service name and port are taken from
#                        docker-compose.yml. Never localhost, never
#                        127.0.0.1, never host.docker.internal, never a host
#                        address and never a hosted endpoint: Grafana resolves
#                        this name inside the Compose network, and every one
#                        of those alternatives would make the file
#                        environment-specific.
#   isDefault: true      The only datasource, so it is also the default.
#   editable: false      Provisioning is the single source of truth. Grafana
#                        refuses edits through the UI, so the running
#                        configuration cannot drift away from this file.
#   jsonData
#     timeInterval: 15s  Matches global.scrape_interval in
#                        observability/prometheus.yml exactly, so Grafana's
#                        $__rate_interval never computes a window shorter than
#                        the interval at which the data actually arrives.
#
# Nothing else is set, and the omissions are deliberate. No authentication of
# any kind is configured, because the Prometheus service in this stack
# requires none; the least-privilege outcome is the absence of an auth stanza
# rather than an empty or environment-interpolated one. TLS verification is
# never bypassed. Grafana's own admin credentials stay in the environment.
#
# ============================================================================
# COMMON FAILURE MODES AND TROUBLESHOOTING
# ============================================================================
# Every panel reports that its datasource cannot be found.
#   The uid published here and the uid referenced by carddemo-dashboard.json
#   have diverged. Compare the two and align the dashboard - this file is the
#   publisher, so the dashboard is what changes.
#
# The datasource exists but every query is refused or times out.
#   The url is not resolvable from inside the container. Confirm it names the
#   Compose service, prometheus, and not localhost, 127.0.0.1 or
#   host.docker.internal: those resolve to the Grafana container itself or to
#   the host, and neither serves Prometheus. Check from inside the container
#   with
#   docker compose exec grafana wget -qO- http://prometheus:9090/-/ready
#
# Grafana starts, logs a provisioning error and creates no datasource.
#   Either this YAML is malformed or apiVersion is a value the pinned Grafana
#   version does not accept. Run docker compose logs grafana; the offending
#   file and line are named in the message.
#
# The datasource can be edited in the UI and drifts from this file.
#   editable: false was omitted. Restore it and restart the service. The
#   symptom over the API is a provisioned datasource reported with
#   "readOnly": false.
#
# A panel is empty even though the datasource reports healthy.
#   This is not a datasource fault, and no change here will fix it. There are
#   two distinct causes:
#     * the metric name in the panel query has drifted from the corresponding
#       constant in MetricsConfig.java - remedy that in
#       carddemo-dashboard.json, not here;
#     * the counter has never been incremented. A Micrometer counter that has
#       not been incremented is ABSENT from the /actuator/prometheus
#       exposition rather than present with the value zero, so Prometheus has
#       no series to return at all. An empty panel before the first batch run
#       or the first sign-on is therefore correct behaviour and not a defect.
#
# No datasource appears at all and the logs say nothing.
#   The provisioning directory was not mounted. Confirm that the grafana
#   service in docker-compose.yml still mounts
#   ./observability/grafana/provisioning at /etc/grafana/provisioning and that
#   GF_PATHS_PROVISIONING agrees with it.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: carddemo-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
