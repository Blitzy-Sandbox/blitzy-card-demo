# * File         : datasource.yml
# * Application  : CardDemo
# * Type         : Grafana datasource provisioning
# * Function     : Wires Grafana to the Prometheus server and the Jaeger tracing
# *                backend so the integration sign-off gate needs no manual
# *                configuration step to render a populated dashboard. Supplies
# *                observability the COBOL corpus lacks entirely - its only
# *                instrumentation is DISPLAY to SYSOUT plus the
# *                9910-DISPLAY-IO-STATUS renderer of app/cbl/CBTRN02C.cbl.
