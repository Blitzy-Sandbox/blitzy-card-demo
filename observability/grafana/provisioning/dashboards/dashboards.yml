# ******************************************************************
# * File         : dashboards.yml
# * Application  : CardDemo
# * Type         : Grafana dashboard provider provisioning
# * Function     : Registers the checked-in dashboard directory so
# *                observability/grafana/dashboards/carddemo-dashboard.json is
# *                loaded automatically at Grafana start. Without this provider
# *                the dashboard JSON is inert and the integration sign-off gate
# *                could not demonstrate a populated dashboard.
