global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    application: carddemo
    environment: local

scrape_configs:

  # CardDemo application metrics. `host.docker.internal` is mapped to the host
  # gateway by docker-compose.yml, so this target works whether the JAR runs on
  # the host (./mvnw spring-boot:run) or in a container joined to the network.
  - job_name: carddemo
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets:
          - "host.docker.internal:8080"
          - "carddemo-app:8080"
        labels:
          service: carddemo
          component: modular-monolith

  # Prometheus self-monitoring.
  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets:
          - "localhost:9090"
