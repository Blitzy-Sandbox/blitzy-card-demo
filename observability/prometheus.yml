# ============================================================================
# WHAT THIS FILE DOES
# ============================================================================
# One Prometheus server, one scrape job, one target. Every 15 seconds
# Prometheus issues GET /actuator/prometheus against the running CardDemo
# application and stores the exposition it returns. Grafana renders those
# series through observability/grafana/provisioning/datasources/datasource.yml,
# which declares the same 15s as its datasource timeInterval.
#
# Ownership boundary - four responsibilities, no overlap:
#   * MetricsConfig.java DEFINES the measurements; their names are its own
#     constants. HealthIndicators.java DEFINES the readiness components.
#   * src/main/resources/application.yml REGISTERS and EXPOSES them on the
#     actuator surface, through management.endpoints.web.exposure.include.
#   * THIS FILE SCRAPES that surface. It therefore names no measurement at all.
#     A scrape configuration that enumerated names would duplicate
#     MetricsConfig.java and go stale the moment one of its constants changed,
#     so there is no allow-list, no deny-list and no metric_relabel_configs.
#   * observability/grafana/dashboards/carddemo-dashboard.json DISPLAYS the
#     result.
# For the same reason no `management.*` property is restated here: those keys
# belong exclusively to src/main/resources/application.yml. A scrape
# configuration is in any case inert until the endpoint answers - the target
# simply reports DOWN until it does.
#
# ============================================================================
# HOW TO RUN AND VALIDATE
# ============================================================================
#   Start      docker compose up -d prometheus
#   Config     docker run --rm --entrypoint promtool \
#                  -v "$PWD/observability:/etc/prometheus:ro" \
#                  <the prom/prometheus image pinned in docker-compose.yml> \
#                  check config /etc/prometheus/prometheus.yml
#              --entrypoint is required: the image's entrypoint is the server
#              binary, so passing `promtool` as an argument reaches the server
#              and is rejected as an unexpected argument.
#              Must exit 0 and print SUCCESS with no warning. Always use the
#              pinned image rather than a locally installed promtool, so the
#              validation matches the binary that will read the file.
#   Targets    curl -fsS http://localhost:9090/api/v1/targets
#              The carddemo-app target must report health "up", scrapeUrl
#              http://app:8080/actuator/prometheus and scrapeInterval 15s.
#   Served     curl -fsS http://localhost:9090/api/v1/status/config
#              Confirms the read-only mount resolved to this file.
#   Reload     the prometheus service runs with --web.enable-lifecycle, so
#              curl -X POST http://localhost:9090/-/reload applies an edit
#              without restarting the container.
#   Port       the published port is ${PROMETHEUS_PORT:-9090} and the Compose
#              project name is suffixed by CLONE_INDEX, so parallel stacks do
#              not contend for 9090. Substitute accordingly.
#
# ============================================================================
# KEY CONFIGURATION AND DEFAULTS
# ============================================================================
#   * scrape_interval 15s. Fixed by the migration plan and matched by the
#     Grafana datasource timeInterval; the two must stay in step.
#   * scrape_timeout 10s, strictly below the interval - see the note on the key
#     itself.
#   * One job, job_name carddemo-app. Treat it as a published name: it labels
#     every stored series and any future query may select on it.
#   * One target, app:8080 - the Compose service and the port it listens on
#     inside the network; see the note on the target itself.
#   * metrics_path /actuator/prometheus. The base path comes from
#     management.endpoints.web.base-path and the endpoint is one of the three
#     that management.endpoints.web.exposure.include permits, alongside health
#     and info. Exposure is never `*`, so there is no /actuator/metrics and no
#     /metrics to scrape, and the configuration-bearing endpoints are absent by
#     construction and are deliberately not requested here.
#   * Port 8080 from server.port, corroborated by the Dockerfile's EXPOSE. There
#     is no separate management port in any profile, so the application and its
#     actuator share one port.
#   * scheme http. The scrape stays on the Compose bridge network; transport
#     security is out of scope for the local topology, and this file carries no
#     transport override and no authentication material of any kind.
#   * Measurement names are NOT here - they are constants in
#     MetricsConfig.java. Actuator settings are NOT here - they are in
#     application.yml. Grafana settings are NOT here - they are in
#     observability/grafana/**.
#
# ============================================================================
# COMMON FAILURE MODES AND TROUBLESHOOTING
# ============================================================================
#   * Target down, "connection refused". The application container is up but
#     not yet serving, or it is still applying the Flyway migrations. Check
#     `docker compose ps app` and confirm from inside this container with
#     `docker compose exec prometheus wget -q -O- http://app:8080/actuator/prometheus | head -3`.
#     Prometheus keeps retrying every 15s and recovers on its own once the
#     endpoint answers, so no reload is needed.
#   * Target down, "no such host" or a lookup failure. The `app` service is not
#     on this network - typically because the stack was brought up for a subset
#     of services, as `docker compose up -d prometheus` alone does. Bring the
#     application up with `docker compose up -d --build app`, or start the whole
#     stack with `docker compose up --build --wait`. Compose re-resolves the
#     service name on every scrape, so the target recovers without a reload.
#   * Running the application on the host instead of in the container - for
#     example `SPRING_PROFILES_ACTIVE=local ./mvnw spring-boot:run` - moves it
#     off this network, and `app` then has nothing to resolve to. Reach a
#     host-run process by pointing the target at host.docker.internal:8080 and
#     giving the prometheus service `extra_hosts` of
#     host.docker.internal:host-gateway in docker-compose.yml; both changes
#     belong together, and both are reverted by returning to the containerised
#     application, which is the committed topology.
#   * Target up but HTTP 404. The actuator exposure list no longer includes
#     prometheus, or the base path moved. Both live in application.yml, not
#     here; fix them there rather than changing metrics_path.
#   * Target up but HTTP 401 or 403. The security filter chain is not
#     permitting anonymous access to the endpoint. That is a SecurityConfig
#     concern; this file sends no authentication material and must not.
#   * Target up and healthy but a panel is empty. A counter that has never
#     been incremented is ABSENT from the exposition, not zero, so its series
#     does not exist until the application has actually processed work. Drive
#     the relevant flow, then re-query. `up{job="carddemo-app"}` is the
#     control: if that returns 1, scraping is fine and the gap is upstream.
#   * Prometheus refuses to start, complaining that a scrape timeout exceeds
#     the scrape interval. Any scrape_timeout at or above scrape_interval is
#     rejected at load. Keep it strictly below 15s.
#   * An edit appears to have no effect. The mount is read-only and the file is
#     read at start or on reload only. Either POST /-/reload or restart the
#     service, and check /api/v1/status/config to see what the server actually
#     holds.

global:
  # Fixed at 15 seconds. This is the cadence the migration plan specifies for
  # /actuator/prometheus, and the Grafana datasource declares the same value as
  # its timeInterval, so changing one without the other would misalign every
  # rate() window on the dashboard.
  scrape_interval: 15s
  # Strictly less than scrape_interval. Prometheus rejects a configuration
  # whose timeout is greater than or equal to its interval, and bounding the
  # request stops one unresponsive endpoint from stalling the 15s cadence.
  scrape_timeout: 10s

# Deliberately absent, each because nothing would consume it:
#   * rule_files and alerting - this project defines no alerting or recording
#     rule artefact, so evaluation_interval is omitted too rather than
#     configuring a rule evaluator with nothing to evaluate.
#   * external_labels - they are attached only on federation, remote-write and
#     alert egress, none of which exists here.
#   * remote_write and remote_read - all traffic stays inside the local
#     topology and no hosted or external endpoint is contacted.
#   * service discovery of every kind - the topology is a single Docker Compose
#     stack whose members are known at author time, so one static target is the
#     deterministic choice.

scrape_configs:

  # --------------------------------------------------------------------------
  # The CardDemo modular monolith - the only scrape job in this project
  # --------------------------------------------------------------------------
  # Deliberately the only job. Nothing consumes Prometheus self-metrics: the
  # checked-in dashboard has no panel for them and selects no `job` label at
  # all, so a self-scrape job would be a stanza no reader reads. Grafana,
  # Jaeger, PostgreSQL and LocalStack have no exporter provisioned in
  # docker-compose.yml, so a job for any of them would be permanently down and
  # would make the integration sign-off evidence misleading rather than
  # informative.
  - job_name: carddemo-app
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      # One static target: the `app` service of the repository-root
      # docker-compose.yml, reached by service name over the Compose bridge
      # network that both containers join. Compose resolves the name through
      # its embedded DNS at every scrape, so a restarted or rebuilt
      # application container is picked up without a reload.
      #
      # The port is the CONTAINER port, 8080, not the published host port.
      # docker-compose.yml pins the application's SERVER_PORT to 8080 inside
      # the network for exactly this reason and shifts only the published port
      # for parallel clones, because this literal cannot interpolate a
      # variable - Prometheus performs no environment substitution on its
      # configuration file. An earlier revision targeted
      # host.docker.internal:8080 because the topology then ran the substrate
      # only and the application ran on the host; that indirection went with
      # the extra_hosts entry it required when the application service was
      # added. See TROUBLESHOOTING above for reaching a host-run process.
      - targets:
          - app:8080
        labels:
          # The one target label, and a cross-file contract rather than a
          # decoration: src/main/resources/application.yml states that
          # spring.application.name must match the `service` label attached
          # here. Deliberately no `application` and no `component` label - the
          # exposition already carries both as common tags, and a target label
          # of the same name
          # would push the exposition's own value aside under an exported_
          # prefix. Every label here is a fixed literal: nothing that varies
          # per request or per record, and nothing identifying an account,
          # card, customer, transaction or user, belongs in a label. Those
          # values are carried by the application's structured logs.
          service: carddemo
