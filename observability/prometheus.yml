# ******************************************************************
# * File         : prometheus.yml
# * Application  : CardDemo
# * Type         : Prometheus scrape configuration
# * Function     : Scrapes the Spring Boot Actuator Prometheus endpoint every
# *                15 seconds. Replaces the end-of-run DISPLAY counters of
# *                app/cbl/CBTRN02C.cbl ('TRANSACTIONS PROCESSED :' and
# *                'TRANSACTIONS REJECTED  :') with continuously scraped
# *                metrics: carddemo.batch.records.processed,
# *                carddemo.batch.records.rejected (tagged by reject code
# *                100/101/102/103/109), carddemo.auth.attempts and
# *                carddemo.transaction.amount.total.
