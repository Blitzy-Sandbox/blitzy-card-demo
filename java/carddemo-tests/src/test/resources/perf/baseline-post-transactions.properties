# JFR baseline metrics for the POST-TRANSACTIONS workload.
#
# COBOL source: app/cbl/CBTRN02C.cbl (full posting engine, ~25 paragraphs)
# Java entry point: com.blitzy.carddemo.batch.PostTransactionsBatch (TBD; stubbed in JfrBaseline)
#
# Per AAP §0.6.11 & §0.7.5: these are PLACEHOLDER values pending capture from
# Enterprise COBOL 6.4 on equivalent hardware (z15-equivalent). The capture
# procedure is documented in java/MIGRATION_NOTES.md. Until real baselines
# arrive, the regression-band assertion at +10% is intentionally generous so
# that the smoke run of the harness exercises every code path (start →
# workload → recording → parse → compare → assert) without false negatives.
#
# Properties (long; millis or bytes as noted):
#   wall.clock.millis     wall-clock duration of the workload  (ms)
#   gc.pause.millis       sum of all GC pause durations         (ms)
#   gc.collection.count   number of GC cycles observed
#   peak.heap.bytes       peak heap usage observed              (bytes)
#   allocation.count      count of object-allocation JFR events
#
# Metadata (free-form, optional):
#   captured.on           ISO-like timestamp of capture
#   captured.hardware     capture hardware identifier
#
wall.clock.millis=60000
gc.pause.millis=2000
gc.collection.count=10
peak.heap.bytes=536870912
allocation.count=500000
captured.on=placeholder
captured.hardware=placeholder
