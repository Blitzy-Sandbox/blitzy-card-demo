# =====================================================================
# CardDemo Java 25 LTS — JFR Performance Regression Baseline
# =====================================================================
#
# Source: AAP §0.6.11, AAP §0.7.2
# Consumer:
#   src/test/java/com/blitzy/carddemo/tests/perf/JfrBaselineTest.java
#
# This file captures the reference wall-clock duration of the canonical
# Decimals workload (defined by JfrBaselineTest.runDecimalsWorkload) and
# the regression tolerance band (10% per AAP §0.6.11). Values are
# environment-specific; see java/README.md for the recommended
# capture procedure on a stable CI host.
#
# ---------------------------------------------------------------------
# decimals.workload.median.nanos
# ---------------------------------------------------------------------
# Median wall-clock duration of the Decimals workload in nanoseconds,
# captured on a representative reference environment. Until a real
# capture is committed, this value is intentionally the literal string
# PLACEHOLDER, which causes JfrBaselineTest to log the measured value and
# skip the regression assertion (collection mode).
#
# To capture a real baseline:
#   1. Run mvn -pl carddemo-tests -Dtest=JfrBaselineTest test on a stable
#      CI host with the JVM flags documented in java/README.md
#      (-XX:+UseCompactObjectHeaders -XX:+UseShenandoahGC
#       -XX:ShenandoahGCMode=generational).
#   2. Read the measured nanosecond value from the test log
#      ("JFR baseline running in COLLECTION mode; measured Decimals
#      workload median = N ns ...").
#   3. Replace the literal PLACEHOLDER below with N (an integer).
#   4. Remove the @Disabled annotation on
#      JfrBaselineTest#decimalsWorkloadWithinTolerance and commit both
#      changes in the same PR.
decimals.workload.median.nanos=PLACEHOLDER

# ---------------------------------------------------------------------
# decimals.workload.tolerance
# ---------------------------------------------------------------------
# Allowed regression fraction (0.10 == 10% per AAP §0.6.11). The
# assertion fails when the measured duration exceeds
# baseline * (1 + tolerance). Lowering tolerance below 0.10 narrows
# the gate; raising above is not permitted by AAP §0.6.11.
decimals.workload.tolerance=0.10
