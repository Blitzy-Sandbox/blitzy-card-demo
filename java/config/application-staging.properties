###############################################################################
# CardDemo (Java 25 LTS) — Staging Environment Configuration
# -----------------------------------------------------------------------------
# Refine-PR deliverable Item 3 — per-environment configuration template for
# the STAGING environment. Derived from java/application.properties.example
# (the CANONICAL template) with environment-appropriate overrides for
# carddemo.data.root, carddemo.output.root, carddemo.gdg.root, and
# SafePathResolver allowed-roots. The STAGING template is intended for the
# pre-production environment that mirrors PROD topology, runs against
# refreshed (sanitized) datasets, and validates end-to-end batch flows
# before promotion.
#
# Authority:
#   * AAP §0.2.1, §0.4.1, §0.5.4, §0.7.5 — environment variable contract
#   * Refine-PR Item 3 — three per-environment templates (dev/staging/prod)
#   * SafePathResolver — CWE-22 path-containment mitigation per AAP §0.6.5
#     and §0.7.2; the carddemo.data.root and carddemo.output.root values
#     below act as the explicit allowed-roots that constrain every
#     operator-supplied DD path resolved through
#     SafePathResolver.resolve(key, default, allowedRoot).
#
# Loading pattern (CARDDEMO_CONFIG environment variable):
#   The application discovers its configuration through a layered precedence:
#     (1) System property -Dcarddemo.<key>=<value> on the JVM command line
#     (2) Environment variable CARDDEMO_<KEY_WITH_UNDERSCORES>
#     (3) The file pointed at by environment variable CARDDEMO_CONFIG
#         (defaults to ./application.properties next to the JAR if unset)
#     (4) The hard-coded application.properties shipped inside each shaded
#         jar (carddemo-app/src/main/resources/application.properties)
#     (5) SafePathResolver.resolveTrusted / .resolve defaults from the
#         calling app class
#
#   Recommended staging deployment pattern:
#       export CARDDEMO_CONFIG=/etc/carddemo/application-staging.properties
#       sudo install -m 0640 -o carddemo -g carddemo \
#           java/config/application-staging.properties \
#           /etc/carddemo/application-staging.properties
#       systemctl restart carddemo-<program>
#
#   Secrets (CARDDEMO_JDBC_PASSWORD if the optional JDBC adapter is enabled)
#   MUST come from the environment, not from this file. The systemd unit
#   should source /etc/carddemo/staging.env (mode 0600, owner root) which
#   exports the credentials.
#
# Hard constraints honored by this template:
#   * carddemo.file.charset is set to IBM-1047 (EBCDIC) per the AAP §0.6.5
#     and §0.7.5 default; staging operates on canonical EBCDIC datasets
#     so the per-file overrides are NOT pre-set here.
#   * No JDBC credentials are written here (staging may use file-based
#     persistence; if a JDBC adapter is required, set CARDDEMO_JDBC_*
#     via env var or a sibling secrets file outside source control).
#   * No plaintext password migration is attempted (AAP §0.7.2 — deferred).
###############################################################################


# =============================================================================
# 1. Application identity (STAGING)
# =============================================================================
carddemo.app.name=carddemo-staging
carddemo.app.version=1.0.0-SNAPSHOT


# =============================================================================
# 2. SafePathResolver allowed-roots — STAGING
# -----------------------------------------------------------------------------
# Staging uses dedicated POSIX directories under /var/carddemo so the
# Java process runs with a hardened SELinux/AppArmor profile that grants
# read access only to the data root and write access only to the output
# root. These directories must exist with mode 0750 and ownership
# carddemo:carddemo before the first run; the install playbook
# (out of scope for this template) creates them.
#
# IMPORTANT: every operator-supplied path that flows through
# SafePathResolver.resolve(key, default, allowedRoot) MUST resolve
# underneath one of these roots. Paths that try to escape via `..`
# segments are rejected at resolution time per AAP §0.6.5 / §0.7.2
# (CWE-22 mitigation).
# =============================================================================
carddemo.data.root=/var/carddemo/staging/in
carddemo.output.root=/var/carddemo/staging/out


# =============================================================================
# 3. Codepage — STAGING
# -----------------------------------------------------------------------------
# Staging operates on canonical EBCDIC datasets received from the
# upstream feed; IBM-1047 is the correct default. Per-file overrides
# below are commented out (use only when an individual feed switches
# codepage for a tracked outage / regression run).
# =============================================================================
carddemo.file.charset=IBM-1047


# =============================================================================
# 4. Dataset paths — STAGING (default values)
# -----------------------------------------------------------------------------
# Every property below points at a file under /var/carddemo/staging/in
# (input) or /var/carddemo/staging/out (output). Datasets are refreshed
# nightly from production via a sanitizing feed (out of scope here);
# the refresh job overwrites these paths in place.
# =============================================================================
carddemo.file.acctdata.path=/var/carddemo/staging/in/acctdata.dat
carddemo.file.carddata.path=/var/carddemo/staging/in/carddata.dat
carddemo.file.cardxref.path=/var/carddemo/staging/in/cardxref.dat
carddemo.file.custdata.path=/var/carddemo/staging/in/custdata.dat
carddemo.file.dailytran.path=/var/carddemo/staging/in/dailytran.dat
carddemo.file.dalyrejs.path=/var/carddemo/staging/out/dalyrejs.dat
carddemo.file.transact.path=/var/carddemo/staging/in/transact.dat
carddemo.file.discgrp.path=/var/carddemo/staging/in/discgrp.dat
carddemo.file.trancatg.path=/var/carddemo/staging/in/trancatg.dat
carddemo.file.trantype.path=/var/carddemo/staging/in/trantype.dat
carddemo.file.tcatbalf.path=/var/carddemo/staging/in/tcatbalf.dat
carddemo.file.usrsec.path=/var/carddemo/staging/in/usrsec.dat
carddemo.file.stmt.text.path=/var/carddemo/staging/out/statements.txt
carddemo.file.stmt.html.path=/var/carddemo/staging/out/statements.html
carddemo.file.tranrept.path=/var/carddemo/staging/out/tranrept.dat
carddemo.file.printcatbl.path=/var/carddemo/staging/out/tcatbalf.rept
carddemo.file.dateparm.path=/var/carddemo/staging/in/dateparm.dat
carddemo.file.defcust.delete.path=/var/carddemo/staging/in/defcust-delete.ctl
carddemo.file.defcust.define.path=/var/carddemo/staging/in/defcust-define.ctl


# =============================================================================
# 5. Per-file codepage overrides — STAGING (COMMENTED — uncomment if needed)
# -----------------------------------------------------------------------------
# Staging operates on canonical EBCDIC datasets by default. If a feed
# switches codepage temporarily (e.g., during a documented vendor
# regression), uncomment the affected line and set the new codepage.
# =============================================================================
#carddemo.file.acctdata.charset=IBM-1047
#carddemo.file.carddata.charset=IBM-1047
#carddemo.file.cardxref.charset=IBM-1047
#carddemo.file.custdata.charset=IBM-1047
#carddemo.file.dailytran.charset=IBM-1047
#carddemo.file.dalyrejs.charset=IBM-1047
#carddemo.file.discgrp.charset=IBM-1047
#carddemo.file.trancatg.charset=IBM-1047
#carddemo.file.trantype.charset=IBM-1047
#carddemo.file.tcatbalf.charset=IBM-1047


# =============================================================================
# 6. GDG (Generation Data Group) — STAGING
# -----------------------------------------------------------------------------
# DefineGdgApp creates this root if missing and populates +0 / +1 / etc.
# generation files underneath. SafePathResolver enforces that every GDG
# write resolves under this root or under carddemo.output.root. The
# staging GDG retention policy is 7 generations (operator-enforced via
# a cron job; see java/RUNBOOK.md §2 "GDG version management").
# =============================================================================
carddemo.gdg.root=/var/carddemo/staging/gdg


# =============================================================================
# 7. Statement-generation working directory — STAGING
# -----------------------------------------------------------------------------
# CreateStatementsApp uses this directory for intermediate artifacts
# during CBSTM03A's multi-file open/read/write/close orchestration.
# The directory is wiped at the start of each statement run; do not
# persist files here.
# =============================================================================
carddemo.work.path=/var/carddemo/staging/work


# =============================================================================
# 8. Batch run identity — STAGING
# -----------------------------------------------------------------------------
# Bound to BATCH_CTX (a ScopedValue<BatchRunContext>) at job entry per
# AAP §0.6.6. Staging uses ISO-formatted dates and a short tenant
# code so log aggregation and JFR analysis can filter by environment.
# Override carddemo.batch.processing-date at job-launch time via
# `-Dcarddemo.batch.processing-date=YYYY-MM-DD` or
# `CARDDEMO_BATCH_PROCESSING_DATE=YYYY-MM-DD` to back-date a re-run.
# =============================================================================
carddemo.batch.processing-date=
carddemo.batch.run-id=
carddemo.batch.tenant=staging


# =============================================================================
# 9. Interest calculation PARM — STAGING
# -----------------------------------------------------------------------------
# Mirrors app/jcl/INTCALC.jcl STEP15 PARM='2022071800' per AAP §0.6.5.
# Staging defaults to the canonical fixture date so the first run on a
# refreshed dataset is reproducible against the documented expected
# output (golden-record COBOL captures).
# =============================================================================
carddemo.intcalc.parm=2022071800


# =============================================================================
# 10. Transaction-report date range — STAGING
# -----------------------------------------------------------------------------
# Defaults match JCL TRANREPT.JCL. Operators usually override these
# per run via env vars (CARDDEMO_TRANREPT_START_DATE,
# CARDDEMO_TRANREPT_END_DATE).
# =============================================================================
carddemo.tranrept.start-date=2022-01-01
carddemo.tranrept.end-date=2022-07-06


# =============================================================================
# 11. JDBC adapter — STAGING (DISABLED by default)
# -----------------------------------------------------------------------------
# carddemo-adapter-db is empty by default per AAP §0.7.5. Staging mirrors
# the PROD persistence path; if PROD uses file-based persistence, this
# stays disabled. If PROD enables JDBC, set CARDDEMO_JDBC_ENABLED=true
# in the systemd EnvironmentFile and set the connection credentials via
# CARDDEMO_JDBC_URL / CARDDEMO_JDBC_USERNAME / CARDDEMO_JDBC_PASSWORD
# (the password MUST come from a secrets file or vault, never from this
# template).
# =============================================================================
carddemo.jdbc.enabled=false


# =============================================================================
# 12. Golden-record test harness — STAGING
# -----------------------------------------------------------------------------
# Staging does NOT typically run the golden-record harness (it's a PR
# gate that runs in CI); these keys are kept for parity with the DEV
# template and for ad-hoc parity checks against the canonical fixture
# tree shipped with the application bundle.
# =============================================================================
carddemo.test.golden.root=classpath:/golden
carddemo.test.golden.fixture-source=/var/carddemo/staging/golden-fixtures
carddemo.test.perf.jfr.regression-band=10


###############################################################################
# END OF FILE — keep the trailing newline below; .properties files are line-
# oriented and certain tools mis-parse a missing terminal newline.
###############################################################################
