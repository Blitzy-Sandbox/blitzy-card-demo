###############################################################################
# CardDemo (Java 25 LTS) — Production Environment Configuration
# -----------------------------------------------------------------------------
# Refine-PR deliverable Item 3 — per-environment configuration template for
# the PRODUCTION environment. Derived from java/application.properties.example
# (the CANONICAL template) with environment-appropriate overrides for
# carddemo.data.root, carddemo.output.root, carddemo.gdg.root, and
# SafePathResolver allowed-roots. The PROD template is the LIVE production
# configuration; every value here must be reviewed by SRE before promotion.
#
# Authority:
#   * AAP §0.2.1, §0.4.1, §0.5.4, §0.7.5 — environment variable contract
#   * Refine-PR Item 3 — three per-environment templates (dev/staging/prod)
#   * SafePathResolver — CWE-22 path-containment mitigation per AAP §0.6.5
#     and §0.7.2; the carddemo.data.root and carddemo.output.root values
#     below act as the explicit allowed-roots that constrain every
#     operator-supplied DD path resolved through
#     SafePathResolver.resolve(key, default, allowedRoot).
#
# Loading pattern (CARDDEMO_CONFIG environment variable):
#   The application discovers its configuration through a layered precedence:
#     (1) System property -Dcarddemo.<key>=<value> on the JVM command line
#     (2) Environment variable CARDDEMO_<KEY_WITH_UNDERSCORES>
#     (3) The file pointed at by environment variable CARDDEMO_CONFIG
#         (defaults to ./application.properties next to the JAR if unset)
#     (4) The hard-coded application.properties shipped inside each shaded
#         jar (carddemo-app/src/main/resources/application.properties)
#     (5) SafePathResolver.resolveTrusted / .resolve defaults from the
#         calling app class
#
#   Recommended production deployment pattern:
#       # 1) Drop the canonical template (this file) at a stable path:
#       sudo install -m 0640 -o carddemo -g carddemo \
#           java/config/application-prod.properties \
#           /etc/carddemo/application-prod.properties
#       # 2) Drop the secrets file (NOT in source control) at:
#       sudo install -m 0600 -o root -g root \
#           /secure/prod.env /etc/carddemo/prod.env
#       # 3) Point the systemd unit at both:
#       [Service]
#       EnvironmentFile=/etc/carddemo/prod.env
#       Environment=CARDDEMO_CONFIG=/etc/carddemo/application-prod.properties
#       ExecStart=/usr/bin/java -XX:+UseCompactObjectHeaders \
#                              -XX:+UseShenandoahGC \
#                              -XX:ShenandoahGCMode=generational \
#                              -jar /opt/carddemo/carddemo-<program>.jar
#       # 4) systemctl daemon-reload && systemctl restart carddemo-<program>
#
# Hard constraints honored by this template:
#   * carddemo.file.charset is set to IBM-1047 (EBCDIC) per the AAP §0.6.5
#     and §0.7.5 default; PROD operates exclusively on canonical EBCDIC
#     datasets received from the upstream mainframe, so the per-file
#     overrides remain commented out.
#   * NO JDBC credentials are written here. If the optional JDBC adapter
#     is enabled in PROD, CARDDEMO_JDBC_USERNAME / CARDDEMO_JDBC_PASSWORD
#     MUST come from /etc/carddemo/prod.env (mode 0600, owner root) which
#     is sourced via systemd EnvironmentFile.
#   * No plaintext password migration is attempted (AAP §0.7.2 — deferred
#     to a separate follow-on PR; SEC-USR-PWD remains plaintext per
#     CSUSR01Y.cpy preservation mandate).
#   * Card PAN logging is masked at the application layer per AAP §0.7.2;
#     no configuration change in this file affects PAN-masking behavior.
###############################################################################


# =============================================================================
# 1. Application identity (PROD)
# =============================================================================
carddemo.app.name=carddemo-prod
carddemo.app.version=1.0.0-SNAPSHOT


# =============================================================================
# 2. SafePathResolver allowed-roots — PROD
# -----------------------------------------------------------------------------
# PROD uses dedicated POSIX directories under /var/carddemo with strict
# permissions enforced by SELinux/AppArmor:
#   /var/carddemo/prod/in        mode 0750 owner carddemo:carddemo (read)
#   /var/carddemo/prod/out       mode 0750 owner carddemo:carddemo (write)
#   /var/carddemo/prod/gdg       mode 0750 owner carddemo:carddemo (read+write)
#   /var/carddemo/prod/work      mode 0700 owner carddemo:carddemo (transient)
#
# IMPORTANT: every operator-supplied path that flows through
# SafePathResolver.resolve(key, default, allowedRoot) MUST resolve
# underneath one of these roots. Paths that try to escape via `..`
# segments are rejected at resolution time per AAP §0.6.5 / §0.7.2
# (CWE-22 mitigation). PROD does NOT permit ad-hoc path overrides;
# all paths flow through the SafePathResolver allow-list.
# =============================================================================
carddemo.data.root=/var/carddemo/prod/in
carddemo.output.root=/var/carddemo/prod/out


# =============================================================================
# 3. Codepage — PROD
# -----------------------------------------------------------------------------
# PROD operates exclusively on canonical EBCDIC datasets received from
# the upstream mainframe. IBM-1047 is the binding codepage; do NOT
# override unless an explicit, documented upstream feed change has been
# coordinated with mainframe operations.
# =============================================================================
carddemo.file.charset=IBM-1047


# =============================================================================
# 4. Dataset paths — PROD (default values)
# -----------------------------------------------------------------------------
# Every property below points at a file under /var/carddemo/prod/in
# (input) or /var/carddemo/prod/out (output). The upstream mainframe
# feed places freshly-unloaded VSAM datasets at these paths nightly;
# the Java jobs run from these locations directly. SELinux/AppArmor
# enforces read-only access to /var/carddemo/prod/in for the carddemo
# user, and write-only access to /var/carddemo/prod/out.
# =============================================================================
carddemo.file.acctdata.path=/var/carddemo/prod/in/acctdata.dat
carddemo.file.carddata.path=/var/carddemo/prod/in/carddata.dat
carddemo.file.cardxref.path=/var/carddemo/prod/in/cardxref.dat
carddemo.file.custdata.path=/var/carddemo/prod/in/custdata.dat
carddemo.file.dailytran.path=/var/carddemo/prod/in/dailytran.dat
carddemo.file.dalyrejs.path=/var/carddemo/prod/out/dalyrejs.dat
carddemo.file.transact.path=/var/carddemo/prod/in/transact.dat
carddemo.file.discgrp.path=/var/carddemo/prod/in/discgrp.dat
carddemo.file.trancatg.path=/var/carddemo/prod/in/trancatg.dat
carddemo.file.trantype.path=/var/carddemo/prod/in/trantype.dat
carddemo.file.tcatbalf.path=/var/carddemo/prod/in/tcatbalf.dat
carddemo.file.usrsec.path=/var/carddemo/prod/in/usrsec.dat
carddemo.file.stmt.text.path=/var/carddemo/prod/out/statements.txt
carddemo.file.stmt.html.path=/var/carddemo/prod/out/statements.html
carddemo.file.tranrept.path=/var/carddemo/prod/out/tranrept.dat
carddemo.file.printcatbl.path=/var/carddemo/prod/out/tcatbalf.rept
carddemo.file.dateparm.path=/var/carddemo/prod/in/dateparm.dat
carddemo.file.defcust.delete.path=/var/carddemo/prod/in/defcust-delete.ctl
carddemo.file.defcust.define.path=/var/carddemo/prod/in/defcust-define.ctl


# =============================================================================
# 5. Per-file codepage overrides — PROD (COMMENTED — leave commented)
# -----------------------------------------------------------------------------
# PROD's binding codepage is IBM-1047 for every dataset. The per-file
# overrides below are kept commented as documentation but MUST NOT be
# uncommented in PROD without a documented mainframe coordination
# event. Use a tracked ticket and a change record before any
# uncommenting.
# =============================================================================
#carddemo.file.acctdata.charset=IBM-1047
#carddemo.file.carddata.charset=IBM-1047
#carddemo.file.cardxref.charset=IBM-1047
#carddemo.file.custdata.charset=IBM-1047
#carddemo.file.dailytran.charset=IBM-1047
#carddemo.file.dalyrejs.charset=IBM-1047
#carddemo.file.discgrp.charset=IBM-1047
#carddemo.file.trancatg.charset=IBM-1047
#carddemo.file.trantype.charset=IBM-1047
#carddemo.file.tcatbalf.charset=IBM-1047


# =============================================================================
# 6. GDG (Generation Data Group) — PROD
# -----------------------------------------------------------------------------
# DefineGdgApp creates this root if missing and populates +0 / +1 / etc.
# generation files underneath. SafePathResolver enforces that every GDG
# write resolves under this root or under carddemo.output.root. The
# PROD retention policy is 30 generations rotated via a cron job
# (see java/RUNBOOK.md §2 "GDG version management"); older generations
# are archived to S3-IA / Glacier per the data-retention policy.
# =============================================================================
carddemo.gdg.root=/var/carddemo/prod/gdg


# =============================================================================
# 7. Statement-generation working directory — PROD
# -----------------------------------------------------------------------------
# CreateStatementsApp uses this directory for intermediate artifacts
# during CBSTM03A's multi-file open/read/write/close orchestration.
# The directory is wiped at the START and END of each statement run;
# intermediate artifacts MUST NOT persist between runs because they
# may contain PII (customer name, address, statement totals).
# =============================================================================
carddemo.work.path=/var/carddemo/prod/work


# =============================================================================
# 8. Batch run identity — PROD
# -----------------------------------------------------------------------------
# Bound to BATCH_CTX (a ScopedValue<BatchRunContext>) at job entry per
# AAP §0.6.6. PROD's `carddemo.batch.run-id` is computed at job-launch
# time by the orchestration tier (Airflow / Argo / etc.) and exported
# via env var; do NOT pin a static value here. The tenant tag is
# always "prod" for log aggregation filtering.
# =============================================================================
carddemo.batch.processing-date=
carddemo.batch.run-id=
carddemo.batch.tenant=prod


# =============================================================================
# 9. Interest calculation PARM — PROD
# -----------------------------------------------------------------------------
# Mirrors app/jcl/INTCALC.jcl STEP15 PARM='2022071800' per AAP §0.6.5.
# In PROD, the orchestration tier overrides this at job-launch time
# via `CARDDEMO_INTCALC_PARM=YYYYMMDDHH`. The committed default is
# left blank deliberately so a misconfigured launch fails fast rather
# than silently running against a stale fixture date.
# =============================================================================
carddemo.intcalc.parm=


# =============================================================================
# 10. Transaction-report date range — PROD
# -----------------------------------------------------------------------------
# In PROD, the orchestration tier overrides both at job-launch time
# via `CARDDEMO_TRANREPT_START_DATE` / `CARDDEMO_TRANREPT_END_DATE`.
# The committed defaults are left blank deliberately so a misconfigured
# launch fails fast.
# =============================================================================
carddemo.tranrept.start-date=
carddemo.tranrept.end-date=


# =============================================================================
# 11. JDBC adapter — PROD (DISABLED by default per AAP §0.7.5)
# -----------------------------------------------------------------------------
# carddemo-adapter-db is empty by default per AAP §0.7.5. PROD MAY
# enable a JDBC adapter for a sidecar audit-log / metadata table, but
# the main posting / interest-calc / statement chain remains file-
# based per AAP §0.7.5. If JDBC is enabled, the credentials MUST come
# from /etc/carddemo/prod.env (sourced by systemd EnvironmentFile):
#
#     CARDDEMO_JDBC_ENABLED=true
#     CARDDEMO_JDBC_URL=jdbc:<driver>://<host>:<port>/<db>
#     CARDDEMO_JDBC_USERNAME=<svc-account>
#     CARDDEMO_JDBC_PASSWORD=<rotated-secret-NOT-COMMITTED>
# =============================================================================
carddemo.jdbc.enabled=false
carddemo.jdbc.url=
carddemo.jdbc.username=
carddemo.jdbc.password=


# =============================================================================
# 12. Golden-record test harness — PROD (NOT EXECUTED IN PROD)
# -----------------------------------------------------------------------------
# PROD does NOT run the golden-record harness (it's a PR gate that
# runs only in CI). These keys are kept for parity with DEV/STAGING
# but the corresponding tests are NOT shipped in the PROD jar bundle.
# Leaving the fixture-source path blank is correct for PROD.
# =============================================================================
carddemo.test.golden.root=classpath:/golden
carddemo.test.golden.fixture-source=
carddemo.test.perf.jfr.regression-band=10


###############################################################################
# END OF FILE — keep the trailing newline below; .properties files are line-
# oriented and certain tools mis-parse a missing terminal newline.
###############################################################################
