###############################################################################
# CardDemo (Java 25 LTS) — Development Environment Configuration
# -----------------------------------------------------------------------------
# Refine-PR deliverable Item 3 — per-environment configuration template for
# the DEV environment. Derived from java/application.properties.example
# (the CANONICAL template) with environment-appropriate overrides for
# carddemo.data.root, carddemo.output.root, carddemo.gdg.root, and
# SafePathResolver allowed-roots. The DEV template is intended for the
# developer's local workstation and for short-lived ephemeral test
# environments (CI runners, sandbox VMs) where the COBOL fixtures live
# adjacent to the Java reactor under app/data/ASCII/.
#
# Authority:
#   * AAP §0.2.1, §0.4.1, §0.5.4, §0.7.5 — environment variable contract
#   * Refine-PR Item 3 — three per-environment templates (dev/staging/prod)
#   * SafePathResolver — CWE-22 path-containment mitigation per AAP §0.6.5
#     and §0.7.2; the carddemo.data.root and carddemo.output.root values
#     below act as the explicit allowed-roots that constrain every
#     operator-supplied DD path resolved through
#     SafePathResolver.resolve(key, default, allowedRoot).
#
# Loading pattern (CARDDEMO_CONFIG environment variable):
#   The application discovers its configuration through a layered precedence:
#     (1) System property -Dcarddemo.<key>=<value> on the JVM command line
#     (2) Environment variable CARDDEMO_<KEY_WITH_UNDERSCORES>
#     (3) The file pointed at by environment variable CARDDEMO_CONFIG
#         (defaults to ./application.properties next to the JAR if unset)
#     (4) The hard-coded application.properties shipped inside each shaded
#         jar (carddemo-app/src/main/resources/application.properties)
#     (5) SafePathResolver.resolveTrusted / .resolve defaults from the
#         calling app class
#
#   To use this template, EITHER copy it to ./application.properties next
#   to the shaded jar AND export CARDDEMO_CONFIG=./application.properties,
#   OR export CARDDEMO_CONFIG=./config/application-dev.properties and
#   keep this file in its repo location. The second pattern is preferred
#   because it keeps environment-specific config in version control while
#   secrets (DB passwords, cloud credentials) live exclusively in env
#   vars per the 12-factor methodology.
#
# Hard constraints honored by this template:
#   * carddemo.file.charset is set to IBM-1047 (EBCDIC) per the AAP §0.6.5
#     and §0.7.5 default; per-file overrides for ASCII fixtures appear in
#     the commented block below.
#   * No JDBC credentials are written here (DEV environments may use file-
#     based persistence exclusively; if a JDBC adapter is required, set
#     CARDDEMO_JDBC_PASSWORD via env var instead of pasting it into this
#     file).
#   * No plaintext password migration is attempted (AAP §0.7.2 — deferred).
###############################################################################


# =============================================================================
# 1. Application identity (DEV)
# =============================================================================
carddemo.app.name=carddemo
carddemo.app.version=1.0.0-SNAPSHOT


# =============================================================================
# 2. SafePathResolver allowed-roots — DEV
# -----------------------------------------------------------------------------
# DEV uses workspace-relative paths so a developer can clone the repo,
# build with `mvn -B -ntp clean verify`, and run a shaded jar without
# any prior provisioning. The data/output/gdg/work roots all live under
# ./build/dev-data/ so they are git-ignored and easy to wipe between
# runs (`rm -rf build/dev-data`).
#
# IMPORTANT: every operator-supplied path that flows through
# SafePathResolver.resolve(key, default, allowedRoot) MUST resolve
# underneath one of these roots. Paths that try to escape via `..`
# segments are rejected at resolution time per AAP §0.6.5 / §0.7.2
# (CWE-22 mitigation).
# =============================================================================
carddemo.data.root=./build/dev-data/in
carddemo.output.root=./build/dev-data/out


# =============================================================================
# 3. Codepage — DEV
# -----------------------------------------------------------------------------
# DEV defaults to IBM-1047 (EBCDIC) per AAP §0.6.5; for ad-hoc local
# experiments against the pre-transcoded ASCII fixtures under
# app/data/ASCII/, uncomment the per-file overrides in Section 5 below
# or pass `-Dcarddemo.file.charset=US-ASCII` on the JVM command line.
# =============================================================================
carddemo.file.charset=IBM-1047


# =============================================================================
# 4. Dataset paths — DEV (default values)
# -----------------------------------------------------------------------------
# Every property below points at a file under ./build/dev-data/in (input)
# or ./build/dev-data/out (output). Override on a case-by-case basis via
# env var (CARDDEMO_FILE_<DD>_PATH) or system property when running a
# specific shaded jar against alternate inputs.
# =============================================================================
carddemo.file.acctdata.path=./build/dev-data/in/acctdata.dat
carddemo.file.carddata.path=./build/dev-data/in/carddata.dat
carddemo.file.cardxref.path=./build/dev-data/in/cardxref.dat
carddemo.file.custdata.path=./build/dev-data/in/custdata.dat
carddemo.file.dailytran.path=./build/dev-data/in/dailytran.dat
carddemo.file.dalyrejs.path=./build/dev-data/out/dalyrejs.dat
carddemo.file.transact.path=./build/dev-data/in/transact.dat
carddemo.file.discgrp.path=./build/dev-data/in/discgrp.dat
carddemo.file.trancatg.path=./build/dev-data/in/trancatg.dat
carddemo.file.trantype.path=./build/dev-data/in/trantype.dat
carddemo.file.tcatbalf.path=./build/dev-data/in/tcatbalf.dat
carddemo.file.usrsec.path=./build/dev-data/in/usrsec.dat
carddemo.file.stmt.text.path=./build/dev-data/out/statements.txt
carddemo.file.stmt.html.path=./build/dev-data/out/statements.html
carddemo.file.tranrept.path=./build/dev-data/out/tranrept.dat
carddemo.file.printcatbl.path=./build/dev-data/out/tcatbalf.rept
carddemo.file.dateparm.path=./build/dev-data/in/dateparm.dat
carddemo.file.defcust.delete.path=./build/dev-data/in/defcust-delete.ctl
carddemo.file.defcust.define.path=./build/dev-data/in/defcust-define.ctl


# =============================================================================
# 5. Per-file codepage overrides — DEV (COMMENTED — uncomment if needed)
# -----------------------------------------------------------------------------
# When developing against the pre-transcoded ASCII fixtures under
# app/data/ASCII/, override the codepage to US-ASCII or UTF-8 to match
# the fixture's actual byte stream. The default IBM-1047 (Section 3
# above) wins when these per-file keys are commented out.
#
# To activate, uncomment the lines below by removing the leading `#`.
# =============================================================================
#carddemo.file.acctdata.charset=US-ASCII
#carddemo.file.carddata.charset=US-ASCII
#carddemo.file.cardxref.charset=US-ASCII
#carddemo.file.custdata.charset=US-ASCII
#carddemo.file.dailytran.charset=US-ASCII
#carddemo.file.dalyrejs.charset=US-ASCII
#carddemo.file.discgrp.charset=US-ASCII
#carddemo.file.trancatg.charset=US-ASCII
#carddemo.file.trantype.charset=US-ASCII
#carddemo.file.tcatbalf.charset=US-ASCII


# =============================================================================
# 6. GDG (Generation Data Group) — DEV
# -----------------------------------------------------------------------------
# DefineGdgApp creates this root if missing and populates +0 / +1 / etc.
# generation files underneath. SafePathResolver enforces that every GDG
# write resolves under this root or under carddemo.output.root.
# =============================================================================
carddemo.gdg.root=./build/dev-data/gdg


# =============================================================================
# 7. Statement-generation working directory — DEV
# -----------------------------------------------------------------------------
# CreateStatementsApp uses this directory for intermediate artifacts
# during CBSTM03A's multi-file open/read/write/close orchestration.
# =============================================================================
carddemo.work.path=./build/dev-data/work


# =============================================================================
# 8. Batch run identity — DEV
# -----------------------------------------------------------------------------
# Bound to BATCH_CTX (a ScopedValue<BatchRunContext>) at job entry per
# AAP §0.6.6. The DEV defaults below produce stable run IDs that
# operators can grep for in local log files; CI overrides processing-
# date to the date the build runs.
# =============================================================================
carddemo.batch.processing-date=
carddemo.batch.run-id=dev-${user.name}
carddemo.batch.tenant=dev


# =============================================================================
# 9. Interest calculation PARM — DEV
# -----------------------------------------------------------------------------
# Mirrors app/jcl/INTCALC.jcl STEP15 PARM='2022071800' per AAP §0.6.5.
# DEV uses the same default as the canonical app/data/ASCII/ fixtures
# so a vanilla `mvn verify` run produces a deterministic interest-
# accrual output that matches the COBOL golden fixtures.
# =============================================================================
carddemo.intcalc.parm=2022071800


# =============================================================================
# 10. Transaction-report date range — DEV
# -----------------------------------------------------------------------------
# Defaults match the JCL TRANREPT.JCL constants. Override for ad-hoc
# date-range reports.
# =============================================================================
carddemo.tranrept.start-date=2022-01-01
carddemo.tranrept.end-date=2022-07-06


# =============================================================================
# 11. JDBC adapter — DEV (DISABLED by default)
# -----------------------------------------------------------------------------
# carddemo-adapter-db is empty by default per AAP §0.7.5; DEV does NOT
# enable a relational database. To enable a local SQLite or H2 file-DB
# for ad-hoc experiments, set carddemo.jdbc.enabled=true here AND set
# CARDDEMO_JDBC_URL, CARDDEMO_JDBC_USERNAME, CARDDEMO_JDBC_PASSWORD via
# environment variables (never paste credentials into this template).
# =============================================================================
carddemo.jdbc.enabled=false


# =============================================================================
# 12. Golden-record test harness — DEV
# -----------------------------------------------------------------------------
# DEV's fixture-source path resolves the ASCII fixtures relative to the
# repo root (the antrun scan and surefire fork both start from java/).
# Use the absolute path on Windows to avoid CRLF / forward-slash drift.
# =============================================================================
carddemo.test.golden.root=classpath:/golden
carddemo.test.golden.fixture-source=../app/data/ASCII
carddemo.test.perf.jfr.regression-band=10


###############################################################################
# END OF FILE — keep the trailing newline below; .properties files are line-
# oriented and certain tools mis-parse a missing terminal newline.
###############################################################################
