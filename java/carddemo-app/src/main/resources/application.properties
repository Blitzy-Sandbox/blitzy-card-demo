# ============================================================================
# CardDemo Java 25 LTS — Bundled Classpath Default Configuration
# ============================================================================
# This file ships INSIDE every shaded jar produced by maven-shade-plugin in
# java/carddemo-app/pom.xml. It is loaded at startup via:
#     Properties props = new Properties();
#     try (InputStream in = AppName.class
#             .getResourceAsStream("/application.properties")) {
#         if (in != null) props.load(in);
#     }
#
# OVERRIDE PRECEDENCE (lowest -> highest):
#   1. This bundled file (safe defaults that allow the jar to start cleanly)
#   2. External application.properties on classpath / working directory
#   3. Environment variables: CARDDEMO_<UPPER_KEY_WITH_UNDERSCORES>
#      (e.g., CARDDEMO_FILE_ACCTDATA_PATH overrides carddemo.file.acctdata.path;
#       dots and hyphens both become underscores in the env-var form)
#
# Relationship to other application.properties files in this repository:
#   * java/application.properties.example       (committed, NOT bundled)
#       The canonical 12-factor template; copy to java/application.properties
#       to customize locally. See AAP §0.5.4.
#   * java/application.properties               (NOT committed, NOT bundled)
#       Local-machine override; gitignored per java/.gitignore.
#   * THIS FILE: java/carddemo-app/src/main/resources/application.properties
#       Committed AND bundled into every shaded jar; safe defaults only.
#
# NOT a Spring Boot project — no spring.*, server.*, management.* keys.
# NO PostgreSQL defaults — file-based batch is the default (AAP §0.7.5).
# NO Docker — single shaded jar per executable (AAP §0.2.1).
# NO --enable-preview — Java 25 finalized features only (AAP §0.6.7, §0.7.4).
#
# References:
#   AAP §0.2.1 — rule-mandated supplementary files
#   AAP §0.5.4 — application.properties.example is the canonical template
#   AAP §0.6.5 — file I/O exactness, codepage IBM-1047 default
#   AAP §0.6.6 — batch throughput: virtual threads + ScopedValue
#   AAP §0.6.1, §0.3.3 — Decimals utility defaults (DECIMAL128, HALF_EVEN, 2)
#   AAP §0.7.2 — security: PAN masking, plaintext password preservation
#   AAP §0.7.5 — runtime configuration via env vars
#
# Format: java.util.Properties — key=value, # for comments, UTF-8 + Unix LF.
# ============================================================================


# === Application identity ===
carddemo.app.name=carddemo
carddemo.app.version=1.0.0-SNAPSHOT


# === File paths — VSAM/sequential datasets ===
# Default values are relative paths under ./data/ and ./output/ so the shaded
# jar starts cleanly from a working-directory layout of:
#   working-dir/
#     +-- carddemo-<program>.jar
#     +-- data/   (inputs — acctdata.dat, carddata.dat, ...)
#     +-- output/ (writes — statements.txt, dalyrejs.dat, ...)
# Account master file (KSDS, key 11 [ACCT-ID PIC 9(11)], record 300, copybook CVACT01Y)
carddemo.file.acctdata.path=./data/acctdata.dat
# Card master file (KSDS, key 16 [CARD-NUM PIC X(16)], record 150, copybook CVACT02Y)
carddemo.file.carddata.path=./data/carddata.dat
# Card cross-reference file (KSDS + AIX, record 50, copybook CVACT03Y)
carddemo.file.cardxref.path=./data/cardxref.dat
# Customer master file (KSDS, key 9 [CUST-ID PIC 9(09)], record 500, copybook CVCUS01Y)
carddemo.file.custdata.path=./data/custdata.dat
# Daily transaction file (sequential, record 350, copybook CVTRA06Y)
carddemo.file.dailytran.path=./data/dailytran.dat
# Daily reject file (output, written by CBTRN02C posting engine — see DALYREJS DD in app/jcl/POSTTRAN.jcl)
carddemo.file.dalyrejs.path=./output/dalyrejs.dat
# Transaction master file (KSDS + AIX, key 16 [TRAN-ID PIC X(16)], record 350, copybook CVTRA05Y)
carddemo.file.transact.path=./data/transact.dat
# Disclosure group file (KSDS, key 16 [GROUP-ID(10) + TYPE-CD(2) + CAT-CD(4)], record 50, copybook CVTRA02Y)
carddemo.file.discgrp.path=./data/discgrp.dat
# Transaction category file (KSDS, key 6 [TYPE-CD(2) + CAT-CD(4)], record 60, copybook CVTRA04Y)
carddemo.file.trancatg.path=./data/trancatg.dat
# Transaction type file (KSDS, key 2 [TYPE-CD], record 60, copybook CVTRA03Y)
carddemo.file.trantype.path=./data/trantype.dat
# Transaction category balance file (KSDS, key 17 [ACCT-ID(11) + TYPE-CD(2) + CAT-CD(4)], record 50, copybook CVTRA01Y)
carddemo.file.tcatbalf.path=./data/tcatbalf.dat
# User security file (KSDS, key 8 [SEC-USR-ID PIC X(08)], record 80, copybook CSUSR01Y)
carddemo.file.usrsec.path=./data/usrsec.dat

# Statement outputs (CBSTM03A — see app/jcl/CREASTMT.JCL STMTFILE/HTMLFILE DDs)
carddemo.file.stmt.text.path=./output/statements.txt
carddemo.file.stmt.html.path=./output/statements.html

# Report outputs
carddemo.file.tranrept.path=./output/tranrept.dat
carddemo.file.printcatbl.path=./output/tcatbalf.rept
# Interest-calculation transaction output (SYSTRAN GDG per app/jcl/INTCALC.jcl)
carddemo.file.systran.path=./output/systran.dat


# === Codepage configuration ===
# Default file codepage; production EBCDIC is IBM-1047. Override per-file via
# carddemo.file.<dataset>.charset. For the 9 ASCII fixtures under
# app/data/ASCII/, set the charset to "US-ASCII" in a local override file
# when running golden-record tests. This is the key consumed by
# com.blitzy.carddemo.adapter.file.EbcdicTranscoder.DEFAULT_KEY — the
# legacy "carddemo.codepage.default" spelling has no code consumer.
carddemo.file.default.charset=IBM-1047

carddemo.file.acctdata.charset=IBM-1047
carddemo.file.carddata.charset=IBM-1047
carddemo.file.cardxref.charset=IBM-1047
carddemo.file.custdata.charset=IBM-1047
carddemo.file.dailytran.charset=IBM-1047
carddemo.file.dalyrejs.charset=IBM-1047
carddemo.file.transact.charset=IBM-1047
carddemo.file.discgrp.charset=IBM-1047
carddemo.file.trancatg.charset=IBM-1047
carddemo.file.trantype.charset=IBM-1047
carddemo.file.tcatbalf.charset=IBM-1047
carddemo.file.usrsec.charset=IBM-1047


# === Batch run context (propagated via ScopedValue<BatchRunContext>) ===
# Per AAP §0.6.6: ScopedValue replaces ThreadLocal entirely in new code.
# carddemo.batch.run-id — unique batch run identifier; blank -> auto-generated UUID at startup.
carddemo.batch.run-id=
# carddemo.batch.processing-date — system-date override (yyyy-MM-dd); blank -> system date.
# COBOL CBACT04C uses PARM='2022071800' per app/jcl/INTCALC.jcl STEP15.
carddemo.batch.processing-date=
# carddemo.batch.tenant — multi-tenant key; "DEFAULT" for single-tenant deployments.
carddemo.batch.tenant=DEFAULT

# COBOL JCL PARM passthrough — CBACT04C / InterestCalculationApp.
# Default matches the literal PARM='2022071800' in app/jcl/INTCALC.jcl STEP15.
carddemo.intcalc.parm=2022071800


# === Virtual-thread fan-out ===
# Per AAP §0.6.6: enable only where reordering does NOT change observable output.
# Sort orders, sequencing, and record-by-record dependencies remain preserved.
carddemo.batch.virtual-threads.enabled=true
# Maximum simultaneous virtual threads (0 = unbounded; the JVM still throttles).
carddemo.batch.virtual-threads.parallelism=0


# === Decimal arithmetic (Decimals utility) ===
# Per AAP §0.3.3, §0.6.1: these are exposed for traceability; the compiled
# defaults in Decimals.java are authoritative. NEVER replace BigDecimal with
# double or float (AAP §0.6.1).
carddemo.decimals.math-context=DECIMAL128
# RoundingMode for COBOL ROUNDED clause: HALF_EVEN (banker's rounding).
carddemo.decimals.rounding.rounded=HALF_EVEN
# RoundingMode for default (non-ROUNDED) arithmetic: DOWN (truncation toward zero).
carddemo.decimals.rounding.default=DOWN
# Default monetary scale for PIC S9(n)V99 fields.
carddemo.decimals.scale.monetary=2


# === Optional JDBC adapter (DISABLED BY DEFAULT) ===
# Per AAP §0.7.5: the COBOL source uses VSAM KSDS, so file-based batch is the
# default. Enable ONLY when a relational adapter has been added under
# carddemo-adapter-db and the corresponding JDBC driver is on the classpath.
carddemo.jdbc.enabled=false
# NEVER commit real credentials. Override via env vars:
#   CARDDEMO_JDBC_URL, CARDDEMO_JDBC_USERNAME, CARDDEMO_JDBC_PASSWORD
carddemo.jdbc.url=
carddemo.jdbc.username=
carddemo.jdbc.password=


# === Security / PCI logging ===
# Mask card PAN in logs and error messages — MANDATORY in production.
# Per AAP §0.7.2: "No card PAN logged in full; mask all but last 4 digits".
carddemo.logging.pan-masking.enabled=true
# Number of trailing PAN digits left unmasked.
carddemo.logging.pan-masking.show-last=4

# Plaintext password preservation (AAP §0.1.3, §0.7.2):
# SEC-USR-PWD is stored as PIC X(08) plaintext per app/cpy/CSUSR01Y.cpy.
# This refactor preserves that behavior; any move to BCrypt/Argon2 is OUT OF
# SCOPE and tracked as a follow-up in java/MIGRATION_NOTES.md. No property
# here — documentation only.


# === Golden-record test harness ===
# Per AAP §0.6.11: non-negotiable PR gate.
# Classpath root containing per-program expected outputs.
carddemo.test.golden.root=classpath:/golden
# Filesystem path to the 9 ASCII fixtures in app/data/ASCII (READ-ONLY;
# NOT copied per AAP §0.2.1 REFERENCE rule). Path is resolved against the
# JVM working directory; override via CARDDEMO_TEST_GOLDEN_FIXTURE_SOURCE
# when running tests from another directory.
carddemo.test.golden.fixture-source=../app/data/ASCII
# JFR-based performance regression band, expressed as a percent.
carddemo.test.perf.jfr.regression-band=10


# === JVM tuning recommendations (pass on java command line, NOT via this file) ===
# RECOMMENDED at runtime (per AAP §0.3.4, all finalized JEPs):
#   -XX:+UseCompactObjectHeaders                              (JEP 519 Final; ~20-30% heap)
#   -XX:+UseShenandoahGC -XX:ShenandoahGCMode=generational    (JEP 521 Final; low-pause batch)
#
# Example launch:
#   java -XX:+UseCompactObjectHeaders \
#        -XX:+UseShenandoahGC -XX:ShenandoahGCMode=generational \
#        -jar carddemo-app/target/carddemo-app-1.0.0-SNAPSHOT-shaded.jar \
#        <program-arguments>
#
# FORBIDDEN (per AAP §0.6.7, §0.7.4):
#   --enable-preview                                          (preview features OUT OF SCOPE)
# ============================================================================
# END OF FILE — keep the trailing newline; .properties files are line-oriented.
# ============================================================================
