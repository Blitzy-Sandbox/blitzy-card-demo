# ==================================================================
# WHAT THIS IS
# ==================================================================
# These files are the output of the LEGACY PROGRAM, not of the Java migration.
# app/cbl/CBTRN02C.cbl was compiled UNMODIFIED - byte-identical to the frozen
# corpus, sha256 below - and executed against the frozen ASCII fixtures. The
# Java implementation is then compared against what the COBOL produced.
#
# Nothing here was generated from Java, hand-simulated, or copied from the
# implementation's own output. Reproduce it with:
#     apt-get install -y gnucobol3
#     sh harness/derive-gate1-oracle.sh <repository-root> <output-dir>
# and compare against the sha256 values recorded below.
oracle.derivedFrom = execution of the frozen app/cbl/CBTRN02C.cbl
oracle.derivedFromJava = false
oracle.handSimulated = false
oracle.compiler = GnuCOBOL
oracle.compilerVersion = 3.2.0
oracle.compilerFlags = -x -fsign=EBCDIC -std=ibm -I app/cpy
oracle.indexedFileHandler = BDB
