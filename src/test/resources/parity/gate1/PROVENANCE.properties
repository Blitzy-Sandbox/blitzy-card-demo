# ==================================================================
# WHAT IS EXCLUDED, AND WHY - stated rather than quietly omitted
# ==================================================================
# 1. TRAN-PROC-TS, offsets 305-330 of the 350-byte transaction record.
#    app/cbl/CBTRN02C.cbl:L692-L705 builds it from FUNCTION CURRENT-DATE, so it
#    is generated at run time and differs between two runs of the SAME program.
#    Two consecutive legacy runs were compared to confirm that: everything else
#    was byte-identical and only this span moved. It is therefore excluded from
#    the byte comparison and asserted on its FORMAT instead - 26 characters
#    ending in the four literal zeros that :L701 moves - which is the whole of
#    what the source fixes about it.
exclusion.processingTimestamp.span = 305-330
exclusion.processingTimestamp.reason = generated per run from FUNCTION CURRENT-DATE
exclusion.processingTimestamp.assertedInstead = 26 characters ending in four zeros
exclusion.processingTimestamp.source = app/cbl/CBTRN02C.cbl:L692-L705

# 2. The trailing FILLER PIC X(20), offsets 331-350 of the transaction record.
#    app/cbl/CBTRN02C.cbl assigns it nowhere: 2000-POST-TRANSACTION at
#    :L425-L438 moves twelve input fields and the generated timestamp and never
#    touches the filler, so its content is whatever the compiler left in
#    WORKING-STORAGE. GnuCOBOL leaves X'00'; the COBOL standard leaves an item
#    without a VALUE clause UNSPECIFIED, so X'00' is an observation about this
#    compiler and NOT a contract the source establishes. Asserting it would be
#    asserting a compiler's choice as though it were the legacy behaviour.
exclusion.transactionFiller.span = 331-350
exclusion.transactionFiller.reason = never assigned by the program; WORKING-STORAGE without VALUE is unspecified
exclusion.transactionFiller.observedUnderGnuCobol = 0x00
exclusion.transactionFiller.assertedInstead = nothing

# ==================================================================
# THE ONE RESIDUAL DIFFERENCE FROM A MAINFRAME CAPTURE
# ==================================================================
# This oracle was produced by GnuCOBOL 3.2.0 on Linux, not by IBM Enterprise
# COBOL on z/OS. That is a smaller gap than a hand-derived total but it is not
# zero, and it is recorded rather than glossed:
#   - the source was compiled with NO modification, so no translation choice
#     entered the run;
#   - the fixtures are the frozen ASCII fixtures, read with the IBM trailing
#     overpunch sign convention selected explicitly;
#   - the arithmetic is fixed-scale decimal in both, so no rounding difference
#     is possible on these operations;
#   - what a z/OS capture would additionally settle is exactly the two excluded
#     spans above and the EBCDIC collating sequence of the keyed reads. The
#     fixtures' keys are digits and uppercase letters, whose relative order is
#     the same in both code pages, so key order is not at risk here.
residual.executionEnvironment = GnuCOBOL 3.2.0 on Linux, not IBM Enterprise COBOL on z/OS
residual.sourceModified = false
residual.whatAMainframeCaptureWouldAdd = settles the two excluded spans and removes the code-page assumption
residual.severity = Low

# ==================================================================
# THE ARGUMENT THIS ORACLE WITHDRAWS
# ==================================================================
# An earlier revision of the Gate 1 tests declined to assert any expected total
# on the grounds that a hand-derived figure is "model-sensitive", because a
# stateless single-pass model and a stateful model of app/cbl/CBTRN02C.cbl
# disagree over these fixtures. The disagreement is real - 13 rejects against 38
# - but the conclusion did not follow, because only ONE of the two models is
# faithful. :L395 re-reads the account for every transaction and :L554 rewrites
# it inside the same iteration, so transaction n+1 necessarily sees what
# transaction n persisted. The stateless model contradicts :L554 and is simply
# wrong; the stateful model is the source. An independent derivation of the
# stateful model in a third language reaches 38, matching this legacy execution
# exactly, which is what turns "two models disagree" into "one of them was not a
# model of this program".
withdrawn.claim = a hand-derived reject total is model-sensitive and no oracle exists
withdrawn.reason = only the stateful reading is faithful to :L395 with :L554; it yields 38 and the legacy run yields 38
withdrawn.statelessModelWouldYield = 13
