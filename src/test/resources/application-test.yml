# ---------------------------------------------------------------------------
# Test profile - in-memory H2, embedded Kafka, no external AWS services.
# Per AAP §0.3.1: "application-test.yml".
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:carddemo-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: carddemo-test

spring.cloud:
  aws:
    secretsmanager:
      enabled: false
    parameterstore:
      enabled: false

carddemo:
  aws:
    endpoint-override: http://localhost:4566
    region: us-east-1
  security:
    jwt:
      signing-key: TEST_ONLY_JWT_SIGNING_KEY_MIN_256_BITS_FOR_HS256_ALGORITHM_TESTS
      issuer: carddemo-test
      access-token-ttl-minutes: 10

logging:
  level:
    com.awsm2.carddemo: DEBUG
    org.springframework.test: INFO
