# ============================================================================
#  CardDemo Migration | Testcontainers Runtime Configuration
#  File: src/test/resources/testcontainers.properties
#  Source of truth: AAP §0.9.1 (test execution requirements) and the Phase 9
#                   runtime-investigation findings (CK7 remediation).
# ============================================================================
#
# PURPOSE
# Testcontainers reads this file at startup (via its standard classpath
# resource discovery) and uses the values to configure the Docker client
# strategy and the Ryuk reaper. It is the canonical place to pin runtime
# behaviour that would otherwise require setting environment variables on
# every test invocation.
#
# Settings declared here:
#   * ryuk.disabled = true
#       Disables the Testcontainers "Ryuk" reaper sidecar. Ryuk is normally
#       spawned as testcontainers/ryuk:* before any test container and is
#       responsible for cleaning up containers if the test JVM crashes.
#
#       In this CI / sandbox environment the Ryuk container creation path
#       fails inside docker-java 3.4.0 (the SDK Testcontainers 1.20.4
#       embeds) with `NullPointerException: containerId was not specified`,
#       even though Docker 28.5.2 happily creates the same container via
#       the CLI or the raw REST API (verified manually: `docker run --rm
#       postgres:16-alpine` returns a valid container ID; `curl POST
#       /containers/create` returns a valid Id). The failure is in the
#       SDK / Ryuk interaction, not in Docker itself.
#
#       Because the failure poisons the docker-java client state for the
#       test-class lifetime, every downstream PostgreSQLContainer.start()
#       call in the same JVM also fails. Disabling Ryuk bypasses the
#       failing code path and lets PostgreSQLContainer start normally.
#
#       Trade-off: orphan containers are not auto-reaped if the test JVM
#       crashes. This is acceptable because:
#         (a) Surefire/Failsafe propagate JUnit5 @Container lifecycle
#             cleanly even on test failure (@AfterAll on the base class
#             stops the container);
#         (b) CI runners are ephemeral; orphan containers do not survive
#             the runner teardown;
#         (c) Local developers can `docker container prune` if needed.
#       AAP §0.10.2 Minimal Change Clause supports this: we make the
#       smallest configuration change needed to unblock the IT runtime.
#
#   * checks.disable = true
#       Skips the startup sanity check that Testcontainers runs against the
#       Docker daemon (network probe, image pull test, etc.). The check is
#       a noisy no-op in this environment because Docker is healthy and
#       the postgres:16-alpine image is pre-pulled. Skipping it shaves
#       ~2-5s off the first test-class bootstrap. AAP §0.7.2 wall-clock
#       targets (Repository IT < 250ms per method) reward this.
#
# Settings deliberately NOT declared here:
#   * docker.client.strategy
#       Left at the default. Testcontainers' DockerClientProviderStrategy
#       auto-detects the unix socket at /var/run/docker.sock (logged at
#       INFO during the first container start), which is exactly what we
#       want. Pinning it would couple this file to one specific transport
#       and reduce portability across CI runners.
#
#   * docker.host
#       Left at the default for the same reason.
#
#   * testcontainers.reuse.enable
#       Left at the default (false). Container reuse is an advanced opt-in
#       that requires per-developer ~/.testcontainers.properties config and
#       complicates CI cleanup. AAP §0.10.2 Minimal Change Clause supports
#       avoiding it.
#
# MINIMAL CHANGE CLAUSE (AAP §0.10.2)
# This file contains only the two settings strictly required to make the
# repository integration tests run in this CI/sandbox environment. No
# experimental flags, no debug toggles, no environment-coupled values.
# ============================================================================

ryuk.disabled = true
checks.disable = true
