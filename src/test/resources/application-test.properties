# ============================================================
# CardDemo Migration -- Test Profile Properties
# Location: src/test/resources/application-test.properties
# ============================================================
# Active when the Spring `test` profile is selected (default for
# @SpringBootTest, @DataJpaTest, @WebMvcTest, @SpringBatchTest).
# Spring Boot picks this file up automatically after
# application.properties when the active-profile resolution
# yields `test` (via @ActiveProfiles("test") on a test class,
# spring.profiles.active=test on the command line, or the
# default test classpath resolution applied by spring-boot-test).
#
# Source of truth: AAP section 0.5.4 and section 0.9.1.
#
# Constraints (AAP section 0.10.5, NON-NEGOTIABLE):
#   - NO plaintext credentials. Testcontainers @DynamicPropertySource
#     in AbstractRepositoryIT / AbstractBatchIT supplies the actual
#     JDBC URL, username, and password at runtime.
#   - NO financial data emitted to logs at any level. Hibernate SQL
#     and bound-parameter loggers are pinned at WARN; the
#     logback-test.xml console pattern provides defence-in-depth
#     PII masking on top of this.
#
# Minimal Change Clause (AAP section 0.10.2):
#   Only properties explicitly mandated by the AAP or strictly
#   required by the test infrastructure appear here. No
#   nice-to-have toggles, no performance tuning, no actuator
#   endpoint expansion.
# ============================================================

# ------------------------------------------------------------
# DataSource (Testcontainers-driven, NO plaintext credentials)
# ------------------------------------------------------------
# DataSource keys are intentionally empty here; @DynamicPropertySource
# in AbstractRepositoryIT / AbstractBatchIT supplies Testcontainers
# values at runtime, e.g.:
#
#     @DynamicPropertySource
#     static void datasourceProperties(DynamicPropertyRegistry registry) {
#         registry.add("spring.datasource.url", POSTGRES::getJdbcUrl);
#         registry.add("spring.datasource.username", POSTGRES::getUsername);
#         registry.add("spring.datasource.password", POSTGRES::getPassword);
#     }
#
# Declaring the keys (even with empty values) initialises Spring's
# Environment so the dynamic overrides can replace them cleanly.
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------
# `validate` ensures Hibernate confirms the live schema matches
# entity mappings but does NOT modify the schema. Schema ownership
# belongs to Flyway (src/main/resources/db/migration/V*.sql).
spring.jpa.hibernate.ddl-auto=validate
# SQL logging is OFF by default. Enabling it would echo bound
# parameters that can carry PCI/PII (account numbers, card
# numbers, balances) -- AAP section 0.10.5 forbids this. A developer
# may override locally with `-Dspring.jpa.show-sql=true`.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Hibernate-on-PostgreSQL LOB handling: required for Hibernate 6.x
# when the application reads/writes large objects (e.g., statement
# HTML output in CBSTM03A migration). Setting it here avoids the
# Hibernate warning emitted on every BLOB/CLOB column on startup.
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ------------------------------------------------------------
# Spring Batch (CRITICAL: auto-launch disabled for non-batch tests)
# ------------------------------------------------------------
# Without this flag, every @Bean Job in the application context
# would launch on @SpringBootTest startup -- the classic Spring
# Boot test-suite pitfall. Batch ITs launch jobs explicitly via
# JobLauncherTestUtils#launchJob (AAP section 0.5.4).
spring.batch.job.enabled=false
# Spring Batch creates its internal job-repository tables
# (BATCH_JOB_INSTANCE, BATCH_JOB_EXECUTION, BATCH_STEP_EXECUTION,
# etc.) against the test database. `always` is safe in the test
# profile because the database is ephemeral (Testcontainers).
spring.batch.jdbc.initialize-schema=always

# ------------------------------------------------------------
# Flyway
# ------------------------------------------------------------
# Repository and batch ITs reuse the production migrations under
# src/main/resources/db/migration (V1__schema.sql, V2__indexes.sql,
# V3__seed.sql per AAP section 0.4.4). Subsequent migration agents
# create those scripts; this configuration is forward-compatible
# with their arrival.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Baseline-on-migrate allows Flyway to treat a pre-existing
# database (e.g., a Spring Batch initialize-schema run) as the
# baseline, so the test-profile migration sequence does not fail
# on first apply.
spring.flyway.baseline-on-migrate=true
# `clean` is enabled in the test profile only so
# AbstractRepositoryIT can call flyway.clean() between tests when
# isolation requires it. The production profile keeps this at
# `true` (clean disabled) to prevent accidental data loss.
spring.flyway.clean-disabled=false

# ------------------------------------------------------------
# Spring Security (autoconfigured default user fully suppressed)
# ------------------------------------------------------------
# Spring Boot Security's autoconfigured user is suppressed by
# excluding UserDetailsServiceAutoConfiguration entirely. This
# is stricter than setting placeholder values for
# `spring.security.user.name` / `spring.security.user.password`
# (which themselves would constitute plaintext credentials in
# a configuration file -- AAP section 0.10.5 prohibits exactly
# that, even for non-functional placeholders).
#
# Tests that require authentication use @WithMockUser from
# spring-security-test, which short-circuits the security
# filter chain via SecurityContextHolder rather than relying on
# a real UserDetailsService. Repository ITs that need an
# authenticated principal extend AbstractRepositoryIT, which
# configures @WithMockUser on the test class.
#
# Production-runtime user authentication is handled by the
# project's AuthenticationService (the COSGN00C migration),
# which loads users from the USRSEC table and verifies BCrypt
# hashes -- not by Spring Boot's autoconfigured user.
#
# ------------------------------------------------------------
# Spring Cloud AWS auto-configurations (S3, SQS, SNS)
# ------------------------------------------------------------
# The production pom.xml carries spring-cloud-aws-starter-s3,
# spring-cloud-aws-starter-sqs, and spring-cloud-aws-starter-sns
# for AWS integrations (CardDemo migration uses S3 for fixture
# I/O and SQS/SNS as candidate event-bus replacements for the
# COBOL CICS TDQ pattern). These starters register Spring Cloud
# AWS auto-configurations that, on @SpringBootTest context load,
# attempt to instantiate S3ClientBuilder / SqsClientBuilder /
# SnsClientBuilder. Each builder in turn calls
# DefaultAwsRegionProviderChain.getRegion() which throws
# SdkClientException("Unable to load region from any of the
# providers in the chain") when no AWS_REGION env var,
# aws.region system property, ~/.aws/config file, or EC2
# instance metadata is available -- the case in every test
# environment (local laptops, CI agents, Testcontainers VMs).
#
# Without this exclusion, every @SpringBootTest in this module
# would fail with ApplicationContextException at context load,
# blocking the E2E tests under com.aws.carddemo.e2e.* and the
# batch ITs that extend AbstractBatchIT (which uses
# @SpringBootTest).
#
# Why exclude rather than supply a fake region:
# - Setting spring.cloud.aws.region.static=us-east-1 would
#   silence the region resolver but still bring up the full S3
#   client, which then attempts to load credentials via the
#   DefaultCredentialsProviderChain -- another set of failures
#   when no credentials are present. Cascading fake values into
#   spring.cloud.aws.credentials.* would constitute
#   "test-only plaintext credentials in a configuration file",
#   which AAP section 0.10.5 explicitly prohibits.
# - Excluding the auto-configurations entirely means the AWS
#   clients are never instantiated in the test profile. Tests
#   that need AWS integration (none in the current 4 E2E
#   classes and none of the documented service tests) would
#   use LocalStack via Testcontainers and inject the client
#   explicitly -- the canonical Spring Cloud AWS test pattern.
# - The exclusion is narrow: it disables only the S3 / SQS /
#   SNS auto-configurations; the spring-cloud-aws-core
#   credentials / region provider auto-configurations remain
#   active for any test that opts in to AWS integration via
#   @Import of an explicit AWS test configuration.
#
# Class names verified against the
# spring-cloud-aws-autoconfigure-3.2.1.jar contents under
# io/awspring/cloud/autoconfigure/{s3,sqs,sns}/*.class. The
# package-private nested classes (e.g.,
# S3AutoConfiguration$Jackson2JsonS3ObjectConverterConfiguration
# and SnsAutoConfiguration$SnsWebConfiguration) are loaded
# transitively when their enclosing class is loaded, so
# excluding the outer class disables the nested ones.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,\
  io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration,\
  io.awspring.cloud.autoconfigure.s3.S3CrtAsyncClientAutoConfiguration,\
  io.awspring.cloud.autoconfigure.s3.S3TransferManagerAutoConfiguration,\
  io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration,\
  io.awspring.cloud.autoconfigure.sns.SnsAutoConfiguration

# ------------------------------------------------------------
# Logging (DEBUG on com.aws.carddemo per AAP section 0.5.4)
# ------------------------------------------------------------
# Application packages run at DEBUG so production-source log
# statements are visible during test execution and surface
# diagnostic context on failure. Framework packages stay at
# INFO/WARN to keep test stdout focused.
logging.level.root=INFO
logging.level.com.aws.carddemo=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.batch=INFO
logging.level.org.springframework.web=INFO
# Hibernate SQL and bound-parameter loggers stay at WARN to
# enforce AAP section 0.10.5 (no PCI/PII in logs). Overriding to
# DEBUG is a developer-local override only; the project default
# is WARN.
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
# Testcontainers / Docker-Java: progress logs at INFO are helpful
# when a container fails to start; the Docker REST API chatter
# at INFO is not.
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN

# ------------------------------------------------------------
# Server / Actuator (minimised for test runs)
# ------------------------------------------------------------
# `server.port=0` instructs the embedded Tomcat to bind to a
# random available port, avoiding conflicts when test classes
# run in parallel (junit-platform.properties enables
# class-level parallelism).
server.port=0
# Only the `health` endpoint is exposed in the test profile;
# the production profile (application.properties) configures
# the full actuator surface for runtime observability.
management.endpoints.web.exposure.include=health
# Defence-in-depth against any health indicator that might
# echo internal state (e.g., a custom indicator that includes
# a JDBC URL or AWS endpoint in its details payload).
management.endpoint.health.show-details=never

# ------------------------------------------------------------
# Testcontainers
# ------------------------------------------------------------
# Container lifecycle (start/stop) and the Ryuk reaper are
# handled by the Testcontainers JUnit Jupiter extension applied
# in AbstractRepositoryIT / AbstractBatchIT, not by Spring
# properties.
#
# In constrained CI environments where the Ryuk reaper container
# cannot run (AAP section 0.9.1), set the environment variable
# TESTCONTAINERS_RYUK_DISABLED=true on the build agent. Ryuk
# control is intentionally an environment variable, not a Spring
# property, so it must NOT appear in this file.
