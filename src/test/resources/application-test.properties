# Spring `test` profile configuration (AAP §0.5.4).
#
# The DataSource URL is intentionally NOT pinned here — repository and batch
# integration tests inject the Testcontainers PostgreSQL JDBC URL via
# @DynamicPropertySource, so the framework resolves spring.datasource.url
# (and the matching username/password) at runtime from the Container.

# Disable Spring Batch's @EnableBatchProcessing auto-start so tests that do
# NOT exercise batch jobs do not auto-launch them on context bootstrap.
# Batch ITs use JobLauncherTestUtils to drive jobs explicitly.
spring.batch.job.enabled=false

# Flyway is enabled at IT level only — repository ITs hydrate the schema
# via the production V1/V2/V3 migrations against the Testcontainers PG.
# Unit tests use Mockito-stubbed repositories and never touch Flyway.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate: validate (do not auto-create) — Flyway owns the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Test-time logging — DEBUG on carddemo packages, INFO elsewhere to keep
# test output readable. Production-grade PII redaction is configured in
# logback-test.xml.
logging.level.root=INFO
logging.level.com.aws.carddemo=DEBUG
logging.level.org.springframework.batch=INFO
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN

# Security — disable the Spring Security default user in tests; controller
# ITs use @WithMockUser/SecurityMockMvcConfigurers to drive authenticated
# requests deterministically.
spring.security.user.name=test
spring.security.user.password=test

# AWS — LocalStack endpoints are wired in by each test class via
# @DynamicPropertySource when the test extends LocalStackContainer.
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test
