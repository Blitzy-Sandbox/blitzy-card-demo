# JUnit Platform configuration (AAP §0.5.4, §0.10.9).
#
# Parallel execution is enabled at the platform level so that test *classes*
# run concurrently when the suite is large enough to benefit. Methods inside
# a single class remain `same_thread` to preserve @BeforeEach/@AfterEach
# semantics. Repository ITs (Testcontainers) and batch ITs override this
# at class level via @Execution(SAME_THREAD) where shared state requires it.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Strict by default — every test method requires explicit @Test/@ParameterizedTest;
# legacy auto-detection is disabled to surface mis-annotated tests early.
junit.jupiter.testinstance.lifecycle.default=per_method

# Display name generator: keep the JUnit default (method name).
# Tests in this codebase follow the methodUnderTest_inputCondition_expectedOutcome
# convention per AAP §0.7.2, so the method name is also the human-readable
# scenario description.
