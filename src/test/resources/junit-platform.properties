# ============================================================
# CardDemo Migration -- JUnit 5 Platform Configuration
# Location: src/test/resources/junit-platform.properties
# ============================================================
# Read automatically by the JUnit Platform launcher (no Maven
# plugin wiring required). Surefire 3.x and Failsafe 3.x ship
# the JUnit Platform provider by default, so this file is
# picked up at the test classpath root for both unit tests
# (*Test.java via Surefire) and integration tests (*IT.java
# via Failsafe).
#
# Source of truth: AAP section 0.5.4 and section 0.10.9.
#
# Rationale:
#   - Class-level parallelism reduces wall-clock test time for
#     the ~729 unit tests targeted by the migration (AAP
#     section 0.4.1 test pyramid + section 0.7.2 performance
#     constraint < 60 s for mvn test).
#   - Methods stay same_thread inside a class so @BeforeEach
#     and @AfterEach lifecycles remain deterministic per the
#     Require Test Coverage rule (AAP section 0.10.1).
#   - Per-class overrides are available via the annotations
#     @Execution(ExecutionMode.SAME_THREAD) and
#     @TestInstance(Lifecycle.PER_CLASS) where individual test
#     classes need different semantics (e.g., Testcontainers
#     repository ITs that share a per-class container).
# ============================================================

# ---- Parallelism (AAP section 0.10.9) ----
# Enable the JUnit Platform's parallel execution machinery.
# Without this flag set to true, the mode.* properties below
# are ignored by the launcher.
junit.jupiter.execution.parallel.enabled = true

# Methods inside a single test class execute serially. This
# protects @BeforeEach / @AfterEach lifecycle state (mock
# resets, fixture initialisation, ArgumentCaptor allocation)
# from race conditions that would arise if two @Test methods
# on the same instance ran concurrently against shared fields.
junit.jupiter.execution.parallel.mode.default = same_thread

# Distinct test classes execute concurrently across the worker
# pool sized by the strategy below. This is where the parallel
# speedup actually materialises for the large unit test suite
# planned by AAP section 0.4.1.
junit.jupiter.execution.parallel.mode.classes.default = concurrent

# ---- Concurrency strategy ----
# Dynamic strategy: the platform sizes its worker pool at
# Runtime.getRuntime().availableProcessors() * dynamic.factor.
# This adapts automatically to CI runners (typically 2 cores)
# and developer machines (typically 8+ cores) without manual
# tuning.
junit.jupiter.execution.parallel.config.strategy = dynamic

# Factor of 1.0 means worker_count == available_processors.
# This is the JUnit Platform default and the lowest-risk
# choice. Increase only when the suite becomes I/O-bound on
# Testcontainers / database calls and threads spend time
# blocked rather than computing.
junit.jupiter.execution.parallel.config.dynamic.factor = 1

# ---- Test instance lifecycle ----
# Per AAP section 0.5.4, per_class lifecycle is applied
# "when appropriate" -- i.e., opt-in per test class via the
# @TestInstance(Lifecycle.PER_CLASS) annotation, not as the
# global default. Making the JUnit default explicit here
# documents the intent for future readers.
junit.jupiter.testinstance.lifecycle.default = per_method

# ---- Display name generator ----
# Per AAP section 0.10.2 Minimal Change Clause: keep the JUnit
# default (Standard -> uses the test method name verbatim).
# Method naming convention is
# methodUnderTest_inputCondition_expectedOutcome per
# AAP section 0.7.2, so the method name itself is the
# human-readable scenario description and no DisplayName
# customisation is required.
junit.jupiter.displayname.generator.default = org.junit.jupiter.api.DisplayNameGenerator$Standard
