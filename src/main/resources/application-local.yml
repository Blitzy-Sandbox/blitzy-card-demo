#   addressing.
#   With the local profile: every override applies, and supplying only
#   the externally held values yields
#   jdbc:postgresql://localhost:5432/carddemo, region us-east-1 and the
#   exact resource names localstack-init/init-aws.sh creates.
#   Fail-fast is unweakened: each of the three externally supplied
#   values still raises IllegalArgumentException naming the absent
