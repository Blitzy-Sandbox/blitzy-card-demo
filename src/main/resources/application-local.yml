# =============================================================================
# CardDemo - LOCAL profile overrides (application-local.yml).
#
# Activated automatically when the "local" profile is selected, which is the
# default profile (see spring.profiles.default in the base application.yml).
# Intended for local development against the Docker Compose PostgreSQL and
# LocalStack stack.
#
# This file is the ONLY place that carries LOCAL-DEV credential DEFAULTS, so the
# profile-agnostic application.yml stays secret-free. Every value below is a
# NON-PRODUCTION, local-development convenience default and must never be used in
# a deployed environment. Real environments select a non-local profile and inject
# POSTGRES_PASSWORD / JWT_SECRET from the environment or a secret manager.
# Design rationale is recorded in DECISION_LOG.md, not here.
# =============================================================================

spring:
  datasource:
    # Local-dev PostgreSQL password default matching docker-compose. Still honors
    # POSTGRES_PASSWORD when set; NON-PRODUCTION local-development use only.
    password: ${POSTGRES_PASSWORD:carddemo}

carddemo:
  security:
    jwt:
      # Local-dev Base64-encoded HMAC signing key. Decodes to 62 bytes (>= the
      # 32-byte / 256-bit minimum HS256 requires); JwtTokenService Base64-decodes
      # it before use. NON-PRODUCTION placeholder only - real deployments inject
      # a distinct JWT_SECRET from the environment or a secret manager.
      secret: ${JWT_SECRET:Y2FyZGRlbW8tbG9jYWwtZGV2LW9ubHktand0LXNpZ25pbmcta2V5LW5vdC1mb3ItcHJvZHVjdGlvbi11c2U=}
