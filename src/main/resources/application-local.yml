#
# ---- Live LocalStack resources, verified by read-back ------------
#
#   S3 buckets present: carddemo-batch-input, carddemo-batch-output,
#   carddemo-statements. get-bucket-versioning returns Enabled on the
#   output bucket only; the other two return no status, which is the
#   intended asymmetry - only the GDG-derived output prefix needs
#   object versions.
#   SQS: two queues. The submission queue, logical carddemo-report-jobs
#   resolved to physical carddemo-report-jobs.fifo, attributes
#   FifoQueue=true and ContentBasedDeduplication=false - the latter is
