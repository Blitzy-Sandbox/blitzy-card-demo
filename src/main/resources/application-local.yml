# *               DCB=(RECFM=F,LRECL=430,BLKSIZE=0),
# *               DSN=AWS.M2.CARDDEMO.DALYREJS(+1));
# *               app/jcl/OPENFIL.jcl:L26-L30 and
# *               app/jcl/CLOSEFIL.jcl:L26-L30 (CEMT SET FIL for
# *               TRANSACT, CCXREF, ACCTDAT, CXACAIX and USRSEC, whose
# *               availability is now the readiness surface);
