# ---------------------------------------------------------------------------
# Local development profile - uses LocalStack (Docker) for AWS services and
# H2 in-memory database for storage.
# Per AAP §0.3.1: "application-local.yml - LocalStack-backed local config".
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:carddemo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

carddemo:
  aws:
    endpoint-override: ${AWS_ENDPOINT_URL:http://localhost:4566}
    region: us-east-1

logging:
  level:
    com.awsm2.carddemo: DEBUG
