#   init-aws.sh converges an existing queue onto it. And the standard
#   notification inbox carddemo-notifications-inbox, which exists to be
#   the topic's subscriber and which this application never reads. Full
#   URLs are withheld here, matching the convention
#   localstack-init/init-aws.sh already follows.
#   SNS: exactly one topic, carddemo-notifications, with exactly one
#   subscription - the inbox above, protocol sqs, raw delivery. Zero
#   subscriptions is the state in which every publish is accepted and
#   discarded, so init-aws.sh treats it as fatal rather than verifying
#   it.
#
# ---- No-live-AWS proof, the safety property ----------------------
#
#   A grep for the live AWS endpoint domain over this file returns 0
#   matches. That domain is deliberately never spelled out anywhere in
#   this file, comments included, so the assertion stays true of this
#   evidence section itself rather than being falsified by it. The only
#   endpoint this file now configures for tracing is
#   http://localhost:4318/v1/traces. The three service endpoints moved to
#   the base profile, which indirects each through ${AWS_ENDPOINT_URL}
#   with NO literal default; this profile re-declares the same three keys
#   with the developer default ${AWS_ENDPOINT_URL:http://localhost:4566},
#   so the emulator edge is assumed HERE and nowhere else. Whatever
#   resolves is validated against the permitted emulator hosts by
#   AwsConfig before any client is built.
#   Pointed at a closed port, an S3 call fails with:
#     SdkClientException: Unable to execute HTTP request: Connect to
#     localhost:4599 failed | HttpHostConnectException | ConnectException:
#     Connection refused
#   No frame of that chain names a live AWS host. The client surfaces a
#   local connection error and never falls back to a real regional
#   endpoint - which is the whole point of pinning a static credentials
#   provider alongside the endpoint override.
#
# ---- Flyway, applied exactly once, 2026-08-02T07:08:23Z ----------
#
#   Pass 1: applied=2 of target 2.  Pass 2 on the same database:
#   applied=0. Migrations are not re-applied on restart.
#   Resulting table count 12, of which 11 are the business tables
#   derived from the record-layout copybooks plus flyway_schema_history:
#   account, card, card_cross_reference, customer, daily_transaction,
#   disclosure_group, transaction, transaction_category,
#   transaction_category_balance, transaction_type, user_security.
#   BATCH_* tables created by Flyway: 0. This is the measured proof of
#   the boundary described under spring.batch.jdbc.initialize-schema
#   above - the framework owns its schema and V1 owns exactly 11 tables.
#
# ---- Spring Batch metadata restart, measured not assumed ---------
#
#   Pass 1: initializer returned applied=true, creating 6 tables -
#   batch_job_execution, batch_job_execution_context,
#   batch_job_execution_params, batch_job_instance, batch_step_execution,
#   batch_step_execution_context.
#   Pass 2 against the same database: returned applied=true, threw
#   NOTHING, table count still 6, and batch_job_instance remained
#   queryable (rows=0).
#   RESULT: restart on the same volume is SAFE. Note the precise scope of
#   this claim - the observable outcome of a second run was measured; the
#   SQL layer was not instrumented to classify individual statement
#   errors, so no claim is made about individual statements.
#   Remediation is therefore not required. Had the second pass thrown,
#   the fix would have been to switch this key back to never and let a
#   one-off operator task own the BATCH_* schema, never to add a fourth
#   Flyway migration.
#
# ---- init-aws.sh re-run idempotency, 07:32:23Z to 07:32:32Z ------
#
#   The provisioning hook was executed a second time in place at
#   /etc/localstack/init/ready.d/init-aws.sh: exit 0, five
#   "already exists - idempotent success" lines covering the three
#   buckets, the queue and the topic, and zero error, failure or
#   duplicate-resource lines. Bucket, queue and topic listings taken
#   before and after the re-run are byte-identical, and the output
#   bucket's versioning is still Enabled. Repeated compose cycles
#   converge instead of failing.
#
# ---- Observability reachability ----------------------------------
#
#   A single OTLP span was POSTed to the exact endpoint this profile
#   configures. The collector answered HTTP 200 with
#   {"partialSuccess":{}}, and the span is retrievable in Jaeger as
#   trace 5b8efff798038103d269b633813fc60c, span eee19b7ec3c1b174,
#   operation application-local-profile-otlp-check, carrying the tags
#   internal.span.format=otlp and profile=local. That first tag is the
#   load-bearing one: it proves ingestion through the OTLP receiver on
#   4318 rather than a Jaeger-native protocol, which is precisely what
#   validates the endpoint value above.
#   Prometheus reports its own scrape target UP and both application
#   targets DOWN with connection refused and DNS no-such-host. That was
#   measured with no application process listening, which is the correct
#   state for that condition rather than a configuration fault; with the
#   `app` service up the container target resolves and reports UP. Neither
#   target is configured by this file.
#   Grafana carries two file-provisioned datasources, Prometheus
#   (default) and Jaeger, both readOnly, plus one dashboard. All of it
#   is owned by observability/ and docker-compose.yml, not by this file.
#
