# * Program     : application-local.yml
# * Application : CardDemo
# * Type        : Spring Boot 'local' profile (YAML) - environment delta
# * Function    : Binds the CardDemo modular monolith to the root-owned
# *               Docker Compose substrate - PostgreSQL 16, LocalStack
# *               (S3, SQS FIFO, SNS) and the Jaeger OTLP receiver - and
# *               makes it structurally impossible for a local run to
# *               reach a live AWS endpoint. This file is a DELTA over
# *               application.yml: it restates nothing that the base
# *               profile already declares, so every key below either
# *               changes a base value or exists only in this profile.
# * Source      : app/csd/CARDDEMO.CSD:L499-L505 (DEFINE TDQUEUE(JOBS),
# *               TYPE(EXTRA) DDNAME(INREADER) TYPEFILE(OUTPUT)
# *               RECORDSIZE(80) RECORDFORMAT(FIXED) BLOCKFORMAT(
# *               UNBLOCKED) DISPOSITION(MOD) -> one SQS FIFO queue);
# *               app/jcl/DEFGDGB.jcl:L24-L57 (six GDG bases; TRANREPT
# *               LIMIT(5) at :L38);
# *               app/jcl/DALYREJS.jcl:L24-L26 (the seventh base);
# *               app/jcl/REPTFILE.jcl:L25-L27 (TRANREPT LIMIT(10) -
# *               the retention conflict, resolved to 10);
