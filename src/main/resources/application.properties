# CardDemo default application properties — production runtime envelope is
# Java 17 LTS + Spring Boot 3.x.
#
# This file is a STUB intended as the default Spring Boot configuration
# location. Profile-specific overrides live in application-{profile}.properties
# (e.g. application-local.properties, application-test.properties).
# Subsequent migration agents will populate the production datasource,
# JPA, security, batch, and AWS sections.

spring.application.name=carddemo
spring.profiles.active=local

# Server (embedded Tomcat) — port intentionally configurable per-environment
server.port=8080

# Management endpoints — minimal exposure by default; widen via deployment
# overlay only after security review (the actuator endpoints can reveal PII
# if misconfigured — AAP §0.10.5).
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Hibernate naming + validation defaults — production schemas are owned by
# Flyway (src/main/resources/db/migration/V*.sql created by subsequent
# migration agents).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Disable Spring Batch auto-launch — jobs are triggered explicitly by
# JobLauncher + Spring Scheduling (the JCL-replacement orchestration the
# migration introduces).
spring.batch.job.enabled=false
