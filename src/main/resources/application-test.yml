# =============================================================================
# CardDemo - TEST profile overrides (application-test.yml).
#
# Activated by the JUnit 5 integration / E2E suites via @ActiveProfiles("test")
# (src/test/java/com/carddemo/{integration,gates}). Those suites bring up REAL
# infrastructure with Testcontainers:
#   - PostgreSQL 16   (org.testcontainers:postgresql)
#   - LocalStack      (org.testcontainers:localstack)  -> S3 / SQS / SNS
#
# RUNTIME-INJECTION CONTRACT (do NOT hardcode here):
#   Container host names and ports are RANDOM per run. The Testcontainers base
#   class supplies them at runtime via @DynamicPropertySource / @ServiceConnection,
#   overriding (at the highest property-source precedence):
#       spring.datasource.url / username / password
#       spring.cloud.aws.endpoint (and/or per-service s3/sqs/sns endpoints)
#   Therefore this file deliberately carries NO JDBC URL and NO AWS endpoint.
#   It supplies only the stable, container-agnostic settings and the test-only
#   literals (LocalStack dummy credentials, a deterministic JWT signing key) that
#   make the suites hermetic and reproducible.
#
# Tests MUST exercise the REAL schema: Flyway runs V1/V2/V3 against the
# Testcontainers PostgreSQL (NO in-memory H2 - an embedded DB would defeat the
# VSAM-fidelity parity checks behind Validation Gates 1, 4 and 5).
#
# No live AWS and no real secrets: every AWS interaction is LocalStack-only and
# every value below is a NON-PRODUCTION test literal. Design rationale is
# recorded in DECISION_LOG.md, not here.
# =============================================================================

spring:
  # ---------------------------------------------------------------------------
  # Datasource - Testcontainers-driven. The PostgreSQL JDBC url / username /
  # password are injected at runtime by the integration base class
  # (@DynamicPropertySource / @ServiceConnection), so NONE are set here. Only the
  # driver is pinned to make the connection type explicit and to guarantee that
  # NO embedded/H2 datasource is ever auto-configured for tests.
  # ---------------------------------------------------------------------------
  datasource:
    driver-class-name: org.postgresql.Driver

  # ---------------------------------------------------------------------------
  # JPA / Hibernate - Flyway owns the schema; Hibernate only validates that the
  # entity mappings agree with the Flyway-created tables in the test container.
  # show-sql stays off so test logs stay readable (raise per-test when needed).
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # ---------------------------------------------------------------------------
  # Flyway - the migrations (V1 schema, V2 indexes, V3 seed from the 9 ASCII
  # fixtures) run against the Testcontainers PostgreSQL so tests hit the REAL
  # tables and seed data. clean-disabled is left at the secure default (clean
  # remains disabled); enabling clean-between-runs would require a DECISION_LOG
  # entry per the Explainability rule.
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ---------------------------------------------------------------------------
  # Spring Cloud AWS (3.3.0) -> LocalStack (Testcontainers).
  #   - Region pinned to us-east-1 for deterministic test runs.
  #   - Credentials are the LocalStack dummy "test"/"test" literals; these are
  #     NOT real secrets and intentionally override any AWS_* env credentials so
  #     the suites are hermetic.
  #   - path-style-access-enabled MUST be true for LocalStack S3 (it does not
  #     support virtual-host-style bucket addressing).
  #   - The endpoint is NOT set here: the Testcontainers LocalStack base class
  #     injects spring.cloud.aws.endpoint at runtime (random mapped port).
  # ---------------------------------------------------------------------------
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
      s3:
        path-style-access-enabled: true

# -----------------------------------------------------------------------------
# Observability in tests - keep Micrometer metrics and Actuator health fully
# wired (health-indicator tests assert UP; metrics still register in-memory),
# but suppress distributed-trace EXPORT so the suite never tries to reach a
# non-existent OTLP collector / Jaeger:
#   - sampling probability 0.0  -> no span is ever sampled, so nothing is sent.
#   - otlp.tracing.export.enabled false -> the OTLP span exporter is disabled.
# (Both keys are valid for Spring Boot 3.5.x; either alone suffices - using both
# is belt-and-suspenders. The base management.otlp.tracing.endpoint is inherited
# but never contacted while export is off and sampling is zero.)
# -----------------------------------------------------------------------------
management:
  tracing:
    sampling:
      probability: 0.0
  otlp:
    tracing:
      export:
        enabled: false

# -----------------------------------------------------------------------------
# CardDemo custom namespace.
#
# Resource names (carddemo.aws.s3.* buckets, carddemo.aws.sqs.report-queue,
# carddemo.aws.sns.topic) are INHERITED UNCHANGED from the base application.yml
# on purpose: the integration tests provision these SAME names in their
# LocalStack container and tear them down afterwards, so the production code path
# is exercised against the real contract with no rewiring (Validation Gate 5).
#
# Security / JWT: a fixed, deterministic, clearly NON-PRODUCTION signing key so
# security-filter tests are reproducible. JwtTokenService Base64-decodes this
# value (Keys.hmacShaKeyFor(Decoders.BASE64.decode(secret))); the literal below
# is standard Base64 that decodes to 69 bytes (well above the 32-byte / 256-bit
# HS256 minimum). It decodes to the self-identifying phrase
# "carddemo-test-profile-hs256-signing-key-not-for-production-0123456789".
# -----------------------------------------------------------------------------
carddemo:
  security:
    jwt:
      secret: Y2FyZGRlbW8tdGVzdC1wcm9maWxlLWhzMjU2LXNpZ25pbmcta2V5LW5vdC1mb3ItcHJvZHVjdGlvbi0wMTIzNDU2Nzg5
      expiration-ms: 3600000

# -----------------------------------------------------------------------------
# Logging - keep application logs at INFO for test diagnostics (raise to DEBUG
# locally when chasing a failing test) and quiet the chattiest container plumbing
# so CI output stays focused. The "test" profile selects single-line JSON logging
# in logback-spring.xml (the "!local" appender), which is fine for CI capture.
# -----------------------------------------------------------------------------
logging:
  level:
    com.carddemo: INFO
    com.github.dockerjava: WARN
