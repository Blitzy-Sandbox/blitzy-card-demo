#     true and aborts startup when a group names a contributor that does not
#     exist, Spring Cloud AWS 3.3.0 ships no health indicator, and
#     com.cardemo.observability.HealthIndicators does not exist in this tree
#     yet - src/main/java holds 77 files and no observability package. Naming
#     s3 or sqs today would make PRODUCTION UNBOOTABLE.
#     Resolution: this profile does not fork the group. Remediation: append
#     the contributor names to application.yml:779-780 in the same change
#     that introduces HealthIndicators, so all four profiles gain them
#     together from one definition.
#   - LOW - region variable spelling. The specification asked for AWS_REGION
#     with no default. application.yml:677 reads
