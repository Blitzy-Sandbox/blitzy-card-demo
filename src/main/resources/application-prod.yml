# MODULE DOCSTRING
#
# WHAT IT DOES
#
# This profile hardens one deployable artefact for production. It is a DELTA
# and nothing else: application.yml declares the property namespace, the
# environment-variable contract and every structural default, and this file
# changes only what production must change. TWENTY properties are declared
# here. Everything else is inherited, and every deliberate omission is listed
# under INHERITED AND DELIBERATELY NOT RESTATED below so a reviewer can tell
# an intentional absence from a forgotten key.
#
# It exists for one reason. Rule 1 Clause D requires least privilege for
# tokens, credentials and configuration, and the previous migration attempt
# shipped no production profile at all while hardcoding the JWT signing key.
# Both are closed here: the key is inherited as a bare environment reference
# with no default, and the production posture is now written down where an
# auditor can read it rather than inferred from a development profile.
#
# The twenty-five declared properties fall into exactly two kinds, and the
# distinction is what keeps this file free of duplication. Twenty of them are
# the original set; the five cloud-client keys were added when the live-AWS
# fall-through described above was closed, and all five are PINS.
#
#   - DELTA (7 properties) - the value production requires differs from the
#     value the base profile establishes. Measured, base on the left:
#         spring.main.banner-mode                     log     -> off
#         management.endpoints.web.discovery.enabled  unset in base, default
#                                                     true    -> false
#         management.info.build.enabled               unset in base, default
#                                                     true    -> false
#         management.info.git.enabled                 unset in base, default
#                                                     true    -> false
#         management.tracing.sampling.probability     1.0     -> 0.1
#         logging.level.org.springframework.web       INFO    -> WARN
#         logging.level.org.springframework.security  INFO    -> WARN
#   - PIN (13 properties) - the value equals the base value, but the key is
#     declared anyway because it is schema-destructive, PII-disclosing or
#     surface-widening, and a production profile that does not state its own
#     answer to those questions cannot be audited:
#         spring.jpa.hibernate.ddl-auto
#         spring.jpa.show-sql
#         spring.flyway.baseline-on-migrate
#         spring.flyway.validate-on-migrate
#         spring.flyway.clean-disabled
#         spring.flyway.out-of-order
#         spring.batch.job.enabled
#         spring.batch.jdbc.initialize-schema
#         management.endpoints.web.exposure.include
#         management.endpoint.health.show-details
#         management.endpoint.health.show-components
#         logging.level.org.hibernate.SQL
#         logging.level.org.hibernate.orm.jdbc.bind
#     Each pin names the specific harm it prevents at its declaration site.
#     No pin is a silent repeat.
#     Six of the thirteen also narrow or correct the framework default that
#     would otherwise apply, measured against the pinned classpath's own
#     spring-configuration-metadata.json: ddl-auto has no safe literal default
#     at all, because Boot derives it from the DataSource through
#     HibernateDefaultDdlAutoProvider.getDefaultDdlAuto(DataSource);
#     spring.batch.job.enabled defaults to true; batch initialize-schema
#     defaults to embedded; exposure.include defaults to health alone; and the
#     two Hibernate log levels have no per-logger default, so an unset logger
#     inherits the root level. The other seven already match the framework
#     default and are pinned regardless, because a default that happens to be
#     safe is still not a decision anyone recorded.
#
# HOW TO RUN, BUILD AND TEST
#
# Build and unit-test - identical to every other profile, because the build is
# profile independent:
#     ./mvnw -B -ntp clean test
# Full verify, including coverage and the vulnerability scan:
#     ./mvnw -B -ntp clean verify
#
# Activate this profile by environment variable only. The Dockerfile ENV
# block sets SPRING_PROFILES_ACTIVE to the empty string precisely so the image
# stays profile neutral, and nothing in this file or in application.yml sets
# spring.profiles.active:
#     SPRING_PROFILES_ACTIVE=prod java -jar target/carddemo-*.jar
#
# ACTIVATE prod ALONE. This is a hard precondition, not advice. Spring
# resolves competing profile properties by ACTIVATION ORDER - the profile
# listed last wins - so `prod,local` would let the local profile's concrete
# database host, its service-emulator endpoint override and its
# spring.batch.jdbc.initialize-schema: always defeat everything below,
# whichever keys this file declares. The layering contract is recorded at
# the PROFILE LAYERING CONTRACT section of application.yml. No amount of restatement can make a mixed
# activation safe, which is why the answer is a precondition rather than more
# keys. The one thing restatement DOES buy is the reverse order: under
# `local,prod` the thirteen pins below win. Treat that as a seatbelt, never as
# a licence to combine profiles.
#
# EVERY SECRET IS INJECTED BY THE DEPLOYMENT PLATFORM AND NONE IS COMMITTED.
# The variables the running process must be given are declared once, in the
# base profile, and are inherited here unchanged:
#     JWT_SIGNING_KEY                   carddemo.security.jwt.signing-key
#                                       in application.yml  (no default)
#     POSTGRES_HOST, POSTGRES_DB        application.yml:544  (no default)
#     POSTGRES_USER                     application.yml:545  (no default)
#     POSTGRES_PASSWORD                 application.yml:547  (no default)
#     AWS_REGION or AWS_DEFAULT_REGION  application.yml:677  (no default)
#     CARDDEMO_S3_BATCH_INPUT_BUCKET    application.yml:898  (no default)
#     CARDDEMO_S3_BATCH_OUTPUT_BUCKET   application.yml:899  (no default)
#     CARDDEMO_S3_STATEMENTS_BUCKET     application.yml:900  (no default)
#     CARDDEMO_SQS_REPORT_QUEUE         application.yml:949  (no default)
#     CARDDEMO_SNS_NOTIFICATION_TOPIC   application.yml:958  (no default)
#     OTEL_EXPORTER_OTLP_ENDPOINT       application.yml:814  (no default)
# Deliver them through the platform's secret mechanism - a task-definition
# secret reference, a Kubernetes Secret projected as an environment variable,
# or an equivalent. Do not bake them into the image, a compose file or a
# committed .env. The AWS credentials that reach S3, SQS and SNS are NOT in
# that list, and the reason has changed: they are not secrets at all. This
# deployment talks only to the containerised AWS emulator, so the base profile
# supplies an inert static pair whose sole purpose is to displace the SDK
# provider chain. See THE NO-LIVE-AWS BOUNDARY APPLIES HERE TOO, below.
#
# KEY CONFIGURATION AND DEFAULTS
#
# THIS PROFILE CARRIES NO DEFAULT FOR ANY SECRET, AND THAT IS THE DESIGN.
# There is not one `${VAR:fallback}` anywhere below, and the environment
# references this profile inherits are all bare. An absent variable therefore
# leaves a placeholder unresolvable, which fails property resolution and
# aborts startup before the first request is served.
#
# A FAILED STARTUP HERE IS A CORRECT STARTUP, NOT A MISCONFIGURATION. Rule 1
# Clause B requires null and empty cases to be handled explicitly, and a
# production process that boots with a guessed database host or a generated
# signing key is precisely the unsafe default Rule 1 Clause A forbids. The
# failure is the explicit handling. Never add a default to silence it.
#
# The only defaulted values anywhere in the composed configuration are
# non-secret protocol constants and legacy parity constants inherited from
# the base - SERVER_PORT 8080, POSTGRES_PORT 5432, the JWT issuer and
# lifetime, the four page sizes, the BCrypt strength, the fixed record
# lengths and the generation retention count. None is environment specific
# and none is sensitive.
#
# COMMON FAILURE MODES AND TROUBLESHOOTING
#
#   - STARTUP ABORTS ON THE SIGNING KEY. Reported as an unresolvable
#     placeholder for carddemo.security.jwt.signing-key naming
#     JWT_SIGNING_KEY. JWT_SIGNING_KEY was not injected. This is the intended
#     fail-fast path.
#     Remediation: inject a key of at least 32 bytes of entropy through the
#     platform secret store; the Security section of .env.example documents
#     how one is generated and ships the entry empty. Never add a default, and
#     never introduce a second variable name for the same value. A platform
#     still exporting the superseded JWT_SECRET produces exactly this failure;
#     the remedy is to rename the injected variable, not to reintroduce the
#     old name alongside the new one.
#   - STARTUP ABORTS ON THE DATASOURCE. POSTGRES_HOST, POSTGRES_DB,
#     POSTGRES_USER or POSTGRES_PASSWORD was not injected. Inject all four, or
#     override spring.datasource.url, .username and .password wholesale with
#     SPRING_DATASOURCE_URL,
#     SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD, which bind
#     to the same three properties by relaxed binding at a higher precedence
#     than any profile file.
#   - THE DATABASE REJECTS THE CREDENTIAL. The process starts resolving
#     properties and then fails to open a pool connection with an
#     authentication error. The value was injected but is wrong, or the
#     production role lacks CONNECT on the database. Verify the secret version
#     the platform actually projected, then verify the grant.
#     Under least privilege the application role needs CONNECT plus SELECT,
#     INSERT, UPDATE and DELETE on the 11 business tables, and it needs
#     nothing else: no SUPERUSER, no CREATEDB and no CREATEROLE. It does
#     need DDL rights on its own schema for the Flyway history table only
#     while a migration is pending; a deployment that separates migration
#     from serving should run Flyway under a distinct migration role.
#   - FLYWAY REPORTS A CHECKSUM MISMATCH OR A FAILED VALIDATION against an
#     existing schema. A committed migration was edited after it had already
#     been applied to this database, or the schema was created by something
#     other than Flyway. Roll forward with a new migration.
#     spring.flyway.clean-disabled is pinned true below and must stay true -
#     clean would drop the production schema - and there is deliberately no
#     ignore-migration-patterns and no continue-on-error, because Rule 1
#     Clause B forbids swallowing the failure. Do NOT baseline an unknown
#     schema: baseline-on-migrate is pinned false for that reason.
#   - HIBERNATE REPORTS A MISSING TABLE OR COLUMN. ddl-auto is pinned
#     validate, so the entity mapping and the Flyway schema have diverged.
#     Fix whichever is wrong and redeploy. Never switch ddl-auto
#     to update or create in order to start - that would let Hibernate
#     reshape a production table away from the record layouts in app/cpy and
#     break field-contract parity silently.
#   - SPRING BATCH REPORTS A MISSING BATCH_JOB_INSTANCE. Expected on a fresh
#     production database: spring.batch.jdbc.initialize-schema is pinned
#     never. Have a DBA apply the framework's own
#     org/springframework/batch/core/schema-postgresql.sql once, as a
#     reviewed change. The BATCH_* tables must NEVER become a fourth Flyway
#     migration nor an extra table in V1__create_schema.sql, because a
#     validation gate asserts V1 creates exactly 11 tables.
#   - AWS CALLS FAIL WITH A CONNECTION ERROR, OR STARTUP ABORTS NAMING AN
#     ENDPOINT OR CREDENTIAL PROPERTY. Both are the emulator-only boundary
#     working. A connection error means AWS_ENDPOINT_URL addresses an emulator
#     that is not reachable from this deployment - bring it up, or correct the
#     variable. A startup abort from com.cardemo.config.AwsConfig means an
#     endpoint is absent, is not an absolute http/https URI with an explicit
#     port, or names a host outside the permitted emulator list, or that a
#     credential property is absent or carries a real AWS key prefix.
#     Remediation: supply the emulator address and the inert credential pair.
#     Do NOT diagnose either by pointing the deployment at real AWS or by
#     pasting a real access key: the first is forbidden by AAP 0.3.2, the
#     second is a committed credential, and AwsConfig refuses both. The
#     operation set the workload actually performs, recorded here so that a
#     future live-AWS engagement has it: s3:GetObject and s3:PutObject on the
#     three bucket ARNs plus s3:ListBucket where a current-generation read
#     must find the greatest existing key prefix; sqs:SendMessage,
#     sqs:ReceiveMessage, sqs:DeleteMessage and sqs:GetQueueAttributes on the
#     FIFO queue ARN; and sns:Publish on the topic ARN.
#   - AWS CALLS RESOLVE TO THE WRONG ACCOUNT OR REGION, or an unexpected
#     bucket appears. Either AWS_REGION and AWS_DEFAULT_REGION are both
#     absent, or AWS_ENDPOINT_URL is exported in the production environment.
#     The SDK honours AWS_ENDPOINT_URL globally and it must never be set
#     here; this profile declares no endpoint override of any kind.
#   - THE OTLP COLLECTOR IS MISSING. Startup aborts on an unresolvable
#     OTEL_EXPORTER_OTLP_ENDPOINT. There is deliberately no default: Boot
#     gates its OTLP span exporter on that property, so a missing value would
#     create no exporter and every span would be dropped in silence.
#     Inject the collector endpoint, or set the higher-precedence
#     MANAGEMENT_OTLP_TRACING_ENDPOINT. If tracing is
#     genuinely not wanted in a given environment, disable it explicitly with
#     MANAGEMENT_TRACING_ENABLED=false rather than by omitting the endpoint.
#   - /actuator/health/readiness RETURNS 404. The probe groups were removed
#     or renamed in the base. The Dockerfile HEALTHCHECK issues
#     GET /actuator/health/readiness and greps for UP, so the group must
#     exist and resolve or every container will be killed by its own probe.
#   - AN ACTUATOR ENDPOINT RETURNS 404 IN PRODUCTION. Expected. Exactly
#     health, info and prometheus are exposed. Do not widen the list to "*"
#     to diagnose an incident: env and configprops echo resolved property
#     values including the signing key, and heapdump serves the process
#     image. Reproduce under the local profile instead.
#   - PROMETHEUS SHOWS NO CARDDEMO SERIES. The scrape target cannot reach the
#     application port. The carddemo-app scrape job in
#     observability/prometheus.yml declares the targets and the metrics_path
#     /actuator/prometheus. Fix reachability there. Do not move the management
#     port to work around it - see the note beside the actuator block.
#   - A REQUIRED VARIABLE IS UNSET AND STARTUP STILL SUCCEEDS. Something is
#     binding the target property directly and outranking the composed
#     reference. SPRING_DATASOURCE_URL and MANAGEMENT_OTLP_TRACING_ENDPOINT
#     bind spring.datasource.url and management.otlp.tracing.endpoint
#     themselves, so while either is set the inner ${POSTGRES_HOST} or
#     ${OTEL_EXPORTER_OTLP_ENDPOINT} placeholder is never evaluated and
#     removing that variable changes nothing. .env.example ships both, which
#     is why any check of the fail-fast contract has to clear the direct
#     variable as well as the composed one.
#   - TRACES LOOK SPARSE COMPARED WITH A LOCAL RUN. Expected. Sampling is
#     0.1 here against 1.0 in the base. For a specific investigation, raise
#     MANAGEMENT_TRACING_SAMPLING_PROBABILITY for the duration, then put it
#     back.
#
# THE RESTATEMENT RULE
#
# Rule 1 Clause C forbids duplication, and a production profile that copies
# its base is both duplication and a maintenance trap: the copy drifts, and
# the drift is invisible. One rule therefore governs every key below, and it
# was applied to all 1163 lines of application.yml one key at a time:
#
#   A key appears in this file if and only if
#     (1) the value production requires DIFFERS from the value the base
#         profile establishes - either because the base sets a different
#         value, or because the base leaves the key unset and the framework
#         default is wrong for production - a DELTA; or
#     (2) the base already establishes the IDENTICAL value, but the key is
#         schema-destructive, PII-disclosing or surface-widening, so a
#         production profile that does not state its own answer to it cannot
#         be audited - a PIN.
#   The two kinds are mutually exclusive and mechanically decidable: compare
#   the production value against the base value, key by key. That comparison
#   was executed as an assertion rather than asserted from reading - see the
#   DELTA AUDIT under VALIDATION EVIDENCE, which prints the base value beside
#   the production value for the original twenty. The five cloud-client keys
#   added later are pins whose base counterparts are bare environment
#   references, so the audit's own rule - a pin repeats the base value - holds
#   for them by construction. Every other key is INHERITED and is listed below
#   with its base line, so no absence is ambiguous.
#
# Every pin is a key anyone auditing this deployment would otherwise have to go
# and look for in another file - which is exactly how a production database
# gets dropped by a profile nobody read.
#
# A CORRECTED INVARIANT: THE CLOUD ENDPOINT IS PINNED, NOT ABSENT
#
# Four things are absent on purpose. An absence is invisible, so each is
# stated here to be verifiable rather than assumed. Two of the four used to
# be the absence of an AWS endpoint and the absence of an AWS credential;
# both are now mandatory, inherited values, and the first two entries below
# record what replaced them and why.
#
#   - CORRECTED, AND NO LONGER AN INVARIANT OF THIS KIND. An earlier revision
#     listed "NO ENDPOINT OVERRIDE OF ANY KIND" here and presented it as a
#     safeguard. It was the opposite: with no override, standard endpoint
#     resolution supplies the real regional endpoint, so the absence was the
#     one setting that produced live AWS routing - which Agent Action Plan
#     0.3.2 and 0.8.4 forbid outright. The three overrides are now MANDATORY
#     and carry no default; see the `spring.cloud.aws` block below for the full
#     reasoning, and AwsConfig.requireEmulatorEndpoints plus
#     AwsConfig.requireLocalServiceEndpoint for the allowlist that rejects a
#     non-emulator value before any client is built.
#     THE ONLY ABSOLUTE URL WRITTEN LITERALLY IN THIS FILE remains the Apache
#     License URL at the top, which the source-header convention requires on
#     every artefact in this repository and which nothing contacts. The
#     endpoint overrides carry no literal host: each is an environment
#     reference, so no address is committed here, and there is no other host
#     name, port, IP address or service URL in any line of this file, comment
#     or property.
#   - NO CREDENTIAL LITERAL IN THIS FILE, AND NO DEFAULT PROVIDER CHAIN EITHER.
#     There is no spring.cloud.aws.credentials.access-key and no .secret-key
#     below. What this file no longer does is treat that absence as a POSTURE:
#     it used to state that production signs with an instance or task role
#     resolved through the SDK's default provider chain, and that was itself a
#     live-AWS path, which AAP 0.3.2 forbids outright. The credential contract
#     is INHERITED from the base profile, which pins static non-live values so
#     the default provider chain is displaced entirely, and AwsConfig then
#     proves at startup that both are present and that neither carries the
#     AKIA/ASIA prefix AWS assigns to real keys. Absence here therefore means
#     "inherited and validated", not "unrestricted".
#   - NO SESSION STATE. There is no spring.session.*, no session persistence,
#     no session timeout and no CSRF token repository. SecurityConfig
#     enforces SessionCreationPolicy.STATELESS because the COMMAREA-based
#     pseudo-conversational model - app/cpy/COCOM01Y.cpy CDEMO-PGM-CONTEXT
#     with 88 CDEMO-PGM-ENTER VALUE 0 and 88 CDEMO-PGM-REENTER VALUE 1 - has
#     no Java counterpart. Pagination state moves to request parameters and
#     response metadata, never to the server. Adding a session store here
#     would reintroduce the state the migration deliberately removed.
#   - NO DUMMY PRODUCTION VALUE. No placeholder database name, no sample
#     bucket name, no example credential, no illustrative endpoint - not even
#     in a comment. Every environment-specific value is a bare environment
#     reference in the base, and this file adds no literal that names a
#     specific host, database, bucket, queue, topic or account.
#
# THE NO-LIVE-AWS BOUNDARY APPLIES HERE TOO, WITHOUT EXCEPTION
#
# AAP 0.3.2 is unqualified: "All AWS interaction is against LocalStack. Zero
# live credentials appear in any file, and no code path may reach a real AWS
# endpoint." It does not exempt a production profile, and this profile no
# longer claims an exemption. The earlier posture - standard regional endpoint
# resolution plus instance or task-role credentials - read as least privilege
# but was in fact the one reachable live-AWS path in the application, and a
# deployment activating this profile would have addressed real AWS hosts with
# whatever principal its runtime supplied.
#
# What now holds under this profile, inherited from application.yml and proved
# by com.cardemo.config.AwsConfig before any client exists:
#
#   * The three service endpoints resolve through ${AWS_ENDPOINT_URL} to the
#     containerised emulator. Supply that variable through the platform's
#     configuration mechanism exactly as the datasource variables are supplied;
#     it must address the emulator, and AwsConfig refuses any other host.
#   * The static credential pair is present and inert, which displaces the SDK
#     default provider chain outright - so an instance role, a task role, a
#     web-identity token or instance metadata can never sign a call. That is a
#     STRONGER least-privilege position than a role-based one, not a weaker
#     one: the deployment holds no live AWS permission at all.
#   * AwsConfig aborts the context refresh when an endpoint is absent, is not
#     an absolute http/https URI with an explicit port, carries user
#     information, or names a host outside its permitted emulator list, and
#     when either credential is absent or carries the AKIA/ASIA prefix of a
#     real AWS key.
#
# Consequently this profile is production-shaped in every respect that this
# migration's scope covers - least-privilege database credentials, a narrowed
# actuator surface, no schema authority, no development convenience - while
# remaining emulator-only at the cloud boundary. Deploying against real AWS is
# out of scope by AAP 0.3.2 and is recorded as residual risk rather than
# quietly enabled here; enabling it would require a deliberate, reviewed change
# to AwsConfig's guard, not merely a property.
#
# INHERITED AND DELIBERATELY NOT RESTATED
#
# Each entry is already correct for production in application.yml under the
# property path named, and restating it here would only repeat a base value.
# Property paths are cited rather than line numbers, because a path survives
# every edit to that file while a line number does not.
#
#   Datasource and pool
#     spring.datasource.url .username .password
#       Composed from bare POSTGRES_* references with no literal default
#       except the IANA-registered port. Nothing about them is
#       production specific, so a copy would add no auditable fact.
#     spring.datasource.driver-class-name
#     spring.datasource.hikari.*
#       pool-name carddemo-pool, maximum-pool-size 10, minimum-idle 2,
#       connection-timeout 30000, auto-commit false. DELIBERATELY UNTUNED,
#       and this profile does not invent production sizing on top. The COBOL
#       corpus publishes no service-level objective - CICS concurrency was
#       governed by the region, not by the application - so any pool figure
#       presented here as "tuned" would be fabricated, which Rule 1 Clause A
#       forbids. CONNECTION-POOL TUNING, TABLE PARTITIONING AND READ
#       REPLICAS ARE EXPLICITLY OUT OF SCOPE FOR THIS MIGRATION and are
#       carried as residual risk rather than silently dropped. What is needed
#       to close them is stated under WHAT THIS PROFILE DOES NOT ASSERT
#       below.
#     spring.jpa.open-in-view false
#       Already off, so no connection is held across a view render. Not a
#       schema or disclosure question, so it is not pinned.
#     spring.jpa.generate-ddl false
#     spring.jpa.properties.hibernate.*
#       UTC session time zone, batch_size 50, ordered inserts and updates.
#   Schema
#     spring.flyway.enabled true
#     spring.flyway.locations classpath:db/migration
#     spring.flyway.table .encoding
#   Security
#     carddemo.security.jwt.signing-key ${JWT_SIGNING_KEY}
#       ALREADY a bare environment reference with no default, no example and
#       no fallback. Re-declaring it here would put a second mention of the
#       signing key into the repository for no gain, and re-declaring it
#       under a different variable name would create the duplication Rule 1
#       Clause C forbids - see the discrepancy register.
#     carddemo.security.jwt.issuer .expiration-minutes
#       The lifetime is expressed in MINUTES with a 30-minute default, bound
#       from JWT_EXPIRATION_MINUTES and accepted only within 1..1440. A note
