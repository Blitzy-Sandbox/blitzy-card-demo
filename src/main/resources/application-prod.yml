#     VARIABLE rather than a literal, so no literal default exists and an
#     absent pair still fails startup. .env.example:64 ships only
#     AWS_DEFAULT_REGION, the AWS-standard spelling.
#     Resolution: inherit. Restating a bare ${AWS_REGION} here would DELETE a
#     working spelling and break any deployment that supplies the standard
#     one - a regression dressed as hardening. Remediation: none; both
#     spellings satisfy the requirement.
#   - LOW - the embedded job deck holds SEVENTEEN cards, not eighteen. The
#     technical specification describes an "eighteen-card embedded job
#     skeleton". Direct inspection of app/cbl/CORPT00C.cbl resolves 17:
#     JOB-DATA-1 spans :82-125 and contains fourteen 05 FILLER PIC X(80) VALUE
#     literals at :83, :85, :87, :89, :91, :93, :95, :97, :99, :101, :113,
#     :115, :122 and :124, plus three composed groups that each total 80 bytes
#     exactly - FILLER-1 at :103 as 18 + 10 + 52, FILLER-2 at :108 as
#     16 + 10 + 54, and FILLER-3 at :117 as 10 + 1 + 10 + 59. That is
#     14 x 80 + 3 x 80 = 1360 bytes = 17 x 80, and JOB-DATA-2 REDEFINES
#     JOB-DATA-1 as JOB-LINES OCCURS 1000 TIMES PIC X(80), so only 17 of the
#     thousand slots are populated.
#     Resolution: the count above says seventeen. The COBOL corpus is the
#     authority and prose is not, so where the two disagree the source wins
#     and the discrepancy is recorded rather than propagated. Nothing in this
#     profile depends on the number - the deck collapses into one message
#     either way - but a downstream artefact that reproduced "eighteen" would
#     be asserting a card that does not exist. Remediation: correct the count
#     in the specification and in TRACEABILITY_MATRIX.md.
#   - LOW - no application service in the compose topology. docker-compose.yml
#     provisions the five substrate services only, so nothing in the
#     repository activates this profile automatically. Nothing here depends on
