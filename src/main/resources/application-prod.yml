# AUTHORISATION SURFACE THIS PROFILE PROTECTS
#
# The least-privilege claim is only meaningful against a known surface, so the
# surface is stated. EXACTLY 17 OPERATIONS ARE EXPOSED. app/csd/CARDDEMO.CSD
# defines 18 transactions; the eighteenth, CDV1 at L388-390, is described as
# "DEVELOPER TRANSACTION - 1" and fronts PROGRAM(COCRDSEC), which has no
# source anywhere in the repository. It is a dangling legacy definition, no
# endpoint is invented for it, and no property here references it.
#
# /api/admin/* IS ADMINISTRATOR-ROLE-ONLY, enforced by SecurityConfig. The
# four transactions behind it are CU00, CU01, CU02 and CU03, fronting
# COUSR00C, COUSR01C, COUSR02C and COUSR03C - the user list, add, update and
# delete programs. The role comes from CDEMO-USER-TYPE PIC X(01) in
# app/cpy/COCOM01Y.cpy, whose only two values are 'A' administrator and 'U'
# standard user, carried as a token claim rather than in a COMMAREA.
#
# Eight of the ten VSAM clusters have an online DEFINE FILE in the CSD -
# ACCTDAT, CARDAIX, CARDDAT, CCXREF, CUSTDAT, CXACAIX, TRANSACT and USRSEC at
# L1, L13, L25, L37, L50, L63, L76 and L88. TCATBALF, DISCGRP, TRANCATG and
# TRANTYPE have NO online definition at all, which is the evidence that they
# are batch-only: no production endpoint reaches them, and none is added.
#
# S3 OBJECT LAYOUT AND RECORD GEOMETRY IN PRODUCTION
#
# The bucket names, the FIFO queue name, the topic name and the key prefixes
# are inherited from carddemo.aws.s3.*, carddemo.aws.sqs.* and
# carddemo.aws.sns.* in the base profile and are not restated. What
# matters in a production profile is the invariant they carry, so it is
# recorded here.
#
# The SEVEN generation data group bases become deterministic key prefixes over
# a versioned bucket rather than catalogue generations: DALYREJS
# (app/jcl/DALYREJS.jcl:25), SYSTRAN (app/jcl/DEFGDGB.jcl:49), TCATBALF.BKUP
# (:43), TRANREPT (:37), TRANSACT.BKUP (:25), TRANSACT.COMBINED (:55) and
# TRANSACT.DALY (:31). A next-generation (+1) write becomes a new object under
# a monotonically increasing job-instance or timestamp prefix; a
# current-generation (0) read becomes the lexicographically greatest existing
# prefix. THE BATCH OUTPUT BUCKET IS VERSIONED, so object versioning - not a
# generation counter - is what makes a superseded write recoverable.
#
# RECORD LENGTH IS PRESERVED BYTE-EXACTLY AT THE S3 BOUNDARY: 350 for the
# transaction and daily-transaction images, 430 for a reject record, 133 for a
# report line, and 80 and 100 for the statement text and HTML outputs. The 430
# is not a round number - app/jcl/POSTTRAN.jcl:36 declares
# DCB=(RECFM=F,LRECL=430) and app/cbl/CBTRN02C.cbl:L176-L182 resolves it as
# exactly 350 data bytes plus an 80-byte trailer carrying a four-digit reason
# code and a 76-character description. 350 + 80 = 430. Parity is compared on
# the emitted bytes, so a wrong length is a wrong output even when every field
# value is right, and no production setting may alter it.
#
# THE RETENTION CONFLICT IS RESOLVED TO 10 AND IS DOCUMENTATION, NOT CODE.
# app/jcl/DEFGDGB.jcl:37-38 declares LIMIT(5) for AWS.M2.CARDDEMO.TRANREPT
# while app/jcl/REPTFILE.jcl:26-27 declares LIMIT(10) for the same base. A
# single S3 lifecycle value must be chosen, so 10 is used - the larger, so no
# generation the legacy system would have retained is discarded. The value is
# recorded at carddemo.aws.s3.gdg-retention-generations in the base profile as
# intent; it is NOT enforced by application code, and nothing in this profile
# prunes an object. Enforcement, if wanted, is an S3 lifecycle rule owned by
# the deployment.
#
# THE FIFO QUEUE REPLACES THE TRANSIENT DATA QUEUE. app/csd/CARDDEMO.CSD:
# L499-505 defines TDQUEUE(JOBS) TYPE(EXTRA) DDNAME(INREADER) TYPEFILE(OUTPUT)
# RECORDSIZE(80) RECORDFORMAT(FIXED) DISPOSITION(MOD) - an 80-byte fixed
# OUTPUT record written one card at a time into the JES2 internal reader. The
# SEVENTEEN eighty-byte job cards that app/cbl/CORPT00C.cbl holds as literal
# constants in JOB-DATA-1 at :82-125 collapse into ONE typed JSON message
# carrying the report name and the start and end dates, and an SQS listener
# replaces the internal reader. A single message group id preserves the strict
# sequential DISPOSITION(MOD) append ordering. queue-not-found-strategy is
# FAIL in the base, so a mistyped production queue name is a loud error rather
# than a silently created queue with the wrong FIFO attributes.
#
# DEFERRED HARDENING - DISCLOSED, NOT DROPPED
#
# Rule 1 Clause F requires missing information to be stated rather than
# implied away. The following are OUT OF SCOPE for this migration and are each
# carried as residual risk. None is silently omitted, and none is claimed to
# be present:
#
#   - TLS TERMINATION. This profile configures no server.ssl.*, no keystore
#     and no truststore, and the repository ships no certificate. The target
#     topology terminates at the load balancer. A deployment that must
#     terminate in-process has to add server.ssl.* from injected material and
#     must still not commit a keystore.
#   - REQUEST RATE LIMITING. No limiter, no bucket, no quota. Nothing here
#     throttles a caller.
#   - URI-BASED API VERSIONING. The 17 operations are served at unversioned
#     paths; a breaking change would need a versioning scheme first.
#   - GENERATED OPENAPI DOCUMENTATION. No specification is generated and no
#     specification endpoint is exposed - which is also why widening the
#     Actuator exposure list would not help. docs/api-contracts.md is the
#     manual substitute.
#   - ENCRYPTION AT REST FOR PERSONALLY IDENTIFIABLE DATA. CUST-SSN
#     PIC 9(09) at app/cpy/CVCUS01Y.cpy:17, CUST-GOVT-ISSUED-ID at :18 and
#     CUST-DOB-YYYY-MM-DD at :19 are stored in plain columns. No
#     column-level encryption and no tokenisation is configured. Storage-level
#     encryption, if the platform provides it, is a deployment concern and is
#     not asserted here.
#   - CONNECTION-POOL TUNING, TABLE PARTITIONING AND READ REPLICAS. See the
#     inherited Hikari note above and WHAT THIS PROFILE DOES NOT ASSERT
#     below.
#
# WHY CERTAIN SPELLINGS AND CERTAIN ABSENCES ARE WHAT THEY ARE
#
# None of the following is a defect in this file. Each records a conflict
# between two sources, resolved once and written down rather than hidden, or a
# bound on what this profile is entitled to claim.
#
#   - HIGH, NOW CLOSED - signing-key variable name AND token lifetime. The
#     file specification for this artefact asked for JWT_SIGNING_KEY and a
#     minute-based lifetime. This profile was written when the repository had
#     standardised on JWT_SECRET and carddemo.security.jwt.expiration-seconds
#     with a 3,600-second default, and it argued for inheriting that spelling
#     unchanged on the grounds that a second name is duplication. The
#     duplication argument was right; the conclusion was not, because the
#     fix for two spellings of one setting is to rename ALL of them, not to
#     keep the wrong one. Resolution, applied in one change so that exactly
#     one spelling exists at every moment: application.yml now publishes
#     carddemo.security.jwt.signing-key: ${JWT_SIGNING_KEY} with no default
#     and carddemo.security.jwt.expiration-minutes: ${JWT_EXPIRATION_MINUTES:
#     30}, and SecurityConfig, JwtTokenProvider, .env.example, pom.xml,
#     owasp-suppressions.xml, the Dockerfile and the unit test that asserts
#     the variable name moved with it.
#     Severity is HIGH rather than Medium because the unit was not cosmetic:
#     3,600 seconds is DOUBLE the approved thirty-minute bearer window, and a
#     bearer token cannot be revoked before it expires, so the drift widened a
#     credential's lifetime rather than merely renaming it.
#     This profile still declares neither key: environment indirection, no
#     committed value, no fallback and fail-fast all hold by inheritance, and
#     re-declaring the signing key here would put a second mention of one
#     secret in the repository for no gain.
#   - WITHDRAWN - was HIGH: "carddemo.s3.* is not the namespace any profile
#     declares, and it is a startup blocker". RE-VERIFIED AT HEAD AND NO LONGER
#     TRUE. Every @Value key it named now binds the declared namespace:
#     RejectWriter.java:616 and TransactionWriter.java:585 read
#     carddemo.aws.s3.batch-output-bucket, TransactionWriter.java:590 reads
#     carddemo.aws.s3.transaction-object-prefix, StatementWriter.java:923 reads
#     carddemo.aws.s3.statements-bucket and AccountReader.java:493 reads
#     carddemo.batch.account-reader.page-size. The recommended remediation was
#     applied in the owning classes, so the finding is withdrawn rather than left
#     standing. Re-verification command:
#       grep -rn 'carddemo\.s3\.' src/main/java   ->  no matches
#     The residue it correctly identified is closed separately: the four reader
#     page-size keys and carddemo.aws.s3.transaction-object-prefix were active in
#     code but declared in NO profile, and are now declared in application.yml.
#   - MEDIUM - bucket variable names. The specification asked for
#     CARDDEMO_S3_INPUT_BUCKET and CARDDEMO_S3_OUTPUT_BUCKET. The repository
#     provisions CARDDEMO_S3_BATCH_INPUT_BUCKET at .env.example:80 and
#     CARDDEMO_S3_BATCH_OUTPUT_BUCKET at :81, and
#     carddemo.aws.s3.batch-input-bucket and carddemo.aws.s3.batch-output-bucket
#     read exactly those. The statements bucket, the report queue and the
#     notification topic match the specification exactly.
#     Resolution: inherit the provisioned spelling. A profile that read a
#     variable name nothing provisions would fail startup for a reason no
#     operator could diagnose from the message. Remediation: none required.
#   - MEDIUM - object-storage and queue readiness coverage. The specification
#     requires readiness to cover database, object storage and queue; the
#     inherited group covers readinessState and db only.
#     Cause: management.endpoint.health.validate-group-membership defaults to
#     true and aborts startup when a group names a contributor that does not
#     exist, and Spring Cloud AWS 3.3.0 ships no health indicator of its own.
#     com.cardemo.observability.HealthIndicators HAS SINCE BEEN CREATED and is
#     present in this tree - an earlier revision of this note recorded it as
#     absent, and that is withdrawn. What has NOT changed is the resolution:
#     a group may name only contributor beans the context actually registers,
#     so the contributor names must be added to the shared definition in
#     application.yml rather than forked here.
#     Resolution: this profile does not fork the group. Remediation: append
#     the contributor names to management.endpoint.health.group.readiness.include
#     in the base profile, in the same change
#     that introduces HealthIndicators, so all four profiles gain them
#     together from one definition.
#   - LOW - region variable spelling. The specification asked for AWS_REGION
#     with no default. spring.cloud.aws.region.static reads
#     ${AWS_REGION:${AWS_DEFAULT_REGION}}, where the fallback is a second
#     VARIABLE rather than a literal, so no literal default exists and an
#     absent pair still fails startup. .env.example:132 ships only
#     AWS_DEFAULT_REGION, the AWS-standard spelling.
#     Resolution: inherit. Restating a bare ${AWS_REGION} here would DELETE a
#     working spelling and break any deployment that supplies the standard
#     one - a regression dressed as hardening. Remediation: none; both
#     spellings satisfy the requirement.
#   - LOW - the embedded job deck holds SEVENTEEN cards, not eighteen. The
#     technical specification describes an "eighteen-card embedded job
#     skeleton". Direct inspection of app/cbl/CORPT00C.cbl resolves 17:
#     JOB-DATA-1 spans :82-125 and contains fourteen 05 FILLER PIC X(80) VALUE
#     literals at :83, :85, :87, :89, :91, :93, :95, :97, :99, :101, :113,
#     :115, :122 and :124, plus three composed groups that each total 80 bytes
#     exactly - FILLER-1 at :103 as 18 + 10 + 52, FILLER-2 at :108 as
#     16 + 10 + 54, and FILLER-3 at :117 as 10 + 1 + 10 + 59. That is
#     14 x 80 + 3 x 80 = 1360 bytes = 17 x 80, and JOB-DATA-2 REDEFINES
#     JOB-DATA-1 as JOB-LINES OCCURS 1000 TIMES PIC X(80), so only 17 of the
#     thousand slots are populated.
