#     logging.config                                     NOT SET, by design
#       logback-spring.xml is auto-detected from the classpath. It owns JSON
#       encoding, the traceId, spanId and correlationId MDC fields, and the
#       masking backstop. No appender, encoder or pattern is restated here.
#       MASKING IS A BACKSTOP, NOT THE CONTROL. An earlier revision of this
#       listing said logback-spring.xml masks credentials, presented
#       passwords, BCrypt hashes, social security numbers, tokens and
#       Authorization headers, which reads as complete exclusion. It is not
#       complete, and the claim is withdrawn. THE PRIMARY CONTROL IS THAT
#       SENSITIVE DATA IS NEVER EMITTED: no log statement in this application
#       may pass a credential, a hash, a card number, a CVV or customer PII to
#       a logger, and the readers and entities that handle those fields
#       withhold them at the point of rendering.
#       The limitation is structural, not a configuration gap. The decorator
#       holds 22 <paths> field-name entries and 13 <valueMask> regex rules,
#       and 6 of those 13 fire ONLY when a recognised label precedes the
#       value. logback-spring.xml states why in its own rule notes: a bare
#       16-digit run cannot be masked because CARD-NUM PIC X(16) and
#       TRAN-ID PIC X(16) are the same shape (R11), a bare 9-digit run cannot
#       be masked because it collides with the PIC 9(09) counters displayed at
#       app/cbl/CBTRN02C.cbl:L227-L228 (R4), 3-4 bare digits cannot be
#       recognised as a CVV at all (R12), and the remaining CVCUS01Y PII has
#       no distinguishing shape (R13). An unlabelled value of any of those
#       kinds passes through unmasked, by design, because the alternative
#       corrupts the output Gate 1 compares byte for byte.
