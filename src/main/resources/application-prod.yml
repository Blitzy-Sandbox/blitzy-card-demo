# ******************************************************************
# * File         : application-prod.yml
# * Application  : CardDemo
# * Type         : Spring Boot production profile (YAML), least privilege
# * Function     : The production-only DELTA over application.yml for the
# *                CardDemo modular monolith that replaces the z/OS
# *                runtime of the frozen COBOL corpus in app/. It exists
# *                to satisfy Rule 1 Clause D - "principle of least
# *                privilege for tokens/credentials/config" - and to close
# *                the High-severity gap left by the previous migration
# *                attempt, which shipped no production profile at all.
# *                It carries NO secret, NO credential, NO endpoint, NO
# *                hostname and NO default on any environment-specific
# *                value, so an absent variable fails startup by design.
# *                It restates nothing from the base profile that would
# *                merely repeat a base value.
# * Source       : app/csd/CARDDEMO.CSD - the 8 DEFINE FILE entries of the
# *                online file control table at L1 ACCTDAT, L13 CARDAIX,
# *                L25 CARDDAT, L37 CCXREF, L50 CUSTDAT, L63 CXACAIX,
# *                L76 TRANSACT and L88 USRSEC; 18 DEFINE TRANSACTION of
# *                which CDV1 at L388-390 fronts PROGRAM(COCRDSEC), a
# *                program with no source anywhere in the repository,
# *                leaving 17 sourced operations; and DEFINE TDQUEUE(JOBS)
# *                TYPE(EXTRA) DDNAME(INREADER) TYPEFILE(OUTPUT)
# *                RECORDSIZE(80) RECORDFORMAT(FIXED) DISPOSITION(MOD) at
# *                L499-505;
# *                app/jcl/DEFGDGB.jcl - six generation data group bases
# *                at L25 TRANSACT.BKUP, L31 TRANSACT.DALY, L37 TRANREPT,
# *                L43 TCATBALF.BKUP, L49 SYSTRAN and L55
# *                TRANSACT.COMBINED, every one LIMIT(5);
# *                app/jcl/REPTFILE.jcl - L26-27 declares LIMIT(10) for
# *                the SAME TRANREPT base, the retention conflict this
# *                migration resolves to 10;
# *                app/jcl/OPENFIL.jcl and app/jcl/CLOSEFIL.jcl - EXEC
# *                PGM=SDSF issuing CEMT SET FIL(TRANSACT), (CCXREF),
# *                (ACCTDAT), (CXACAIX) and (USRSEC) OPE and CLO at
# *                L26-L30, the five datasets whose availability becomes
# *                the readiness probe group;
# *                app/cpy/CSUSR01Y.cpy - 05 SEC-USR-PWD PIC X(08) at L21,
# *                the plaintext password field now stored only as a
# *                BCrypt hash;
# *                app/cpy/CVCUS01Y.cpy - 05 CUST-SSN PIC 9(09) at L17,
# *                with CUST-GOVT-ISSUED-ID at L18 and
# *                CUST-DOB-YYYY-MM-DD at L19, the personally identifiable
# *                fields that must never reach a log line or a
