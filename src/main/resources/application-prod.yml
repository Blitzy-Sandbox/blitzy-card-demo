#     command line.
#   - LOW - /actuator/info and /actuator/prometheus remain anonymously
#     reachable, because observability/prometheus.yml scrapes without
#     credentials in this topology. This profile now narrows every surface a
#     profile CAN narrow: info is emptied by its two contributor deltas, and
#     the discovery index that enumerated the whole surface is switched off
#     outright after runtime validation caught it answering 200. What is left
#     is what a profile cannot reach. The Prometheus body still discloses the
#     JVM build string through the jvm_info meter and an absolute filesystem
#     path through the path label on disk_free_bytes and disk_total_bytes -
#     both standard Micrometer behaviour, neither a credential. Suppressing
#     the first would also remove every heap, garbage-collection, thread and
#     class-loader meter, a trade that is not justifiable against the
#     requirement for measurable behaviour, so it is accepted deliberately
#     rather than taken quietly.
#     Remediation belongs to the components that own access and meter
#     registration, not to this file: authenticate /actuator/prometheus in
