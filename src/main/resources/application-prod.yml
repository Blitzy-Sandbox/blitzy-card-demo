# AUTHORISATION SURFACE THIS PROFILE PROTECTS
#
# The least-privilege claim is only meaningful against a known surface, so the
# surface is stated. EXACTLY 17 OPERATIONS ARE EXPOSED. app/csd/CARDDEMO.CSD
# defines 18 transactions; the eighteenth, CDV1 at L388-390, is described as
# "DEVELOPER TRANSACTION - 1" and fronts PROGRAM(COCRDSEC), which has no
# source anywhere in the repository. It is a dangling legacy definition, no
# endpoint is invented for it, and no property here references it.
#
# /api/admin/* IS ADMINISTRATOR-ROLE-ONLY, enforced by SecurityConfig. The
# four transactions behind it are CU00, CU01, CU02 and CU03, fronting
# COUSR00C, COUSR01C, COUSR02C and COUSR03C - the user list, add, update and
# delete programs. The role comes from CDEMO-USER-TYPE PIC X(01) in
# app/cpy/COCOM01Y.cpy, whose only two values are 'A' administrator and 'U'
# standard user, carried as a token claim rather than in a COMMAREA.
#
# Eight of the ten VSAM clusters have an online DEFINE FILE in the CSD -
# ACCTDAT, CARDAIX, CARDDAT, CCXREF, CUSTDAT, CXACAIX, TRANSACT and USRSEC at
# L1, L13, L25, L37, L50, L63, L76 and L88. TCATBALF, DISCGRP, TRANCATG and
# TRANTYPE have NO online definition at all, which is the evidence that they
# are batch-only: no production endpoint reaches them, and none is added.
#
# S3 OBJECT LAYOUT AND RECORD GEOMETRY IN PRODUCTION
#
# The bucket names, the FIFO queue name, the topic name and the key prefixes
# are inherited from application.yml:898-958 and are not restated. What
# matters in a production profile is the invariant they carry, so it is
# recorded here.
#
# The SEVEN generation data group bases become deterministic key prefixes over
# a versioned bucket rather than catalogue generations: DALYREJS
# (app/jcl/DALYREJS.jcl:25), SYSTRAN (app/jcl/DEFGDGB.jcl:49), TCATBALF.BKUP
# (:43), TRANREPT (:37), TRANSACT.BKUP (:25), TRANSACT.COMBINED (:55) and
# TRANSACT.DALY (:31). A next-generation (+1) write becomes a new object under
# a monotonically increasing job-instance or timestamp prefix; a
# current-generation (0) read becomes the lexicographically greatest existing
# prefix. THE BATCH OUTPUT BUCKET IS VERSIONED, so object versioning - not a
# generation counter - is what makes a superseded write recoverable.
#
# RECORD LENGTH IS PRESERVED BYTE-EXACTLY AT THE S3 BOUNDARY: 350 for the
# transaction and daily-transaction images, 430 for a reject record, 133 for a
# report line, and 80 and 100 for the statement text and HTML outputs. The 430
# is not a round number - app/jcl/POSTTRAN.jcl:36 declares
# DCB=(RECFM=F,LRECL=430) and app/cbl/CBTRN02C.cbl:L176-L182 resolves it as
# exactly 350 data bytes plus an 80-byte trailer carrying a four-digit reason
# code and a 76-character description. 350 + 80 = 430. Parity is compared on
# the emitted bytes, so a wrong length is a wrong output even when every field
# value is right, and no production setting may alter it.
#
# THE RETENTION CONFLICT IS RESOLVED TO 10 AND IS DOCUMENTATION, NOT CODE.
# app/jcl/DEFGDGB.jcl:37-38 declares LIMIT(5) for AWS.M2.CARDDEMO.TRANREPT
# while app/jcl/REPTFILE.jcl:26-27 declares LIMIT(10) for the same base. A
# single S3 lifecycle value must be chosen, so 10 is used - the larger, so no
# generation the legacy system would have retained is discarded. The value is
# recorded at application.yml:934 as intent; it is NOT enforced by application
# code, and nothing in this profile prunes an object. Enforcement, if wanted,
# is an S3 lifecycle rule owned by the deployment.
#
# THE FIFO QUEUE REPLACES THE TRANSIENT DATA QUEUE. app/csd/CARDDEMO.CSD:
# L499-505 defines TDQUEUE(JOBS) TYPE(EXTRA) DDNAME(INREADER) TYPEFILE(OUTPUT)
# RECORDSIZE(80) RECORDFORMAT(FIXED) DISPOSITION(MOD) - an 80-byte fixed
# OUTPUT record written one card at a time into the JES2 internal reader. The
# SEVENTEEN eighty-byte job cards that app/cbl/CORPT00C.cbl holds as literal
# constants in JOB-DATA-1 at :82-125 collapse into ONE typed JSON message
# carrying the report name and the start and end dates, and an SQS listener
# replaces the internal reader. A single message group id preserves the strict
# sequential DISPOSITION(MOD) append ordering. queue-not-found-strategy is
# FAIL in the base, so a mistyped production queue name is a loud error rather
# than a silently created queue with the wrong FIFO attributes.
#
# DEFERRED HARDENING - DISCLOSED, NOT DROPPED
#
# Rule 1 Clause F requires missing information to be stated rather than
# implied away. The following are OUT OF SCOPE for this migration and are each
# recorded as residual risk in DECISION_LOG.md and docs/validation-gates.md.
# None is silently omitted, and none is claimed to be present:
#
#   - TLS TERMINATION. This profile configures no server.ssl.*, no keystore
#     and no truststore, and the repository ships no certificate. The target
#     topology terminates at the load balancer. A deployment that must
#     terminate in-process has to add server.ssl.* from injected material and
#     must still not commit a keystore.
#   - REQUEST RATE LIMITING. No limiter, no bucket, no quota. Nothing here
#     throttles a caller.
#   - URI-BASED API VERSIONING. The 17 operations are served at unversioned
#     paths; a breaking change would need a versioning scheme first.
#   - GENERATED OPENAPI DOCUMENTATION. No specification is generated and no
#     specification endpoint is exposed - which is also why widening the
#     Actuator exposure list would not help. docs/api-contracts.md is the
#     manual substitute.
#   - ENCRYPTION AT REST FOR PERSONALLY IDENTIFIABLE DATA. CUST-SSN
#     PIC 9(09) at app/cpy/CVCUS01Y.cpy:17, CUST-GOVT-ISSUED-ID at :18 and
#     CUST-DOB-YYYY-MM-DD at :19 are stored in plain columns. No
#     column-level encryption and no tokenisation is configured. Storage-level
#     encryption, if the platform provides it, is a deployment concern and is
#     not asserted here.
#   - CONNECTION-POOL TUNING, TABLE PARTITIONING AND READ REPLICAS. See the
#     inherited Hikari note above and NOT AVAILABLE below.
