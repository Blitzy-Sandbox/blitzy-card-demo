#       proved; anonymous authorisation of /actuator/health is NOT, nor is the
#       administrator-only rule on /api/admin/*. WHAT IS NEEDED: SecurityConfig
#       to exist in src/main/java, then a boot with the chain active.
#       The three AWS clients were disabled by property because that session
#       had no emulator running, and because a provider-chain credential
#       resolution against real AWS is exactly what this environment must never
#       attempt - which is now refused outright by com.cardemo.config.AwsConfig
#       rather than avoided by leaving configuration out. CONSEQUENCE: the
#       bucket, queue and topic references were proved to RESOLVE from the
#       environment, and no AWS call was made. WHAT IS NEEDED: a boot with the
#       emulator up, which additionally exercises the endpoint allowlist and
#       the static-credentials assertion that did not exist when this evidence
#       was recorded. NOT a deployment holding a real instance or task role: an
#       instance role IS a live credential, and this project is not permitted
#       to hold one.
#     A FOURTH BOUND WAS A SUBSTITUTION, AND IS NO LONGER NEEDED:
#     at the time of that measurement CardDemoApplication did not exist in
#     src/main/java, so the entry point that boots this profile in production
#     could not itself be started, and a throwaway harness stood in for it -
#     which is why the evidence below reads as proved against the real Spring
#     context on the real pinned classpath but not against the real
#     application class. com.cardemo.CardDemoApplication IS PRESENT NOW, and
#     pom.xml names it as the JAR Start-Class, so the substitution is
#     withdrawn and a re-measurement needs no harness.
#
# VALIDATION EVIDENCE
#
# Every line below is a measurement taken on this file as delivered, with the
# exit code the command actually returned. Nothing here is inferred, and the
# things that were NOT measured are named under NOT AVAILABLE above rather
# than left to look like passes.
#
# WHEN AND ON WHAT
#     2026-08-02 UTC. OpenJDK 25.0.3 (build 25.0.3+9-2-25.10.2-Ubuntu),
#     Apache Maven 3.9.11 through ./mvnw, PostgreSQL 16.10, Docker 29.7.0 and
#     Compose v5.3.1 - all present and running, none of them assumed absent.
#     Compilation ran at release 25 with -Xlint:all -Werror, pinned at
#     pom.xml:276 and pom.xml:863-864.
#
# BUILD - the whole module, not this file alone
#     ./mvnw -B -ntp clean compile                                    exit 0
#         77 sources, 7 resources, ZERO warnings under the -Werror gate. This
#         file lands at target/classes/application-prod.yml and, once
#         packaged, at BOOT-INF/classes/application-prod.yml inside
#         target/carddemo-1.0.0.jar.
#     ./mvnw -B -ntp test                                             exit 0
#         0 failures, 0 errors, 0 skipped, and a count identical to the
#         pre-change baseline - which is the regression proof a resource-only
#         change needs, and is the part that does not go stale. The absolute
#         count measured at the time was 6590, recorded as a historical
#         measurement rather than a current figure; the dated module-wide count
#         lives once, in section 0.4.5.1 of docs/technical-specifications.md.
#     ./mvnw -B -ntp -Ddependency-check.skip=true
#            -Djacoco.line.coverage.minimum=0.0 clean verify          exit 0
#         Line coverage 3453/5746 = 60.09%, unchanged, because a YAML resource
#         contributes no coverable line. THE 0.80 FLOOR IN pom.xml WAS NOT
#         LOWERED - it was overridden for this run only, and the shortfall is
#         owed by the test tier, not by this file. Report at
#         target/site/jacoco/index.html. Failsafe reported "No tests to run",
#         so NO integration evidence is claimed here.
#
# STATIC ASSERTIONS ON THIS FILE                                  all pass
#     UTF-8, LF only, final newline, no tab, no trailing space, every line
#     inside 80 columns, indentation a multiple of two, and the whole file
#     parses as a YAML mapping with the banner and docstring entirely in #
#     comments.
#     ZERO matches anywhere in the file, comments included, for 27 forbidden
#     tokens. THEY ARE DESCRIBED HERE RATHER THAN SPELLED OUT, because a file
#     that writes a forbidden token in order to claim the token is absent
#     makes its own claim false - and a whole-file assertion is worth far more
#     than one carrying an exemption for the paragraph that lists them. The
#     assertion covers: the service emulator's product name; a loopback host
#     name, a loopback IPv4 literal and the unspecified-address literal; the
#     emulator port and the database port; a TLS URL scheme; the container-host
#     alias; the public AWS domain suffix; a PostgreSQL JDBC URL prefix; both
#     AWS access-key-id prefixes; a BCrypt hash prefix; a PEM private-key
#     header; a JWT-shaped literal; either binary floating-point type name;
#     four deferred-work markers; the misspelled daily-transaction fixture
#     name, whose real spelling is dailytran.txt; the user-security fixture
#     name that does not exist, the ten seed rows living inline in
#     app/jcl/DUSRSECJ.jcl instead; the misspelled package root, the real one
#     being com.cardemo; the rejected wrapper-directory name; the permissive
#     health-detail value; and both schema-mutating ddl-auto values. The ONLY
#     absolute URL in the file is the Apache License URL on line 56, which the
#     header convention requires and which nothing contacts.
#     THE PROHIBITION ASSERTIONS SEPARATE PROSE FROM DECLARATION, which is the
#     only way they can be both true and meaningful: this file has to NAME the
#     static-credential properties, the session namespace, the TLS and
#     key-material properties and the two Flyway leniency switches in order to
#     state that each is deliberately absent. Each was asserted absent from
#     the 42 non-comment YAML lines and present only in prose.
#     NO ${...} REFERENCE IS DECLARED HERE AT ALL. The five that appear are
#     comment text documenting the inherited contract, and none carries a
#     literal default. No credential-shaped key and no nine-digit literal is
#     declared, and every declared value is a bounded literal of at most 24
#     characters.
#
# PROPERTY BINDING - resolved against the pinned classpath, offline
#     226 jars resolved by dependency:build-classpath. All 20 declared keys
#     were confirmed to be REAL, CONSUMED properties in the
#     spring-configuration-metadata.json that classpath ships - 2638
#     properties harvested - so no key here is dead configuration. The four
#     logging.level entries bind through the Map<String,String> parent
#     declared by spring-boot-3.5.11.jar.
#     Loading application.yml and then this file through Boot's own
#     YamlPropertySourceLoader, prod at the higher precedence, and binding
#     with Binder: banner-mode -> Banner.Mode.OFF, show-details and
#     show-components -> Show.NEVER, initialize-schema ->
#     DatabaseInitializationMode.NEVER, sampling.probability -> 0.1f, and
#     exposure.include -> exactly [health, info, prometheus]. All 7 deltas
#     resolve to the production value; all 13 pins to their safe value.
#     Keys that must not appear IN THIS FILE were each asserted absent: the
#     three datasource literals, ignore-migration-patterns, continue-on-error,
#     logging.config, server.ssl.key-store, both JWT decoder properties, the
#     signing key itself, and spring.profiles.active. The AWS endpoint and
#     static credential keys moved OFF that list when they became mandatory:
#     they are declared once in application.yml, environment-indirected with no
#     default, and inherited here - so what is asserted of them now is that
#     this file declares no literal for any of them and weakens none of them.
#     THE QUOTING OF "off" IS NOT STYLISTIC AND WAS MEASURED. The same loader
#     reads an UNQUOTED off as Boolean false, which can never reach an enum,
#     while the quoted form reads as the String that Banner.Mode resolves.
#
# DELTA AUDIT - executed, not asserted from reading
#     The base value was read for all 20 keys and compared one at a time. The
#     7 deltas differ from the base - log to off, unset to false three times,
#     1.0 to 0.1, INFO to WARN twice - and the 13 pins are identical. That is
#     what makes the taxonomy above mechanically decidable instead of a matter
#     of opinion.
#
# RUNTIME EVIDENCE - this profile was booted, not just parsed
#     com.cardemo.CardDemoApplication NOW EXISTS, so the earlier note that it
#     did not - and the throwaway @SpringBootConfiguration harness that stood
#     in for it - are both withdrawn. The measurements below were taken with
#     Flyway EXCLUDED so a validation run could not migrate the shared,
#     intentionally empty database, and with Spring Security EXCLUDED so that
#     an HTTP 404 measures the EXPOSURE contract rather than authentication.
#     The AWS clients were disabled for the session recorded above, and they no
#     longer need to be: every endpoint now resolves to the allow-listed local
#     emulator and AwsConfig aborts startup on anything else, so a prod-profile
#     boot cannot reach a real account by construction rather than by
#     exclusion. Those exclusions are the limit of this evidence and are stated
#     so no one reads more into it.
#     BOOT WITH SPRING_PROFILES_ACTIVE=prod SUCCEEDED. Resolved at runtime:
#     active profile prod, banner-mode off, ddl-auto validate, show-sql false,
#     flyway clean-disabled true, batch initialize-schema never, sampling 0.1,
#     exposure health,info,prometheus. Effective logger levels were read from
#     the running logging system rather than from this file: the two Hibernate
#     loggers WARN, web WARN, security WARN, com.cardemo INFO. No banner was
#     printed, which is the banner-mode delta observable in the log.
#     All eleven no-default environment references resolved, and NONE of the
#     three secrets among them appears anywhere in the startup log - the
#     resolved signing key was searched for as a literal and was absent.
#
# FAIL-FAST - ELEVEN OUT OF ELEVEN, one boot per missing variable
#     The profile claims that an absent secret is a startup failure by design
#     rather than a misconfiguration. That claim was tested by booting eleven
#     more times, each time removing exactly one required variable:
#     JWT_SIGNING_KEY, POSTGRES_HOST, POSTGRES_DB, POSTGRES_USER,
#     POSTGRES_PASSWORD, OTEL_EXPORTER_OTLP_ENDPOINT and the five
#     CARDDEMO_S3, CARDDEMO_SQS and CARDDEMO_SNS resource names.
#     EVERY ONE failed the context with a non-zero exit, never reached
#     Started, and reported a message that NAMES THE VARIABLE AND ECHOES NO
#     VALUE - the exact form being: could not resolve placeholder, then the
#     variable name, then the unresolved expression itself and nothing more.
#     A twelfth control boot with every variable present SUCCEEDED, which is
#     what makes the eleven failures evidence rather than a broken harness.
#     ONE PRECONDITION HAD TO BE HONOURED FOR THAT TEST TO MEAN ANYTHING, and
#     it is worth recording because it is easy to get wrong: the .env.example
#     of the day shipped SPRING_DATASOURCE_URL and
#     MANAGEMENT_OTLP_TRACING_ENDPOINT, which bind those two properties
#     DIRECTLY and therefore outrank the composed values in application.yml.
#     While either is set the inner placeholder is never evaluated, so removing
#     POSTGRES_HOST or OTEL_EXPORTER_OTLP_ENDPOINT alone changes nothing. The
#     masking variable was removed alongside each of those, so what was
#     measured is the contract this file inherits rather than an accident of
#     the template. The template no longer ships either composed name, so the
#     precondition is now structural rather than something a tester must
#     remember.
#
# LOG HYGIENE - measured with a sentinel, because the obvious test is useless
#     A first attempt searched the logs for the development database password
#     and reported a leak in all eleven runs. It was a FALSE POSITIVE, and an
#     instructive one: that password is literally the word carddemo, which is
#     also the application name and therefore appears in the MDC prefix of
#     every single log line. The test was redone with a distinctive sentinel
#     password. Result: the sentinel NEVER appears in any log, INCLUDING the
#     run where the database connection genuinely failed with it. Across the
#     same logs there were zero occurrences of an Authorization header, of a
#     bearer token, of a Hibernate bound parameter, of a SELECT statement and
#     of a BCrypt hash prefix. Masking itself belongs to logback-spring.xml;
#     what is demonstrated here is that this profile's levels give it nothing
#     to mask.
#
# ACTUATOR SURFACE - measured over HTTP, then independently in a browser
#     Exposed, 200: health, health/liveness, health/readiness, info,
#     prometheus.
#     NOT exposed, 404: env, configprops, beans, heapdump, threaddump,
#     loggers, mappings and shutdown - and equally metrics, caches,
#     conditions, scheduledtasks, quartz, sbom and startup, none of which the
#     include list names.
#     health answered an aggregate status plus the two group NAMES, with no
#     components object, no details object, no substrate named and NOT ONE
#     DIGIT CHARACTER in the whole body - so no port, host, JDBC URL, user
#     name or password can be present in it.
#     liveness and readiness each answered 200 with their own status. They are
#     separately registered rather than aliased: health/db and a nonexistent
#     group name both answered 404, which no catch-all could do. Because
#     show-details and show-components are never, two healthy groups
#     necessarily render identical text; that is the hardening working, not
#     aliasing.
#     THE READINESS GROUP IS PROVED SUBSTRATE-BACKED, TWICE OVER. Statically,
#     management.endpoint.health.validate-group-membership is true, so naming a
#     contributor that does not exist FAILS the context; the context started,
#     so the db contributor named in
#     management.endpoint.health.group.readiness.include exists. Empirically, a
#     boot carrying a deliberately WRONG database credential then answered
#     readiness DOWN with HTTP 503 while liveness stayed UP with HTTP 200 and
#     the aggregate went DOWN. That is the OPENFIL.jcl and CLOSEFIL.jcl
#     analogue behaving as designed, and it simultaneously proves the property
#     the base profile argues for under management.endpoint.health.probes: a database
#     outage takes the instance out of rotation WITHOUT triggering a liveness
#     restart loop.
#     THE FAILURE PATH IS WHERE A HEALTH ENDPOINT NORMALLY LEAKS, AND IT DID
#     NOT. With the connection genuinely failing, the readiness body was the
#     bare status and nothing else: zero occurrences of the credential, of a
#     JDBC URL, of the driver name, of the word password, of the database
#     port, of the word Connection and of the word FATAL. That is
#     show-details: never earning its place, measured on the one code path
#     that matters.
#     info answered exactly two bytes, an empty object, which is the
#     observable proof of the two info contributor deltas.
#     prometheus answered valid exposition format, 261 lines, with ZERO
#     case-insensitive matches for password, secret, token, jwt, authorization
#     or bearer, no JDBC URL, and no host name or port among its 23 distinct
#     label keys. Its only database-related entries are the two pool-size
#     gauges, whose sole identifier is a logical bean name.
#     shutdown is not merely method-blocked but UNREGISTERED: an exposed
#     POST-only endpoint answers a GET with 405, and 404 came back to both GET
#     and POST while the process stayed up and healthy.
#     A browser session over the same 16 URLs reproduced every status code,
#     and its only console errors were the automatic 404 notices that ARE the
#     negative assertions passing. Server side, logback_events_total reported
#     zero error-level and zero warn-level events for the entire run.
#
# WHAT RUNTIME VALIDATION CHANGED
#     One key on this page exists because the browser audit found it, not
#     because anyone read the file: /actuator itself was answering 200 with a
#     HAL document that enumerated the exposed endpoints, because the
#     discovery index is not gated by the exposure list. The discovery key
#     under management.endpoints.web closes it, and the fix was then MEASURED
#     rather than assumed: after it, /actuator answers 404 while all five
#     exposed endpoints still answer 200 and all eight forbidden ones still
#     answer 404. Setting an exposure list did NOT by itself make the surface
#     non-enumerable, and no amount of reading would have revealed that -
#     which is the whole argument for booting a configuration profile rather
#     than proof-reading it.
#     A second lesson from the same session, recorded because it nearly became
#     a false finding: an intermediate boot failed instantiating the OTLP span
#     exporter, which looked like a missing runtime dependency. It was not.
#     The harness had been launched with a truncated classpath; against the
#     full resolved graph the exporter initialises cleanly, because
#     opentelemetry-exporter-common, opentelemetry-exporter-sender-okhttp and
#     okhttp are all present. NO DEFECT WAS REPORTED, because there was none -
#     the tooling was wrong, not the build.
#
# SCOPE
#     src/main/resources holds 7 of its 11 mandated files and ZERO extra
#     files. application-local.yml, application-test.yml, logback-spring.xml
#     and V3__seed_data.sql are pending elsewhere in this same single phase.
#     No keystore, certificate, README or copied fixture was added.

spring:

  # --------------------------------------------------------------------------
  # Startup output - 1 DELTA
  # --------------------------------------------------------------------------
  main:
    # DELTA. The base sets spring.main.banner-mode to `log`, which routes the
    # multi-line ASCII banner through the logging system. In production
    # logback-spring.xml emits structured JSON, so a banner would enter the log
    # pipeline as several records of ASCII art carrying no field an operator
    # can query, and it would put the framework version into the stream on
    # every start. `off` removes both. QUOTED DELIBERATELY: YAML 1.1 resolves a
    # bare off to the boolean false, and the target of this property is an
    # enum, so the unquoted form would not bind. Rule 1 Clause A, explicit
    # behaviour over cleverness.
    banner-mode: "off"

  # --------------------------------------------------------------------------
  # JPA and Hibernate - 2 PINS
  # --------------------------------------------------------------------------
  jpa:
    hibernate:
      # PIN. Flyway owns the schema and Hibernate only checks it. THE HARM
      # THIS PREVENTS IS IRREVERSIBLE: create and create-drop would drop and
      # rebuild production tables, and update would silently alter a column
      # away from the record layouts in app/cpy - for instance widening the
      # NUMERIC(11,2) that app/cpy/CVTRA01Y.cpy pins as PIC S9(09)V99 - which
      # breaks field-contract parity without any error. There is no safe way
      # to discover that by accident, so production states its own answer
      # rather than trusting a value in another file.
      ddl-auto: validate
    # PIN. A logged statement or bound parameter would put CUST-SSN
    # PIC 9(09) from app/cpy/CVCUS01Y.cpy:17 and the BCrypt hashes derived
    # from SEC-USR-PWD PIC X(08) in app/cpy/CSUSR01Y.cpy:21 into the log
    # stream, which Rule 1 Clause D forbids outright. This is also the one
    # pin that beats a sibling: the profile-layering note in application.yml
    # records that the local profile carries verbose logging, so under a
    # `local,prod` activation this line is what keeps SQL out of production
    # output.
    show-sql: false

  # --------------------------------------------------------------------------
  # Flyway - 4 PINS, all four protecting a live production schema
  # --------------------------------------------------------------------------
  # These four are pinned together because they are the difference between a
  # migration failure and data loss. There is deliberately NO
  # ignore-migration-patterns, NO continue-on-error and NO baseline-version
  # anywhere in this profile: Rule 1 Clause B forbids swallowing a failure,
  # and a migration that fails must stop the process rather than leave a
  # production schema half applied.
  flyway:
    # PIN. Baselining would make Flyway ACCEPT an unknown pre-existing schema
    # and record it as version 1 without checking a single object, so a
    # database shaped by something other than V1__create_schema.sql would pass
    # silently and every later migration would apply to the wrong shape.
    baseline-on-migrate: false
    # PIN. Validation is what turns an edited-after-apply migration into a
    # startup failure instead of a divergence nobody notices.
    validate-on-migrate: true
    # PIN. clean() DROPS EVERY OBJECT IN THE SCHEMA. In production that is
    # unrecoverable, and the property is the only guard. Must stay true here
    # and in every other profile.
    clean-disabled: true
    # PIN. V1 then V2 then V3, always. Out-of-order application would let
    # V3__seed_data.sql insert rows before V2__create_indexes.sql created the
    # three alternate indexes those rows are read through.
    out-of-order: false
    placeholders:
      # PIN, and RESTATED ON PURPOSE even though the base profile already sets
      # it false. This is the one property in this file whose absence would be
      # indistinguishable from an oversight, so the intent is written where a
      # reviewer of the production profile looks for it rather than left to
      # inheritance from a file they may not open.
      #
      # False closes the demonstration-user gate in V3__seed_data.sql. Those ten
      # CSUSR01Y rows derive from one plaintext that is recorded in a frozen file
      # in this repository, and their identifiers are recorded there too, so
      # installing them here would hand administrative authority to anyone able
      # to read the repository. The digests are correct BCrypt cost-10 digests;
      # that is not the point, because the input is published.
      #
      # A closed gate leaves user_security EMPTY, and no substitute principal is
      # seeded in its place. That is deliberate: the alternative to a known
      # credential is no credential. The first administrator is provisioned out
      # of band with a credential that exists nowhere in version control, and
      # the schema offers no locked, expired or must-reset state to park a
      # placeholder principal in - see the residual-risk register, which records
      # forced first-use reset as deferred hardening rather than pretending the
      # schema supports it.
      seeddemousers: false

  # --------------------------------------------------------------------------
  # Spring Batch - 2 PINS
  # --------------------------------------------------------------------------
  batch:
    job:
      # PIN. The framework default is true, which runs EVERY registered job on
      # EVERY boot. In production that would post the daily transaction file
      # and generate interest on each restart - real financial writes, from a
      # deployment event. Launching stays explicit: BatchPipelineOrchestrator,
      # or the SQS listener that replaces the JES2 internal reader driven by
      # EXEC CICS WRITEQ TD QUEUE('JOBS') in app/cbl/CORPT00C.cbl.
      enabled: false
    jdbc:
      # PIN, and the one value the layering contract in application.yml names
      # for this profile explicitly. The BATCH_* metadata tables come
      # from the framework's own
      # org/springframework/batch/core/schema-postgresql.sql and from nowhere
      # else, and in production a DBA applies that script once as a reviewed
      # change. `always` - which that same note records as the local and test
      # value - runs DDL from the application on every start; it
      # completes only because the framework initialiser continues on error,
      # which means a partial failure would be swallowed, and Rule 1 Clause B
      # forbids that. This line is therefore also the pin that beats a
      # `local,prod` or `test,prod` activation.
      #
      # THE BATCH_* TABLES MUST NEVER BECOME A FOURTH FLYWAY MIGRATION nor an
      # extra table in V1__create_schema.sql: a validation gate asserts V1
      # creates exactly 11 tables.
      initialize-schema: never

  # --------------------------------------------------------------------------
  # Cloud endpoints - 3 PINS, and a CORRECTION to this profile's own posture
  # --------------------------------------------------------------------------
  # CORRECTION. An earlier revision of this profile declared no endpoint
  # override of any kind and described that absence as an enforced invariant,
  # on the reasoning that production should resolve each service through the
  # SDK's standard endpoint resolution for the configured region and should
  # authenticate through an instance or task role. That reasoning is sound
  # for an ordinary production deployment and WRONG FOR THIS PROJECT, because
  # it contradicts a binding scope decision:
  #
  #   - Agent Action Plan 0.3.2 places live AWS accounts and real credentials
  #     OUT OF SCOPE, in these words: all AWS interaction is against
  #     LocalStack, zero live credentials appear in any file, and NO CODE PATH
  #     MAY REACH A REAL AWS ENDPOINT.
  #   - Agent Action Plan 0.8.4 restates it: all cloud interaction targets the
  #     local emulator, no code path may reach a live endpoint.
  #   - pom.xml:578-579 makes the same claim about this project - every client
  #     targets a LocalStack endpoint override, and there is no live AWS
  #     credential path anywhere in it.
  #
  # An absent override is therefore NOT a neutral setting here. It is the one
  # setting that silently produces live routing, because standard resolution
  # fills the gap with the real regional endpoint. The absence that the earlier
  # revision documented as a safeguard was in fact the violation.
  #
  # This profile now FAILS CLOSED instead. The three overrides below are
  # mandatory and carry NO DEFAULT, so an unset variable aborts startup rather
  # than falling back to anything; and AwsConfig.requireEmulatorEndpoints
  # additionally allowlists whatever they resolve to, so a variable set to a
  # real service host is rejected at context startup too. Configuration alone
  # could not keep the invariant - a property can always be set to the wrong
  # value - which is why the allowlist lives in code and this file only has to
  # ensure the property is present.
  #
  # TO ENABLE REAL AWS ROUTING, AMEND THE AGENT ACTION PLAN FIRST. The
  # obstruction is deliberate. Once the plan permits it, the change is this
  # block plus the allowlist in AwsConfig, and both are named here so neither
  # can be missed.
  #
  # STILL ABSENT, AND STILL DELIBERATELY: there is no
  # spring.cloud.aws.credentials.access-key and no .secret-key in this file.
  # Least privilege under Rule 1 Clause D is unchanged by the correction
  # above - the emulator needs no key material, so none is committed here, and
  # the static non-live credentials inherited from the base profile displace the
  # SDK default provider chain rather than deferring to it.
  cloud:
    aws:
      s3:
        # PIN. No default. AWS_ENDPOINT_URL is a documented contract entry in
        # .env.example, and an absent value must abort the process rather than
        # reach live object storage holding the reject, report and statement
        # outputs whose byte-exact geometry is the parity contract.
        endpoint: ${AWS_ENDPOINT_URL}
      sqs:
        # PIN. No default. This queue is the DEFINE TDQUEUE(JOBS) replacement
        # of app/csd/CARDDEMO.CSD, so a live endpoint here would publish real
        # report-submission messages.
        endpoint: ${AWS_ENDPOINT_URL}
      sns:
        # PIN. No default, for the same reason: operator notification must not
        # leave the emulator.
        endpoint: ${AWS_ENDPOINT_URL}

# ============================================================================
# Management surface - 3 PINS and 3 DELTAS
# ============================================================================
# THE MANAGEMENT PORT AND BASE PATH ARE DELIBERATELY NOT MOVED, and the
# instruction to consider a separate port was evaluated rather than skipped. A
# separate management port would narrow the public surface, but two root-owned
# artefacts address the MAIN application port: the Dockerfile HEALTHCHECK
# opens a loopback TCP socket on it and issues
# GET /actuator/health/readiness, and the carddemo-app scrape job in
# observability/prometheus.yml declares its targets on it at
# metrics_path /actuator/prometheus. Splitting the port
# from this file alone would break the container probe - every instance would
# be killed by its own health check - and blind the scrape, while the file
# that must change to keep them working is root-owned and outside this
# artefact's scope. Introducing a MANAGEMENT_SERVER_PORT variable would also
# invent a contract entry that .env.example does not ship. The exposure list
# below is already three endpoints, so the residual gain is small and the
# breakage is certain. RECORDED AS THE REASON FOR THE ABSENCE so a reviewer
# does not read it as an oversight; the remaining exposure risk and where it
# has to be closed are recorded under WHY CERTAIN SPELLINGS AND CERTAIN
# ABSENCES ARE WHAT THEY ARE above.
management:
  endpoints:
    web:
      discovery:
        # DELTA against an unsafe default. THE DISCOVERY INDEX AT /actuator IS
        # NOT GATED BY THE EXPOSURE LIST BELOW: with that list holding three
        # endpoints, /actuator still answers 200 with a HAL document naming
        # health, health-path, info and prometheus, so setting an exposure
        # list does not by itself make the surface non-enumerable. Enumerating
        # a management surface is reconnaissance, and the framework default
        # for this key is true, as the pinned classpath's own
        # spring-configuration-metadata.json records. Nothing legitimate
        # depends on the index: an operator and a scrape each address their
        # endpoint directly, and observability/prometheus.yml names the path
        # it scrapes. Rule 1 Clause D, least privilege.
        enabled: false
      exposure:
        # PIN. EXACTLY THREE ENDPOINTS, AND NEVER "*". env and configprops
        # echo RESOLVED property values, which in this application means the
        # JWT signing key and the database password; heapdump serves the
        # process image, from which both are recoverable; beans, mappings and
        # loggers disclose internal structure; shutdown stops the process.
        # A production profile that does not state its own exposure list
        # cannot be audited, and this is the single line an auditor reads to
        # answer "what can an anonymous caller reach?". Rule 1 Clause D.
        include: health,info,prometheus
  endpoint:
    health:
      # PIN. Aggregate status only. Component detail names the substrate and
      # carries its failure text, which for a datasource can include the JDBC
      # URL and the user name. never is also the framework default; it is
      # stated so that the production answer does not depend on knowing that.
      show-details: never
      # PIN. Same reasoning one level up: the component list alone reveals
      # which backing services exist.
      show-components: never
  info:
    # /actuator/info is anonymously reachable because it is in the exposure
    # list above. Both contributors below default to ENABLED, as the pinned
    # classpath's own spring-configuration-metadata.json records for
    # management.info.build.enabled and management.info.git.enabled, against
    # env, java, os, process and ssl which all default false and are therefore
    # left alone.
    # Today the response body is empty only by accident: pom.xml configures
    # the spring-boot-maven-plugin with the repackage goal alone and no
    # build-info goal, and no commit-id plugin is present, so neither
    # META-INF/build-info.properties nor git.properties is produced and both
    # contributors have nothing to read. Adding either goal - a routine build
    # change - would SILENTLY begin publishing the artefact version, the build
    # timestamp and the commit SHA to unauthenticated callers.
    build:
      # DELTA against an unsafe default. Makes the empty body a property of
      # this profile rather than a side effect of the build.
      enabled: false
    git:
      # DELTA against an unsafe default, same reasoning.
      enabled: false
  tracing:
    sampling:
      # DELTA. The base sets management.tracing.sampling.probability to 1.0 so
      # that every request and every batch step is traceable during a parity
      # investigation, and says in as many words to lower it in production if
      # volume demands. It does.
      # At 1.0 the span rate equals the transaction rate, and the cost lands
      # on the collector and the network rather than on the application, so
      # the trade is export volume against per-request certainty. 0.1 keeps a
      # statistically useful sample of a production workload while bounding
      # that cost, and it coincides with the framework's own metadata default,
      # so no reader has to know an implicit value to predict behaviour.
      # A specific investigation raises MANAGEMENT_TRACING_SAMPLING_PROBABILITY
      # for its duration instead of editing this file.
      probability: 0.1

# ============================================================================
# Logging - 2 DELTAS and 2 PINS
# ============================================================================
# logging.config is deliberately NOT set here: logback-spring.xml is
# auto-detected from the classpath and owns JSON encoding, the traceId, spanId
# and correlationId MDC fields, and the masking backstop. No appender, encoder
# or pattern is restated (Rule 1 Clause C).
#
# That masking is a BACKSTOP and not the control. An earlier revision of this
# header listed it as the masking "of credentials, presented passwords, BCrypt
# hashes, social security numbers, tokens and Authorization headers", which
# reads as complete exclusion; the claim is withdrawn. Non-emission is the
# primary control - sensitive values are withheld at the point of rendering and
# never handed to a logger - because 6 of the decorator's 13 <valueMask> rules
# are label anchored and cannot fire on a bare value. The reasons are recorded
# in logback-spring.xml itself: a bare 16-digit run is indistinguishable from a
# TRAN-ID, a bare 9-digit run from the PIC 9(09) batch counters, and a bare
# 3-4 digit run from any small number. Raising a logger's level, as the two
# deltas below do, reduces what is emitted and is therefore a control in the
# same sense; the masking rules are what catch the residue.
#
# Only four levels are declared. root stays at the inherited INFO on purpose:
# lowering it would suppress the framework's own started-successfully and
# listening-on-port lines, which are the first thing an operator looks for
# after a deployment, and no security requirement is served by hiding them.
logging:
  level:
    # DELTA. The base sets this logger to INFO. In production the
    # request-mapping and content-negotiation detail this package emits below
    # WARN is noise at best, and the web loggers are the ones that can echo
    # request data.
    org.springframework.web: WARN
    # DELTA. The base sets this logger to INFO. Filter-chain construction and
    # per-request authorisation detail are not needed in production, and no
    # audit trail is lost by raising this: the authentication signal is the
    # carddemo.auth.attempts counter, declared as
    # MetricsConfig.METRIC_AUTHENTICATION_ATTEMPTS and by no property - the
    # carddemo.metrics.* mirror that once named it was deleted because nothing
    # bound it - and the application's own events stay at INFO under
    # com.cardemo.
    org.springframework.security: WARN
    # PIN of the base value, and a protective FLOOR rather than a repeat. A
    # child level overrides its parent, so if any profile or a runtime logger
    # change raises the org.hibernate parent to DEBUG, this line still
    # suppresses statement text: org.hibernate.SQL prints every statement at
    # DEBUG.
    org.hibernate.SQL: WARN
    # PIN of the base value, the same floor for bound parameter VALUES,
    # which org.hibernate.orm.jdbc.bind prints at TRACE. Those values are the
    # row contents: CUST-SSN
    # PIC 9(09) from app/cpy/CVCUS01Y.cpy:17 and the BCrypt hash of
    # SEC-USR-PWD PIC X(08) from app/cpy/CSUSR01Y.cpy:21.
    org.hibernate.orm.jdbc.bind: WARN
