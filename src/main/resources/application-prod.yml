#     CARDDEMO_S3_BATCH_OUTPUT_BUCKET at :81, and application.yml:898-899
#     reads exactly those. The statements bucket, the report queue and the
#     notification topic match the specification exactly.
#     Resolution: inherit the provisioned spelling. A profile that read a
#     variable name nothing provisions would fail startup for a reason no
#     operator could diagnose from the message. Remediation: none required.
#   - MEDIUM - object-storage and queue readiness coverage. The specification
#     requires readiness to cover database, object storage and queue; the
#     inherited group covers readinessState and db only.
