#     cannot refresh.
#     RESOLUTION HERE: NONE, DELIBERATELY. Declaring a carddemo.s3.* block in
#     this profile would make production start by creating a SECOND spelling
#     for one bucket - the duplication Rule 1 Clause C forbids - and would
#     leave the defect latent in three other profiles. A profile must not
#     paper over a source-code defect.
