#     with no generated default.
#     Resolution: inherit JWT_SECRET unchanged and declare no second name.
#     The instruction's normative requirements are environment indirection, no
#     committed value, no fallback and fail-fast startup; all four already
#     hold, and a second spelling would satisfy none of them any better while
#     creating exactly the duplication Rule 1 Clause C forbids.
#     Remediation if the repository later standardises on JWT_SIGNING_KEY:
#     rename in every place in one change, never partially.
