# =============================================================================
# docker-compose.override.yml  —  LOCAL DEVELOPMENT OVERRIDES (auto-merged)
# =============================================================================
# Docker Compose AUTOMATICALLY merges this file ON TOP OF docker-compose.yml
# whenever you run `docker compose up` locally (both the base file and this
# override are loaded by default). CI, by contrast, uses ONLY the base file
# (`docker compose -f docker-compose.yml ...`), so NOTHING here affects CI.
#
# This layer is ADDITIVE, LOCAL-ONLY developer ergonomics:
#   * verbose application logging (com.carddemo at DEBUG) so the correlation-ID
#     from each service's MDC filter shows while tracing UI -> BFF -> card-svc,
#   * detailed Actuator health output (show-details: always) for debugging,
#   * card-svc SQL echo so the tracer's REAL Oracle read is printed & formatted,
#   * faster Oracle health feedback, and explicit host access to the DB and UI.
#
# It intentionally does NOT change any orchestration semantics — the base file
# remains the CI-authoritative deployment unit and stays fully functional alone:
#   * the oracle -> flyway -> request-serving services -> bff -> ui startup
#     gating (depends_on conditions) is UNTOUCHED,
#   * reporting-svc stays HEALTH-EXEMPT (no healthcheck, no port, not gated),
#   * the ONE live tracer chain  ui -> bff -> card-svc -> Oracle FREEPDB1  is
#     unaffected,
#   * in-service Flyway stays DISABLED (SPRING_FLYWAY_ENABLED=false); the
#     dedicated one-shot `flyway` step remains the sole owner of migrations.
#
# Conventions matched to the base file: the obsolete top-level `version:` key is
# intentionally OMITTED; the SAME service names are used (no new services or
# required infrastructure); and every interpolated variable referenced here
# (ORACLE_PORT, UI_PORT) is defined in /.env.example. The 8 Spring Boot bounded
# contexts and the Oracle data layer derive from the legacy CICS registrations
# in app/csd/CARDDEMO.CSD  [SRC: CARDDEMO.CSD].
# =============================================================================

services:

  # ===========================================================================
  # DATA LAYER — oracle: faster local health feedback + explicit host DB access
  # ===========================================================================
  oracle:
    # Re-state the listener publish so local DB tools (SQL*Plus, SQLcl, DBeaver,
    # IntelliJ Database, ...) can reach FREEPDB1 at localhost:${ORACLE_PORT}.
    # This is already published by the base file; restating it here makes host
    # access explicit for local dev (identical mapping -> no new binding).
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    # Poll more frequently and shorten the start grace so a locally-cached image
    # is reported healthy sooner, giving faster `docker compose up` feedback.
    # retries stays HIGH so a cold first boot (datafile creation can take
    # ~1-2 minutes) still has a generous window (30s grace + 40 x 5s = 230s) and
    # never fails prematurely. A health probe that SUCCEEDS during start_period
    # marks the container healthy immediately, so this only speeds up the happy
    # path without weakening the cold-boot safety margin.
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 30s

  # ===========================================================================
  # REQUEST-SERVING SPRING BOOT SERVICES — dev logging + detailed health
  # ---------------------------------------------------------------------------
  # Docker Compose MERGES `environment` maps, so the base file's shared
  # datasource-env (SPRING_DATASOURCE_URL/USERNAME/PASSWORD, CORRELATION_HEADER,
  # SERVER_PORT, TZ) is PRESERVED; the keys below are added / overridden on top.
  #   * SPRING_PROFILES_ACTIVE: local  -> activates each service's `local`
  #     profile document where present (e.g. account-svc -> health show-details:
  #     always); datasource/JPA config is profile-independent + env-injected, so
  #     the DB connection is unaffected by the profile switch.
  #   * MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always -> full Actuator health
  #     detail locally (belt-and-suspenders alongside the `local` profile).
  #   * LOGGING_LEVEL_COM_CARDDEMO: DEBUG -> verbose app logs; the MDC filter's
  #     correlation id appears on every line, making the real hop observable.
  #   * SPRING_FLYWAY_ENABLED: "false" -> KEEP in-service Flyway disabled; the
  #     dedicated compose `flyway` step still owns all migrations locally too.
  # ===========================================================================

  # auth-svc — permissive Sign-On stub (real token + correlation-ID hop).
  auth-svc:
    environment:
      SPRING_PROFILES_ACTIVE: local
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      LOGGING_LEVEL_COM_CARDDEMO: DEBUG
      SPRING_FLYWAY_ENABLED: "false"

  # account-svc — typed-stub Account bounded context.
  account-svc:
    environment:
      SPRING_PROFILES_ACTIVE: local
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      LOGGING_LEVEL_COM_CARDDEMO: DEBUG
      SPRING_FLYWAY_ENABLED: "false"

  # card-svc — THE ONE LIVE TRACER read service. Additionally echoes the real
  # Oracle SELECT it issues (show + format SQL) so the seeded-row read shows
  # in local logs. This does NOT alter behaviour, only logging verbosity.
  card-svc:
    environment:
      SPRING_PROFILES_ACTIVE: local
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      LOGGING_LEVEL_COM_CARDDEMO: DEBUG
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SPRING_FLYWAY_ENABLED: "false"

  # transaction-svc — typed-stub Transaction bounded context.
  transaction-svc:
    environment:
      SPRING_PROFILES_ACTIVE: local
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      LOGGING_LEVEL_COM_CARDDEMO: DEBUG
      SPRING_FLYWAY_ENABLED: "false"

  # payment-svc — typed-stub Bill-Payment bounded context.
  payment-svc:
    environment:
      SPRING_PROFILES_ACTIVE: local
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      LOGGING_LEVEL_COM_CARDDEMO: DEBUG
      SPRING_FLYWAY_ENABLED: "false"

  # useradmin-svc — typed-stub User-Admin bounded context.
  useradmin-svc:
    environment:
      SPRING_PROFILES_ACTIVE: local
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      LOGGING_LEVEL_COM_CARDDEMO: DEBUG
      SPRING_FLYWAY_ENABLED: "false"

  # bff — thin backend-for-frontend the SPA binds to; fronts the live tracer.
  bff:
    environment:
      SPRING_PROFILES_ACTIVE: local
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      LOGGING_LEVEL_COM_CARDDEMO: DEBUG
      SPRING_FLYWAY_ENABLED: "false"

  # ===========================================================================
  # ASYNC JOB STUB (HEALTH-EXEMPT) — reporting-svc
  # ---------------------------------------------------------------------------
  # Verbose logging ONLY, so its stub job handler is observable when invoked.
  # Deliberately NO healthcheck, NO published host port, and NO SERVER_PORT are
  # added here: reporting-svc must remain health-exempt and outside the
  # service_healthy gating chain, exactly as in the base file.
  # ===========================================================================
  reporting-svc:
    environment:
      SPRING_PROFILES_ACTIVE: local
      LOGGING_LEVEL_COM_CARDDEMO: DEBUG
      SPRING_FLYWAY_ENABLED: "false"

  # ===========================================================================
  # UI (React 19 + MUI SPA, served by nginx) — explicit host access
  # ---------------------------------------------------------------------------
  # Re-state the host port so the SPA is reachable at localhost:${UI_PORT}
  # for the local browser. The image serves a STATIC nginx build, so hot-reload
  # source bind mounts are intentionally OUT OF SCOPE for this skeleton — none
  # are added. Identical mapping to the base -> no new binding.
  # ===========================================================================
  ui:
    ports:
      - "${UI_PORT:-3000}:80"
