# ==================================================================
# COMPONENT DOCSTRING
#
# This block plus the descriptive step names below ARE this component's
# documentation, satisfying Rule 1 clause E through its "or docstring"
# disjunct. No README is added to this folder: a second document describing
# one file would be the duplication clause C forbids. This folder holds
# exactly one file, deliberately - there is no release, deploy, publish or
# second workflow, no reusable or composite action, and no bot manifest,
# because an automated version-bump bot contradicts the determinism clause C
# requires and the "no ranges, no LATEST, no RELEASE" rule pom.xml holds
# itself to.
#
# ------------------------------------------------------------------
# 1. WHAT IT DOES
#
# It is the deterministic, repeatable harness that validates the COBOL to
# Java 25 migration and publishes the evidence, pinned to JDK 25 and Maven
# 3.9.11. Five jobs, each with one responsibility:
#
#   repository-integrity  the frozen corpus under app/ is unmodified, and the
#                         legacy inventory still counts what it counted at the
#                         traceability anchor
#   verify                the toolchain, wrapper and dependency contracts hold,
#                         then one Maven command compiles warning-free and runs
#                         the unit, integration and end-to-end tiers under the
#                         coverage floor and the vulnerability scan
#   integration           the committed container topology stands up and the
#                         schema, object store, queue and scrape target are
#                         really reachable
#   image-scan            the artefact that actually ships is scanned, because
#                         the Maven scan reads the dependency graph and cannot
#                         see the runtime image
#   gate-evidence         collates the eight gates, their severities and their
#                         evidence paths
#
# IT NEVER DEPLOYS. There is no deploy stage, no Kubernetes, Helm or ECS
# manifest, no container-registry login and no image push - AAP section 0.3.2
# puts orchestration beyond Docker Compose out of scope, and
# docs/project-guide.md records that no registry is configured. The
# deploy-stage and production-deployment items in that document are
# prior-run recommendations, not AAP requirements, and are deliberately not
# implemented here.
#
# ------------------------------------------------------------------
# 2. HOW TO RUN, BUILD AND TEST
#
# Automatically on every push to main and on every pull request targeting
# main, which is what CONTRIBUTING.md:37 relies on when it asks contributors
# to "Pay attention to any automated CI failures reported in the pull
# request". Manually through the Actions tab: this workflow accepts NO
# workflow_dispatch inputs, deliberately, so it has no knob that could weaken
# a gate and no operator-supplied string that could reach a shell.
#
# Reproduce it locally with the same commands, in this order. They are the
# commands docs/validation-gates.md documents, and the first is the one
# CONTRIBUTING.md:34 ("Ensure local tests pass.") refers to - the harness runs
# exactly what a developer runs, with no CI-only skip flags, so the two
# results are comparable:
#
#   ./mvnw --batch-mode --no-transfer-progress clean verify
#   docker compose up --build --wait
#
# Prerequisites: JDK 25, a container runtime for the Testcontainers-backed
# tiers, and - only when the wrapper must download its distribution - curl or
# wget. unzip is NOT a prerequisite: the launcher falls back to the JDK's own jar
# tool to expand the pinned zip (see failure mode 10).
# Maven itself is NOT a prerequisite - ./mvnw provisions the pinned version
# and verifies its checksum first.
#
# ------------------------------------------------------------------
# 3. KEY CONFIGURATION AND DEFAULTS
#
# Thresholds are asserted and referenced here, never restated: pom.xml is the
# single place they are defined, and duplicating a number into this file is
# how the two drift apart. Read pom.xml for the authoritative values.
#
#   JDK feature version        25            asserted; the patch is whatever
#                                            the pinned distribution ships
#   Apache Maven               3.9.11        asserted exactly, via ./mvnw
#   Compiler                   pom.xml       release 25, -Xlint:all, -Werror
#   Coverage floor             pom.xml       jacoco.line.coverage.minimum
#   Vulnerability threshold    pom.xml       owasp.failBuildOnCVSS
#   Testcontainers             pom.xml       testcontainers.version property
#   Container topology         docker-compose.yml   every image digest-pinned
#   LocalStack readiness       INIT_MAX_ATTEMPTS / INIT_SLEEP_SECONDS
#   Artifact retention         30 days, finite by design
#   if-no-files-found          error on a required report; warn on a
#                              diagnostic log. Never ignore - a missing report
#                              is a signal, and ignore is the setting that
#                              hides it
#
# Credentials. There is no repository secret on any LocalStack path. Every
# value the topology needs is generated per run, registered with the runner's
# masking mechanism, never printed and never persisted beyond the job. AWS
# access is emulated: dummy non-production key material against the local
# endpoint only, so no code path can reach a live AWS endpoint and there is no
# live credential, account identifier or production endpoint anywhere in this
# file. The LocalStack image is the COMMUNITY build at the exact tag
# docker-compose.yml pins - never the Pro image, which would need an auth
# token, and never a floating tag. NVD_API_KEY is optional and is read from
# the environment if a maintainer has configured it; the scan runs on public
# retrieval without it, and no key is committed.
#
# ------------------------------------------------------------------
# 4. COMMON FAILURE MODES AND TROUBLESHOOTING
#
#  1. A bare Testcontainers coordinate cannot be resolved.
#     Every module artefact was renamed in the 2.x line, so org.testcontainers
#     localstack, postgresql and junit-jupiter DO NOT EXIST at the pinned
#     version and fail resolution outright.
#     Remedy: use the prefixed artifact ids only - testcontainers,
#     testcontainers-localstack, testcontainers-postgresql,
#     testcontainers-junit-jupiter.
#
#  2. Testcontainers resolves to a 1.x version unexpectedly.
#     Spring Boot already manages a 1.x version and imports the Testcontainers
#     bill of materials itself, so a competing import produces an
#     ordering-dependent resolution that can silently win.
#     Remedy, and BOTH halves are required: set the version PROPERTY to the
#     pinned value and import no second bill of materials. Overriding without
#     renaming resolves artefacts that do not exist; renaming without
#     overriding resolves the wrong version.
#
#  3. The enforcer rejects the toolchain.
#     Remedy: use JDK 25 and Maven 3.9.11. Never downgrade the floor, never
#     install Maven 3.8, and never fall back to Java 21 or 17.
#
#  4. The build fails on a compiler warning.
#     -Werror is the zero-warning gate, so a warning is an error by design.
#     Remedy: fix the warning. Never disable -Xlint and never remove -Werror.
#
#  5. The coverage threshold fails.
#     Remedy: add meaningful tests. Never lower the line-coverage floor and
#     never exclude core packages from the report to reach it.
#
#  6. The vulnerability feed, a registry or another network prerequisite is
#     unavailable.
#     Remedy: report it as an exact Blocker with the error text and fix the
#     prerequisite. A skipped, blocked or partially completed scan is NOT a
#     passing gate. Never weaken the threshold, never add a skip, never widen
#     the suppression file and never downgrade the failure to a warning.
#
#  7. Flyway fails against an existing schema.
#     A migration checksum or an already-populated schema will stop the
#     migrate step.
#     Remedy: start from a clean volume - "docker compose down --volumes" and
#     bring the topology up again.
#
#  8. LocalStack initialisation has not finished when a check runs.
#     The provisioning script polls with bounded readiness rather than
#     sleeping blindly.
#     Remedy: raise INIT_MAX_ATTEMPTS, or INIT_SLEEP_SECONDS on a slow host.
#     Re-running the script is safe: it is idempotent and converges.
#
#  9. The JWT signing key variable is unset.
#     The application fails fast by design - there is deliberately no
#     committed default, because a committed default is a shipped credential.
#     Remedy: supply it through the environment. This workflow generates an
#     ephemeral one per run.
#
# 10. A missing unzip on the runner. Read mvnw before diagnosing this: an
#     behaviour differs from the UPSTREAM launcher's, and describing the
#     upstream behaviour here would send a reader looking for a
#     checksum failure that this launcher cannot produce that way.
#     What upstream does: rewrite the
#     distribution URL to the .tar.gz variant when unzip is absent, while
#     distributionSha256Sum still pins the .zip - so the hashes cannot match
#     and it reports a possibly compromised distribution for what is only a
#     missing tool.
#     What THIS launcher does, in mvnw's DELIBERATE DIVERGENCES block, its
#     extract_zip function and its distributionUrl guard: it never
#     retargets. The URL must end in apache-maven-<version>-bin.zip or the
#     launcher refuses it outright, and when unzip is absent it expands the
#     same zip with the JDK jar tool - which every runner has, since a JDK is
#     already required - and only if THAT is also unreachable does it fail,
#     with a message naming both tools. So a missing unzip is ordinarily
#     invisible here, and a real checksum failure means what it says.
#     Remedy for the fail-both case: install unzip, or make
#     $JAVA_HOME/bin/jar reachable. Never blank or delete the checksum - a
#     blank value silently disables integrity verification and the build then
#     passes having checked nothing. Never pin the .tar.gz either; the
#     launcher rejects any URL that does not end in -bin.zip.
# ==================================================================

name: build

# The default branch is main, evidenced by catalog-info.yaml:23 (project-slug),
# :24 (source-location .../tree/main/) and CONTRIBUTING.md:26 ("You are working
# against the latest source on the main branch"). workflow_dispatch declares no
# inputs: none is needed, and an absent input cannot be used to weaken a gate or
# to smuggle an operator-supplied string into a shell.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege, Rule 1 clause D. Read-only, and nothing else is granted.
# Deliberately absent, without exception: pull-requests: write and issues: write
# - CONTRIBUTING.md:54 asks that a potential security issue be reported through
# the vulnerability reporting page and NOT as a public github issue, so this
# workflow neither opens an issue nor writes vulnerability detail into a pull
# request comment; packages: write or any publish scope, because nothing is
# published; id-token: write, because no cloud identity is federated; and any
# environment: target, because nothing is deployed. No self-hosted runner and no
# self-hosted secret is assumed anywhere.
permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Non-secret, non-sensitive expectations only. Every one of these is ASSERTED
# against its authoritative source rather than trusted: JAVA_PATCH_VERSION and
# MAVEN_VERSION against the running toolchain, and the wrapper values against
# .mvn/wrapper/maven-wrapper.properties itself.
env:
  # ----------------------------------------------------------------
  # PINNED TO THE PATCH, ASSERTED TO THE BUILD NUMBER.
  #
  # This was the feature version "25", and the comment here argued that
  # asserting a patch "would be brittle for no gain" because the available
  # sources disagreed - docs/project-guide.md:510 records 25.0.2 while AAP
  # section 0.6.1.3 records 25.0.3. That argument does not survive what the
  # setup action actually DOES with a feature version. Its own documentation
  # states that for a broad range such as `25` it downloads the latest
  # available release satisfying the range, behaving like check-latest: true.
  # So "25" was never a pin; it was a moving reference.
  #
  # Measured, not assumed: the Adoptium release listing for the 25 line is
  # jdk-25.0.4+7, jdk-25.0.3+9, jdk-25.0.2+10, jdk-25.0.1+8, jdk-25+36, so "25"
  # resolves to 25.0.4+7 - a THIRD JDK, differing from both Dockerfile stages,
  # which are now both 25.0.3+9. Compiling release-25 bytecode on an unknown
  # patch is the same defect class the Dockerfile stages just closed, so it is
  # closed the same way and against the same value.
  #
  # The source disagreement is SETTLED rather than dodged: the delivered runtime
  # is eclipse-temurin:25.0.3_9-jre-noble and the build stage is asserted equal
  # to it, so 25.0.3+9 is what the shipped artefact is compiled and run on, and
  # project-guide.md's 25.0.2 is stale prose about an earlier run.
  #
  # Two values, because they answer two different questions:
  #   JAVA_PATCH_VERSION   is what is REQUESTED. A plain semver patch, so
  #                        resolution does not depend on whether build metadata
  #                        after `+` participates in the action's range matching.
  #   JAVA_RUNTIME_VERSION is what is ASSERTED, against java.runtime.version -
  #                        the full build number. A Temurin REBUILD of the same
  #                        patch (a hypothetical 25.0.3+10) therefore fails here
  #                        loudly rather than silently diverging from the image.
  #
  # Moving all four surfaces - builder, runtime, CI and setup - to 25.0.4 is the
  # documented next step and is deliberately NOT taken here: it is a toolchain
  # pin move, which requires approval rather than an agent's judgement. It is
  # registered as a disclosed residual risk instead.
  # ----------------------------------------------------------------
  JAVA_PATCH_VERSION: "25.0.3"
  JAVA_RUNTIME_VERSION: "25.0.3+9-LTS"
  # Asserted exactly. docs/project-guide.md:521 records 3.9.9, a Medium drift;
  # the pinned value governs and 3.9.9 must NOT be accepted.
  MAVEN_VERSION: "3.9.11"
  WRAPPER_PROPERTIES: .mvn/wrapper/maven-wrapper.properties
  # Uploaded evidence is retained for a finite, stated period rather than the
  # account default, so retention is a reviewable property of this file.
  ARTIFACT_RETENTION_DAYS: "30"

# ==================================================================
# SUPPLY CHAIN: WHY EVERY `uses:` CARRIES A COMMIT SHA
#
# A major-version tag on an action is not a version. It is a branch the
# publisher re-points at will, so `@v7` means "whatever v7 is when the job
# starts", and that code executes with this workflow's token and full read
# access to the checkout. The same reasoning that makes every Maven coordinate
# in pom.xml an exact version, and every container image in docker-compose.yml a
# digest, applies with more force here, because an action EXECUTES rather than
# merely being linked. Pinning by tag would also defeat this file's stated
# purpose: a harness advertised as deterministic cannot be one while a third
# party can change what it runs between two builds of the same commit.
#
# So each reference below names an immutable 40-character commit, with the
# human-readable release beside it. The comment is what a reader and a
# dependency bot use; the SHA is what executes. Both are required - a bare SHA
# is unreviewable and a bare tag is unpinned.
#
# Three actions are used, one per function: repository checkout, JDK
# provisioning, and artifact upload. Each SHA was resolved from the official
# action repository's tagged release and verified twice - the tag-to-commit
# mapping from the repository's own refs, and the input contract by reading
# action.yml at that exact commit. None was guessed. All three are on the
# current major line and run on the supported Node 24 runtime rather than the
# deprecated Node 20 one.
#
# NO MARKETPLACE ACTION INSTALLS MAVEN. That step was removed rather than
# pinned, because it was both an unpinned third-party dependency in the critical
# path and redundant: .mvn/wrapper/maven-wrapper.properties names the exact
# distribution together with its distributionSha256Sum, so ./mvnw verifies the
# checksum of what it downloads before running it. That is a stronger guarantee
# than installing the same version from a marketplace, and it is the same tool a
# developer runs locally and the Dockerfile build stage runs. The "Assert the
# toolchain" step below proves the wrapper really did resolve the pinned
# version, so the guarantee this removal relies on is checked rather than
# assumed.
#
# NO CACHE ACTION EITHER. The Maven repository is cached by the JDK provisioning
# action, which cannot alter a verdict; a separately keyed vulnerability-data
# cache is deliberately NOT added, because a cache that could let a scan pass on
# data it did not really evaluate is a cache that must not exist.
#
# src/test/java/com/cardemo/unit/infrastructure/BuildProvenanceTest.java holds
# these properties mechanically, so an unpinned action, a missing release
# comment or a reintroduced host Maven fails the build rather than depending on
# a reviewer noticing.
# ==================================================================

# ==================================================================
# THE RUNNER IMAGE: A DATED FAMILY, AND THE LIMIT THAT REMAINS
#
# Every job below names `ubuntu-24.04`, never `ubuntu-latest`. The reasoning is
# the reasoning of the block above, applied to the last unpinned input in this
# file. `ubuntu-latest` is an alias the platform re-points at a new OS release
# once that release reaches general availability; when it moves, the operating
# system this harness runs on changes with NO DIFF IN THIS REPOSITORY. A file
# whose stated purpose is a deterministic build cannot leave its own base image
# addressed by a moving alias while pinning every action to a commit, every
# Maven coordinate to a version and every container image to a digest.
# `ubuntu-24.04` is the current general-availability LTS family and is what the
# alias resolves to today, so this pin removes the silent-migration risk without
# changing what runs. `ubuntu-26.04` exists but is a preview image, and a
# preview base is the wrong foundation for the harness that decides whether a
# change is releasable.
#
# WHAT THIS PIN DOES NOT BUY, STATED PLAINLY. A dated label selects an OS
# family, not an image build. The platform rebuilds these images on a weekly
# cadence, so `ubuntu-24.04` on two different dates can ship different
# preinstalled tool versions. This pin therefore bounds the drift to a patch
# stream within one OS release; it does not eliminate it. Exact reproducibility
# needs one of two things this file deliberately does not do: run every step
# inside a digest-pinned job container, or run on an immutable self-hosted
# runner image. Neither is adopted here, and the reason is measured rather than
# aesthetic - the `integration` job drives `docker compose` and Testcontainers
# against the host daemon, so a job container would need the daemon socket
# mounted into it and would relocate the very network topology those steps
# assert. Trading a real topology assertion for a narrower reproducibility claim
# would weaken the evidence, so the gap is DISCLOSED as residual risk instead.
# See docs/validation-gates.md and the residual-risk register in
# DECISION_LOG.md.
#
# WHY THE RESIDUAL GAP IS NARROW IN PRACTICE. Nothing that determines this
# build's output is taken from the runner image. The JDK arrives from the pinned
# setup action as an explicit distribution and feature version; Maven arrives
# through ./mvnw, which verifies the wrapper's declared distributionSha256Sum
# before executing it; every dependency and plugin is an exact coordinate; every
# service and scanner image is a digest. The runner image supplies the kernel,
# the shell and the container daemon - not the toolchain under test.
#
# BuildProvenanceTest holds this mechanically too: a reintroduced
# `ubuntu-latest`, or any other undated runner label, fails the build.
# ==================================================================


jobs:

  # ------------------------------------------------------------------
  # The frozen corpus is simultaneously the parity oracle, the field-contract
  # source and the traceability anchor, so any modification under app/
  # invalidates all three at once. This job also holds the source-text integrity
  # checks, because they need no toolchain and therefore give the fastest
  # feedback of any gate here.
  # ------------------------------------------------------------------
  repository-integrity:
    name: Frozen corpus, legacy inventory and migration integrity
    runs-on: ubuntu-24.04
    # ------------------------------------------------------------------
    # EVERY JOB IS BOUNDED, AND THE BOUND IS A CEILING RATHER THAN A TARGET.
    #
    # Left unset, a job inherits the platform default of six hours. Nothing here
    # takes anything like that, so the default is not a budget - it is the
    # duration a HUNG step would burn before anyone learned that the run was
    # never going to finish: six hours per job, and five of the six jobs drive a
    # container daemon or a network fetch that can stall rather than fail. The
    # same reasoning already bounds the test tier's heap in the verify job, and
    # this bounds the wall clock the same way.
    #
    # Each value below is a measured duration with room over it, never a
    # performance objective - Gate 3 is a measurement and this file publishes no
    # service level. A job that trips its ceiling is reporting that something
    # stopped making progress, which is exactly the signal an unbounded job
    # cannot give. Raise a ceiling only against a measurement that needs it.
    #
    # This job runs no toolchain at all - text, digests and git history only -
    # and completes in about a minute.
    # ------------------------------------------------------------------
    timeout-minutes: 20
    steps:
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the frozen-corpus comparison needs the pull request's
          # base commit to be present, and nothing shallower guarantees that.
          fetch-depth: 0
          # Nothing here pushes, so the checkout token is not left behind in
          # .git/config for any later step to reach.
          persist-credentials: false

      # Rule 1 clause F in one place. Every finding this workflow reports carries
      # the file path, the symbol checked, expected versus actual, a severity
      # from Blocker / High / Medium / Low, and a remediation line. Defining it
      # once rather than restating it in each step is clause C's "avoid
      # duplication" applied to shell as much as to Java.
      - name: Install the shared finding reporter
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/finding.sh" <<'REPORTER'
          FINDINGS=0

          # finding <severity> <path> <symbol> <expected> <actual> <remediation>
          finding() {
            printf '::error title=%s::%s [%s] expected: %s | actual: %s | remediation: %s\n' \
              "$1" "$2" "$3" "$4" "$5" "$6"
            FINDINGS=$((FINDINGS + 1))
          }

          # unavailable <severity> <path> <what-is-needed>
          # The mandated wording for a result that cannot be produced.
          unavailable() {
            printf '::error title=%s::%s Not available - %s\n' "$1" "$2" "$3"
            FINDINGS=$((FINDINGS + 1))
          }

          # conclude <gate-label>
          conclude() {
            if [ "${FINDINGS}" -ne 0 ]; then
              printf '%s: %d finding(s) reported above; see docs/validation-gates.md.\n' \
                "$1" "${FINDINGS}"
              exit 1
            fi
            printf '%s: no findings.\n' "$1"
          }
          REPORTER
          echo "Reporter installed at ${RUNNER_TEMP}/finding.sh"

      # The legacy antecedent of this sequencing is the JES2 job stream's
      # COND=(0,NE) gating - app/jcl/CREASTMT.JCL:56, :66 and :79 - where a step
      # runs only if every prior step ended cleanly. Nothing below carries
      # continue-on-error, so a finding stops the job exactly as a nonzero
      # condition code stopped the stream.
      - name: Assert app/, samples/ and diagrams/ are byte-for-byte unmodified
        env:
          # Routed through env: rather than interpolated into the script.
          # A github.event.* value is attacker-influenced on a pull request, and
          # expanding one inside a shell is the injection pattern Rule 1 clause D
          # names explicitly.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The commit the ref pointed at BEFORE this push. Same routing, same
          # reason. It exists only on a push event and is all-zeros when the ref
          # is newly created, both of which the ladder below handles.
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          # WHICH COMMIT TO COMPARE AGAINST, and why the order is this order.
          #
          # Comparing against HEAD~1 whenever no pull-request
          # base is available is wrong for the ordinary case: a push of
          # several commits would be diffed against its own second-to-last commit, so an
          # edit under app/ made in any EARLIER commit of that same push would be inside
          # the range and invisible. The check would then report the frozen corpus
          # intact while a modification had just landed on the branch.
          #
          # 1. THE TRACEABILITY ANCHOR, preferred whenever it resolves. The AAP
          #    keys every citation to 7756d89 and freezes the corpus as of that
          #    commit, so the invariant is absolute - app/, samples/ and diagrams/
          #    must be byte-for-byte what the anchor holds - not incremental.
          #    Comparing against it is independent of how many commits a push
          #    carries, of force pushes, and of which branch is being built.
          # 2. The pull-request base, which spans the whole branch rather than one
          #    commit, for a fork whose history does not contain the anchor.
          # 3. The push event's before SHA, which spans the whole push. Skipped
          #    when it is empty, all-zeros (a newly created ref) or unresolvable
          #    (a force push whose old tip was rewritten away).
          # 4. HEAD~1, then HEAD, as a last resort. Both are announced as
          #    incremental so a reader never mistakes a weaker comparison for the
          #    absolute one.
          ANCHOR=7756d895ffeb65f7ea72aaa609e356d9899afcec
          ZERO=0000000000000000000000000000000000000000

          resolves() {
            [ -n "$1" ] && [ "$1" != "${ZERO}" ] \
              && git cat-file -e "$1^{commit}" 2> /dev/null
          }

          base=''
          scope=''
          if resolves "${ANCHOR}"; then
            base="${ANCHOR}"
            scope='the frozen-corpus traceability anchor - an ABSOLUTE comparison'
          elif resolves "${PR_BASE_SHA:-}"; then
            base="${PR_BASE_SHA}"
            scope='the pull-request base - spans every commit on this branch'
          elif resolves "${PUSH_BEFORE_SHA:-}"; then
            base="${PUSH_BEFORE_SHA}"
            scope='the pre-push tip - spans every commit in this push'
          elif git rev-parse --verify --quiet 'HEAD~1' > /dev/null; then
            base="$(git rev-parse 'HEAD~1')"
            scope='HEAD~1 - INCREMENTAL, so an edit in an earlier commit of a multi-commit push is out of range'
          else
            base="$(git rev-parse HEAD)"
            scope='HEAD itself - the tree has no parent, so only the working tree below is checked'
          fi
          printf 'Comparing the frozen trees against %s\n  basis: %s\n' \
            "${base}" "${scope}"

          changed="$(git diff --name-only "${base}" HEAD -- app/ samples/ diagrams/)"
          if [ -n "${changed}" ]; then
            remedy='revert every change under these trees. They are read-only reference material: the'
            remedy="${remedy}"' parity oracle, the field-contract source and the traceability anchor. The migration'
            remedy="${remedy}"' is additive only.'
            finding Blocker 'app/ samples/ diagrams/' 'git diff --name-only' \
              'no changed paths' "$(printf '%s' "${changed}" | tr '\n' ' ')" \
              "${remedy}"
          fi

          dirty="$(git status --porcelain app/ samples/ diagrams/)"
          if [ -n "${dirty}" ]; then
            finding Blocker 'app/ samples/ diagrams/' 'git status --porcelain' \
              'empty' "$(printf '%s' "${dirty}" | tr '\n' ' ')" \
              'restore the working tree. No build step may write into the frozen trees.'
          fi

          conclude 'Frozen corpus'

      # ----------------------------------------------------------------------
      # ENUMERATION IS CASE-INSENSITIVE AND COUNTS MEMBERS, NOT GLOB MATCHES.
      # Two measured hazards make this mandatory rather than stylistic.
      #
      # 1. A lowercase glob under-reports the corpus. app/cbl holds 28 members
      #    totalling 19,254 lines, but two of them - CBSTM03A.CBL and
      #    CBSTM03B.CBL - carry an UPPERCASE extension, so `app/cbl/*.cbl`
      #    matches only 26 and silently drops 1,154 lines. The same trap exists
      #    for COSTM01.CPY in app/cpy and for CREASTMT.JCL in app/jcl, and that
      #    last one is the sole source for statement generation, so a
      #    case-sensitive pattern deletes a whole feature from scope.
      #
      # 2. A bare extension glob misses a member outright, and .gitkeep
      #    sentinels inflate a raw listing. app/data/EBCDIC holds 12 data files
      #    but only 11 end in .PS - the twelfth is
      #    AWS.M2.CARDDEMO.DALYTRAN.PS.INIT - and app/cpy-bms, app/csd and
      #    app/data/EBCDIC each carry a .gitkeep that `ls | wc -l` would count.
      #
      # So every count below is `find -type f`, excluding .gitkeep, and every
      # extension test uses -iname. Never `ls | wc -l`, never a bare glob.
      # ----------------------------------------------------------------------
      - name: Assert the legacy inventory still counts what the anchor counted
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          members() {
            find "$1" -type f ! -name '.gitkeep' | wc -l | tr -d ' '
          }

          # expect_members <directory> <expected-count> <severity>
          expect_members() {
            if [ ! -d "$1" ]; then
              unavailable "$3" "$1" 'the directory is absent; restore the frozen corpus from the traceability anchor'
              return
            fi
            actual="$(members "$1")"
            if [ "${actual}" != "$2" ]; then
              remedy='restore the frozen corpus, or correct the expected count here only if the AAP'
              remedy="${remedy}"' inventory in docs/technical-specifications.md section 0.2 changed.'
              finding "$3" "$1" 'non-.gitkeep member count' "$2" "${actual}" \
                "${remedy}"
            else
              printf '%-20s %s members\n' "$1" "${actual}"
            fi
          }

          expect_members app/cbl            28 High
          expect_members app/cpy            28 High
          expect_members app/cpy-bms        17 High
          expect_members app/bms            17 High
          expect_members app/jcl            29 High
          expect_members app/proc            2 High
          expect_members app/ctl             1 High
          expect_members app/csd             1 High
          expect_members app/catlg           1 High
          expect_members app/data/ASCII      9 High
          expect_members app/data/EBCDIC    12 High
          expect_members diagrams            6 Low
          expect_members samples             8 Low

          # The line total is the figure TRACEABILITY_MATRIX.md is keyed to, and
          # it is only reachable case-insensitively.
          cbl_lines="$(find app/cbl -type f -iname '*.cbl' -exec cat {} + | wc -l | tr -d ' ')"
          if [ "${cbl_lines}" != "19254" ]; then
            remedy='enumerate with -iname. A lowercase-only glob reports 18,100 because CBSTM03A.CBL and'
            remedy="${remedy}"' CBSTM03B.CBL carry an uppercase extension.'
            finding High app/cbl 'total lines across *.cbl, case-insensitive' \
              '19254' "${cbl_lines}" \
              "${remedy}"
          else
            printf 'app/cbl              %s lines across 28 programs\n' "${cbl_lines}"
          fi

          # The uppercase members are asserted BY NAME, so the hazard above is
          # proven closed rather than merely commented on.
          for upper in app/cbl/CBSTM03A.CBL app/cbl/CBSTM03B.CBL \
                       app/cpy/COSTM01.CPY app/jcl/CREASTMT.JCL; do
            if [ ! -f "${upper}" ]; then
              remedy='restore it. Its uppercase extension is exactly why every pattern touching these'
              remedy="${remedy}"' directories must be case-insensitive.'
              finding High "${upper}" 'uppercase-extension member' 'present' 'absent' \
                "${remedy}"
            fi
          done

          # The Gate 1 and Gate 4 fixture, named in full - dailytran.txt, not
          # dalytran.txt, which is the mainframe DD name.
          fixture=app/data/ASCII/dailytran.txt
          if [ ! -f "${fixture}" ]; then
            unavailable Blocker "${fixture}" 'the named-fixture gate has no input; restore the ASCII fixture set'
          else
            bytes="$(wc -c < "${fixture}" | tr -d ' ')"
            lines="$(wc -l < "${fixture}" | tr -d ' ')"
            if [ "${bytes}" != "105300" ] || [ "${lines}" != "300" ]; then
              remedy='restore the fixture. Its geometry is load-bearing: 300 x 350 = 105,300, and it'
              remedy="${remedy}"' carries both positive and negative overpunch signs, so it must not be normalised.'
              finding Blocker "${fixture}" 'size and record count' \
                '105300 bytes / 300 records of 350' "${bytes} bytes / ${lines} records" \
                "${remedy}"
            else
              printf '%s   %s bytes / %s records\n' "${fixture}" "${bytes}" "${lines}"
            fi
          fi

          conclude 'Legacy inventory'

      - name: Assert the mandated migration artefacts are present
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          # expect_file <path> <severity> <why-it-is-needed>
          expect_file() {
            if [ ! -s "$1" ]; then
              unavailable "$2" "$1" "$3"
            else
              printf 'present  %s\n' "$1"
            fi
          }

          expect_file pom.xml Blocker \
            'the build descriptor defines every gate this workflow drives'
          expect_file Dockerfile Blocker \
            'the runtime image is built from it and is the artefact the image scan covers'
          expect_file docker-compose.yml Blocker \
            'the container topology under test is defined there'
          expect_file localstack-init/init-aws.sh Blocker \
            'the object store, queue and topic are provisioned by it'

          # The three observability provisioning files the AAP mandates. The
          # directory legitimately holds more than three files, so the MANDATED
          # SET is asserted by name rather than by a total count. The stale paths
          # in docs/project-guide.md:96 - a bare prometheus.yml and a dashboard
          # under docs/ - are superseded by these.
          expect_file observability/prometheus.yml High \
            'without a scrape configuration the metrics gate cannot report a target'
          expect_file observability/grafana/provisioning/datasources/datasource.yml High \
            'without datasource provisioning the integration sign-off needs a manual step'
          expect_file observability/grafana/dashboards/carddemo-dashboard.json High \
            'without a dashboard definition there is no populated dashboard to demonstrate'

          # The three Flyway migrations, by their exact committed names.
          for migration in V1__create_schema V2__create_indexes V3__seed_data; do
            expect_file "src/main/resources/db/migration/${migration}.sql" Blocker \
              'Flyway applies the three migrations in prefix order; a missing one leaves the schema incomplete'
          done

          # ------------------------------------------------------------------
          # THE SCOPED DOCUMENTS, and why they are asserted HERE by exact name.
          #
          # Asserting the build, container,
          # provisioning, observability and migration artefacts and stopping
          # there would leave the documentation set the AAP mandates checked
          # nowhere in this workflow, so a run in which two of these files were
          # simply absent would pass this step and every step after it. That is
          # precisely the omission a completeness check exists to catch, and it is
          # why the names are literal rather than a glob: a glob over docs/ passes
          # on whatever happens to be there.
          #
          # api-contracts.md stands in for generated OpenAPI, which is out of
          # scope, so its absence removes the only endpoint contract there is.
          # ------------------------------------------------------------------
          for document in \
            docs/api-contracts.md \
            docs/architecture-before-after.md \
            docs/onboarding-guide.md \
            docs/validation-gates.md \
            docs/executive-presentation.html \
            docs/technical-specifications.md; do
            remedy='the AAP mandates this document in the same single phase as the code; there is no'
            remedy="${remedy}"' staged delivery in which it is legitimately still absent'
            expect_file "${document}" High \
              "${remedy}"
          done

          # DECISION_LOG.md and TRACEABILITY_MATRIX.md are deliberately NOT in that
          # list. The next step owns them, at their own severities and with the
          # deeper assertion that the matrix cites all 28 programs. Asserting mere
          # presence here as well would emit two annotations for one absence and
          # would let this list's severity contradict that step's.

          # ------------------------------------------------------------------
          # AND THE NAVIGATION, because presence on disk is not publication.
          #
          # catalog-info.yaml sets backstage.io/techdocs-ref: dir:. so TechDocs
          # renders straight from mkdocs.yml's nav. A document absent from that
          # nav never appears in the published site and produces NO error while
          # failing to publish - the one omission in this repository with no
          # symptom at all. Both halves are therefore asserted: the file exists,
          # and the nav points at it.
          # ------------------------------------------------------------------
          expect_file mkdocs.yml Blocker \
            'the published documentation site is generated from it, and TechDocs renders its nav'

          nav_missing=''
          for target in \
            index.md \
            project-guide.md \
            technical-specifications.md \
            api-contracts.md \
            architecture-before-after.md \
            onboarding-guide.md \
            validation-gates.md \
            executive-presentation.html; do
            # BOTH halves, because either alone passes on a broken site: a nav
            # entry pointing at a file that is not there builds nothing under
            # --strict, and a file with no nav entry publishes nothing at all.
            if ! grep -qF -- "${target}" mkdocs.yml; then
              nav_missing="${nav_missing} ${target}(no-nav-entry)"
            elif [ ! -s "docs/${target}" ]; then
              nav_missing="${nav_missing} ${target}(nav-entry-resolves-to-nothing)"
            fi
          done
          # Counted as nav ITEMS - a top-level list entry inside the nav block -
          # rather than as lines containing a colon. The nav block carries
          # explanatory comments, several of which contain a colon, and counting
          # those reported twelve entries for a nav holding eight.
          nav_entries="$(awk '
            /^nav:/          { inside = 1; next }
            /^[^[:space:]#]/ { inside = 0 }
            inside && /^[[:space:]]*-[[:space:]]/ { count++ }
            END              { print count + 0 }' mkdocs.yml)"
          if [ -n "${nav_missing}" ] || [ "${nav_entries}" != "8" ]; then
            remedy='add a nav entry for each document named above. A document missing from nav is absent'
            remedy="${remedy}"' from the published site and reports nothing, so this is the only place the omission'
            remedy="${remedy}"' surfaces.'
            finding High mkdocs.yml 'nav coverage' \
              'eight entries, one per scoped document' \
              "entries=${nav_entries}${nav_missing:+, unreferenced:${nav_missing}}" \
              "${remedy}"
          else
            printf 'mkdocs.yml nav lists all 8 scoped documents.\n'
          fi

          conclude 'Mandated artefacts'

      # ----------------------------------------------------------------------
      # The evidence artefacts are deliverables of this same single phase - the
      # AAP admits no staging - so their absence is a real finding rather than a
      # tolerable "not yet". Reported with the mandated "Not available" wording
      # and the precise prerequisite, never faked and never quietly passed over.
      # ----------------------------------------------------------------------
      - name: Assert the evidence artefacts exist and cover all 28 programs
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          # TRACEABILITY_MATRIX.md lives at the repository ROOT, not under docs/.
          matrix=TRACEABILITY_MATRIX.md
          if [ ! -s "${matrix}" ]; then
            remedy='the paragraph-level mapping from all 28 COBOL programs to their Java methods has not'
            remedy="${remedy}"' been generated; Gate 7 cannot be evidenced until it exists at the repository root'
            unavailable High "${matrix}" \
              "${remedy}"
          else
            missing=''
            while IFS= read -r program; do
              stem="$(basename "${program}")"
              stem="${stem%.*}"
              if ! grep -qi -- "${stem}" "${matrix}"; then
                missing="${missing} ${stem}"
              fi
            done <<< "$(find app/cbl -type f -iname '*.cbl' | sort)"
            if [ -n "${missing}" ]; then
              remedy='add a row for each program named above. Enumerate the corpus case-insensitively or'
              remedy="${remedy}"' CBSTM03A and CBSTM03B are silently omitted.'
              finding High "${matrix}" 'program coverage' \
                'all 28 programs cited' "unmapped:${missing}" \
                "${remedy}"
            else
              printf '%s cites all 28 programs.\n' "${matrix}"
            fi
          fi

          if [ ! -s DECISION_LOG.md ]; then
            remedy='every mechanism substitution and every deliberately preserved legacy quirk must be'
            remedy="${remedy}"' recorded with its COBOL locator; the register has not been generated'
            unavailable Medium DECISION_LOG.md \
              "${remedy}"
          fi

          if [ ! -s docs/validation-gates.md ]; then
            remedy='the eight gate definitions with their anchors #gate-1 through #gate-8, evidence'
            remedy="${remedy}"' paths, severities and remediations have not been generated; this workflow reports'
            remedy="${remedy}"' against them'
            unavailable High docs/validation-gates.md \
              "${remedy}"
          fi

          if [ ! -s src/test/java/com/cardemo/e2e/GateVerificationTest.java ]; then
            remedy='the machine-checkable gate assertions have not been generated; Failsafe already'
            remedy="${remedy}"' includes **/e2e/**/*Test.java, so the class runs as soon as it exists'
            unavailable High src/test/java/com/cardemo/e2e/GateVerificationTest.java \
              "${remedy}"
          fi

          conclude 'Evidence artefacts'

      # ----------------------------------------------------------------------
      # Documentation publication, which is the one failure in this repository
      # that reports NOTHING at all.
      #
      # catalog-info.yaml sets backstage.io/techdocs-ref: dir:. so TechDocs
      # renders straight from the nav block of mkdocs.yml. A page omitted from
      # that block never appears in the published site: the build succeeds, the
      # file sits in the repository, and the reader who needs it cannot reach
      # it. Review findings H-04 (both documents absent) and H-05 (three nav
      # entries where eight are needed) were both of that shape.
      #
      # The obvious safety net does not work, which is why the policy itself is
      # asserted below. `mkdocs build --strict` promotes WARNINGS to errors, but
      # MkDocs defaults validation.nav.omitted_files to INFO, so under a
      # configuration declaring no validation block an omitted page passes a
      # strict build silently. The failure is warning-free by default, not
      # merely error-free.
      #
      # WHY THIS STEP DOES NOT RUN MKDOCS. MkDocs is a Python tool, is not a
      # build dependency of this project, and is absent from the runner image.
      # Installing it here would mean pinning mkdocs, mkdocs-techdocs-core and
      # mkdocs-mermaid2-plugin into a job whose purpose is repository integrity,
      # and an unpinned install would breach the deterministic-build rule. The
      # invariant is provable from the file itself, so it is proved from the
      # file. The executed strict build and its result are recorded in
      # docs/validation-gates.md, section 2.5.
      #
      # This duplicates the guard in
      # src/test/java/com/cardemo/unit/infrastructure/DocumentationConsistencyTest
      # deliberately, and the duplication is the point: that class runs in the
      # Surefire tier of the `verify` job, so a tree that fails to compile for
      # any unrelated reason would never reach it and would report the
      # documentation gap nowhere. This job needs no JDK and no build.
      # ----------------------------------------------------------------------
      - name: Assert every document under docs/ is published, and that an omission would fail
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          config=mkdocs.yml

          if [ ! -s "${config}" ]; then
            unavailable High "${config}" \
              'the site configuration carries the nav block TechDocs renders from; without it no document publishes'
            conclude 'Documentation publication'
            exit 0
          fi

          # The nav BLOCK only, ending at the next top-level key. Scoped rather
          # than matched across the whole file so that a document merely named
          # in one of this file's explanatory comments cannot satisfy a check
          # about being published.
          nav="$(awk '
            /^nav:[[:space:]]*$/ { inNav = 1; next }
            inNav && /^[^[:space:]#]/ { exit }
            inNav { print }
          ' "${config}")"

          if [ -z "${nav}" ]; then
            finding High "${config}" 'nav' \
              'a nav block listing every document' 'no nav block found' \
              'declare nav: with one entry per document under docs/. TechDocs renders the site from it.'
          fi

          # 1. The two CREATE deliverables the review recorded as absent. Named
          #    explicitly because the general scan below can only prove that
          #    whatever EXISTS is published; it cannot notice a document that
          #    was never written, and that was precisely this pair's defect.
          for document in docs/onboarding-guide.md docs/executive-presentation.html; do
            if [ ! -f "${document}" ]; then
              unavailable High "${document}" \
                'a mandated CREATE deliverable of the Agent Action Plan has not been generated'
            elif [ ! -s "${document}" ]; then
              finding High "${document}" 'file size' \
                'non-empty' 'present but empty' \
                'an empty file publishes a blank page, which is the same failure as omitting it. Author the document.'
            else
              printf '%s   %s bytes\n' "${document}" "$(wc -c < "${document}" | tr -d ' ')"
            fi
          done

          # 2. The five entries the review found missing, asserted as literal
          #    `title: file` pairs. The titles are not free choices: they were
          #    fixed by docs/technical-specifications.md and
          #    docs/validation-gates.md before the documents existed, so a
          #    renamed title is a finding too.
          while IFS= read -r entry; do
            [ -n "${entry}" ] || continue
            if ! printf '%s' "${nav}" | grep -qF -- "${entry}"; then
              finding High "${config}" 'nav' \
                "an entry reading '${entry}'" 'absent' \
                'add it. A document omitted from the nav never publishes, and the omission produces no error and no output.'
            fi
          done <<'ENTRIES'
          API Contracts: api-contracts.md
          Architecture Before and After: architecture-before-after.md
          Onboarding Guide: onboarding-guide.md
          Validation Gates: validation-gates.md
          Executive Presentation: executive-presentation.html
          ENTRIES

          # 3. The invariant, rather than a fixed list, so this keeps holding as
          #    the document set changes: anything publishable under docs/ must be
          #    reachable from the nav.
          for document in docs/*.md docs/*.html; do
            [ -f "${document}" ] || continue
            name="$(basename "${document}")"
            if ! printf '%s' "${nav}" | grep -qF -- ": ${name}"; then
              finding High "${config}" 'nav' \
                "an entry for ${name}" 'unpublished - present under docs/ but absent from the nav' \
                'add a nav entry in the same change that adds the document.'
            fi
          done

          # 4. The detection policy itself. Without it the omission above is not
          #    merely error-free but warning-free, so a strict build passes.
          #
          #    The top-level key is matched ANCHORED. A plain substring match for
          #    'validation:' also matches 'disabled_validation:', so renaming the
          #    block away - the obvious way to disable it - would have satisfied
          #    an unanchored check. Verified by mutation: the unanchored form
          #    passed that rename, the anchored form fails it.
          if ! grep -qE '^validation:' "${config}"; then
            finding High "${config}" 'validation' \
              'a top-level validation: block' 'absent, or renamed so it no longer applies' \
              'declare validation: at the top level. MkDocs reads the policy only under that exact key; anything else is inert configuration.'
          fi

          for key in 'omitted_files: warn' 'not_found: warn'; do
            if ! grep -qF -- "${key}" "${config}"; then
              finding High "${config}" 'validation' \
                "${key} declared" 'absent' \
                'MkDocs defaults validation.nav.omitted_files to info and --strict acts only on warnings, so without this an omitted page passes a strict build silently. Do not remove or lower it.'
            fi
          done

          conclude 'Documentation publication'


      # ----------------------------------------------------------------------
      # Gate 6, the parts provable from source text alone.
      #
      # The float/double check is deliberately scoped to DECLARATIONS - fields,
      # record components and parameters - and not to every occurrence of the
      # token. AAP transformation rule 1 forbids a floating-point type in a
      # financial FIELD; it does not forbid calling a metrics API that takes a
      # double, and a blanket text search would fail on exactly that legitimate
      # call while proving nothing extra about the money path.
      # ----------------------------------------------------------------------
      - name: Assert no floating-point type reaches a financial field
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          declarations='(private|protected|public|final)[[:space:]]+'
          declarations="${declarations}"'(float|double|Float|Double)[[:space:]]+[A-Za-z_]'
          declarations="${declarations}"'|[(,][[:space:]]*'
          declarations="${declarations}"'(float|double|Float|Double)[[:space:]]+[A-Za-z_]'
          if hits="$(grep -rnE "${declarations}" src/main/java --include='*.java')"; then
            remedy='replace the declaration with BigDecimal at the scale the PIC clause dictates, compare'
            remedy="${remedy}"' with compareTo rather than equals, and round HALF_EVEN.'
            finding Blocker src/main/java 'float/double declaration' \
              'none; every monetary and rate value is java.math.BigDecimal' \
              "$(printf '%s' "${hits}" | head -c 400 | tr '\n' ' ')" \
              "${remedy}"
          else
            printf 'src/main/java declares no float or double field, component or parameter.\n'
          fi

          if sql="$(grep -rinE '\b(double precision|float[0-9]*|real)\b' \
              src/main/resources/db/migration --include='*.sql' \
              | grep -vE ':[0-9]+:[[:space:]]*--')"; then
            remedy='use NUMERIC with the precision and scale the copybook PIC clause fixes. An'
            remedy="${remedy}"' approximate type cannot reproduce packed-decimal arithmetic.'
            finding Blocker src/main/resources/db/migration 'column type' \
              'NUMERIC(p,2) for every monetary and rate column' \
              "$(printf '%s' "${sql}" | head -c 400 | tr '\n' ' ')" \
              "${remedy}"
          else
            printf 'The migrations declare no approximate numeric column type.\n'
          fi

          conclude 'Gate 6 - decimal arithmetic'

      - name: Assert no credential material is committed
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          # Scanned paths exclude the frozen corpus: app/jcl/DUSRSECJ.jcl
          # legitimately carries the ten seeded users' plaintext passwords as
          # inline IEBGENER data, and that member is read-only reference material
          # whose whole purpose is to be the seed of record. What must not exist
          # is a plaintext password on the JAVA side - V3__seed_data.sql stores
          # only BCrypt hashes.
          targets='src pom.xml docker-compose.yml Dockerfile .env.example localstack-init observability'

          # Provider-shaped key material and private keys.
          patterns='AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}'
          patterns="${patterns}"'|gh[pousr]_[0-9A-Za-z]{20,}|github_pat_[0-9A-Za-z_]{20,}'
          patterns="${patterns}"'|xox[abps]-[0-9A-Za-z-]{10,}|AIza[0-9A-Za-z_-]{35}'
          patterns="${patterns}"'|sk_live_[0-9A-Za-z]{16,}|pk_live_[0-9A-Za-z]{16,}'
          patterns="${patterns}"'|-----BEGIN[[:space:]][A-Z ]*PRIVATE KEY-----'

          # -o so each MATCHED TOKEN is judged individually rather than the whole
          # line, then self-declared non-functional placeholders are dropped: a
          # token containing EXAMPLE is a published documentation value that
          # cannot authenticate against anything.
          #
          # This exclusion is narrow and it is load-bearing. The only tokens it
          # removes belong to NEGATIVE SECURITY TESTS - cases asserting that the
          # application and the provisioning script REFUSE an endpoint carrying
          # credentials, and that a refusal never echoes the offending value back
          # into a log. Flagging those would put a maintainer under pressure to
          # delete the very tests that harden this repository against credential
          # leakage, which is how a scan stops being read at all. Any real-shaped
          # token without EXAMPLE in it still fails this gate, and judging tokens
          # rather than lines means a genuine key sharing a line with an example
          # is still caught.
          # The two stages are deliberately NOT one pipeline. awk exits 0 whether
          # or not its expression selected anything, so a pipeline ending in awk
          # cannot report "nothing matched" through its exit status, and testing
          # that status would report a finding on every run with an empty value.
          # Matching and filtering are therefore separated, and the verdict is
          # taken from whether the filtered file has content.
          raw="${RUNNER_TEMP}/credential-matches.raw"
          filtered="${RUNNER_TEMP}/credential-matches.txt"
          if grep -rnoE "${patterns}" ${targets} > "${raw}" 2>/dev/null; then
            awk -F: '$NF !~ /EXAMPLE/' "${raw}" > "${filtered}"
          else
            : > "${filtered}"
          fi

          if [ -s "${filtered}" ]; then
            remedy='remove the value, rotate it at the provider, and read it from the environment'
            remedy="${remedy}"' instead. Never commit a credential.'
            finding Blocker "${targets}" 'provider credential pattern' \
              'no key material of any kind' \
              "$(head -c 300 "${filtered}" | tr '\n' ' ')" \
              "${remedy}"
          else
            printf 'No provider-shaped credential material found outside the frozen corpus.\n'
            note='Documented EXAMPLE placeholders in negative security tests are'
            note="${note}"' excluded by design:'
            printf '%s %s such token(s) seen.\n' "${note}" \
              "$(wc -l < "${raw}" | tr -d ' ')"
          fi

          # A committed default for the signing key is the specific High-severity
          # defect the prior implementation carried. Every profile must indirect
          # to the environment and fail fast when it is unset.
          #
          # The pattern anchors on the KEY AT THE START OF ITS OWN LINE rather
          # than looking for "jwt" adjacent to it, because in YAML the property is
          # nested - "jwt:" sits on one line and "signing-key:" on the next - so a
          # pattern requiring both on one line cannot see the realistic case at
          # all. It then requires the value to begin with something other than
          # "$", so the environment-indirected form is accepted and a literal is
          # not. Anchoring on leading whitespace also means a commented example
          # cannot trigger it, since a comment line begins with "#".
          literal_key='^[[:space:]]*(signing-key|signingKey|jwt-secret|jwt_secret)'
          literal_key="${literal_key}"'[[:space:]]*:[[:space:]]*[^$[:space:]#]'
          if hits="$(grep -rnE "${literal_key}" \
              src/main/resources --include='*.yml')"; then
            remedy='indirect the key through the environment in every profile and let the application'
            remedy="${remedy}"' fail fast when it is unset. A committed default is a shipped credential.'
            finding Blocker src/main/resources 'JWT signing key' \
              'an environment reference with no committed default' \
              "$(printf '%s' "${hits}" | head -c 300 | tr '\n' ' ')" \
              "${remedy}"
          else
            printf 'The signing key is environment-indirected in every profile.\n'
          fi

          conclude 'Gate 6 - secret hygiene'

      # ----------------------------------------------------------------------
      # THE INTENT IS "NO SECOND PIPELINE", NOT "NO SECOND FILE".
      #
      # This guard compared the whole `.github` listing against the single
      # literal `.github/workflows/build.yml`, and this folder has not matched
      # that since the redacting filter and the plugin-graph scanner were
      # authored. Both are INVOKED from this file - the integration job runs the
      # filter to mask a captured response body before anything can print it, and
      # the plugin-graph job runs the scanner with its dispositions - so the
      # guard forbade the very files two of its own jobs depend on and reported a
      # finding on every run. A guard that can never pass is not a gate: it
      # trains a reader to skip the annotation, which leaves the tree less
      # protected than an honest guard would.
      #
      # Rescoped rather than relaxed. The original wording argued against "a
      # release, deploy, publish or second workflow, a composite action, a
      # version-bump bot manifest, an owners file, a duplicate security policy or
      # an issue template", and all of that is still refused - by three
      # assertions, each holding a different part of it:
      #
      #   1. EXACTLY ONE WORKFLOW. `.github/workflows` must hold `build.yml` and
      #      nothing else. This is the part that forbids a release, deploy or
      #      publish pipeline and any second workflow, and it is the part the
      #      remediation text was really about.
      #   2. THE INVENTORY STAYS CLOSED. The complete listing is still compared
      #      against an authored set, so a composite action, a bot manifest, an
      #      owners file, a duplicate security policy or an issue template is
      #      still a finding. None of those is a workflow, so assertion 1 alone
      #      would not see them.
      #   3. EVERY HELPER EARNS ITS PLACE. Each non-workflow member must carry a
      #      real invocation in this file, so a helper cannot be added, forgotten,
      #      and left sitting behind a passing gate as dead weight.
      #
      # Assertion 3 searches for the INVOCATION, assembled at run time from a
      # directory variable, rather than for the bare path. The paths themselves
      # appear in assertion 2's own list a few lines above, so a bare-path search
      # would match this step's text and pass no matter what the jobs do; the
      # assembled form appears nowhere in this file except at a genuine call site.
      # ----------------------------------------------------------------------
      - name: Assert .github holds one workflow and only the helpers it invokes
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          workflows="$(find .github/workflows -type f | sort | tr '\n' ' ')"
          only_workflow='.github/workflows/build.yml '
          if [ "${workflows}" != "${only_workflow}" ]; then
            remedy='this folder holds exactly one workflow. A release, deploy, publish or second'
            remedy="${remedy}"' workflow contradicts the determinism this file exists to provide, and nothing'
            remedy="${remedy}"' here publishes, deploys or releases anything.'
            finding Medium .github/workflows 'workflow inventory' \
              "${only_workflow}" "${workflows}" \
              "${remedy}"
          else
            printf '.github/workflows holds exactly one workflow: build.yml\n'
          fi

          actual="$(find .github -type f | sort | tr '\n' ' ')"
          expected='.github/plugin-graph/dispositions.json'
          expected="${expected}"' .github/plugin-graph/scan_plugin_graph.py'
          expected="${expected}"' .github/smoke/redact_auth_body.py'
          expected="${expected}"' .github/workflows/build.yml '
          if [ "${actual}" != "${expected}" ]; then
            remedy='the inventory is closed on purpose. A composite action, a version-bump bot'
            remedy="${remedy}"' manifest, an owners file, a duplicate security policy or an issue template all'
            remedy="${remedy}"' either contradict that determinism or duplicate guidance CONTRIBUTING.md already'
            remedy="${remedy}"' gives. Add a file here only alongside the step that invokes it, and extend this'
            remedy="${remedy}"' list in the same commit.'
            finding Medium .github 'directory contents' \
              "${expected}" "${actual}" \
              "${remedy}"
          else
            printf '.github holds one workflow and the three helpers it invokes.\n'
          fi

          helpers="$(find .github -type f -not -path '.github/workflows/*' | sort | tr '\n' ' ')"
          expected_helpers='.github/plugin-graph/dispositions.json '
          expected_helpers="${expected_helpers}"'.github/plugin-graph/scan_plugin_graph.py '
          expected_helpers="${expected_helpers}"'.github/smoke/redact_auth_body.py '
          if [ "${helpers}" != "${expected_helpers}" ]; then
            remedy='every non-workflow file under .github must be a helper THIS workflow executes, kept'
            remedy="${remedy}"' outside the YAML so it can be unit tested. Adding one is a decision to record'
            remedy="${remedy}"' here and to call from a step; an owners file, an issue template, a funding'
            remedy="${remedy}"' manifest or a duplicate security policy is none of those.'
            finding Medium .github 'non-workflow contents' \
              "${expected_helpers}" "${helpers}" \
              "${remedy}"
          else
            printf 'The three helper scripts are present and no other non-workflow file is.\n'
          fi

          smoke='.github/smoke'
          graph='.github/plugin-graph'
          for invocation in "python3 ${smoke}/redact_auth_body.py" \
                            "python3 ${graph}/scan_plugin_graph.py" \
                            "--dispositions ${graph}/dispositions.json"; do
            if grep -qF -- "${invocation}" .github/workflows/build.yml; then
              printf 'Invoked by this workflow: %s\n' "${invocation}"
            else
              remedy='delete the helper, or add the step that runs it. An unreferenced file here is'
              remedy="${remedy}"' either dead weight, which Rule 1 clause B forbids, or a step someone'
              remedy="${remedy}"' intended to add and did not.'
              finding Medium .github 'helper invocation' \
                "${invocation} appears in .github/workflows/build.yml" \
                'no call site names it' \
                "${remedy}"
            fi
          done

          conclude 'Workflow inventory'

  # ------------------------------------------------------------------
  # Gate 2. One Maven command enforces the zero-warning compile, the unit,
  # integration and end-to-end tiers, the coverage floor, the toolchain floors
  # and the vulnerability scan. The contract assertions run BEFORE it, so a
  # dependency or toolchain defect is reported as itself rather than as a
  # confusing compilation failure several minutes later.
  # ------------------------------------------------------------------
  verify:
    name: Zero-warning build, tests, coverage and vulnerability scan
    runs-on: ubuntu-24.04
    # The longest job here by a wide margin, and the ceiling reflects both halves
    # of it: `clean verify` was measured at 11 minutes, and the vulnerability
    # scan runs for roughly half an hour whenever NVD_API_KEY is absent, since an
    # unkeyed caller is rate-limited while refreshing the advisory data. Ninety
    # minutes carries that worst case with room for a cold dependency cache.
    timeout-minutes: 90
    env:
      # Bounded so a runaway test tier fails rather than consuming the whole job
      # allowance. Not a performance target - see Gate 3, which is a measurement.
      MAVEN_OPTS: -Xmx3072m -XX:MaxMetaspaceSize=512m
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_PATCH_VERSION }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          # The exact patch, not the feature version. A feature version here is
          # resolved by this action as "the latest release satisfying the range",
          # which today means 25.0.4+7 - neither Dockerfile stage's JDK. The
          # requested value is the patch alone because it is plain semver and so
          # cannot depend on whether build metadata after `+` takes part in range
          # matching; the full build number is asserted separately below, which
          # is the check that actually holds this to the delivered image.
          java-version: ${{ env.JAVA_PATCH_VERSION }}
          # Caches ~/.m2/repository. This cannot change a verdict: the cached
          # content is resolved dependency jars whose coordinates pom.xml pins
          # exactly, and the vulnerability scan re-validates its own data
          # freshness on every run with failOnError set, so data it cannot
          # refresh FAILS the build rather than passing it. A separately keyed
          # vulnerability-data cache is deliberately not added, because a cache
          # able to stale-bypass a scan must not exist. The tradeoff bought here
          # is transfer time only.
          cache: maven

      - name: Install the shared finding reporter
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/finding.sh" <<'REPORTER'
          FINDINGS=0

          finding() {
            printf '::error title=%s::%s [%s] expected: %s | actual: %s | remediation: %s\n' \
              "$1" "$2" "$3" "$4" "$5" "$6"
            FINDINGS=$((FINDINGS + 1))
          }

          unavailable() {
            printf '::error title=%s::%s Not available - %s\n' "$1" "$2" "$3"
            FINDINGS=$((FINDINGS + 1))
          }

          conclude() {
            if [ "${FINDINGS}" -ne 0 ]; then
              printf '%s: %d finding(s) reported above; see docs/validation-gates.md.\n' \
                "$1" "${FINDINGS}"
              exit 1
            fi
            printf '%s: no findings.\n' "$1"
          }
          REPORTER
          echo "Reporter installed at ${RUNNER_TEMP}/finding.sh"

      # ----------------------------------------------------------------------
      # The launcher is the root of the build's integrity, so it is validated
      # rather than trusted. Two boundary conditions make the sharpened form
      # necessary, and neither is visible from a mere existence check:
      #
      #   - a BLANK distributionSha256Sum silently disables integrity
      #     verification altogether. The build still succeeds and exits 0 having
      #     checked nothing, which is the worst possible failure shape.
      #   - an UPPERCASE hex value passes on Linux and therefore on this runner,
      #     but fails only on Windows, because that launcher lowercases the hash
      #     it computes and then compares verbatim. A silent platform asymmetry
      #     is exactly what a CI assertion should catch on behalf of a developer
      #     who has no Windows machine to discover it on.
      #
      # There is deliberately NO assertion about a wrapper jar. distributionType
      # is only-script, which means the launcher is a script that downloads and
      # checksums a distribution; no jar is committed and none should be.
      # ----------------------------------------------------------------------
      - name: Assert the Maven wrapper pins a checksum-verified distribution
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          if [ ! -f mvnw ]; then
            unavailable Blocker mvnw 'the launcher is absent; restore it and mark it executable'
          elif [ ! -x mvnw ]; then
            remedy='run "git update-index --chmod=+x mvnw" and commit the mode change, or every job must'
            remedy="${remedy}"' invoke it through an interpreter.'
            finding Blocker mvnw 'file mode' 'executable' 'not executable' \
              "${remedy}"
          else
            printf 'mvnw is present and executable.\n'
          fi

          if [ ! -f mvnw.cmd ]; then
            finding Medium mvnw.cmd 'presence' 'present' 'absent' \
              'restore the Windows launcher. Without it the build is reproducible on Unix only.'
          else
            printf 'mvnw.cmd is present.\n'
          fi

          if [ ! -s "${WRAPPER_PROPERTIES}" ]; then
            unavailable Blocker "${WRAPPER_PROPERTIES}" \
              'the distribution coordinates and checksum are absent, so nothing pins the Maven version'
            conclude 'Maven wrapper'
          fi

          # Key by key, each asserted against its exact expected form.
          if ! grep -qE '^wrapperVersion=3\.3\.4$' "${WRAPPER_PROPERTIES}"; then
            remedy='pin the wrapper version exactly; a floating value reintroduces the nondeterminism'
            remedy="${remedy}"' this file exists to remove.'
            finding Medium "${WRAPPER_PROPERTIES}" wrapperVersion '3.3.4' \
              "$(grep -E '^wrapperVersion=' "${WRAPPER_PROPERTIES}" || echo absent)" \
              "${remedy}"
          fi

          if ! grep -qE '^distributionType=only-script$' "${WRAPPER_PROPERTIES}"; then
            remedy='keep the script-only launcher. Any other type expects a committed wrapper jar, which'
            remedy="${remedy}"' this repository deliberately does not carry.'
            finding Medium "${WRAPPER_PROPERTIES}" distributionType 'only-script' \
              "$(grep -E '^distributionType=' "${WRAPPER_PROPERTIES}" || echo absent)" \
              "${remedy}"
          fi

          if ! grep -qE '^distributionUrl=https://.*apache-maven-3\.9\.11-bin\.zip$' \
              "${WRAPPER_PROPERTIES}"; then
            remedy='pin the exact -bin.zip distribution over https. The launcher rejects a URL that does'
            remedy="${remedy}"' not end in -bin.zip, so pinning the .tar.gz is not an option.'
            finding Blocker "${WRAPPER_PROPERTIES}" distributionUrl \
              "an https URL ending in apache-maven-${MAVEN_VERSION}-bin.zip" \
              "$(grep -E '^distributionUrl=' "${WRAPPER_PROPERTIES}" || echo absent)" \
              "${remedy}"
          fi

          # The checksum must be present, exactly 64 characters, and LOWERCASE.
          if ! grep -qE '^distributionSha256Sum=[0-9a-f]{64}$' "${WRAPPER_PROPERTIES}"; then
            remedy='restore the published SHA-256 in lowercase. A blank value disables verification'
            remedy="${remedy}"' entirely while still exiting 0, and an uppercase value passes here but fails only on'
            remedy="${remedy}"' Windows.'
            finding Blocker "${WRAPPER_PROPERTIES}" distributionSha256Sum \
              '64 lowercase hexadecimal characters' \
              "$(grep -E '^distributionSha256Sum=' "${WRAPPER_PROPERTIES}" \
                 | sed 's/=.*/=<redacted-shape-mismatch>/' || echo absent)" \
              "${remedy}"
          else
            printf '%s pins Apache Maven %s with a 64-character lowercase SHA-256.\n' \
              "${WRAPPER_PROPERTIES}" "${MAVEN_VERSION}"
          fi

          # Failure mode 10, reported rather than enforced, and stated against
          # what the committed launcher does rather than what the upstream one
          # does. Without unzip the upstream launcher retargets the URL at a
          # .tar.gz and then fails the zip checksum claiming a possibly
          # compromised distribution. That is upstream only: mvnw's DELIBERATE DIVERGENCES block records
          # the divergence, :374-395 expands the pinned zip with the JDK jar tool
          # when unzip is missing, and :696-703 refuses any URL that is not
          # apache-maven-<version>-bin.zip.
          # So an absent unzip does not produce a checksum failure here, and a
          # checksum failure must not be diagnosed as an absent unzip.
          #
          # None of the three is a finding, because each is needed only when the
          # distribution must actually be downloaded and extracted: a runner whose
          # wrapper cache already holds the pinned distribution invokes none of
          # them, and failing such a run would be a false positive on a build that
          # works. A gate that fails a working build is how gates lose their
          # audience. The authoritative check is therefore the next step, which
          # asserts the wrapper really did resolve the pinned version - the
          # observable outcome rather than a proxy for it.
          #
          # unzip is reported separately from the download tools because its
          # absence has a documented fallback and theirs does not.
          if command -v unzip > /dev/null 2>&1; then
            printf 'available unzip\n'
          else
            note="::warning title=Low::${WRAPPER_PROPERTIES} [runner tool: unzip]"
            note="${note}"' expected: available on PATH | actual: absent |'
            note="${note}"' remediation: none required in most cases - the launcher'
            note="${note}"' expands the pinned zip with $JAVA_HOME/bin/jar instead, and'
            note="${note}"' a JDK is already a prerequisite. Install unzip only if the'
            note="${note}"' launcher reports that neither it nor the jar tool is'
            note="${note}"' available. Never blank the checksum and never pin the'
            note="${note}"' .tar.gz.'
            printf '%s\n' "${note}"
          fi
          if command -v curl > /dev/null 2>&1 || command -v wget > /dev/null 2>&1; then
            printf 'available at least one of curl, wget\n'
          else
            note="::warning title=Low::${WRAPPER_PROPERTIES} [runner tool: curl or wget]"
            note="${note}"' expected: at least one on PATH | actual: neither |'
            note="${note}"' remediation: install one. The launcher tries curl, then'
            note="${note}"' wget, then fails explicitly - it deliberately does not'
            note="${note}"' compile a Java downloader as a third fallback.'
            printf '%s\n' "${note}"
          fi

          conclude 'Maven wrapper'

      - name: Assert the toolchain is JDK ${{ env.JAVA_RUNTIME_VERSION }} and Maven ${{ env.MAVEN_VERSION }}
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          # The COMPLETE patch and build number, not the feature digit. A feature
          # assertion passes on any 25.x, which is how CI came to compile the
          # delivered bytecode on a JDK that matched neither Dockerfile stage.
          #
          # java.runtime.version is read rather than java.version because only the
          # former carries the build number: java.version is "25.0.3" for both
          # 25.0.3+9 and a hypothetical 25.0.3+10 rebuild, whereas
          # java.runtime.version is "25.0.3+9-LTS". The comparison is against the
          # same value the Dockerfile build stage asserts for itself, so CI and
          # both image stages are held to ONE number by construction.
          java -version
          java_runtime="$(java -XshowSettings:properties -version 2>&1 \
            | sed -n 's/^ *java\.runtime\.version = //p' | head -n 1)"
          if [ "${java_runtime}" != "${JAVA_RUNTIME_VERSION}" ]; then
            remedy='align this workflow, the Dockerfile build stage and the Dockerfile runtime stage on ONE'
            remedy="${remedy}"' Temurin build. Correct JAVA_PATCH_VERSION and JAVA_RUNTIME_VERSION here, or the'
            remedy="${remedy}"' digest-pinned base images there, so all three carry the same value. Do NOT relax'
            remedy="${remedy}"' this back to a feature version to make it pass: a feature version is resolved by'
            remedy="${remedy}"' the setup action as the latest release in the line, which is what made the three'
            remedy="${remedy}"' surfaces diverge. Never fall back to Java 21 or 17, and never hardcode a host JDK'
            remedy="${remedy}"' path - the action supplies JAVA_HOME. Moving the line to a newer patch such as'
            remedy="${remedy}"' 25.0.4 is a toolchain pin move and needs approval, not a quiet edit.'
            finding Blocker Dockerfile 'JDK build number, shared by CI and both image stages' \
              "${JAVA_RUNTIME_VERSION}" "${java_runtime:-unreadable}" \
              "${remedy}"
          else
            printf 'JDK %s - the exact build the Dockerfile build and runtime stages both carry.\n' \
              "${java_runtime}"
          fi

          # The wrapper, never a host or marketplace Maven. This is also the
          # check that proves removing the marketplace install step was safe.
          ./mvnw --version
          resolved="$(./mvnw --version 2>/dev/null \
            | sed -n 's/^Apache Maven \([0-9][^ ]*\).*/\1/p' | head -n 1)"
          if [ "${resolved}" != "${MAVEN_VERSION}" ]; then
            remedy='correct the distributionUrl and its checksum in that file, which is the single source'
            remedy="${remedy}"' of this version. Do not install a Maven beside the wrapper, and do not accept 3.9.9'
            remedy="${remedy}"' or the 3.8 line.'
            finding Blocker "${WRAPPER_PROPERTIES}" 'resolved Apache Maven version' \
              "${MAVEN_VERSION}" "${resolved:-unreadable}" \
              "${remedy}"
          else
            printf 'Apache Maven %s, resolved by the checksum-verified wrapper.\n' "${resolved}"
          fi

          conclude 'Toolchain'

      # ----------------------------------------------------------------------
      # THE BUILD-BREAKING COORDINATE RENAME, asserted in both halves.
      #
      # The Testcontainers 2.x line renamed every module artefact, so the bare
      # 1.x coordinates - org.testcontainers localstack, postgresql and
      # junit-jupiter - DO NOT EXIST at the pinned version and fail resolution
      # outright. Compounding that, Spring Boot already manages a 1.x version and
      # imports the Testcontainers bill of materials itself, so declaring a
      # competing import yields an ordering-dependent resolution that can
      # silently select 1.x.
      #
      # The remedy has two halves and BOTH are required, which is why both are
      # asserted: override the VERSION PROPERTY, and use only prefixed
      # coordinates. Overriding without renaming resolves artefacts that do not
      # exist; renaming without overriding resolves the wrong version. Either
      # half alone still fails, and each half's failure looks nothing like the
      # other's.
      # ----------------------------------------------------------------------
      - name: Assert the Testcontainers coordinate contract
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          expected_version=2.0.3

          declared="$(sed -n 's:.*<testcontainers\.version>\([^<]*\)</testcontainers\.version>.*:\1:p' \
            pom.xml | head -n 1)"
          if [ "${declared}" != "${expected_version}" ]; then
            remedy='set the version property to the pinned value. This is half one of the remedy; without'
            remedy="${remedy}"' it the managed 1.x version wins.'
            finding Blocker pom.xml 'testcontainers.version property' \
              "${expected_version}" "${declared:-absent}" \
              "${remedy}"
          else
            printf 'testcontainers.version property is %s.\n' "${declared}"
          fi

          if grep -q 'testcontainers-bom' pom.xml; then
            remedy='remove the import. A second bill of materials competes with the one Spring Boot'
            remedy="${remedy}"' already imports and makes resolution ordering-dependent.'
            finding Blocker pom.xml 'testcontainers-bom import' \
              'no import; the version property is the only lever' 'an import is declared' \
              "${remedy}"
          else
            printf 'No competing Testcontainers bill of materials is imported.\n'
          fi

          # Exactly the four prefixed module artefacts, each asserted by name.
          for module in testcontainers testcontainers-localstack \
                        testcontainers-postgresql testcontainers-junit-jupiter; do
            if ! grep -qE "<artifactId>${module}</artifactId>" pom.xml; then
              finding Blocker pom.xml "artifactId ${module}" 'declared' 'absent' \
                'declare the prefixed module artefact. This is half two of the remedy.'
            else
              printf 'prefixed module present: %s\n' "${module}"
            fi
          done

          # And zero bare 1.x module coordinates, matched only inside an
          # org.testcontainers dependency block so an unrelated artefact of the
          # same short name elsewhere cannot trigger a false finding.
          bare="$(awk '
            /<groupId>org\.testcontainers<\/groupId>/ { pending = 1; next }
            pending && /<artifactId>/ {
              line = $0
              sub(/.*<artifactId>/, "", line)
              sub(/<\/artifactId>.*/, "", line)
              if (line == "localstack" || line == "postgresql" || line == "junit-jupiter") {
                print "org.testcontainers:" line
              }
              pending = 0
            }
          ' pom.xml)"
          if [ -n "${bare}" ]; then
            remedy='rename each to its prefixed form. These coordinates do not exist at the pinned'
            remedy="${remedy}"' version and fail resolution outright.'
            finding Blocker pom.xml 'bare Testcontainers module coordinate' \
              'none' "$(printf '%s' "${bare}" | tr '\n' ' ')" \
              "${remedy}"
          else
            printf 'No bare Testcontainers module coordinate is declared.\n'
          fi

          conclude 'Testcontainers coordinates'

      # Reported, not asserted. The runner's Docker version is whatever the
      # image ships and this project does not pin it - docs/project-guide.md:522
      # records 28.x while the authoring host measured a later release, so a
      # pinned assertion would fail for a reason unrelated to this codebase. What
      # matters is that a runtime is present, because the integration and
      # end-to-end tiers start real containers through Testcontainers.
      - name: Report the container runtime available to Testcontainers
        run: |
          set -euo pipefail
          docker --version
          docker compose version
          docker info --format 'server version: {{.ServerVersion}} | storage driver: {{.Driver}}'

      # ----------------------------------------------------------------------
      # THE GATE. One command, no overrides, nonzero exit preserved.
      #
      # Deliberately absent: -DskipTests, -DskipITs and -Dmaven.test.skip, so the
      # unit, integration and end-to-end tiers all really run; continue-on-error,
      # a trailing "|| true" and "set +e", so a failure is a failure; and any
      # -Dtest or -Dit.test selector, because pom.xml already configures Failsafe
      # with path-based includes for **/integration/** and **/e2e/** - the
      # integration and end-to-end classes end in Test, not IT, so a
      # workflow-side selector would silently narrow the run.
      #
      # No skip is passed for the vulnerability scan either. pom.xml sets no skip
      # element, so the scan runs by default and this one command therefore
      # enforces all six gates it configures: the zero-warning compile, the three
      # test tiers, the coverage floor, the toolchain floors and the scan. A
      # skipped, blocked or partially completed scan is not a passing gate.
      #
      # This is character for character the command docs/validation-gates.md
      # documents and the command CONTRIBUTING.md:34 asks a contributor to run
      # locally, so a red result here is reproducible on a developer machine.
      # ----------------------------------------------------------------------
      - name: Verify - compile warning-free, run every tier, enforce every gate
        env:
          # Optional and read from the environment, never committed and never
          # printed. The scan works on public retrieval without it, at a lower
          # request rate; pom.xml names the variable rather than materialising
          # its value, so it never reaches a command line or the process table.
          # When it is unset this step does NOT fail: failing because a
          # maintainer has not configured an optional key would be the
          # environment-specific assumption Rule 1 clause C forbids.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          # Stamped BEFORE Maven starts, and outside target/ so `clean` cannot
          # remove it. Every report this build produces must be newer than this
          # instant, which is what lets the reconciliation below distinguish a
          # report this run wrote from one left behind by an earlier tree. In CI
          # the workspace is fresh so staleness is already impossible; the stamp
          # makes the same check meaningful when a maintainer runs these steps
          # locally against a warm target/, which is where a stale report can
          # otherwise satisfy an existence test.
          date -u '+%s' > "${RUNNER_TEMP}/verify-started-at-epoch"
          ./mvnw --batch-mode --no-transfer-progress clean verify

      # ----------------------------------------------------------------------
      # TEST-COLLECTION AUDIT: the testcase element count is the authority.
      #
      # Surefire writes one report per top-level test class and records every
      # JUnit 5 nested case as a testcase element inside it, but it does NOT roll
      # those cases up into the root testsuite "tests" attribute. A class whose
      # cases all live in nested groups therefore advertises tests="0" while
      # carrying many elements. The cases really do run - Maven's own console
      # summary and the elements agree - but any consumer that sums the suite
      # attributes reads a fraction of the real total and can report
      # undercollection on a green build.
      #
      # This step makes the element count authoritative and refuses the attribute
      # sum as a substitute. It fails when nothing was collected at all, and when
      # any case failed or errored - including a failure inside a nested group of
      # a suite advertising zero, which an attribute-only consumer cannot see. The
      # discrepancy is reported rather than tolerated silently, and falls to zero
      # on its own once a provider that performs the roll-up is available, at
      # which point this step keeps working unchanged.
      #
      # No count is asserted against a fixed expected total, deliberately. The
      # suite size is a property of the test tree, not a contract of this file,
      # and hardcoding a figure here would turn every added test into a CI
      # failure. What is asserted is what actually matters: that cases were
      # collected, and that none of them failed.
      # ----------------------------------------------------------------------
      - name: Audit test collection - testcase elements are the authoritative total
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          failed = 0
          collected = 0
          attribute_sum = 0
          under_advertising = 0
          suites = 0

          for directory in ("target/surefire-reports", "target/failsafe-reports"):
              for report in sorted(glob.glob(directory + "/TEST-*.xml")):
                  root = ET.parse(report).getroot()
                  cases = list(root.iter("testcase"))
                  advertised = int(root.get("tests") or 0)
                  suites += 1
                  collected += len(cases)
                  attribute_sum += advertised
                  if advertised < len(cases):
                      under_advertising += 1
                  for case in cases:
                      if case.find("failure") is not None or case.find("error") is not None:
                          failed += 1
                          print("FAILED: {}#{}".format(
                              case.get("classname"), case.get("name")))

          print("suite reports                 : {}".format(suites))
          print("testcase elements (AUTHORITY) : {}".format(collected))
          print("suite tests attribute sum     : {}".format(attribute_sum))
          print("suites under-advertising      : {}".format(under_advertising))
          print("failed or errored cases       : {}".format(failed))

          if suites == 0 or collected == 0:
              sys.exit("::error title=Blocker::target/surefire-reports and "
                       "target/failsafe-reports [testcase elements] expected: at least "
                       "one collected case | actual: none | remediation: the reports are "
                       "missing or empty, so no tier ran. Check the compile step and "
                       "confirm no skip flag reached Maven.")
          if failed:
              sys.exit("::error title=Blocker::target/surefire-reports and "
                       "target/failsafe-reports [testcase outcome] expected: zero "
                       "failures | actual: {} failed or errored | remediation: fix the "
                       "cases named above.".format(failed))
          if attribute_sum < collected:
              print(
                  "NOTE: the suite tests attributes under-report by {} case(s) across "
                  "{} suite(s), because Surefire does not roll JUnit 5 nested cases up "
                  "into the root testsuite tests attribute. Suite-attribute-only "
                  "aggregation is therefore REJECTED for this repository: the element "
                  "count above is authoritative, and this step has already asserted "
                  "that none of those cases failed.".format(
                      collected - attribute_sum, under_advertising))
          PY

      # ----------------------------------------------------------------------
      # COLLECTION COMPLETENESS: the test TREE is the authority for what should
      # have run, and the reports are reconciled against it.
      #
      # WHY THE AUDIT ABOVE IS NOT SUFFICIENT, stated plainly because the two
      # steps look similar. That step asserts that cases were collected and that
      # none failed. It deliberately asserts no total - a hardcoded figure would
      # turn every added test into a CI failure - and that is exactly the hole:
      # a whole suite, or a whole package, can stop being collected while the
      # aggregate element count stays large, nonzero and green. Nothing in an
      # aggregate can report an absence.
      #
      # This step closes it without hardcoding anything. The expected set is
      # DERIVED from the tree: every *Test.java / *Tests.java source is expected
      # to produce exactly one report, in the directory its own path determines -
      # Failsafe for anything under integration/ or e2e/, Surefire otherwise,
      # which is precisely the split pom.xml configures. Abstract suites are
      # excluded by reading the source for an `abstract class` declaration rather
      # than by naming them here, so adding or removing one needs no edit.
      #
      # Five distinct failures are separated, because they have different causes
      # and different fixes:
      #   MISSING       a source exists and produced no report - the TEST-013
      #                 hole: deleted from a selection, filtered by a stale
      #                 pattern, or silently not compiled.
      #   EMPTY         a report exists carrying zero cases.
      #   WRONG PLUGIN  the report is in the other tier's directory, which means
      #                 the class moved package without moving directory.
      #   DUPLICATED    both tiers reported it, so it ran twice and one of the
      #                 two runs is meaningless.
      #   ORPHAN        a report exists with no source, which is a leftover from
      #                 an earlier tree being read as current evidence.
      #   STALE         a report predates this build's start stamp.
      #
      # A source NOT named like a suite is support code, and support code must
      # declare no @Test - otherwise renaming a suite is a way to remove it from
      # collection while leaving its cases in the tree. The unit tier asserts the
      # same property, and that is not a reason to omit it here: a test can only
      # prove it if it was itself collected, which is the very thing under audit.
      # ----------------------------------------------------------------------
      - name: Reconcile every suite in the tree against the report it produced
        if: always()
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"
          python3 - <<'PY'
          import glob
          import os
          import re
          import sys
          import xml.etree.ElementTree as ET

          TEST_ROOT = "src/test/java"
          SUITE_NAME = re.compile(r".*Tests?\.java$")
          TEST_ANNOTATION = re.compile(r"@Test\b")
          SUREFIRE = "target/surefire-reports"
          FAILSAFE = "target/failsafe-reports"
          TIERS = (SUREFIRE, FAILSAFE)

          started_at = 0
          stamp = os.path.join(os.environ.get("RUNNER_TEMP", "."), "verify-started-at-epoch")
          if os.path.isfile(stamp):
              with open(stamp, encoding="utf-8") as handle:
                  started_at = int(handle.read().strip() or 0)

          if not os.path.isdir(TEST_ROOT):
              sys.exit("::error title=Blocker::{} [test tree] expected: the test sources | actual: the "
                       "directory does not exist | remediation: the checkout is incomplete; nothing about "
                       "collection can be concluded.".format(TEST_ROOT))

          expected = {}
          support = []
          abstract = []

          for directory, _, files in os.walk(TEST_ROOT):
              for name in sorted(files):
                  if not name.endswith(".java"):
                      continue
                  path = os.path.join(directory, name)
                  relative = "/" + os.path.relpath(path, TEST_ROOT).replace(os.sep, "/")
                  fqcn = relative[1:-len(".java")].replace("/", ".")
                  with open(path, encoding="utf-8") as source:
                      text = source.read()
                  if not SUITE_NAME.match(name):
                      support.append((fqcn, len(TEST_ANNOTATION.findall(text))))
                      continue
                  simple = name[:-len(".java")]
                  if re.search(r"\babstract\s+class\s+" + re.escape(simple) + r"\b", text):
                      abstract.append(fqcn)
                      continue
                  expected[fqcn] = FAILSAFE if ("/integration/" in relative
                                                or "/e2e/" in relative) else SUREFIRE

          def report_for(tier, fqcn):
              return os.path.join(tier, "TEST-{}.xml".format(fqcn))

          missing, empty, wrong_plugin, duplicated, stale = [], [], [], [], []
          matched = 0
          for fqcn in sorted(expected):
              tier = expected[fqcn]
              mine = report_for(tier, fqcn)
              elsewhere = [other for other in TIERS
                           if other != tier and os.path.isfile(report_for(other, fqcn))]
              if os.path.isfile(mine):
                  matched += 1
                  if elsewhere:
                      duplicated.append("{} reported by both tiers".format(fqcn))
                  root = ET.parse(mine).getroot()
                  if not list(root.iter("testcase")):
                      empty.append(fqcn)
                  if started_at and os.path.getmtime(mine) < started_at:
                      stale.append(fqcn)
              elif elsewhere:
                  wrong_plugin.append("{} reported by {} but its path assigns it to {}".format(
                      fqcn, elsewhere[0], tier))
              else:
                  missing.append("{} -> no {}".format(fqcn, mine))

          on_disk = set()
          for tier in TIERS:
              for report in glob.glob(tier + "/TEST-*.xml"):
                  on_disk.add(os.path.basename(report)[len("TEST-"):-len(".xml")])
          orphan = sorted(on_disk - set(expected))
          hiding = ["{} declares {} @Test".format(name, count) for name, count in support if count]

          tiers_seen = {"unit": 0, "integration": 0, "e2e": 0}
          for fqcn in expected:
              for tier_name in tiers_seen:
                  if ".{}.".format(tier_name) in fqcn:
                      tiers_seen[tier_name] += 1

          print("expected suites (DERIVED from the tree) : {}".format(len(expected)))
          print("  Surefire / Failsafe                   : {} / {}".format(
              sum(1 for t in expected.values() if t == SUREFIRE),
              sum(1 for t in expected.values() if t == FAILSAFE)))
          print("  per tier                              : {}".format(tiers_seen))
          print("reports matched                          : {}".format(matched))
          print("abstract suites excluded                 : {}".format(len(abstract)))
          print("support sources (no @Test permitted)     : {}".format(len(support)))
          print("build start stamp (epoch, 0 = absent)    : {}".format(started_at))

          def report(kind, offenders, remediation):
              if not offenders:
                  return 0
              shown = offenders[:20]
              print("::error title=Blocker::{} [{}] expected: none | actual: {} | remediation: {}".format(
                  TEST_ROOT, kind, len(offenders), remediation))
              for offender in shown:
                  print("  {} {}".format(kind, offender))
              if len(offenders) > len(shown):
                  print("  ... and {} more".format(len(offenders) - len(shown)))
              return 1

          problems = 0
          problems += report("MISSING REPORT", missing,
                             "a suite in the tree produced no report, so it did not run. Confirm no test "
                             "selection property reached Maven and that the source compiles.")
          problems += report("EMPTY REPORT", empty,
                             "the suite reported zero cases; check for a disabled class or an empty tag "
                             "filter.")
          problems += report("WRONG PLUGIN", wrong_plugin,
                             "move the source into the directory its package implies, so exactly one plugin "
                             "owns it.")
          problems += report("DUPLICATED", duplicated,
                             "both plugins collected it; narrow the include patterns in pom.xml.")
          problems += report("ORPHAN REPORT", orphan,
                             "a report has no source. Run `clean` so an earlier tree's evidence is not read "
                             "as this one's.")
          problems += report("STALE REPORT", stale,
                             "the report predates this build. Run `clean verify` rather than a bare test "
                             "goal against a warm target/.")
          problems += report("HIDDEN SUITE", hiding,
                             "a support-named source declares test methods, which keeps them out of both "
                             "plugins' include patterns. Rename it to end in Test or move the methods.")

          if not expected:
              sys.exit("::error title=Blocker::{} [expected suites] expected: at least one | actual: none | "
                       "remediation: the walk matched nothing, so this audit proved nothing.".format(
                           TEST_ROOT))
          for tier_name, count in tiers_seen.items():
              if count == 0:
                  problems += 1
                  print("::error title=Blocker::{} [{} tier] expected: at least one suite | actual: none | "
                        "remediation: a whole tier is absent from the tree, which an aggregate count cannot "
                        "report.".format(TEST_ROOT, tier_name))

          if problems:
              sys.exit("Collection reconciliation: {} problem class(es) reported above.".format(problems))
          print("Collection reconciliation: every one of the {} suites in the tree produced exactly one "
                "report, in the right tier, non-empty and newer than the build stamp.".format(len(expected)))
          PY

      # ----------------------------------------------------------------------
      # THE GATE HARNESS SPECIFICALLY: its own report, its own raw marker, and
      # the commit both describe.
      #
      # The reconciliation above proves that every suite named like one produced
      # a report. That is a set property, and the eight validation gates rest on
      # ONE named class, so its presence is asserted by name here rather than
      # inferred from a set. The harness also writes a marker while it executes,
      # which is the only artefact that distinguishes "ran and passed" from
      # "never collected" - but a marker the workflow neither requires nor reads
      # proves nothing to the workflow, and a marker with no commit in it cannot
      # be told apart from one left over from an earlier tree. So all three are
      # required: the exact report, the raw marker, and a commit inside the
      # marker equal to the commit this job checked out.
      #
      # The commit is compared against `git rev-parse HEAD` in the workspace
      # rather than against github.sha, deliberately: on a pull request those two
      # differ by design, and what matters is the tree that was actually tested.
      # ----------------------------------------------------------------------
      - name: Assert the gate harness ran, on this commit, and left its raw evidence
        if: always()
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          harness_report='target/failsafe-reports/TEST-com.cardemo.e2e.GateVerificationTest.xml'
          marker='target/gate-verification/gate-verification-evidence.properties'
          summary='target/gate-verification/gate-verification-summary.properties'

          if [ ! -f "${harness_report}" ]; then
            unavailable Blocker "${harness_report}" \
              'the gate harness produced no report of its own, so no gate was asserted by this run. Confirm the class is still at src/test/java/com/cardemo/e2e/GateVerificationTest.java and that the Failsafe include patterns still reach it'
          else
            cases="$(python3 -c 'import sys,xml.etree.ElementTree as ET; print(len(list(ET.parse(sys.argv[1]).getroot().iter("testcase"))))' "${harness_report}")"
            bad="$(python3 -c 'import sys,xml.etree.ElementTree as ET; r=ET.parse(sys.argv[1]).getroot(); print(sum(1 for c in r.iter("testcase") if c.find("failure") is not None or c.find("error") is not None))' "${harness_report}")"
            printf 'gate harness cases: %s, failed or errored: %s\n' "${cases}" "${bad}"
            if [ "${cases}" -lt 1 ]; then
              finding Blocker "${harness_report}" 'testcase elements' 'at least one gate asserted' \
                "${cases}" 'the harness was collected but asserted nothing; check for a disabled class.'
            fi
            if [ "${bad}" -ne 0 ]; then
              finding Blocker "${harness_report}" 'testcase outcome' 'zero failures' \
                "${bad} failed or errored" 'read the annotations above; a failing gate is a failing gate.'
            fi
          fi

          for artefact in "${marker}" "${summary}"; do
            if [ ! -s "${artefact}" ]; then
              unavailable Blocker "${artefact}" \
                'the harness wrote no raw evidence, so a silent non-run cannot be ruled out. This file is written by the harness while it executes; its absence after a completed build means the class never ran'
            else
              printf 'retained  %s (%s bytes)\n' "${artefact}" "$(wc -c < "${artefact}" | tr -d ' ')"
            fi
          done

          # Every one of the eight gates must have recorded at least one figure.
          # This is the assertion that a test count cannot make: 50 cases prove
          # that fifty things ran, not that all eight gates were among them, and
          # a hardcoded 50 would fail on every gate added. A per-gate key prefix
          # is derived from what the harness itself published, so a gate that
          # stops reporting is named here rather than absorbed into a total.
          if [ -s "${summary}" ]; then
            for gate in 1 2 3 4 5 6 7 8; do
              recorded="$(grep -c "^gate${gate}\." "${summary}" || true)"
              printf '  gate %s recorded %s figure(s)\n' "${gate}" "${recorded}"
              if [ "${recorded}" -eq 0 ]; then
                unavailable Blocker "${summary}" \
                  "gate ${gate} recorded no figure at all, so this run asserted nothing about it. A case count cannot substitute: it says how many assertions ran, not which gates they covered"
              fi
            done
          fi

          if [ -s "${marker}" ]; then
            checked_out="$(git rev-parse HEAD)"
            stamped="$(sed -n 's/^gate\.harness\.commit=//p' "${marker}" | head -n 1)"
            printf 'workspace commit: %s\nmarker commit   : %s\ngithub.sha      : %s\n' \
              "${checked_out}" "${stamped:-<absent>}" "${GITHUB_SHA}"
            if [ -z "${stamped}" ]; then
              finding Blocker "${marker}" 'gate.harness.commit' 'the commit under test' 'absent' \
                'the harness must stamp the commit it ran against, otherwise a leftover marker from an earlier tree is indistinguishable from a fresh one.'
            elif [ "${stamped}" != "${checked_out}" ]; then
              finding Blocker "${marker}" 'gate.harness.commit' "${checked_out}" "${stamped}" \
                'the retained evidence describes a different tree than the one this job checked out. Run clean verify on this commit.'
            fi
          fi

          conclude 'Gate harness evidence'

      # A green build that produced no report is not evidence, so the four
      # required reports are asserted to exist. This step runs only after the
      # gate above succeeded, which is when their absence would be genuinely
      # anomalous rather than an expected consequence of an earlier failure.
      - name: Assert every required report was produced
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          expect_report() {
            if [ ! -e "$1" ]; then
              unavailable High "$1" "$2"
            else
              printf 'produced  %s\n' "$1"
            fi
          }

          expect_report target/surefire-reports \
            'the unit tier produced no report, so its result cannot be evidenced'
          expect_report target/failsafe-reports \
            'the integration and end-to-end tiers produced no report; confirm Failsafe ran'
          expect_report target/site/jacoco/index.html \
            'the merged coverage report is absent, so the line-coverage floor cannot be evidenced'
          expect_report target/carddemo-1.0.0.jar \
            'the executable archive was not packaged, so there is nothing for the image build to ship'

          if ! ls target/site/jacoco/jacoco*.xml > /dev/null 2>&1; then
            remedy='the machine-readable coverage report is absent; a human-readable report alone cannot'
            remedy="${remedy}"' be consumed by a coverage tool'
            unavailable High 'target/site/jacoco/jacoco*.xml' \
              "${remedy}"
          else
            printf 'produced  %s\n' "$(ls target/site/jacoco/jacoco*.xml | head -n 1)"
          fi

          # The vulnerability scan writes HTML, JSON and SARIF into its own
          # directory. Its absence after a successful verify means the goal did
          # not execute, which is the "skipped scan read as a clean scan" failure
          # that must never pass silently.
          if [ ! -d target/dependency-check ]; then
            remedy='the vulnerability scan produced no report after a successful verify, so the gate did'
            remedy="${remedy}"' not execute. Confirm no skip property and no offline mode reached Maven, and that the'
            remedy="${remedy}"' feed was reachable'
            unavailable Blocker target/dependency-check \
              "${remedy}"
          else
            printf 'produced  %s\n' 'target/dependency-check'
          fi

          conclude 'Required reports'

      # ----------------------------------------------------------------------
      # Evidence upload. if: always() is what makes a FAILING run still publish
      # its reports, which is what CONTRIBUTING.md:37 relies on when it asks a
      # contributor to act on automated CI feedback in the pull request.
      #
      # if-no-files-found is "error" on every required report and never "ignore".
      # ignore is precisely the setting that turns a missing report into a silent
      # no-op, and Rule 1 clause B requires a boundary condition to be handled
      # explicitly rather than hidden. On a run that failed before the tiers
      # executed this surfaces a second annotation, and that is intended: it
      # states that the tiers produced nothing, which is information.
      #
      # THE COST OF THAT CHOICE, MEASURED AND ACCEPTED RATHER THAN OVERLOOKED.
      # A review observed the consequence precisely: after a test-tier failure
      # `target/site/jacoco` and `target/gate-verification` do not exist, because
      # both are written at verify, so these two uploads annotate a run that is
      # already red. That is noise on a failed run and it is never a false green -
      # an absent artifact cannot make a red run look green, and the run's own
      # conclusion is the signal a reader acts on. "warn" was the alternative
      # considered and refused: it would remove the annotation on a red run at the
      # cost of the ONE setting that says an evidence artifact is required, and the
      # asymmetry is what decides it - a missing report on a red run is expected
      # and reported twice, while a missing report on a GREEN run is a defect that
      # must not pass. That case is caught twice over: the
      # "Assert every required report was produced" step above fails the job
      # before any upload runs, and "error" here is the second line of defence for
      # a report produced but empty. Keeping both is deliberate.
      # ----------------------------------------------------------------------
      - name: Upload the Surefire and Failsafe reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      # The harness's raw marker and summary, retained unaltered. The gate
      # evidence job downloads this artifact and derives its document from these
      # figures, so the published evidence is a rendering of what the run
      # recorded rather than prose written alongside it.
      - name: Upload the gate harness raw evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-harness-raw-evidence
          path: target/gate-verification/**
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload the JaCoCo coverage report - XML and HTML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/**
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload the dependency vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dependency-check-report
          path: target/dependency-check/**
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload the executable archive
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: carddemo-executable-jar
          path: target/carddemo-*.jar
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ------------------------------------------------------------------
  # Gate 8. The committed topology is stood up and the substrate is exercised
  # for real: the schema the three migrations establish, the object store, the
  # queue and the scrape target. Every test tier above runs from an exploded
  # classpath, so the nested-archive layout the Dockerfile actually ships is
  # never exercised there - this job starts that artefact instead, which is a
  # structural gap the verify job cannot close however many tests it runs.
  # ------------------------------------------------------------------
  integration:
    name: Container topology, migrations, object store, queue and scrape target
    needs: verify
    runs-on: ubuntu-24.04
    # Builds the image, then brings seven services to healthy and exercises them.
    # `up --wait` carries its own 420-second deadline, so a topology that never
    # becomes healthy already fails inside this ceiling; what this bounds is the
    # rest - an image build, a pull and a dozen probe steps - none of which has a
    # deadline of its own. Forty-five minutes is roughly three times the measured
    # run.
    timeout-minutes: 45
    env:
      # The bounded readiness the provisioning script honours. Named here so the
      # values are reviewable rather than implicit.
      INIT_MAX_ATTEMPTS: "30"
      INIT_SLEEP_SECONDS: "2"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the shared finding reporter
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/finding.sh" <<'REPORTER'
          FINDINGS=0

          finding() {
            printf '::error title=%s::%s [%s] expected: %s | actual: %s | remediation: %s\n' \
              "$1" "$2" "$3" "$4" "$5" "$6"
            FINDINGS=$((FINDINGS + 1))
          }

          unavailable() {
            printf '::error title=%s::%s Not available - %s\n' "$1" "$2" "$3"
            FINDINGS=$((FINDINGS + 1))
          }

          conclude() {
            if [ "${FINDINGS}" -ne 0 ]; then
              printf '%s: %d finding(s) reported above; see docs/validation-gates.md.\n' \
                "$1" "${FINDINGS}"
              exit 1
            fi
            printf '%s: no findings.\n' "$1"
          }
          REPORTER
          echo "Reporter installed at ${RUNNER_TEMP}/finding.sh"

      # ----------------------------------------------------------------------
      # Every value the topology needs is generated HERE, per run, registered
      # with the runner's masking mechanism so it cannot appear in a log, and
      # written to a gitignored .env that lives only on this runner. No
      # repository secret is referenced on any part of this path.
      #
      # The AWS values are explicitly non-production placeholders. The emulator
      # accepts any well-formed pair and both the application configuration and
      # the provisioning script refuse an endpoint host outside their shared
      # allowlist, so there is no live account, no live credential and no
      # reachable production endpoint anywhere in this job.
      # ----------------------------------------------------------------------
      - name: Generate the ephemeral, masked local environment
        run: |
          set -euo pipefail

          # generated <name> - a fresh value, masked before it is ever used.
          generated() {
            value="$(openssl rand -hex 32)"
            printf '::add-mask::%s\n' "${value}"
            printf '%s=%s\n' "$1" "${value}" >> .env
          }

          : > .env
          chmod 600 .env

          generated JWT_SIGNING_KEY
          generated POSTGRES_PASSWORD
          generated CARDDEMO_DB_APP_PASSWORD
          generated CARDDEMO_DB_MIGRATION_PASSWORD
          generated METRICS_SCRAPE_PASSWORD
          generated GRAFANA_ADMIN_PASSWORD

          # Non-secret settings. The emulator placeholders are deliberately the
          # literal word "test" so no reader can mistake them for real material.
          #
          # The two database ROLE NAMES belong here rather than above: a role
          # name is not a credential, and docker-compose.yml guards all four
          # least-privilege variables with `:?` - it no longer defaults either
          # name to the bootstrap POSTGRES_USER - so `docker compose config`
          # requires both to be present. Their two passwords are generated
          # above, like every other secret on this path.
          # They are spelled exactly as .env.example ships them, and the topology
          # validator below asserts that agreement on the RENDERED configuration
          # rather than trusting these two lines: a name without its password is
          # what used to let the runtime fall back to the bootstrap SUPERUSER.
          cat >> .env <<'PLAIN'
          CARDDEMO_DB_APP_USER=carddemo_app
          CARDDEMO_DB_MIGRATION_USER=carddemo_migrator
          GRAFANA_ADMIN_USER=carddemo-admin
          AWS_ACCESS_KEY_ID=test
          AWS_SECRET_ACCESS_KEY=test
          AWS_DEFAULT_REGION=us-east-1
          AWS_REGION=us-east-1
          CARDDEMO_BIND_ADDRESS=127.0.0.1
          SPRING_PROFILES_ACTIVE=local
          PLAIN

          printf 'Wrote %s assignments to a gitignored, runner-local .env.\n' \
            "$(wc -l < .env | tr -d ' ')"

          # .gitignore already excludes it; asserted rather than assumed, because
          # a tracked .env would put generated credentials into a commit.
          if ! git check-ignore --quiet .env; then
            note='::error title=Blocker::.gitignore [.env] expected: ignored |'
            note="${note}"' actual: tracked or untracked-but-not-ignored |'
            note="${note}"' remediation: add .env to .gitignore before this job can'
            note="${note}"' safely write one.'
            printf '%s\n' "${note}"
            exit 1
          fi

      # ----------------------------------------------------------------------
      # THE LOG SCRUBBER, BUILT AND SELF-TESTED BEFORE ANYTHING IS LOGGED.
      #
      # The uploaded container logs are the one artifact of this job that a human
      # reads, and they are collected from a running application handling seeded
      # customer data. Two things were wrong with scrubbing them inline at
      # collection time. First the rule set was incomplete: it redacted a
      # DASHED nine-digit national identifier and nothing else of that shape, so
      # `ssn=123456789` - the form a JSON payload, a bind-parameter log or a
      # constraint-violation message actually carries - survived into the
      # artifact. Second, and worse, the rules were written and applied in the
      # same step, so nothing ever demonstrated that any of them fires. A
      # redaction rule that silently matches nothing is indistinguishable from a
      # redaction rule that works, and the artifact is published either way.
      #
      # So the rules are built here, then run against a fixture that contains one
      # instance of every shape they claim to cover, and the step fails unless
      # each secret is gone AND its marker is present. The fixture is asserted to
      # have contained the value BEFORE scrubbing too, so a rule cannot pass by
      # being tested against input that never held the thing it removes.
      #
      # Over-reach is asserted against as well. An unlabelled nine-digit number
      # is an account or transaction identifier in this domain, not a national
      # one, and redacting it would destroy exactly the diagnostic value the logs
      # are collected for. The label-aware rule keeps its label and replaces only
      # the digits.
      # ----------------------------------------------------------------------
      - name: Build and self-test the container log scrubber
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          scrubber="${RUNNER_TEMP}/scrub.sed"
          : > "${scrubber}"

          # Every generated value, replaced BY VALUE rather than by shape. This
          # half cannot be tested against a fixture without putting the real
          # values in one, so the fixture below uses the values themselves,
          # which are already masked in this runner's log output.
          while IFS='=' read -r name value; do
            case "${name}" in
              JWT_SIGNING_KEY|POSTGRES_PASSWORD|CARDDEMO_DB_APP_PASSWORD|\
              CARDDEMO_DB_MIGRATION_PASSWORD|METRICS_SCRAPE_PASSWORD|GRAFANA_ADMIN_PASSWORD)
                printf 's|%s|REDACTED_%s|g\n' "${value}" "${name}" >> "${scrubber}"
                ;;
              *) ;;
            esac
          done < .env

          # And by shape, for anything the application itself may have emitted.
          #
          # The label-aware rule preserves the label through a back-reference and
          # is case-insensitive, because the same field is written CUST-SSN in the
          # copybook, ssn in JSON and socialSecurityNumber in a method name.
          #
          # IT USES # AS ITS DELIMITER, and that is load-bearing rather than
          # stylistic: with | as the delimiter, the \| inside the pattern is read
          # as an ESCAPED DELIMITER - a literal pipe - and not as alternation, so
          # the rule compiles, runs, matches nothing and reports nothing. The
          # self-test below is what caught exactly that.
          cat >> "${scrubber}" <<'SHAPES'
          s|[0-9]\{3\}-[0-9]\{2\}-[0-9]\{4\}|REDACTED_NATIONAL_ID|g
          s#\(ssn\|social[ _-]*security\([ _-]*number\)\?\|national[ _-]*id\(entifier\)\?\)\([^0-9A-Za-z]\{0,4\}\)[0-9]\{9\}#\1\4REDACTED_NATIONAL_ID#gI
          s|\$2[aby]\$[0-9]\{2\}\$[A-Za-z0-9./]\{53\}|REDACTED_PASSWORD_HASH|g
          s|eyJ[A-Za-z0-9_-]\{6,\}\.[A-Za-z0-9_-]\{6,\}\.[A-Za-z0-9_-]\{6,\}|REDACTED_JWT|g
          s|[Bb]earer [A-Za-z0-9._~+/-]\{16,\}=*|Bearer REDACTED_TOKEN|g
          SHAPES

          printf 'Scrubber built with %s rule(s).\n' \
            "$(wc -l < "${scrubber}" | tr -d ' ')"

          # ---- the self-test ----
          fixture="${RUNNER_TEMP}/scrub-fixture.log"
          jwt_signing_key="$(sed -n 's/^JWT_SIGNING_KEY=//p' .env | head -n 1)"
          grafana_admin_password="$(sed -n 's/^GRAFANA_ADMIN_PASSWORD=//p' .env | head -n 1)"
          {
            printf 'startup signing key resolved to %s\n' "${jwt_signing_key}"
            printf 'dashboard admin password %s\n' "${grafana_admin_password}"
            printf 'CUST-SSN=123-45-6789 loaded from the seed\n'
            printf '{"ssn":"123456789","custId":"000000001"}\n'
            printf 'socialSecurityNumber: 123456789 rejected by validation\n'
            printf 'national-id 123456789 not found\n'
            printf 'stored hash $2a$10$abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0\n'
            printf 'Authorization: Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJBRE1JTjAwMSJ9.c2lnbmF0dXJl\n'
            printf 'Authorization: Bearer 0123456789abcdefghijABCDEFGHIJ==\n'
            printf 'transaction 123456789 posted to account 000000010\n'
          } > "${fixture}"

          # Non-vacuity FIRST: the fixture must really hold each value, or the
          # assertions below would pass over input that never contained it.
          for present in "${jwt_signing_key}" "${grafana_admin_password}" \
              '123-45-6789' '"ssn":"123456789"' 'socialSecurityNumber: 123456789' \
              'national-id 123456789' '$2a$10$' 'Bearer eyJ' \
              'Bearer 0123456789abcdefghijABCDEFGHIJ'; do
            if ! grep -qF -- "${present}" "${fixture}"; then
              finding Blocker "${fixture}" 'self-test fixture' 'contains the value under test' \
                'absent' 'the fixture no longer exercises this rule, so the rule is untested rather than proven.'
            fi
          done

          sed -i -f "${scrubber}" "${fixture}"

          # Each secret must be GONE. Compared with -F so a value containing a
          # regex metacharacter cannot make the check pass by failing to compile.
          for gone in "${jwt_signing_key}" "${grafana_admin_password}" \
              '123-45-6789' '"ssn":"123456789"' '$2a$10$' 'Bearer eyJhbGciOiJIUzI1NiJ9' \
              'Bearer 0123456789abcdefghijABCDEFGHIJ'; do
            if grep -qF -- "${gone}" "${fixture}"; then
              finding Blocker "${RUNNER_TEMP}/scrub.sed" 'redaction' 'the value is removed' \
                'it survived scrubbing' 'fix the rule for this shape before any log is uploaded.'
            fi
          done

          # And each marker must be PRESENT, so a rule cannot pass by deleting
          # the whole line or by doing nothing to a value that was never there.
          # 'Bearer REDACTED_JWT' rather than 'Bearer REDACTED_TOKEN' for the
          # signed token, because the JWT rule is the more specific of the two and
          # runs first; the opaque token on the next fixture line is what proves
          # the general Bearer rule still fires.
          for marker in REDACTED_JWT_SIGNING_KEY REDACTED_GRAFANA_ADMIN_PASSWORD \
              REDACTED_NATIONAL_ID REDACTED_PASSWORD_HASH 'Bearer REDACTED_JWT' \
              'Bearer REDACTED_TOKEN'; do
            if ! grep -qF -- "${marker}" "${fixture}"; then
              finding Blocker "${RUNNER_TEMP}/scrub.sed" 'redaction marker' \
                "${marker} appears in the scrubbed output" 'absent' \
                'the rule did not fire, so the shape it claims to cover is unprotected.'
            fi
          done

          # The three labelled forms must each keep their label and lose only the
          # digits, which is what makes a scrubbed log still readable.
          for labelled in '"ssn":"REDACTED_NATIONAL_ID"' 'socialSecurityNumber: REDACTED_NATIONAL_ID' \
              'national-id REDACTED_NATIONAL_ID'; do
            if ! grep -qF -- "${labelled}" "${fixture}"; then
              finding Blocker "${RUNNER_TEMP}/scrub.sed" 'label-aware redaction' \
                "${labelled}" 'the label was lost or the digits survived' \
                'the label-aware rule must preserve its label through the back-reference and replace only the nine digits.'
            fi
          done

          # Over-reach: an UNLABELLED nine-digit number is an account or
          # transaction identifier here, and destroying it would remove the
          # diagnostic value the logs are collected for.
          if ! grep -qF -- 'transaction 123456789 posted' "${fixture}"; then
            finding Medium "${RUNNER_TEMP}/scrub.sed" 'over-reach' \
              'an unlabelled nine-digit identifier passes through untouched' 'it was redacted' \
              'narrow the rule to labelled occurrences; a blanket nine-digit rule redacts every account and transaction id in the log.'
          fi

          printf -- '--- scrubbed fixture ---\n'
          cat "${fixture}"
          conclude 'Log scrubber self-test'

      # ----------------------------------------------------------------------
      # The topology is validated before anything is started, so a
      # configuration defect is reported as one rather than as a container that
      # mysteriously fails to come up.
      # ----------------------------------------------------------------------
      - name: Validate the committed container topology
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          docker compose config --quiet

          # ------------------------------------------------------------------
          # THE RESOLVED TOPOLOGY IS NEVER WRITTEN TO DISK, and that is the
          # point of the pipe rather than a stylistic preference.
          #
          # `docker compose config` INTERPOLATES .env. The .env this job writes
          # a few steps above holds a generated JWT signing key, the PostgreSQL
          # superuser password, both least-privilege role passwords, the metrics
          # scrape password and the Grafana administrator password - so the
          # resolved JSON is a complete credential set in plaintext. An earlier
          # revision redirected it to ${RUNNER_TEMP}/topology.json, at whatever
          # mode the default umask gave, and never removed it: it stayed for the
          # life of the runner and was readable by anything else running there,
          # for no benefit, since the only consumers are this validator and one
          # image reference read by the promtool step below.
          #
          # The validator therefore reads the resolved JSON from STDIN, so it
          # exists only in the pipe, and writes back a STRUCTURAL PROJECTION
          # holding service names, image references, build flags and network
          # names - no environment, no secrets, nothing interpolated from .env.
          # The projection is what the later step reads. Neither umask nor chmod
          # nor an rm is needed for a file that never contains a credential,
          # which is a stronger guarantee than remembering to delete one.
          # ------------------------------------------------------------------
          cat > "${RUNNER_TEMP}/topology-check.py" <<'CHECKER'
          import json
          import re
          import sys

          EXPECTED = {"app", "postgres", "localstack", "jaeger", "pushgateway",
                      "prometheus", "grafana"}
          DIGEST = re.compile(r"@sha256:[0-9a-f]{64}$")
          findings = []

          topology = json.load(sys.stdin)
          services = set(topology.get("services", {}))
          networks = set(topology.get("networks", {}))

          if services != EXPECTED:
              findings.append(
                  "docker-compose.yml [services] expected: {} | actual: {} | "
                  "remediation: the topology is exactly these seven services.".format(
                      sorted(EXPECTED), sorted(services)))

          if len(networks) != 1:
              findings.append(
                  "docker-compose.yml [networks] expected: exactly one isolated "
                  "network | actual: {} | remediation: keep every service on one "
                  "project network.".format(sorted(networks)))

          for name, service in sorted(topology.get("services", {}).items()):
              image = service.get("image", "")
              built = "build" in service
              # This one assertion subsumes any separate movable-tag check: a
              # reference without a digest fails here whatever its tag, and a
              # reference WITH a digest resolves to one immutable image however
              # its tag is spelled. A second check on the tag text would be
              # redundant logic, so none is written.
              if not built and not DIGEST.search(image):
                  findings.append(
                      "docker-compose.yml [services.{}.image] expected: a "
                      "digest-pinned reference | actual: {} | remediation: pin by "
                      "@sha256 digest. A tag is a movable pointer; only a digest "
                      "names one image.".format(name, image or "absent"))
              if service.get("privileged"):
                  findings.append(
                      "docker-compose.yml [services.{}.privileged] expected: absent "
                      "| actual: true | remediation: privileged mode is refused."
                      .format(name))
              if service.get("network_mode") == "host":
                  findings.append(
                      "docker-compose.yml [services.{}.network_mode] expected: the "
                      "project network | actual: host | remediation: host "
                      "networking is refused.".format(name))
              for volume in service.get("volumes", []):
                  source = volume.get("source", "") if isinstance(volume, dict) else str(volume)
                  if "docker.sock" in source:
                      findings.append(
                          "docker-compose.yml [services.{}.volumes] expected: no "
                          "Docker socket | actual: {} | remediation: never hand the "
                          "daemon socket to an application or emulator container."
                          .format(name, source))

          # ------------------------------------------------------------------
          # The database principals, read back from the RENDERED topology.
          #
          # Three layers name these roles - the app service, the postgres
          # service and the postgres-least-privilege-roles config - and the
          # defect this guards against was them disagreeing: the app service
          # defaulted both names to POSTGRES_USER (a SUPERUSER) while the other
          # two defaulted to carddemo_app and carddemo_migrator, so a start
          # without the names exported created two roles nobody then used and
          # served every request as the superuser. Interpolation is what decides
          # the outcome, so the assertion is made after interpolation.
          # ------------------------------------------------------------------
          app_env = topology["services"].get("app", {}).get("environment", {})
          db_env = topology["services"].get("postgres", {}).get("environment", {})
          roles = {
              "runtime": ("CARDDEMO_DB_APP_USER", "CARDDEMO_DB_APP_PASSWORD", "APP_USER"),
              "migration": ("CARDDEMO_DB_MIGRATION_USER", "CARDDEMO_DB_MIGRATION_PASSWORD",
                            "MIGRATION_USER"),
          }
          provisioner = topology.get("configs", {}).get(
              "postgres-least-privilege-roles", {}).get("content", "")

          for role, (user_name, password_name, script_variable) in sorted(roles.items()):
              app_user = app_env.get(user_name, "")
              db_user = db_env.get(user_name, "")
              app_password = app_env.get(password_name, "")
              db_password = db_env.get(password_name, "")

              if not app_user or app_user != db_user:
                  findings.append(
                      "docker-compose.yml [{}] expected: one non-empty {} role name "
                      "on both the app and postgres services | actual: app={} "
                      "postgres={} | remediation: spell the default once and "
                      "identically on both services.".format(
                          user_name, role, app_user or "absent", db_user or "absent"))

              if not app_password or app_password != db_password:
                  findings.append(
                      "docker-compose.yml [{}] expected: one non-empty {} role "
                      "password on both the app and postgres services | actual: "
                      "app={} postgres={} | remediation: the role the script "
                      "creates and the role the application authenticates as must "
                      "share one password variable.".format(
                          password_name, role,
                          "set" if app_password else "absent",
                          "set" if db_password else "absent"))

              # The variable the provisioning script reads, out of the rendered
              # config body. `$$` survives rendering because Compose must not
              # interpolate a shell expansion it will hand to sh.
              #
              # The services guard all four names with `:?` and carry no `:-`
              # default, so there is exactly ONE source for each name and the
              # created role cannot differ from the authenticated one by
              # construction. What is asserted is therefore that the script
              # binds the SAME variable - through psql's \getenv, which is what
              # keeps the value out of argv - and that, if the script ever
              # reintroduces a literal default, that default agrees with the
              # rendered service value rather than silently overriding it.
              bound = re.search(
                  r'\\getenv\s+\w+\s+{}\b'.format(user_name), provisioner)
              if bound is None:
                  findings.append(
                      "docker-compose.yml [configs.postgres-least-privilege-roles] "
                      "expected: {} derived from {} | actual: no such binding | "
                      "remediation: the script must read the same variable the "
                      "services read.".format(script_variable, user_name))
              declared = re.search(
                  r'{}="\$\$\{{{}:-([^}}]*)\}}"'.format(script_variable, user_name),
                  provisioner)
              if declared is not None and declared.group(1) and declared.group(1) != app_user:
                  findings.append(
                      "docker-compose.yml [configs.postgres-least-privilege-roles] "
                      "expected: {} default {} to match the rendered service value "
                      "| actual: {} | remediation: a role is created under one name "
                      "and authenticated under another; make the two agree."
                      .format(script_variable, app_user, declared.group(1)))

              if app_user and app_user == app_env.get("POSTGRES_USER", ""):
                  findings.append(
                      "docker-compose.yml [{}] expected: a dedicated role distinct "
                      "from the bootstrap POSTGRES_USER | actual: {} | remediation: "
                      "the bootstrap role is a cluster SUPERUSER and ignores every "
                      "grant; the {} role must not resolve to it.".format(
                          user_name, app_user, role))

              if app_password and app_password == app_env.get("POSTGRES_PASSWORD", ""):
                  findings.append(
                      "docker-compose.yml [{}] expected: a secret of its own | "
                      "actual: the bootstrap POSTGRES_PASSWORD | remediation: "
                      "sharing it means recovering the {} role's password recovers "
                      "the superuser's.".format(password_name, role))

          localstack = topology["services"].get("localstack", {}).get("image", "")
          if "localstack-pro" in localstack:
              findings.append(
                  "docker-compose.yml [services.localstack.image] expected: the "
                  "community image | actual: {} | remediation: the Pro image needs "
                  "an auth token, which would force a repository secret onto a "
                  "path that must carry none.".format(localstack))

          for finding in findings:
              print("::error title=Blocker::" + finding)
          if findings:
              sys.exit("Container topology: {} finding(s) above.".format(len(findings)))

          print("Seven digest-pinned services on one isolated network:")
          for name, service in sorted(topology["services"].items()):
              print("  {:<11} {}".format(name, service.get("image", "<built locally>")))

          print("Database principals, agreed across app, postgres and the role script:")
          print("  runtime   {} (DML only)".format(app_env.get("CARDDEMO_DB_APP_USER")))
          print("  migration {} (DDL, Flyway only)".format(
              app_env.get("CARDDEMO_DB_MIGRATION_USER")))
          print("  bootstrap {} (SUPERUSER, used by neither)".format(
              app_env.get("POSTGRES_USER", "not passed to the app service")))

          # The structural projection: exactly the four facts a later step needs,
          # copied field by field rather than by filtering the resolved document,
          # so a key added upstream cannot leak in by default.
          projection = {
              "services": {
                  name: {
                      "image": service.get("image", ""),
                      "build": "build" in service,
                  }
                  for name, service in sorted(topology["services"].items())
              },
              "networks": sorted(networks),
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(projection, handle, indent=2, sort_keys=True)
          print("Structural projection written to {} (no interpolated value)."
                .format(sys.argv[1]))
          CHECKER

          docker compose config --format json \
            | python3 "${RUNNER_TEMP}/topology-check.py" \
                "${RUNNER_TEMP}/topology-projection.json"

          conclude 'Container topology'

      # promtool is run from the image docker-compose.yml pins, read out of the
      # resolved topology rather than named again here, so the validator and the
      # server that will read the file are the same build. A placeholder
      # credential file is mounted only because promtool resolves password_file
      # at check time; it is never used to authenticate anything.
      - name: Validate the Prometheus scrape configuration with promtool
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          # Read from the structural projection the topology step wrote, not from
          # a resolved compose document: an image reference is all this needs, and
          # the projection carries no interpolated credential to be careless with.
          image="$(python3 -c "
          import json, sys
          print(json.load(open(sys.argv[1]))['services']['prometheus']['image'])
          " "${RUNNER_TEMP}/topology-projection.json")"
          printf 'Validating with the compose-pinned image: %s\n' "${image}"

          secrets_dir="${RUNNER_TEMP}/prometheus-secrets"
          mkdir -p "${secrets_dir}"
          printf 'placeholder-not-a-credential\n' > "${secrets_dir}/scrape-password"

          docker run --rm --entrypoint promtool \
            --volume "${PWD}/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            --volume "${secrets_dir}:/etc/prometheus/secrets:ro" \
            "${image}" check config /etc/prometheus/prometheus.yml

          # The interval and both targets are contract, not preference: the
          # dashboard panels and the metrics gate both assume them.
          if ! grep -qE '^[[:space:]]*scrape_interval:[[:space:]]*15s[[:space:]]*$' \
              observability/prometheus.yml; then
            finding High observability/prometheus.yml 'global.scrape_interval' '15s' \
              "$(grep -E 'scrape_interval:' observability/prometheus.yml | head -n 1 | tr -d ' ')" \
              'restore the 15s interval that the dashboard panels and the metrics gate assume.'
          fi
          if ! grep -qE '^[[:space:]]*metrics_path:[[:space:]]*/actuator/prometheus[[:space:]]*$' \
              observability/prometheus.yml; then
            finding High observability/prometheus.yml 'scrape_configs[].metrics_path' \
              '/actuator/prometheus' 'a different path' \
              'point the job at the actuator scrape endpoint the application exposes.'
          fi

          # The SECOND job is equally contract. Three of the four named counters
          # are written only by the batch submission process, which ends when its
          # job ends and therefore cannot be scraped at all; they reach Prometheus
          # through the Pushgateway or not at all. Losing this job silently would
          # return six dashboard panels to the permanent zero they used to hold.
          if ! grep -qE '^[[:space:]]*-[[:space:]]*job_name:[[:space:]]*carddemo-pushgateway[[:space:]]*$' \
              observability/prometheus.yml; then
            finding High observability/prometheus.yml 'scrape_configs[].job_name' \
              'a carddemo-pushgateway job' 'absent' \
              'restore the Pushgateway scrape job; without it the batch-fed counters reach nothing.'
          fi
          # honor_labels is not a preference. Without it Prometheus overwrites the
          # pushed series' job label with the scrape job's own name, relabelling
          # the producer as its own letterbox.
          if ! grep -qE '^[[:space:]]*honor_labels:[[:space:]]*true[[:space:]]*$' \
              observability/prometheus.yml; then
            finding High observability/prometheus.yml 'scrape_configs[].honor_labels' \
              'true on the Pushgateway job' 'absent or false' \
              'set honor_labels: true so a pushed series keeps the job label its producer set.'
          fi

          conclude 'Prometheus configuration'

      # Explicit, so the images that run are demonstrably the pinned ones and a
      # registry outage is reported here rather than surfacing as an ambiguous
      # start-up failure. Nothing is pulled for the application service - it is
      # built from the committed Dockerfile in the next step.
      - name: Pull the exact pinned images
        run: |
          set -euo pipefail
          docker compose pull --ignore-buildable
          docker compose images

      - name: Bring the topology up and wait for every health check
        run: |
          set -euo pipefail
          docker compose up --build --wait --wait-timeout 420
          docker compose ps

      # The delivered image must not run as root. The Dockerfile sets a numeric
      # unprivileged user; this reads it back from the built image so the
      # property is verified on the artefact rather than trusted from the recipe.
      - name: Assert the application image runs as an unprivileged user
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          image="$(docker compose ps --format json app \
            | python3 -c "
          import json, sys
          raw = sys.stdin.read().strip()
          entries = [json.loads(line) for line in raw.splitlines() if line.strip()]
          print(entries[0]['Image'])
          ")"
          user="$(docker image inspect "${image}" --format '{{.Config.User}}')"
          printf 'image %s runs as user %s\n' "${image}" "${user:-<unset>}"

          case "${user}" in
            ''|root|0|0:0)
              remedy='declare an unprivileged numeric USER in the runtime stage. A container that runs as'
              remedy="${remedy}"' root turns any application defect into host-adjacent exposure.'
              finding Blocker Dockerfile 'USER' 'a non-root, unprivileged user' \
                "${user:-unset, which means root}" \
                "${remedy}"
              ;;
            *)
              printf 'The delivered image does not run as root.\n'
              ;;
          esac

          conclude 'Image privilege'

      - name: Assert the three Flyway migrations applied cleanly
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          # Every query below is written WITHOUT an SQL string literal, and that is
          # deliberate rather than incidental. A literal would need a single quote
          # inside the single-quoted script handed to "sh -c", inside a YAML block
          # scalar - three nested quoting contexts, which is precisely where a
          # query silently stops being the query that was intended. The rows are
          # therefore joined in the shell, and ordinary tables are counted from
          # pg_catalog.pg_tables rather than by comparing table_type to a literal.
          applied="$(docker compose exec -T postgres sh -c \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
             "SELECT version FROM flyway_schema_history WHERE success \
              ORDER BY installed_rank"' \
            | tr -d '\r' | sed '/^[[:space:]]*$/d' | tr -d '[:blank:]' | paste -sd, -)"

          if [ "${applied}" != "1,2,3" ]; then
            remedy='apply the three migrations against a clean volume. A checksum mismatch or an'
            remedy="${remedy}"' already-populated schema stops the migrate step - run "docker compose down --volumes"'
            remedy="${remedy}"' and bring the topology up again.'
            finding Blocker src/main/resources/db/migration 'flyway_schema_history' \
              'versions 1,2,3 all successful' "${applied:-none}" \
              "${remedy}"
          else
            printf 'Migrations 1, 2 and 3 applied successfully.\n'
          fi

          failed="$(docker compose exec -T postgres sh -c \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
             "SELECT count(*) FROM flyway_schema_history WHERE NOT success"' \
            | tr -d '[:space:]')"
          if [ "${failed}" != "0" ]; then
            finding Blocker src/main/resources/db/migration 'failed migration rows' \
              '0' "${failed}" \
              'inspect flyway_schema_history, repair the migration and start from a clean volume.'
          fi

          tables="$(docker compose exec -T postgres sh -c \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
             "SELECT count(*) FROM pg_catalog.pg_tables \
              WHERE schemaname = current_schema()"' | tr -d '[:space:]')"
          printf 'Base tables in the migrated schema: %s\n' "${tables}"
          if [ "${tables}" -lt 11 ]; then
            finding Blocker src/main/resources/db/migration/V1__create_schema.sql \
              'base table count' 'at least 11, one per VSAM cluster' "${tables}" \
              'the schema migration did not create every table. One entity per catalogued KSDS cluster is the contract.'
          fi

          conclude 'Flyway migrations'

      # The readiness group enumerates readinessState, db, s3 and sqs, so a UP
      # from that group is an authoritative statement about the database, the
      # object store and the queue at once. Details are deliberately never
      # exposed on this endpoint, so the substrate is ALSO asserted directly in
      # the next steps rather than inferred from a rolled-up status alone.
      - name: Assert liveness and readiness report UP
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          probe() {
            body="$(curl --silent --show-error --fail --max-time 10 "$2")"
            status="$(printf '%s' "${body}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
            printf '%-10s %s -> %s\n' "$1" "$2" "${status}"
            if [ "${status}" != "UP" ]; then
              remedy='inspect the collected container logs. The readiness group covers readinessState,'
              remedy="${remedy}"' db, s3 and sqs, so a DOWN names a real unreachable dependency.'
              finding Blocker "$2" 'health status' 'UP' "${status:-unreadable}" \
                "${remedy}"
            fi
          }

          probe liveness  http://127.0.0.1:8080/actuator/health/liveness
          probe readiness http://127.0.0.1:8080/actuator/health/readiness
          probe composite http://127.0.0.1:8080/actuator/health

          conclude 'Health and readiness'

      # ----------------------------------------------------------------------
      # PACKAGED-ARTEFACT API SMOKE. The image, not the tree.
      #
      # WHY NO TEST TIER CAN REPLACE THIS. Surefire and Failsafe put
      # target/classes and the dependency jars on the class path directly, so the
      # layout the Dockerfile actually ships - BOOT-INF/classes, BOOT-INF/lib,
      # BOOT-INF/classpath.idx and the loader that reads them - is never
      # exercised by any of them. A runtime assessment once reported 500 for every
      # chunked request body against the packaged archive while the identical
      # request answered 200 from an exploded class path. Whatever the cause in
      # any one environment, the structural gap is real, and a replacement that
      # starts the image and probes only Actuator does not close it.
      # Health says the context started. It says nothing about request framing,
      # content negotiation or the authored error envelope.
      #
      # THE THREE PROBES ARE THE THREE THINGS THAT WERE REPORTED BROKEN, plus a
      # happy path so a green result cannot come from an application that refuses
      # everything:
      #   1. a chunked request body must be read like any other;
      #   2. a wildcard Content-Type must be 415 carrying the AUTHORED problem
      #      envelope, never a 500 with the framework's default body;
      #   3. a well-framed body must succeed and return a token.
      #
      # THE IDENTITY IS GENERATED PER RUN, and no credential is committed. The
      # bootstrap is unavoidable - a sign-on needs an account that already exists
      # - so it is read at run time from the frozen public sample data that seeds
      # the demo users, app/jcl/DUSRSECJ.jcl columns 49-56, and masked before it
      # is used. Every assertion below then runs against an identity this run
      # created and deletes again, so the shared demo credential is a bootstrap
      # and never the subject.
      # ----------------------------------------------------------------------
      - name: Smoke the packaged image - request framing, media type, happy path
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          base='http://127.0.0.1:8080'
          json='Content-Type: application/json'

          # ---- bootstrap, read from the frozen corpus rather than committed ----
          bootstrap_id='ADMIN001'
          bootstrap_pw="$(awk '/^ADMIN001/ {print substr($0, 49, 8); exit}' app/jcl/DUSRSECJ.jcl)"
          printf '::add-mask::%s\n' "${bootstrap_pw}"
          if [ "${#bootstrap_pw}" -ne 8 ]; then
            finding Blocker app/jcl/DUSRSECJ.jcl 'inline seed record columns 49-56' \
              'an eight-character credential' "${#bootstrap_pw} characters" \
              'the frozen seed layout is SEC-USR-PWD PIC X(08) at columns 49-56; if that moved, the corpus was modified, which this workflow forbids elsewhere.'
            conclude 'Packaged-image API smoke'
            exit 1
          fi

          token_of() {
            python3 -c 'import json,sys; print(json.load(sys.stdin).get("token",""))' < "$1"
          }

          # --------------------------------------------------------------
          # NO AUTHENTICATION BODY IS EVER PRINTED RAW.
          #
          # Each probe below writes its sign-on response to a file, and the
          # failure branches used to `cat` that file so a broken run explained
          # itself. Three of the four bodies can legitimately carry a JWT and
          # only the bootstrap token was masked, so the one regression the
          # wildcard-media-type probe exists to catch - a negotiation failure
          # answered with 200 and a normal token instead of 415 - would have
          # printed a live credential into a job log that persists for the
          # retention period.
          #
          # mask_body runs IMMEDIATELY after every request, before any branch can
          # print anything, because masking after a print does not unprint it. It
          # ignores the status code deliberately: a token is masked because it is
          # PRESENT, never because the response was one expected to carry one.
          #
          # describe_body is what replaced `cat`. It prints length, the key set
          # and an allowlist of non-sensitive fields, so the authored problem
          # envelope stays legible while credential values are withheld by
          # construction rather than by a denylist someone has to maintain.
          #
          # Both delegate to .github/smoke/redact_auth_body.py, which lives
          # outside this file so that it can be TESTED - the guard test plants a
          # sentinel JWT and proves it cannot reach the output. A shell function
          # embedded in a job step could not be tested that way.
          # --------------------------------------------------------------
          mask_body() {
            python3 .github/smoke/redact_auth_body.py --mask "$1" || true
          }

          describe_body() {
            python3 .github/smoke/redact_auth_body.py --describe "$1" || true
          }

          admin_token="$(curl --silent --show-error --max-time 20 \
            -o "${RUNNER_TEMP}/smoke-bootstrap.json" -w '%{http_code}' \
            -X POST "${base}/api/auth/signon" -H "${json}" \
            --data-binary "{\"userId\":\"${bootstrap_id}\",\"password\":\"${bootstrap_pw}\"}")"
          mask_body "${RUNNER_TEMP}/smoke-bootstrap.json"
          if [ "${admin_token}" != '200' ]; then
            finding Blocker "${base}/api/auth/signon" 'bootstrap sign-on' '200' "${admin_token}" \
              'the demo users are seeded only when the seeddemousers placeholder is true, which the local profile sets. Confirm the image is running that profile and that the seed migration applied.'
            conclude 'Packaged-image API smoke'
            exit 1
          fi
          admin_token="$(token_of "${RUNNER_TEMP}/smoke-bootstrap.json")"
          printf '::add-mask::%s\n' "${admin_token}"

          # ---- the per-run identity ----
          smoke_id="CI$(openssl rand -hex 3 | tr 'a-f' 'A-F')"
          smoke_pw="$(openssl rand -hex 4 | tr 'a-f' 'A-F')"
          printf '::add-mask::%s\n' "${smoke_pw}"
          printf 'provisioning the per-run identity %s\n' "${smoke_id}"

          created="$(curl --silent --show-error --max-time 20 \
            -o "${RUNNER_TEMP}/smoke-create.json" -w '%{http_code}' \
            -X POST "${base}/api/admin/users" -H "${json}" \
            -H "Authorization: Bearer ${admin_token}" \
            --data-binary "{\"firstName\":\"CI\",\"lastName\":\"SMOKE\",\"userId\":\"${smoke_id}\",\"password\":\"${smoke_pw}\",\"userType\":\"U\"}")"
          # Same treatment as the sign-on bodies, and for a reason beyond
          # symmetry: the REQUEST that produced this response carried a password,
          # so an application defect that echoed the submitted representation
          # back would put that password in this body. The administration API is
          # specified never to return a password, and this is what makes printing
          # the body safe even if that specification is ever violated.
          mask_body "${RUNNER_TEMP}/smoke-create.json"
          if [ "${created}" != '201' ]; then
            finding Blocker "${base}/api/admin/users" 'per-run identity creation' '201' "${created}" \
              'the smoke cannot run against a generated identity without this. The response is described below with credential values withheld.'
            describe_body "${RUNNER_TEMP}/smoke-create.json"
            conclude 'Packaged-image API smoke'
            exit 1
          fi

          credentials="{\"userId\":\"${smoke_id}\",\"password\":\"${smoke_pw}\"}"
          smoke_failures=0

          # 1. A chunked body must be read like any other. curl sends chunked
          #    when the length is unknown, which --data-binary @- from a pipe is.
          chunked="$(printf '%s' "${credentials}" | curl --silent --show-error --max-time 20 \
            -o "${RUNNER_TEMP}/smoke-chunked.json" -w '%{http_code}' \
            -X POST "${base}/api/auth/signon" -H "${json}" \
            -H 'Transfer-Encoding: chunked' --data-binary @-)"
          mask_body "${RUNNER_TEMP}/smoke-chunked.json"
          printf 'chunked sign-on      -> %s\n' "${chunked}"
          if [ "${chunked}" != '200' ]; then
            smoke_failures=$((smoke_failures + 1))
            finding Blocker "${base}/api/auth/signon" 'chunked request body' '200' "${chunked}" \
              'a chunked body is a valid HTTP/1.1 request. A 5xx here is the packaged-layout defect this probe exists to catch; a 4xx means the body was not read at all.'
            describe_body "${RUNNER_TEMP}/smoke-chunked.json"
          elif [ -z "$(token_of "${RUNNER_TEMP}/smoke-chunked.json")" ]; then
            smoke_failures=$((smoke_failures + 1))
            finding Blocker "${base}/api/auth/signon" 'chunked response body' 'a token' 'none' \
              'the status was 200 but the response carried no token, so the request was answered without being honoured.'
          fi

          # 2. A wildcard Content-Type must be 415 in the AUTHORED envelope.
          media="$(printf '%s' "${credentials}" | curl --silent --show-error --max-time 20 \
            -o "${RUNNER_TEMP}/smoke-media.json" -w '%{http_code}' \
            -X POST "${base}/api/auth/signon" -H 'Content-Type: */*' --data-binary @-)"
          mask_body "${RUNNER_TEMP}/smoke-media.json"
          printf 'wildcard media type  -> %s\n' "${media}"
          if [ "${media}" != '415' ]; then
            smoke_failures=$((smoke_failures + 1))
            finding Blocker "${base}/api/auth/signon" 'wildcard Content-Type' '415' "${media}" \
              'a wildcard media type is not a supported request representation; answering anything else - a 500 in particular - means the negotiation failure escaped as an error.'
            describe_body "${RUNNER_TEMP}/smoke-media.json"
          elif ! grep -q 'CARDDEMO-UNSUPPORTED-MEDIA-TYPE' "${RUNNER_TEMP}/smoke-media.json"; then
            smoke_failures=$((smoke_failures + 1))
            finding Blocker "${base}/api/auth/signon" '415 response body' \
              'the authored problem envelope' "the framework default" \
              'the status is right and the body is not the authored one, so the error contract is not being applied to negotiation failures.'
            describe_body "${RUNNER_TEMP}/smoke-media.json"
          fi

          # 3. The happy path, so a green result cannot come from an application
          #    that refuses everything.
          happy="$(printf '%s' "${credentials}" | curl --silent --show-error --max-time 20 \
            -o "${RUNNER_TEMP}/smoke-happy.json" -w '%{http_code}' \
            -X POST "${base}/api/auth/signon" -H "${json}" --data-binary @-)"
          mask_body "${RUNNER_TEMP}/smoke-happy.json"
          printf 'well-framed sign-on  -> %s\n' "${happy}"
          if [ "${happy}" != '200' ]; then
            smoke_failures=$((smoke_failures + 1))
            finding Blocker "${base}/api/auth/signon" 'well-framed sign-on' '200' "${happy}" \
              'the generated identity cannot authenticate, so the two probes above prove nothing about a working application.'
            describe_body "${RUNNER_TEMP}/smoke-happy.json"
          elif [ -z "$(token_of "${RUNNER_TEMP}/smoke-happy.json")" ]; then
            smoke_failures=$((smoke_failures + 1))
            finding Blocker "${base}/api/auth/signon" 'sign-on response body' 'a token' 'none' \
              'a 200 with no token is not a successful sign-on.'
          fi

          # ---- symmetric cleanup, whatever the probes did ----
          removed="$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' \
            -X DELETE "${base}/api/admin/users/${smoke_id}?confirmed=true" \
            -H "Authorization: Bearer ${admin_token}")"
          printf 'per-run identity %s removed -> %s\n' "${smoke_id}" "${removed}"
          case "${removed}" in
            200|204) ;;
            *) finding Medium "${base}/api/admin/users" 'per-run identity cleanup' '200 or 204' \
                 "${removed}" 'the runner is ephemeral so nothing leaks, but a delete that does not work is a finding in its own right.' ;;
          esac

          printf 'packaged-image smoke: %s probe failure(s).\n' "${smoke_failures}"
          conclude 'Packaged-image API smoke'

      # ----------------------------------------------------------------------
      # The provisioned inventory, asserted exactly rather than approximately,
      # and read back from the emulator rather than from the script's own output.
      # Versioning in particular is verified by READ-BACK: the output bucket must
      # report Enabled and the other two must not, because "it was requested"
      # and "it is in effect" are different claims.
      #
      # EVERY BLANK-LINE FILTER BELOW IS awk 'NF', NEVER grep -v '^$', and the
      # difference decides whether this step can report its own failure. grep
      # exits 1 when it selects no line, and an empty inventory selects none - so
      # under set -o pipefail the command substitution inherits status 1 and
      # set -e terminates the step at that assignment, BEFORE the finding(...)
      # branch that would name what was missing. The one case these checks exist
      # for - nothing provisioned at all - was therefore the one case that
      # produced an opaque failure instead of a diagnosis. awk 'NF' drops the same
      # blank lines and exits 0 on empty input, so the empty string reaches the
      # comparison and the finding is reported. Four sites use it: the bucket,
      # queue and topic inventories here, and the idempotence snapshot below.
      # ----------------------------------------------------------------------
      - name: Assert the provisioned object store, queue and topic inventory
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          inventory() {
            docker compose exec -T localstack sh -c "$1"
          }

          buckets="$(inventory 'awslocal s3api list-buckets --query "Buckets[].Name" --output text' \
            | tr -s '[:space:]' '\n' | awk 'NF' | sort | tr '\n' ' ')"
          expected_buckets='carddemo-batch-input carddemo-batch-output carddemo-statements '
          if [ "${buckets}" != "${expected_buckets}" ]; then
            remedy='exactly three buckets are provisioned. Re-run the ready hook with "docker compose'
            remedy="${remedy}"' exec localstack bash /etc/localstack/init/ready.d/init-aws.sh"; it is idempotent.'
            finding Blocker localstack-init/init-aws.sh 'S3 bucket inventory' \
              "${expected_buckets}" "${buckets:-none}" \
              "${remedy}"
          else
            printf 'Buckets: %s\n' "${buckets}"
          fi

          # Versioning: Enabled on the output bucket ONLY. That bucket stands in
          # for the generation data groups, whose relative generations become
          # object versions; the input and statements buckets have no such
          # requirement and must not carry it.
          for bucket in carddemo-batch-input carddemo-batch-output carddemo-statements; do
            state="$(inventory "awslocal s3api get-bucket-versioning --bucket ${bucket} \
              --query Status --output text" | tr -d '[:space:]')"
            if [ "${bucket}" = 'carddemo-batch-output' ]; then
              wanted=Enabled
            else
              wanted=None
            fi
            printf '  %-26s versioning=%s (expected %s)\n' "${bucket}" "${state:-None}" "${wanted}"
            if [ "${state:-None}" != "${wanted}" ] && ! { [ "${wanted}" = 'None' ] && [ -z "${state}" ]; }; then
              remedy='versioning belongs on the batch output bucket alone: it is what replaces relative'
              remedy="${remedy}"' generation references. Enabling it elsewhere retains objects no gate reads.'
              finding High localstack-init/init-aws.sh "s3:${bucket} versioning" \
                "${wanted}" "${state:-None}" \
                "${remedy}"
            fi
          done

          # THREE queues, asserted BY NAME rather than by count. The report queue
          # replaces the JOBS transient data queue of app/csd/CARDDEMO.CSD; its
          # -dlq companion is the dead-letter target its RedrivePolicy names, so
          # that a submission the producer accepts but the consumer can never run
          # is quarantined instead of circulating at the head of an ordered FIFO
          # group; the notification inbox is the SNS subscriber that turns an
          # accepted publish into a delivered notice, and without it the topic
          # discards everything sent to it. Comparing the sorted name set catches
          # a missing queue, an extra queue and a misspelled queue in one
          # comparison, which a count cannot: a count of three is also what two
          # correct queues beside one stray queue produces.
          queues="$(inventory 'awslocal sqs list-queues --query "QueueUrls[]" --output text' \
            | tr -s '[:space:]' '\n' | awk 'NF' | sed 's#.*/##' | sort | tr '\n' ' ')"
          expected_queues='carddemo-notifications-inbox carddemo-report-jobs-dlq.fifo '
          expected_queues="${expected_queues}"'carddemo-report-jobs.fifo '
          if [ "${queues}" != "${expected_queues}" ]; then
            remedy='three queues are provisioned and each is load bearing. carddemo-report-jobs.fifo must keep'
            remedy="${remedy}"' its .fifo suffix, because ordering is required: it carries report job submissions'
            remedy="${remedy}"' in the order the operator made them. carddemo-report-jobs-dlq.fifo is its'
            remedy="${remedy}"' dead-letter target and must also be FIFO, which AWS requires of the target of a'
            remedy="${remedy}"' FIFO queue. carddemo-notifications-inbox is a standard queue and is the topic'
            remedy="${remedy}"' subscriber. Re-run the ready hook with "docker compose'
            remedy="${remedy}"' exec localstack bash /etc/localstack/init/ready.d/init-aws.sh"; it is idempotent.'
            finding Blocker localstack-init/init-aws.sh 'SQS queue inventory' \
              "${expected_queues}" "${queues:-none}" \
              "${remedy}"
          else
            printf 'Queues: %s\n' "${queues}"
          fi

          # The RedrivePolicy is asserted from the edge, not from the script that
          # applied it. Without it the report queue has no containment at all: a
          # message the consumer cannot classify circulates for the whole
          # four-day retention, one visibility window at a time, and an ordered
          # FIFO group cannot deliver past it.
          redrive="$(inventory 'awslocal sqs get-queue-attributes \
            --queue-url "$(awslocal sqs get-queue-url --queue-name carddemo-report-jobs.fifo \
            --query QueueUrl --output text)" --attribute-names RedrivePolicy \
            --query "Attributes.RedrivePolicy" --output text' | tr -d '[:space:]' | tr -d '\\\\"')"
          case "${redrive}" in
            *carddemo-report-jobs-dlq.fifo*maxReceiveCount:4*)
              printf 'RedrivePolicy confirmed by read-back: maxReceiveCount 4 to the -dlq queue.\n'
              ;;
            *)
              remedy='the report queue must carry a RedrivePolicy naming carddemo-report-jobs-dlq.fifo with'
              remedy="${remedy}"' maxReceiveCount 4, so a message no consumer can act on leaves the group.'
              remedy="${remedy}"' Re-run the ready hook; ensure_redrive_policy converges an existing queue.'
              finding Blocker localstack-init/init-aws.sh 'sqs RedrivePolicy' \
                'deadLetterTargetArn:...carddemo-report-jobs-dlq.fifo,maxReceiveCount:4' \
                "${redrive:-absent}" \
                "${remedy}"
              ;;
          esac

          fifo="$(inventory 'awslocal sqs get-queue-attributes \
            --queue-url "$(awslocal sqs get-queue-url --queue-name carddemo-report-jobs.fifo \
            --query QueueUrl --output text)" --attribute-names FifoQueue \
            --query "Attributes.FifoQueue" --output text' | tr -d '[:space:]')"
          if [ "${fifo}" != "true" ]; then
            finding Blocker localstack-init/init-aws.sh 'sqs FifoQueue attribute' 'true' \
              "${fifo:-absent}" \
              'create the queue with FifoQueue=true. A standard queue cannot preserve submission order.'
          else
            printf 'FifoQueue=true confirmed by read-back.\n'
          fi

          topics="$(inventory 'awslocal sns list-topics --query "Topics[].TopicArn" --output text' \
            | tr -s '[:space:]' '\n' | awk 'NF' | sort)"
          topic_count="$(printf '%s\n' "${topics}" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "${topic_count}" != "1" ]; then
            finding High localstack-init/init-aws.sh 'SNS topic count' '1' "${topic_count}" \
              'exactly one notification topic is provisioned.'
          else
            printf 'Topic: %s\n' "${topics}"
          fi

          # EXACTLY ONE SUBSCRIPTION, and this step used to assert exactly zero.
          # The reversal is finding M-04 and it is the whole point of the check:
          # a topic with no subscriber ACCEPTS every publish and discards it, so
          # the notification capability reported success while delivering nothing,
          # and the publisher could not tell the difference because acceptance is
          # not delivery. Asserting emptiness therefore certified the broken
          # state. The provisioning script now creates the inbox subscription
          # itself and treats zero as fatal, so this step asserts that same
          # contract from the outside instead of the opposite one.
          #
          # Both bounds are asserted, and they fail for different reasons. Zero
          # is the inert topic above. More than one is duplicate delivery, since
          # every subscription receives its own copy of every notice.
          #
          # The upper bound is asserted HERE rather than in the script because
          # the two run against different edges. A subscription the script did
          # not create may belong to a sibling clone sharing a long-lived edge,
          # and the script is forbidden to unsubscribe it, so it reports the
          # observed count and continues. The CI edge is freshly created and
          # sole-tenant, so here an exact count is both meaningful and safe.
          subscription_count="$(inventory 'awslocal sns list-subscriptions \
            --query "Subscriptions[].SubscriptionArn" --output text' \
            | tr -s '[:space:]' '\n' | awk 'NF' | wc -l | tr -d ' ')"
          if [ "${subscription_count}" != "1" ]; then
            remedy='the topic must carry exactly one subscriber. Zero means every operator notification is'
            remedy="${remedy}"' accepted and silently discarded, which is the defect finding M-04 reported. More'
            remedy="${remedy}"' than one means duplicate delivery: each subscription receives its own copy.'
            finding High localstack-init/init-aws.sh 'SNS subscription count' '1' \
              "${subscription_count:-0}" \
              "${remedy}"
          else
            printf 'Subscriptions: 1\n'
          fi

          # The count alone would pass on a subscription pointing anywhere at
          # all, so the inbox subscription is located BY ITS ENDPOINT and counted
          # on its own. Selecting by endpoint rather than by list position is
          # deliberate: SNS does not order the listing, so a positional read
          # would check whichever subscription happened to come back first and
          # would report a confusing second failure whenever the count above had
          # already failed.
          #
          # An endpoint that is not the inbox queue's ARN is the defect the M-04
          # fix introduced once already. A value captured from a function that
          # also wrote progress lines to stdout was accepted as an endpoint, and
          # the hook then reported a verified subscription delivering to
          # something that was not a queue at all.
          inbox_subscriptions="$(inventory 'awslocal sns list-subscriptions \
            --query "length(Subscriptions[?Protocol==\`sqs\` \
            && ends_with(Endpoint, \`:carddemo-notifications-inbox\`)])" \
            --output text' | tr -d '[:space:]')"
          if [ "${inbox_subscriptions}" != "1" ]; then
            remedy='the sole subscriber must be the carddemo-notifications-inbox queue over the sqs protocol.'
            remedy="${remedy}"' An email, http, https or lambda subscriber would put a delivery target outside this'
            remedy="${remedy}"' topology, and an endpoint that is not a bare sqs ARN means the ARN capture in'
            remedy="${remedy}"' ensure_notification_subscription picked up log output alongside the value.'
            finding High localstack-init/init-aws.sh 'sqs subscriptions on the notification inbox' '1' \
              "${inbox_subscriptions:-0}" \
              "${remedy}"
          else
            printf 'Subscriber: sqs -> carddemo-notifications-inbox (selected by endpoint)\n'
          fi

          # Raw delivery is read back because it decides the SHAPE of the body a
          # consumer sees. With it off, SNS wraps the publisher's JSON in its own
          # envelope, so the message a reader parses is not the message the
          # publisher sent and a consumer written against the published contract
          # fails on a field it cannot find. The subscription ARN is resolved by
          # endpoint here too, for the reason given above.
          raw_delivery="$(inventory 'awslocal sns get-subscription-attributes \
            --subscription-arn "$(awslocal sns list-subscriptions \
            --query "Subscriptions[?Protocol==\`sqs\` \
            && ends_with(Endpoint, \`:carddemo-notifications-inbox\`)] \
            | [0].SubscriptionArn" --output text)" \
            --query "Attributes.RawMessageDelivery" --output text' | tr -d '[:space:]')"
          if [ "${raw_delivery}" != 'true' ]; then
            remedy='subscribe with RawMessageDelivery=true so the body a subscriber reads is exactly the JSON'
            remedy="${remedy}"' the publisher sent, rather than that JSON wrapped in an SNS envelope.'
            finding Medium localstack-init/init-aws.sh 'SNS RawMessageDelivery attribute' 'true' \
              "${raw_delivery:-absent}" \
              "${remedy}"
          else
            printf 'RawMessageDelivery=true confirmed by read-back.\n'
          fi

          conclude 'Provisioned inventory'

      # ----------------------------------------------------------------------
      # Idempotence is asserted by RE-RUNNING the hook and comparing, because
      # "the script says it is idempotent" and "a second run converges" are
      # different claims and only the second is evidence. A repeated
      # "docker compose up" must converge rather than fail on resources that
      # already exist.
      # ----------------------------------------------------------------------
      - name: Assert the provisioning script converges on a second run
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          # The SUBSCRIPTION SET is in the snapshot, because it was the one
          # provisioned resource this comparison did not cover. Buckets, queues
          # and the topic are all created through an exists-first check, so a
          # second run cannot add one; the subscription is the only member of the
          # inventory whose duplication is even expressible, since a topic can
          # legitimately carry many subscribers.
          #
          # Whether a repeat subscribe actually duplicates depends on the
          # emulator, which is exactly why this is asserted rather than reasoned
          # about. On the pinned localstack/localstack:4.14.0 image a repeated
          # topic/protocol/endpoint triple was observed to return the EXISTING
          # subscription ARN and leave the count at one, matching the documented
          # AWS behaviour. That makes this comparison a regression guard rather
          # than a reproduction of a known break: it holds the observed behaviour
          # in place across an image bump, and it also covers the case the
          # read-before-write in ensure_notification_subscription exists for, on
          # any edge where the documented behaviour is not reproduced.
          #
          # Protocol and endpoint are snapshotted rather than the subscription
          # ARN, so the comparison is deterministic: the ARN carries a random
          # suffix that would differ between two runs even with nothing wrong,
          # whereas an added subscriber appears as an extra protocol/endpoint
          # pair and changes the sorted token multiset.
          snapshot() {
            docker compose exec -T localstack sh -c '
              awslocal s3api list-buckets --query "Buckets[].Name" --output text
              awslocal sqs list-queues --query "QueueUrls[]" --output text
              awslocal sns list-topics --query "Topics[].TopicArn" --output text
              awslocal sns list-subscriptions \
                --query "Subscriptions[].[Protocol,Endpoint]" --output text' \
              | tr -s '[:space:]' '\n' | awk 'NF' | sort
          }

          before="$(snapshot)"

          printf 'Re-running the ready hook with INIT_MAX_ATTEMPTS=%s INIT_SLEEP_SECONDS=%s\n' \
            "${INIT_MAX_ATTEMPTS}" "${INIT_SLEEP_SECONDS}"
          if docker compose exec -T \
              --env "INIT_MAX_ATTEMPTS=${INIT_MAX_ATTEMPTS}" \
              --env "INIT_SLEEP_SECONDS=${INIT_SLEEP_SECONDS}" \
              localstack bash /etc/localstack/init/ready.d/init-aws.sh \
              > "${RUNNER_TEMP}/init-rerun.log" 2>&1; then
            printf 'The second run exited 0.\n'
          else
            status=$?
            remedy='the script must converge. Exit 2 is a configuration error and exit 3 means the edge'
            remedy="${remedy}"' never came up; raise INIT_MAX_ATTEMPTS or INIT_SLEEP_SECONDS on a slow host.'
            finding Blocker localstack-init/init-aws.sh 'second-run exit status' '0' \
              "${status}" \
              "${remedy}"
          fi
          sed -n '1,80p' "${RUNNER_TEMP}/init-rerun.log"

          after="$(snapshot)"
          if [ "${before}" != "${after}" ]; then
            remedy='a second run must neither create nor remove anything. Compare the two snapshots printed'
            remedy="${remedy}"' below; a repeated sqs endpoint pair is a duplicated SNS subscription, which means'
            remedy="${remedy}"' the read-before-write in ensure_notification_subscription did not take effect and'
            remedy="${remedy}"' every operator notice is now delivered twice.'
            finding Blocker localstack-init/init-aws.sh 'inventory after a second run' \
              'identical to the first' 'changed' \
              "${remedy}"
            printf 'before:\n%s\nafter:\n%s\n' "${before}" "${after}"
          else
            printf 'The inventory is identical after the second run.\n'
          fi

          # Convergence should be reported as recognition, not as an error.
          if grep -qiE 'already exists|already present|unchanged|converg' \
              "${RUNNER_TEMP}/init-rerun.log"; then
            printf 'The second run logged existing resources as already present.\n'
          else
            note='::warning title=Low::localstack-init/init-aws.sh [second-run log]'
            note="${note}"' expected: existing resources logged as already present |'
            note="${note}"' actual: no such line | remediation: the inventory did'
            note="${note}"' converge and exit 0, so this is a reporting observation'
            note="${note}"' only.'
            printf '%s\n' "${note}"
          fi

          conclude 'Provisioning idempotence'

      - name: Assert the Prometheus scrape target is healthy
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          # The server needs at least one completed scrape interval before a
          # target leaves the unknown state, so this waits with a bounded poll
          # rather than a blind sleep.
          target_health=''
          for attempt in $(seq 1 "${INIT_MAX_ATTEMPTS}"); do
            payload="$(curl --silent --show-error --fail --max-time 10 \
              http://127.0.0.1:9090/api/v1/targets)"
            target_health="$(printf '%s' "${payload}" | python3 -c '
          import json
          import sys

          document = json.load(sys.stdin)
          for target in document.get("data", {}).get("activeTargets", []):
              if target.get("labels", {}).get("job") == "carddemo-app":
                  print(target.get("health", ""))
                  break
          ')"
            if [ "${target_health}" = 'up' ]; then
              break
            fi
            printf 'attempt %s: carddemo-app target health=%s\n' \
              "${attempt}" "${target_health:-not-yet-registered}"
            sleep "${INIT_SLEEP_SECONDS}"
          done

          if [ "${target_health}" != 'up' ]; then
            remedy='the scrape uses basic authentication against a password file, so confirm'
            remedy="${remedy}"' METRICS_SCRAPE_PASSWORD reached both the server config and the application, and that'
            remedy="${remedy}"' /actuator/prometheus is in the exposure list.'
            finding High observability/prometheus.yml 'activeTargets[job=carddemo-app].health' \
              'up' "${target_health:-not registered}" \
              "${remedy}"
          else
            printf 'The carddemo-app scrape target reports health=up.\n'
          fi

          conclude 'Scrape target'

      # Exposure is asserted against the RUNNING application, not only against
      # the configuration file, because what a client can reach is the property
      # that matters. Three endpoints answer and the disclosing ones do not.
      - name: Assert actuator exposure is exactly health, info and prometheus
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/finding.sh"

          code() {
            curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "$1"
          }

          # The scrape credential. The username is read from
          # observability/prometheus.yml so the server configuration stays the
          # single source of it, and the password is the one this job generated and
          # already registered for masking, so it cannot reach a log even by
          # accident. Neither is printed.
          scrape_user="$(sed -n 's/^[[:space:]]*username:[[:space:]]*//p' \
            observability/prometheus.yml | head -n 1)"
          scrape_password="$(sed -n 's/^METRICS_SCRAPE_PASSWORD=//p' .env | head -n 1)"

          authenticated() {
            curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 \
              --user "${scrape_user}:${scrape_password}" "$1"
          }

          # Unauthenticated and reachable. The container health check issues a
          # readiness request with no credential, so these two must stay open.
          for endpoint in health info; do
            status="$(code "http://127.0.0.1:8080/actuator/${endpoint}")"
            printf '  anonymous     /actuator/%-12s %s\n' "${endpoint}" "${status}"
            if [ "${status}" != '200' ]; then
              finding High src/main/resources/application.yml \
                "management.endpoints.web.exposure.include -> /actuator/${endpoint}" \
                '200 without a credential' "${status}" \
                'health and info must answer anonymously; the container health check depends on it.'
            fi
          done

          # The scrape endpoint is EXPOSED but AUTHENTICATED, and both halves are
          # asserted. It must refuse an anonymous caller, because the series it
          # serves are the business counters - transaction volumes, reject counts
          # by reject code, authentication attempt counts - and it must answer the
          # scraper, or the metrics gate has nothing to read.
          anonymous_metrics="$(code 'http://127.0.0.1:8080/actuator/prometheus')"
          printf '  anonymous     /actuator/%-12s %s\n' prometheus "${anonymous_metrics}"
          if [ "${anonymous_metrics}" != '401' ]; then
            remedy='the scrape endpoint must require a credential. Answering 200 anonymously would'
            remedy="${remedy}"' publish the business counters to any caller that can route to the port.'
            finding High src/main/resources/application.yml \
              'anonymous GET /actuator/prometheus' '401' "${anonymous_metrics}" \
              "${remedy}"
          fi

          scraped="$(authenticated 'http://127.0.0.1:8080/actuator/prometheus')"
          printf '  authenticated /actuator/%-12s %s\n' prometheus "${scraped}"
          if [ "${scraped}" != '200' ]; then
            remedy='confirm METRICS_SCRAPE_USERNAME and METRICS_SCRAPE_PASSWORD reached both the'
            remedy="${remedy}"' application and the scrape configuration, and that prometheus is in the exposure'
            remedy="${remedy}"' list.'
            finding High src/main/resources/application.yml \
              'authenticated GET /actuator/prometheus' '200' "${scraped}" \
              "${remedy}"
          fi

          # Endpoints that disclose configuration or memory contents. Probed WITH
          # the scrape credential, deliberately: an anonymous 401 only proves a
          # credential is required, whereas these must not be readable even by a
          # caller that HAS one. configprops in particular would echo resolved
          # property values including the signing key, so this is a security
          # assertion rather than tidiness.
          for endpoint in env beans configprops loggers heapdump threaddump mappings; do
            status="$(authenticated "http://127.0.0.1:8080/actuator/${endpoint}")"
            printf '  authenticated /actuator/%-12s %s\n' "${endpoint}" "${status}"
            if [ "${status}" = '200' ]; then
              remedy='narrow the exposure list back to health,info,prometheus. Never widen it to "*". The'
              remedy="${remedy}"' scrape credential is not an administrative credential.'
              finding Blocker src/main/resources/application.yml \
                "management.endpoints.web.exposure.include -> /actuator/${endpoint}" \
                'not readable, even with the scrape credential' 'answered 200' \
                "${remedy}"
            fi
          done

          conclude 'Actuator exposure'

      # ----------------------------------------------------------------------
      # Diagnostics, collected before teardown so a failing run still explains
      # itself. Scrubbed on the way out with the rule set built and PROVEN
      # earlier in this job, rather than with rules written here and never
      # exercised.
      #
      # FAIL-CLOSED: if the scrubber is absent - because the step that builds it
      # did not run, which happens when the job failed before reaching it - the
      # logs are NOT collected. Publishing an unscrubbed application log because
      # an earlier step failed would be the worst possible moment to publish one,
      # since a failing run is exactly when the log is most likely to contain a
      # payload, a bind parameter or a constraint-violation row image.
      # ----------------------------------------------------------------------
      - name: Collect and scrub the container logs
        if: always()
        run: |
          set -euo pipefail
          scrubber="${RUNNER_TEMP}/scrub.sed"
          if [ ! -s "${scrubber}" ]; then
            printf '::warning title=Medium::%s Not available - the self-tested scrubber was never built, so no log is collected. Collecting an unscrubbed application log would publish whatever the run happened to emit; the earlier step failure is the finding to act on.\n' \
              "${scrubber}"
            exit 0
          fi

          mkdir -p "${RUNNER_TEMP}/compose-logs"
          docker compose logs --no-color --timestamps > "${RUNNER_TEMP}/compose-logs/compose.log"
          docker compose ps --all > "${RUNNER_TEMP}/compose-logs/services.txt"

          for log in "${RUNNER_TEMP}/compose-logs"/*; do
            sed -i -f "${scrubber}" "${log}"
          done
          printf 'Collected and scrubbed %s log file(s) with %s proven rule(s).\n' \
            "$(find "${RUNNER_TEMP}/compose-logs" -type f | wc -l | tr -d ' ')" \
            "$(wc -l < "${scrubber}" | tr -d ' ')"

      # if: always() so the runner is left clean whatever happened above. A step
      # that SUCCEEDS after an earlier failure does not reset the job's
      # conclusion, so this cannot mask a failure. Nor does it swallow one: a
      # teardown problem is reported with its output as a Low finding rather than
      # discarded, and rather than being allowed to turn a green build red for a
      # reason unrelated to the code under test.
      - name: Tear the topology down
        if: always()
        run: |
          set -euo pipefail
          if docker compose down --volumes --remove-orphans --timeout 60 \
              > "${RUNNER_TEMP}/teardown.log" 2>&1; then
            printf 'Topology removed, including its volumes.\n'
          else
            note='::warning title=Low::docker-compose.yml [teardown] expected: a'
            note="${note}"' clean shutdown | actual: the command reported a problem |'
            note="${note}"' remediation: the runner is ephemeral so nothing leaks, but'
            note="${note}"' the output below should be read.'
            printf '%s\n' "${note}"
            cat "${RUNNER_TEMP}/teardown.log"
          fi
          rm -f .env

      - name: Upload the container topology evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: container-topology-evidence
          path: ${{ runner.temp }}/compose-logs/**
          # warn, not ignore: on a run that failed before the topology started
          # there is genuinely nothing to collect, and that is visible rather
          # than hidden. A required report uses error instead - see the verify job.
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ------------------------------------------------------------------
  # The delivered image, scanned.
  #
  # The Maven vulnerability scan in the verify job reads pom.xml's resolved
  # dependency graph. It cannot see the runtime image, and that gap is not
  # theoretical: it is how outdated PostgreSQL, Prometheus and Grafana pins
  # survived green builds until a human read the tags, one of them carrying a
  # score above the threshold the Maven scan already enforced. A gate that covers
  # the dependencies but not the artefact holds the delivery to a standard it does
  # not actually check.
  #
  # WHAT IS SCANNED: the image this repository's Dockerfile produces, which
  # covers both of its layers in one pass - the operating-system packages of the
  # runtime base, and the Java archives inside the application archive. A
  # CycloneDX bill of materials is emitted alongside the findings so the
  # delivered contents are recorded as evidence and not merely the verdict.
  #
  # WHY A DIGEST-PINNED IMAGE RATHER THAN AN ACTION: a marketplace action would
  # be one more mutable reference in the critical path, which is exactly what the
  # pinning in this file exists to remove, and it would add a supply-chain
  # dependency in order to close a supply-chain gap. The official scanner image
  # pinned by digest is self-verifying and needs no marketplace trust. The
  # version is stated beside the digest so a reader knows it; the digest is what
  # resolves, and it was verified against the registry's own image index.
  #
  # WHY THE SCANNER IS PINNED BUT ITS DATABASE IS NOT: these are different
  # properties and only one should be frozen. The scanner BINARY is pinned so the
  # analysis is reproducible - the same image yields the same parsing, matching
  # rules and severity arithmetic every run. The advisory DATABASE is deliberately
  # fresh, because a frozen advisory set cannot report an advisory published after
  # it was frozen, and a vulnerability gate whose data cannot move is a gate that
  # has silently stopped working. It is not cached for the same reason. What IS
  # pinned about the data is its ORIGIN: both repositories are named explicitly
  # below rather than left to the tool's defaults, so the content is current while
  # its source is fixed. The tradeoff is one database download per run, accepted
  # because no cache may be able to change this verdict.
  # ------------------------------------------------------------------
  image-scan:
    name: Delivered image and bill of materials (fail on HIGH or CRITICAL)
    needs: verify
    runs-on: ubuntu-24.04
    # An image build plus a scanner that downloads its advisory database on every
    # run, by the deliberate choice recorded above. A download is the step most
    # able to stall rather than fail, which is precisely what a ceiling is for.
    timeout-minutes: 45
    env:
      TRIVY_IMAGE: aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
      TRIVY_DB: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
      TRIVY_JAVA_DB: mirror.gcr.io/aquasec/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
      IMAGE_TAG: carddemo:scan-${{ github.sha }}
      SCAN_OUT: ${{ github.workspace }}/target/image-scan
      # The saved image the scanner reads INSTEAD of the Docker daemon. Kept
      # under RUNNER_TEMP rather than the workspace so it is never a candidate
      # for the uploaded evidence artefact: it is a full copy of the image.
      IMAGE_ARCHIVE: ${{ runner.temp }}/image-archive/carddemo-image.tar
      # The BUILD stage, scanned as well as the delivered image. The delivered
      # image is what runs in production, but the build stage is what COMPILES
      # it, and a compiler host is part of the supply chain of everything it
      # emits. Scanning only the delivered image left that surface unmeasured -
      # which is how the build stage came to run on a JDK three patches behind
      # the runtime's without any gate noticing.
      BUILDER_TAG: carddemo-build:scan-${{ github.sha }}
      BUILDER_ARCHIVE: ${{ runner.temp }}/image-archive/carddemo-build.tar
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # No --pull: both stages of the Dockerfile are already digest-pinned, so
      # there is no movable tag for a pull to re-resolve.
      - name: Build the runtime image from the committed Dockerfile
        run: |
          set -euo pipefail
          docker build --file Dockerfile --tag "${IMAGE_TAG}" .
          docker image inspect "${IMAGE_TAG}" \
            --format 'scanned image id: {{.Id}}{{"\n"}}created: {{.Created}}{{"\n"}}user: {{.Config.User}}'

      # ----------------------------------------------------------------------
      # THE BUILD STAGE IS TAGGED SO IT CAN BE SCANNED TOO.
      #
      # This costs almost nothing: the step above already built every build-stage
      # layer, because the runtime stage copies the application archive out of it.
      # This re-runs the same graph with an explicit --target, so every layer is a
      # cache hit and the only new artefact is the tag.
      #
      # It is also where the JDK alignment becomes BLOCKING rather than merely
      # asserted in CI: the build stage contains a RUN step that reads
      # java.runtime.version and exits non-zero unless it is the runtime stage's
      # exact build. So a divergence between the two image stages fails THIS step,
      # in addition to the workflow-level assertion that holds CI to the same
      # number. Three surfaces, one value, two independent enforcement points.
      # ----------------------------------------------------------------------
      - name: Build the build stage so the compiler host is scanned, not only the delivered image
        run: |
          set -euo pipefail
          docker build --file Dockerfile --target build --tag "${BUILDER_TAG}" .
          docker image inspect "${BUILDER_TAG}" \
            --format 'build stage image id: {{.Id}}{{"\n"}}created: {{.Created}}'
          printf 'Build stage JDK: %s\n' \
            "$(docker run --rm --entrypoint java "${BUILDER_TAG}" \
                 -XshowSettings:properties -version 2>&1 \
               | sed -n 's/^ *java\.runtime\.version = //p' | head -n 1)"

      # ----------------------------------------------------------------------
      # THE IMAGE IS HANDED TO THE SCANNER AS A FILE, NOT AS DAEMON ACCESS.
      #
      # Both Trivy steps below previously mounted /var/run/docker.sock. The :ro
      # flag on that mount is misleading protection: it makes the SOCKET FILE
      # read-only, not the daemon API behind it, and that API can create
      # privileged containers, bind-mount any host path and read every image and
      # secret the daemon can see. Docker documents daemon access as equivalent
      # to root on the host. Handing it to a third-party container image - even a
      # digest-pinned one - grants that authority to whatever that image runs.
      #
      # It was also unnecessary, which is what makes it a defect rather than a
      # trade-off: Trivy reads a `docker save` archive directly with --input, and
      # the informational topology scan further down already runs socketless.
      # The archive is written under a 0700 directory at 0600 by the same user
      # that will read it, so nothing else on the runner can open it, and the
      # scanner container gets exactly one read-only file.
      # ----------------------------------------------------------------------
      - name: Save the delivered image to a restricted runner-local archive
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$(dirname "${IMAGE_ARCHIVE}")"
          chmod 700 "$(dirname "${IMAGE_ARCHIVE}")"
          docker save --output "${IMAGE_ARCHIVE}" "${IMAGE_TAG}"
          chmod 600 "${IMAGE_ARCHIVE}"
          printf 'Saved %s -> %s (%s bytes, mode %s)\n' \
            "${IMAGE_TAG}" "${IMAGE_ARCHIVE}" \
            "$(wc -c < "${IMAGE_ARCHIVE}" | tr -d ' ')" \
            "$(stat --format '%a' "${IMAGE_ARCHIVE}")"
          # The build stage, handed over as a file on exactly the same terms and
          # for exactly the same reason: no step here is given daemon access.
          docker save --output "${BUILDER_ARCHIVE}" "${BUILDER_TAG}"
          chmod 600 "${BUILDER_ARCHIVE}"
          printf 'Saved %s -> %s (%s bytes, mode %s)\n' \
            "${BUILDER_TAG}" "${BUILDER_ARCHIVE}" \
            "$(wc -c < "${BUILDER_ARCHIVE}" | tr -d ' ')" \
            "$(stat --format '%a' "${BUILDER_ARCHIVE}")"

      # Written as the invoking user so no elevation is needed to read the
      # reports back, which is why there is no ownership fix-up anywhere here.
      - name: Generate a CycloneDX bill of materials for the delivered image
        run: |
          set -euo pipefail
          mkdir -p "${SCAN_OUT}"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${IMAGE_ARCHIVE}:/scan/image.tar:ro" \
            --volume "${SCAN_OUT}:/out" \
            "${TRIVY_IMAGE}" \
              image \
              --input /scan/image.tar \
              --db-repository "${TRIVY_DB}" \
              --java-db-repository "${TRIVY_JAVA_DB}" \
              --format cyclonedx \
              --output /out/carddemo-image-sbom.cdx.json
          printf 'Bill of materials written: %s bytes\n' \
            "$(wc -c < "${SCAN_OUT}/carddemo-image-sbom.cdx.json" | tr -d ' ')"

      # ----------------------------------------------------------------------
      # THE BUILD STAGE: SCANNED AND REPORTED, NOT ENFORCED - and why.
      #
      # Placed BEFORE the blocking gate below on purpose, so this evidence is
      # produced even on the runs where the delivered image fails: a step after a
      # failing step does not run, and the record of what the compiler host
      # carried is most wanted precisely when something broke.
      #
      # WHY REPORTED RATHER THAN BLOCKING. The split is the same one this job
      # already draws for the development topology images further down, and it is
      # grounded in a measurement rather than a preference. Measured against this
      # scanner and database: the delivered runtime's Ubuntu layer reports ZERO
      # findings, while the build stage's Ubuntu layer reports three HIGH - gpgv
      # CVE-2025-68973 and OpenSSL CVE-2026-45447 through libssl3t64 and openssl.
      # Every one is `fixed` upstream. They are not the JDK, which is now the
      # runtime's exact build; they are the Ubuntu 24.04.3 layer of the pinned
      # maven base, and the runtime base is 24.04.4, which is why one is clean and
      # the other is not.
      #
      # That leaves exactly two remedies, and neither belongs behind an automatic
      # gate. Upgrading the packages in place means apt with exact version pins
      # against an archive that removes superseded versions, so the build would
      # start failing on a date nobody chose - non-determinism introduced to fix a
      # determinism defect. Rebasing the build stage onto the digest-pinned
      # Temurin JDK image would clear all three, since that image is 24.04.4, but
      # it ships no curl, wget or unzip, so the checksum-verifying wrapper cannot
      # fetch its pinned distribution there; and it is a toolchain pin move, which
      # is the class of change that requires approval rather than an agent's
      # judgement. A gate whose only available remedy is suppression is the exact
      # failure mode this file argues against in writing elsewhere.
      #
      # So the finding is DISCLOSED - printed here, uploaded as evidence, and
      # registered as a residual risk with its remedy named - rather than hidden
      # behind a threshold or silently suppressed. What IS blocking is the part
      # that can be fixed and was: the JDK equality, enforced inside the image
      # build and again in the workflow assertion.
      #
      # --ignore-unfixed stays false for the same reason it is false below: an
      # advisory with no upstream fix is still a disclosed exposure, and hiding it
      # would let this base drift out of support unobserved.
      # ----------------------------------------------------------------------
      - name: Scan the build stage and report its findings (evidence, not a gate)
        run: |
          set -euo pipefail
          mkdir -p "${SCAN_OUT}"
          if docker run --rm \
              --user "$(id -u):$(id -g)" \
              --volume "${BUILDER_ARCHIVE}:/scan/build.tar:ro" \
              --volume "${SCAN_OUT}:/out" \
              "${TRIVY_IMAGE}" \
                image \
                --input /scan/build.tar \
                --db-repository "${TRIVY_DB}" \
                --java-db-repository "${TRIVY_JAVA_DB}" \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --ignore-unfixed=false \
                --exit-code 0 \
                --format table \
                --output /out/build-stage-vulnerabilities.txt; then
            printf 'Build stage scanned.\n'
          else
            printf '::warning title=Medium::the build stage scan did not complete; its evidence is absent\n'
          fi

          if [ -s "${SCAN_OUT}/build-stage-vulnerabilities.txt" ]; then
            cat "${SCAN_OUT}/build-stage-vulnerabilities.txt"
          fi

          # Reported, so the drift stays visible in the log and in the uploaded
          # evidence rather than only in a file nobody opens.
          if grep -qE '(HIGH|CRITICAL)' "${SCAN_OUT}/build-stage-vulnerabilities.txt" 2>/dev/null; then
            note="::warning title=High::${BUILDER_TAG} [build-stage HIGH or CRITICAL findings]"
            note="${note}"' expected: none | actual: the findings listed above |'
            note="${note}"' remediation: rebase the build stage onto the digest-pinned'
            note="${note}"' eclipse-temurin JDK image, whose Ubuntu layer is current, and'
            note="${note}"' supply Maven without relying on curl or wget in that image.'
            note="${note}"' This is a TOOLCHAIN PIN MOVE and needs approval - it is'
            note="${note}"' disclosed as a residual risk in DECISION_LOG.md and'
            note="${note}"' docs/validation-gates.md rather than actioned unilaterally,'
            note="${note}"' and it is reported rather than enforced because the only'
            note="${note}"' other remedy, pinned apt upgrades, expires when the Ubuntu'
            note="${note}"' archive drops the superseded versions.'
            printf '%s\n' "${note}"
          else
            printf 'The build stage carries no HIGH or CRITICAL finding.\n'
          fi

      # The scanner's OWN severity bands HIGH and CRITICAL fail the job, matching
      # the boundary the Maven scan enforces so the two gates cannot disagree about
      # what "serious" means. These are EXTERNAL vendor ratings - Trivy's labels for
      # a CVSS range - not this project's finding severities, which are Blocker, High,
      # Medium and Low. The `title=Blocker` on the annotation below is the project
      # severity; the bracketed HIGH/CRITICAL is the scanner's.
      # --ignore-unfixed is explicitly false: an advisory with no upstream fix is
      # still a disclosed exposure in the delivered image, and hiding it would let
      # the base image drift out of support while this job stayed green. The
      # findings are printed before the job fails, so the log names what broke
      # rather than only that something did.
      - name: Scan the delivered image and fail on HIGH or CRITICAL
        run: |
          set -euo pipefail
          mkdir -p "${SCAN_OUT}"
          if docker run --rm \
              --user "$(id -u):$(id -g)" \
              --volume "${IMAGE_ARCHIVE}:/scan/image.tar:ro" \
              --volume "${SCAN_OUT}:/out" \
              "${TRIVY_IMAGE}" \
                image \
                --input /scan/image.tar \
                --db-repository "${TRIVY_DB}" \
                --java-db-repository "${TRIVY_JAVA_DB}" \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --ignore-unfixed=false \
                --exit-code 1 \
                --format table \
                --output /out/image-vulnerabilities.txt; then
            status=0
          else
            status=$?
          fi

          cat "${SCAN_OUT}/image-vulnerabilities.txt"

          if [ "${status}" -ne 0 ]; then
            note="::error title=Blocker::${IMAGE_TAG} [HIGH and CRITICAL findings]"
            note="${note}"' expected: none | actual: the findings listed above |'
            note="${note}"' remediation: raise the pinned base image in Dockerfile, or'
            note="${note}"' the affected dependency in pom.xml, to a fixed release.'
            note="${note}"' Suppressing a finding here is deliberately not available:'
            note="${note}"' this gate exists precisely because the dependency scan'
            note="${note}"' cannot see the image.'
            printf '%s\n' "${note}"
          else
            printf 'The delivered image carries no HIGH or CRITICAL finding.\n'
          fi
          exit "${status}"

      # ----------------------------------------------------------------------
      # The development topology's third-party images: REPORTED, not enforced.
      #
      # The split is grounded in a measurement rather than a preference. These
      # images are development substrate - a developer runs them beside the
      # application and none is part of the delivered artefact - and their
      # contents are not this project's to fix. The current PostgreSQL patch
      # level, pinned here specifically to close a set of advisories including a
      # high-scoring one, still reports findings from a helper binary the official
      # image bundles, and no tag on that major line exists without them:
      # clearing them needs an upstream rebuild. A blocking gate would therefore
      # have exactly one available remedy - suppression - and a suppression list
      # that grows for reasons unrelated to this codebase is how a gate stops
      # being read at all.
      #
      # But the drift is real: outdated pins survived green builds because nothing
      # looked at them. Reporting without failing closes that specific gap - the
      # tags stay under continuous observation and land in the uploaded evidence,
      # while the build's verdict keeps meaning something about what this project
      # ships and can actually act on. This step is NOT a weakened gate; the gate
      # it complements is the blocking one above.
      #
      # The image list is read out of docker-compose.yml so the topology stays the
      # single source of truth and a service added there is covered without this
      # file being touched.
      # ----------------------------------------------------------------------
      - name: Report on the development topology images (informational)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "${SCAN_OUT}"
          report="${SCAN_OUT}/topology-images.txt"
          : > "${report}"

          mapfile -t images < <(grep -oE \
            '[a-z0-9][a-z0-9._/-]*:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' \
            docker-compose.yml | sort -u)

          if [ "${#images[@]}" -eq 0 ]; then
            note='::error title=High::docker-compose.yml [digest-pinned images]'
            note="${note}"' expected: at least one | actual: none found |'
            note="${note}"' remediation: this step would otherwise report nothing while'
            note="${note}"' appearing to succeed. Every service image in that file is'
            note="${note}"' digest-pinned; if that changed, fix the pin rather than this'
            note="${note}"' step.'
            printf '%s\n' "${note}"
            exit 1
          fi

          for image in "${images[@]}"; do
            printf '=== %s\n' "${image}" >> "${report}"
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              "${TRIVY_IMAGE}" \
                image \
                --db-repository "${TRIVY_DB}" \
                --java-db-repository "${TRIVY_JAVA_DB}" \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --exit-code 0 \
                --format table \
                "${image}" >> "${report}" 2>/dev/null
          done
          cat "${report}"

      - name: Upload the image scan and bill of materials
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: image-scan-evidence
          path: target/image-scan/**
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ------------------------------------------------------------------
  # THE BUILD PLUGIN GRAPH: THE GATE THAT SCANS THE SCANNER.
  #
  # dependency-check-maven reads the PROJECT's dependency graph. It is never
  # presented with the plugins that compile, test, measure and package that
  # project, so a vulnerable plugin dependency passed the vulnerability gate in
  # complete silence. pom.xml has recorded this gap in writing for some time,
  # together with the remedy it prescribes - enumerate with
  # dependency:resolve-plugins, then scan those coordinates OUTSIDE the build
  # rather than by adding a scanning plugin, which would introduce a plugin
  # coordinate the AAP does not sanction and enlarge the surface being measured.
  # This job is that remedy, implemented.
  #
  # It is not a hypothetical gap. The component whose verdict every other
  # dependency claim in this build rests on was itself resolving
  # httpclient5 5.4.2, carrying CVE-2025-27820 at CVSS 8.1 in hostname and domain
  # verification, on the very code path that fetches the advisory feed. A scanner
  # that can be fed attacker-chosen advisory data does not fail loudly - it
  # returns a clean report. pom.xml now overrides that transport at plugin scope,
  # and this job is what keeps the override honest: the scanner VERIFIES the
  # override against the plugin's real class realm and fails if it is ever
  # removed, because dependency:resolve-plugins alone cannot see it.
  #
  # WHY A REPOSITORY-OWNED SCRIPT AND NOT AN ACTION: the same reason the image
  # scan uses a digest-pinned image rather than a marketplace action. Closing a
  # supply-chain gap by adding a mutable third-party dependency to the critical
  # path trades one exposure for another. The script is in this repository, is
  # reviewable, and its only external dependency is the advisory service it
  # queries.
  #
  # WHY THE ADVISORY DATA IS NOT PINNED, while the toolchain is: exactly the
  # reasoning the image scan states for its own database. A frozen advisory set
  # cannot report an advisory published after it was frozen, so the data is
  # deliberately live and its ORIGIN is what is fixed.
  # ------------------------------------------------------------------
  plugin-graph-scan:
    name: Build plugin graph advisories (fail on undispositioned HIGH or CRITICAL)
    needs: verify
    runs-on: ubuntu-24.04
    # Resolves the plugin graph and queries a live advisory service once per
    # coordinate. No image build and no container, so the ceiling covers the
    # network calls and little else.
    timeout-minutes: 30
    env:
      PLUGIN_SCAN_OUT: ${{ github.workspace }}/target/plugin-graph
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_PATCH_VERSION }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_PATCH_VERSION }}
          cache: maven

      # Two listings, because they answer different questions and neither alone
      # is sufficient. resolve-plugins gives the DECLARED inventory - every
      # plugin and plugin-transitive coordinate, which is the conservative
      # superset. The -X run gives the plugin's REAL class realm, which is the
      # only place a project-level plugin <dependencies> override is observable.
      # The scanner reconciles them, so what is measured is what executes.
      - name: Enumerate the declared plugin graph and the real plugin realm
        run: |
          set -euo pipefail
          mkdir -p "${PLUGIN_SCAN_OUT}"
          ./mvnw -B -ntp dependency:resolve-plugins \
            | tee "${PLUGIN_SCAN_OUT}/resolve-plugins.txt"
          ./mvnw -B -X dependency-check:help -Ddetail=false \
            > "${PLUGIN_SCAN_OUT}/plugin-realm.log" 2>&1
          printf 'declared coordinates: %s | realm lines: %s\n' \
            "$(grep -cE '^\[INFO]\s+[^ ]+:[^ ]+:(jar|maven-plugin):' \
                 "${PLUGIN_SCAN_OUT}/resolve-plugins.txt" || true)" \
            "$(grep -c 'Included:' "${PLUGIN_SCAN_OUT}/plugin-realm.log" || true)"

      - name: Scan the plugin graph and fail on undispositioned HIGH or CRITICAL
        run: |
          set -euo pipefail
          python3 .github/plugin-graph/scan_plugin_graph.py \
            --inventory "${PLUGIN_SCAN_OUT}/resolve-plugins.txt" \
            --realm "${PLUGIN_SCAN_OUT}/plugin-realm.log" \
            --dispositions .github/plugin-graph/dispositions.json \
            --out "${PLUGIN_SCAN_OUT}"

      - name: Upload the plugin graph advisory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: plugin-graph-evidence
          path: target/plugin-graph/**
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ------------------------------------------------------------------
  # The eight gates, collated. Every result is DERIVED from the job that
  # produced it - nothing here is hardcoded, and the word "pass" is deliberately
  # never asserted about a gate this run did not execute. Where a result cannot
  # be produced the mandated wording is used verbatim, together with what is
  # needed to produce it.
  #
  # if: always() so a failing run still publishes its evidence, which is what
  # makes the automated feedback in a pull request actionable.
  # ------------------------------------------------------------------
  gate-evidence:
    name: Validation gate evidence
    needs:
      - repository-integrity
      - verify
      - integration
      - image-scan
      # plugin-graph-scan produces a security result of its own - a High or
      # Critical advisory on the BUILD PLUGIN graph, accepted only against a
      # written, expiring disposition - and it was the one gate job whose
      # conclusion this document never mentioned. Its failure already failed the
      # run, so nothing was ever reported green on its silence; what was missing
      # is the reverse, and it is the more insidious half. A reader of the
      # evidence could not tell whether that scan had run at all, and an
      # evidence document that omits a scan reads exactly like one whose scan
      # passed. Declaring it here puts its conclusion into the collation and into
      # the verdict below.
      - plugin-graph-scan
    if: always()
    runs-on: ubuntu-24.04
    # Two artefact downloads and one python generation pass. Both downloads carry
    # continue-on-error, so an absent artefact is reported rather than waited on,
    # and this ceiling covers the transfers themselves.
    timeout-minutes: 20
    env:
      # Routed through env: rather than interpolated into the script body.
      INTEGRITY_RESULT: ${{ needs.repository-integrity.result }}
      VERIFY_RESULT: ${{ needs.verify.result }}
      INTEGRATION_RESULT: ${{ needs.integration.result }}
      IMAGE_SCAN_RESULT: ${{ needs.image-scan.result }}
      PLUGIN_GRAPH_RESULT: ${{ needs.plugin-graph-scan.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # ----------------------------------------------------------------------
      # The evidence this job renders is DOWNLOADED, not described. This job runs
      # on a fresh runner with no target/ of its own, so without these two
      # downloads it can see nothing but the other jobs' pass/fail conclusions -
      # which is exactly how the document it produces came to carry hardcoded
      # lifecycle prose that the run it described had already contradicted.
      #
      # continue-on-error, because a run that failed before the tiers executed
      # genuinely has no artifact to fetch. That is a real condition and the
      # document reports it as "Not available" with what is needed, rather than
      # this job failing and publishing nothing at all.
      # ----------------------------------------------------------------------
      - name: Download the retained test reports
        id: reports
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: test-reports
          path: ${{ runner.temp }}/evidence/test-reports

      - name: Download the retained gate harness evidence
        id: harness
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: gate-harness-raw-evidence
          path: ${{ runner.temp }}/evidence/gate-harness

      # ----------------------------------------------------------------------
      # The document is GENERATED FROM THE RETAINED EVIDENCE, gate by gate.
      #
      # Building it from a heredoc over four job-conclusion
      # variables is what this generation step exists to avoid. Everything a job
      # conclusion cannot express would then be written by hand, and hand-written
      # lifecycle prose does not age: the document would go on publishing "the
      # end-to-end tier is pending implementation and execution" and "no legacy
      # baseline exists, so a field-level comparison cannot be produced" for gates
      # that have since been implemented, measured and asserted - in the same
      # document that claims no figure is carried over
      # from an earlier run. A statement about the lifecycle IS a figure.
      #
      # So every Result below is derived: from the suite XML the verify job
      # retained, from the harness's own recorded figures, and from the job
      # conclusions where a conclusion is genuinely the whole answer. Nothing that
      # cannot be derived is asserted - it is reported as "Not available" together
      # with what would produce it, which is the disclosure Rule 1 clause F
      # requires and which a hardcoded sentence cannot honestly make.
      #
      # Generated with python rather than a heredoc for a specific reason. The
      # heredoc was chosen originally to avoid a printf hazard - a long line split
      # across two calls leaves the placeholders in one and the arguments in the
      # other, rendering an evidence document that states no evidence. Python has
      # no format-and-argument split to get wrong, and unlike a heredoc it can
      # express "derive this, and say so plainly when you cannot".
      # ----------------------------------------------------------------------
      - name: Collate the eight gates and their evidence
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/gate-evidence"

          # The commit THIS job checked out. The harness stamps the commit it ran
          # against into its own marker, so an artefact downloaded from a different
          # commit is detectable here instead of being rendered as this run's
          # evidence. That is the mechanism behind the "no figure carried over"
          # claim at the foot of the document: it is now enforced, not asserted.
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          export CHECKED_OUT_COMMIT
          export EVIDENCE_ROOT="${RUNNER_TEMP}/evidence"
          export REPORT_PATH="${RUNNER_TEMP}/gate-evidence/validation-gate-evidence.md"
          export BLOCKER_PATH="${RUNNER_TEMP}/gate-evidence/blocker.txt"

          # Everything the generator needs arrives through the environment, and the
          # heredoc is quoted, so the shell expands nothing inside the script. There
          # is no interpolation site for a value to break out of.
          python3 - <<'PY'
          """Render one run's gate evidence from the artefacts that run retained.

          Nothing here describes a gate's lifecycle. Each Result is derived from the
          suite XML the verify job retained, from the figures the gate harness
          recorded into its own marker and summary, or from a job conclusion where a
          conclusion is genuinely the whole answer. A figure that was not retained is
          reported as "Not available" together with what would produce it.
          """

          import os
          import xml.etree.ElementTree as ElementTree
          from datetime import datetime, timezone
          from pathlib import Path

          EVIDENCE_ROOT = Path(os.environ["EVIDENCE_ROOT"])
          REPORT_PATH = Path(os.environ["REPORT_PATH"])
          BLOCKER_PATH = Path(os.environ["BLOCKER_PATH"])
          CHECKED_OUT = os.environ["CHECKED_OUT_COMMIT"]
          RUN_URL = os.environ.get("RUN_URL", "")
          GITHUB_SHA = os.environ.get("GITHUB_SHA", "")

          HARNESS = "com.cardemo.e2e.GateVerificationTest"
          MARKER_NAME = "gate-verification-evidence.properties"
          SUMMARY_NAME = "gate-verification-summary.properties"
          NA = "Not available"

          CONCLUSIONS = {
              "repository-integrity": os.environ.get("INTEGRITY_RESULT", ""),
              "verify": os.environ.get("VERIFY_RESULT", ""),
              "integration": os.environ.get("INTEGRATION_RESULT", ""),
              "image-scan": os.environ.get("IMAGE_SCAN_RESULT", ""),
              "plugin-graph-scan": os.environ.get("PLUGIN_GRAPH_RESULT", ""),
          }


          def observed(job):
              """Say what a job's conclusion shows, never what it proves."""
              result = CONCLUSIONS.get(job, "")
              if result == "success":
                  return "no findings reported"
              if result == "failure":
                  return "findings reported - see the annotations in the run"
              if result == "cancelled":
                  return NA + " - the job was cancelled before it concluded"
              if result == "skipped":
                  return NA + " - the job did not run because a prerequisite failed"
              return NA + " - the job reported an unrecognised conclusion"


          def locate(filename):
              """Find one retained file by name, wherever the download placed it."""
              if not EVIDENCE_ROOT.is_dir():
                  return None
              for candidate in sorted(EVIDENCE_ROOT.rglob(filename)):
                  if candidate.is_file():
                      return candidate
              return None


          def properties(path):
              """Read a properties file into a dict, tolerating its absence."""
              values = {}
              if path is None:
                  return values
              for raw in path.read_text(encoding="utf-8", errors="replace").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, _, value = line.partition("=")
                  values[key.strip()] = value.strip()
              return values


          def suites():
              """Index every retained suite report by its fully qualified class name.

              Counted from the `testcase` ELEMENTS, never from the root `testsuite`
              element's summary attributes. Those attributes are not reliable for a
              suite that uses nested classes: the harness's own report carries
              tests="0" on its root while holding 50 `testcase` children, because the
              cases are attributed to the nested classes rather than to the file's
              own class. Reading the attribute renders a suite that ran everything as
              a suite that ran nothing - which is how a first draft of this generator
              reported the harness as having been collected but not run. The two
              collection-audit steps in the verify job count elements for the same
              reason; this agrees with them deliberately.
              """
              found = {}
              if not EVIDENCE_ROOT.is_dir():
                  return found
              for report in sorted(EVIDENCE_ROOT.rglob("TEST-*.xml")):
                  tier = "failsafe" if "failsafe" in str(report.parent).lower() else "surefire"
                  try:
                      root = ElementTree.parse(report).getroot()
                  except ElementTree.ParseError:
                      found[report.stem[len("TEST-"):]] = {"tier": tier, "unreadable": True}
                      continue
                  name = root.get("name") or report.stem[len("TEST-"):]
                  cases = list(root.iter("testcase"))
                  found[name] = {
                      "tier": tier,
                      "tests": len(cases),
                      "failures": sum(1 for case in cases if case.find("failure") is not None),
                      "errors": sum(1 for case in cases if case.find("error") is not None),
                      "skipped": sum(1 for case in cases if case.find("skipped") is not None),
                  }
              return found


          MARKER = properties(locate(MARKER_NAME))
          SUMMARY = properties(locate(SUMMARY_NAME))
          SUITES = suites()


          def suite_line(fqcn):
              """Report one suite's retained outcome, or say it was not retained.

              A report recording zero cases is reported as unavailable, not as clean.
              Surefire and Failsafe both write a well-formed report for a suite that
              was collected but ran nothing - a filtered run, an assumption that
              aborted every case - and "0 case(s) with no failure and no error" is
              indistinguishable from a suite that passed. That substitution of a
              count for a named suite having run is the exact defect this whole
              derivation exists to remove, so it is refused here too.
              """
              suite = SUITES.get(fqcn)
              if suite is None:
                  return NA + " - no `" + fqcn + "` report was retained by this run"
              if suite.get("unreadable"):
                  return NA + " - the `" + fqcn + "` report could not be parsed"
              if suite["tests"] == 0:
                  return (NA + " - the retained `" + fqcn + "` report records 0 cases, so "
                          "the suite was collected but ran nothing. Needed: an unfiltered "
                          "run of the tier that owns it.")
              adverse = suite["failures"] + suite["errors"]
              body = "`" + fqcn + "` ran " + str(suite["tests"]) + " case(s)"
              if adverse:
                  return (body + " and reported " + str(suite["failures"])
                          + " failure(s), " + str(suite["errors"]) + " error(s)")
              return body + " with no failure and no error"


          def figure(key, needed):
              """Return a recorded figure, or say plainly what would produce it."""
              value = SUMMARY.get(key)
              if not value:
                  return NA + " - the harness recorded no `" + key + "`. Needed: " + needed
              return value


          def tier(name):
              """Total the retained reports of one test plugin."""
              totals = {"suites": 0, "tests": 0, "failures": 0, "errors": 0, "skipped": 0}
              for suite in SUITES.values():
                  if suite.get("tier") != name or suite.get("unreadable"):
                      continue
                  totals["suites"] += 1
                  for field in ("tests", "failures", "errors", "skipped"):
                      totals[field] += suite[field]
              return totals


          def tier_line(name):
              """Render one plugin's retained totals."""
              totals = tier(name)
              if totals["suites"] == 0:
                  return NA + " - no " + name + " report was retained"
              return (str(totals["suites"]) + " suite(s), " + str(totals["tests"])
                      + " case(s), " + str(totals["failures"]) + " failure(s), "
                      + str(totals["errors"]) + " error(s), " + str(totals["skipped"])
                      + " skipped")


