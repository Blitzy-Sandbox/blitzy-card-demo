# ******************************************************************
# Program     : build.yml
# Application : CardDemo
# Type        : GitHub Actions continuous integration workflow
# Function    : Validate the complete Java 25 / Spring Boot 3.5.11 migration
#               and publish evidence. Never deploys.
# Source      : docs/technical-specifications.md section 0 (the Agent Action
#               Plan: the CI contract, the pinned versions, the eight gates)
#               + pom.xml, mvnw, mvnw.cmd, .mvn/wrapper/maven-wrapper.properties
#               (the Maven build this harness drives)
#               + app/** (the frozen legacy parity corpus; specifically the JES2
#               job stream, whose COND=(0,NE) step gating is the direct
#               antecedent of the fail-fast step sequencing below -
#               app/jcl/CREASTMT.JCL:56 STEP020 EXEC PGM=IDCAMS,COND=(0,NE),
#               app/jcl/CREASTMT.JCL:66 STEP030 EXEC PGM=IEFBR14,COND=(0,NE),
#               app/jcl/CREASTMT.JCL:79 STEP040 EXEC PGM=CBSTM03A,COND=(0,NE))
#               + docs/validation-gates.md, anchors #gate-1 through #gate-8
#               (the eight gates this workflow produces evidence for)
