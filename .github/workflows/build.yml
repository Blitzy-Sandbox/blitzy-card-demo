name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  MAVEN_VERSION: "3.9.11"
  MAVEN_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"

jobs:

  # --------------------------------------------------------------------------
  # The legacy corpus is the parity oracle, the field-contract source and the
  # traceability anchor. Any modification under app/ invalidates all three.
  # --------------------------------------------------------------------------
  frozen-corpus-guard:
    name: Frozen corpus guard (app/ must be unmodified)
    runs-on: ubuntu-latest
    steps:
      - name: Check out with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert no change under app/
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "${base}" ]; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          changed="$(git diff --name-only "${base}" HEAD -- app/ || true)"
          if [ -n "${changed}" ]; then
            echo "::error::The frozen COBOL corpus under app/ was modified:"
            echo "${changed}"
            exit 1
          fi
          echo "app/ is unmodified."

  # --------------------------------------------------------------------------
  # Compile, unit tests, integration and e2e tests, coverage, enforcer.
  # --------------------------------------------------------------------------
  verify:
    name: Zero-warning build, tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Pin Apache Maven ${{ env.MAVEN_VERSION }}
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: ${{ env.MAVEN_VERSION }}

      - name: Report toolchain
        run: |
          java -version
          mvn -version

      - name: Verify (compile, unit + integration + e2e, JaCoCo >= 80% line)
        run: mvn -B -ntp -Ddependency-check.skip=true clean verify

      # ----------------------------------------------------------------------
      # Test-collection audit. Surefire 3.5.4 writes one report per top level
      # test class and records every JUnit 5 @Nested case as a <testcase>
      # element inside it, but it does NOT roll those cases up into the root
      # <testsuite tests="..."> attribute: a class whose cases all live in
      # @Nested groups advertises tests="0" while carrying hundreds of
      # elements. The tests really do run - Maven's own console summary and the
      # elements agree - but any consumer that sums the suite attributes reads a
      # small fraction of the real total and can report undercollection on a
      # green build.
      #
      # Measured on this repository with Surefire 3.5.4 and JUnit 5.12.2: 106
      # surefire suite reports carrying 9,314 <testcase> elements, against a
      # suite tests attribute sum of 1,571, with 89 of the 106 suites
      # advertising tests="0". The 3 failsafe reports are unaffected (39 = 39),
      # because those suites declare their cases at the top level.
      #
      # This step makes the <testcase> element count the authoritative total and
      # refuses the attribute sum as a substitute. It fails the build when no
      # cases are collected at all, when any case failed or errored - including a
      # failure inside a @Nested group of a suite that advertises zero, which an
      # attribute-only consumer cannot see - and it reports the discrepancy
      # rather than tolerating it silently. The discrepancy count falls to zero
      # on its own once a provider that rolls @Nested cases up into the suite
      # attribute is available, at which point this step keeps passing unchanged.
      # ----------------------------------------------------------------------
      - name: Audit test collection (testcase elements are the authoritative total)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          FAILED = 0
          TOTAL = 0
          ATTRIBUTE_SUM = 0
          UNDERREPORTING_SUITES = 0
          SUITES = 0

          for directory in ("target/surefire-reports", "target/failsafe-reports"):
              for report in sorted(glob.glob(directory + "/TEST-*.xml")):
                  root = ET.parse(report).getroot()
                  cases = list(root.iter("testcase"))
                  advertised = int(root.get("tests") or 0)
                  SUITES += 1
                  TOTAL += len(cases)
                  ATTRIBUTE_SUM += advertised
                  if advertised < len(cases):
                      UNDERREPORTING_SUITES += 1
                  for case in cases:
                      if case.find("failure") is not None or case.find("error") is not None:
                          FAILED += 1
                          print("FAILED: {}#{}".format(case.get("classname"), case.get("name")))

          print("suite reports                : {}".format(SUITES))
          print("testcase elements (AUTHORITY) : {}".format(TOTAL))
          print("suite tests attribute sum     : {}".format(ATTRIBUTE_SUM))
          print("suites under-advertising      : {}".format(UNDERREPORTING_SUITES))
          print("failed or errored cases       : {}".format(FAILED))

          if SUITES == 0 or TOTAL == 0:
              sys.exit("no test cases were collected; the reports are missing or empty")
          if FAILED:
              sys.exit("{} test case(s) failed or errored".format(FAILED))
          if ATTRIBUTE_SUM < TOTAL:
              print(
                  "NOTE: the suite tests attributes under-report by {} case(s) across {} suite(s), "
                  "because Surefire does not roll JUnit 5 @Nested cases up into the root testsuite "
                  "tests attribute. Suite-attribute-only aggregation is REJECTED for this "
                  "repository: the testcase element count above is the authoritative total, and "
                  "this step has already asserted that none of those cases failed."
                  .format(TOTAL - ATTRIBUTE_SUM, UNDERREPORTING_SUITES)
              )
          PY

      - name: Upload surefire and failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/**
          if-no-files-found: ignore

      - name: Upload executable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: carddemo-jar
          path: target/carddemo-*.jar
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # OWASP dependency-check. Kept as its own job because the NVD feed update
  # dominates the run time and needs its own cache. A High/Critical finding
  # (CVSS >= 7) fails the job; an unavailable feed is reported as a blocker
  # rather than being silently treated as a pass.
  # --------------------------------------------------------------------------
  security-scan:
    name: OWASP dependency-check (fail on CVSS >= 7)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Pin Apache Maven ${{ env.MAVEN_VERSION }}
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: ${{ env.MAVEN_VERSION }}

      - name: Cache the NVD data directory
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      - name: Fail fast when no NVD API key is configured
        run: |
          if [ -z "${{ secrets.NVD_API_KEY }}" ]; then
            echo "::error::NVD_API_KEY is not configured. The OWASP feed update" \
                 "cannot complete reliably without it, and the scan must not be" \
                 "reported as passing on incomplete vulnerability data." \
                 "Request a key at https://nvd.nist.gov/developers/request-an-api-key" \
                 "and add it as a repository secret named NVD_API_KEY."
            exit 1
          fi

      - name: Run the vulnerability scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -ntp org.owasp:dependency-check-maven:12.1.0:check

      - name: Upload the dependency-check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: target/dependency-check/**
          if-no-files-found: ignore
