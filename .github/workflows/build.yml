# * File         : build.yml
# * Application  : CardDemo
# * Type         : GitHub Actions continuous integration workflow
# * Function     : Provides the deterministic, repeatable zero-warning build
# *                harness the migration requires. There is no legacy
# *                equivalent - the z/OS build inputs were the three compile
# *                templates samples/BATCMP.jcl, samples/CICCMP.jcl and
# *                samples/BMSCMP.jcl driven by the three procedures
# *                samples/BUILDBAT.prc, samples/BUILDBMS.prc and
# *                samples/BUILDONL.prc, all of which are superseded by pom.xml.
# *                Pinned to JDK 25 and Maven 3.9.11. The frozen COBOL corpus in
# *                app/ is verified to be untouched on every run.
