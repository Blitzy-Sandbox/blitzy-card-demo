          add("  - Mapped operations: " + figure("gate5.mappedOperations", "a harness run"))
          add("  - Controllers: " + figure("gate5.controllers", "a harness run"))
          add("  - Seventeen operations, not eighteen: the eighteenth CICS transaction")
          add("    fronts " + figure("gate7.cocrdsec", "a harness run") + ", so no")
          add("    endpoint is invented for it.")
          add("- Remediation: exercise every endpoint against a real application context.")
          add("")

          add("## Gate 6 - security audit")
          add("")
          add("- Severity on failure: Blocker")
          add("- Command: the source-integrity steps in the repository-integrity job, plus")
          add("  the dependency vulnerability scan and the delivered-image scan")
