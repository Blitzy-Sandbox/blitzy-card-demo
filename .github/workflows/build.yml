      - name: Upload the gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: validation-gate-evidence
          path: ${{ runner.temp }}/gate-evidence/**
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      # The overall verdict is derived, so this job cannot report green while a
      # gate job failed. Rule 1 clause B: no swallowed failure, and no
      # conclusion that the evidence does not support.
      - name: Conclude on the collated gate results
        run: |
          set -euo pipefail
          failures=''
          for pair in "repository-integrity:${INTEGRITY_RESULT}" \
                      "verify:${VERIFY_RESULT}" \
                      "integration:${INTEGRATION_RESULT}" \
                      "image-scan:${IMAGE_SCAN_RESULT}" \
                      "plugin-graph-scan:${PLUGIN_GRAPH_RESULT}"; do
            job="${pair%%:*}"
            result="${pair#*:}"
            printf '%-22s %s\n' "${job}" "${result}"
            if [ "${result}" != 'success' ]; then
              failures="${failures} ${job}=${result}"
            fi
          done

          if [ -n "${failures}" ]; then
            note='::error title=Blocker::docs/validation-gates.md [gate jobs]'
            note="${note}"' expected: every gate job to conclude success |'
            note="${note} actual:${failures} | remediation: open the named job in"
            note="${note} ${RUN_URL} and act on its annotations, each of which carries"
            note="${note}"' the file path, the symbol checked, expected versus actual'
            note="${note}"' and a remediation line.'
            printf '%s\n' "${note}"
            exit 1
          fi
          printf 'Every gate job concluded success. Evidence: %s\n' "${RUN_URL}"
