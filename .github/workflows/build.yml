          add("  - Committed reject rows: " + figure("gate1.committedRejectRows", "the oracle"))
          add("  - Corroboration against the real z/OS runtime: "
              + figure("gate1.capturedMainframeRun", "a captured legacy run"))
          add("    Needed: " + figure("gate1.neededEvidence", "a captured legacy run"))
          add("- Remediation: the oracle is derived from `app/cbl/CBTRN02C.cbl` and the")
          add("  frozen fixture, so it proves the Java against the source of record. It")
