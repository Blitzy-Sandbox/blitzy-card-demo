# ******************************************************************
# * File         : docker-compose.yml
# * Application  : CardDemo
# * Type         : Local runtime topology (Docker Compose)
# * Function     : Provisions the substrate that replaces the z/OS runtime of
# *                the frozen COBOL corpus in app/. PostgreSQL 16 replaces the
# *                10 VSAM KSDS clusters catalogued in app/catlg/LISTCAT.txt and
# *                defined by the 12 IDCAMS jobs in app/jcl. LocalStack replaces
# *                the 7 GDG bases of app/jcl/DEFGDGB.jcl (S3) and the
# *                DEFINE TDQUEUE(JOBS) contract of app/csd/CARDDEMO.CSD (SQS
# *                FIFO), plus operator notification (SNS). Jaeger, Prometheus
# *                and Grafana supply the observability layer the COBOL corpus
# *                lacks entirely (its only instrumentation is DISPLAY and the
# *                9910-DISPLAY-IO-STATUS renderer of app/cbl/CBTRN02C.cbl).
# *                Supersedes app/jcl/OPENFIL.jcl and app/jcl/CLOSEFIL.jcl,
# *                whose purpose was making datasets available to the region.
# ******************************************************************
