# =============================================================================
# AWS CardDemo — Local Development Docker Compose Stack
#
# Purpose
# -------
# Brings up the Spring Boot application alongside its local-development
# dependencies for the AWS CardDemo COBOL -> Java/Spring Boot migration target:
#
#   - postgres   : PostgreSQL 16 (replaces VSAM KSDS persistence — AAP §0.6.2)
#   - localstack : LocalStack Pro 4.14.0+ (S3, SQS, SNS, Secrets Manager, KMS,
#                  StepFunctions, OpenSearch, Glue, Batch, IAM, CloudWatch,
#                  CloudTrail — AAP §0.5.1 / §0.7.2)
#   - redis      : Redis 7 (ElastiCache cache-aside, allkeys-lru — AAP §0.3.3)
#   - kafka      : Bitnami Kafka 3.7 in KRaft single-node mode (replaces
#                  Amazon MSK + CICS TDQ — AAP §0.6.5)
#   - app        : Spring Boot 3.x application built from ./Dockerfile
#                  (replaces the entire CICS/JES runtime — AAP §0.3.1)
#
# Run
# ---
#   docker compose up -d                  # start everything in the background
#   docker compose up postgres redis      # bring up a subset
#   docker compose logs -f app            # tail application logs
#   docker compose ps                     # show service status + healthchecks
#   docker compose down                   # stop containers (preserve volumes)
#   docker compose down -v                # stop + WIPE all volumes (clean state)
#
# Environment Overrides
# ---------------------
# All sensitive values are local-dev placeholders only. Production credentials
# are sourced from AWS Secrets Manager (never this file — AAP §0.7.1 PCI-DSS).
#
# Required host env var (or .env file at repository root):
#   LOCALSTACK_AUTH_TOKEN  - LocalStack Pro license token (see env instructions
#                            in AAP §0.7.2). If unset/expired, the LocalStack
#                            container will fail to start — that is the
#                            expected behavior per the AAP. To run with the
#                            community edition instead (no Pro features),
#                            override the image with:
#                              docker compose run --rm -e LOCALSTACK_AUTH_TOKEN= \
#                                  --service-ports localstack
#                            or change the image tag below.
#
# Optional host env var (used for AWS region selection):
#   AWS_DEFAULT_REGION     - defaults to us-east-1.
#
# Service Discovery
# -----------------
# All services share the carddemo-net bridge network and resolve each other
# by Compose service name (postgres, redis, kafka, localstack). Never use
# "localhost" inside containers.
#
# Port Map (host -> container)
# ----------------------------
#   5432  -> postgres:5432
#   6379  -> redis:6379
#   9092  -> kafka:9092
#   4566  -> localstack:4566
#   8080  -> app:8080
#
# Persistence
# -----------
# Named volumes preserve state across `docker compose down`. Use
# `docker compose down -v` to discard them when you need a clean slate.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — replaces the 10 VSAM KSDS clusters and 2 AIX/PATH chains
  # documented in app/catlg/LISTCAT.txt. Schema is provisioned by Flyway
  # migrations under src/main/resources/db/migration/V*.sql at application
  # startup (AAP §0.6.2).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: carddemo-postgres
    environment:
      POSTGRES_DB: carddemo
      POSTGRES_USER: carddemo
      POSTGRES_PASSWORD: carddemo
      # Force NUMERIC behavior consistent with COBOL PIC S9(n)V99 (AAP §0.6.1)
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carddemo -d carddemo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - carddemo-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # LocalStack Pro 4.14.0 — emulates the AWS services required for local dev
  # and integration testing (AAP §0.5.1 / §0.7.2 / §0.6.6). The init-scripts
  # bind mount under ./localstack/init is configured below; the init script
  # (provisioning KMS CMKs, S3 buckets, Secrets Manager entries, SQS queues,
  # SNS topics, and SSM parameters) is added by a future scoped checkpoint
  # — when present, it is auto-executed when the container reaches the
  # "ready" state. Until then, the bind mount silently uses an empty
  # directory (Docker Compose creates the host-side bind source if absent)
  # so no AWS resources are seeded at container start.
  # ---------------------------------------------------------------------------
  localstack:
    # Per AAP §0.5.1 and the user environment instructions, the LocalStack
    # Pro 4.14.0 image is pinned explicitly (NOT `latest`) for build
    # reproducibility and to avoid drift between developer machines and
    # CI. The Pro tag is required because the AAP-mandated service set
    # includes Glue, Batch, OpenSearch, StepFunctions, and CloudTrail —
    # several of which need the Pro edition for full emulation fidelity.
    # If the runtime environment falls back to the community edition
    # (e.g., when LOCALSTACK_AUTH_TOKEN is absent or expired), operators
    # should replace the image tag below with `localstack/localstack:3.8`
    # (the community-edition equivalent currently used by the setup logs)
    # and accept the reduced service coverage.
    image: localstack/localstack-pro:4.14.0
    container_name: carddemo-localstack
    ports:
      - "4566:4566"
    environment:
      # AAP-mandated AWS service set covering S3 (sequential output + GDG
      # replacement), SQS (Secrets Manager rotation events), SNS (Macie
      # findings + rotation notifications), Secrets Manager (credentials),
      # KMS (CMKs for data-at-rest encryption), OpenSearch (audit log
      # indexing), CloudWatch + CloudTrail (observability + audit),
      # StepFunctions (JCL job stream replacement), Glue + Batch (ETL +
      # batch compute), IAM + Lambda + Logs + Events (supporting services).
      SERVICES: "s3,sqs,sns,secretsmanager,kms,opensearch,cloudwatch,cloudtrail,stepfunctions,iam,logs,events,lambda,glue,batch,ssm,dynamodb,kinesis,firehose,sts"
      DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      # Pro license token — sourced from host env or .env file. LocalStack
      # Pro refuses to start if this is empty or expired; that failure is
      # intentional per AAP §0.7.2 (the user environment instructions
      # explicitly call out `localstack auth set-token ${LOCALSTACK_AUTH_TOKEN}`).
      LOCALSTACK_AUTH_TOKEN: "${LOCALSTACK_AUTH_TOKEN:-}"
      DEBUG: "0"
      # State persistence across container restarts.
      PERSISTENCE: "1"
      DATA_DIR: /var/lib/localstack
      # Required because some emulated services (Lambda, Glue, Batch) need
      # to launch sibling Docker containers via the host Docker daemon.
      DOCKER_HOST: "unix:///var/run/docker.sock"
    volumes:
      # AAP §0.3.1 mandates LocalStack init scripts under
      # localstack/init/*.sh that provision S3 buckets, Secrets Manager
      # entries, KMS keys, etc. when the container reaches the "ready"
      # state. The init scripts are added by a future scoped checkpoint;
      # the bind mount remains so they take effect automatically once
      # committed without requiring a docker-compose.yml change.
      - "./localstack/init:/etc/localstack/init/ready.d:ro"
      # State persistence across restarts.
      - localstack-data:/var/lib/localstack
      # Required for the Lambda / Glue / Batch executors that launch
      # Docker containers from inside LocalStack.
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - carddemo-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis 7 — ElastiCache cache-aside for account balance lookups
  # (AAP §0.3.3, §0.6.6). maxmemory + allkeys-lru reproduces the production
  # ElastiCache eviction policy locally.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: carddemo-redis
    # The maxmemory-policy MUST be allkeys-lru per AAP §0.3.3:
    #   "ElastiCache Redis with TTL aligned to transaction frequency
    #    and allkeys-lru eviction policy."
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - carddemo-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Apache Kafka (apache/kafka official image, KRaft single-node) — replaces
  # Amazon MSK in production and CICS TDQ from the COBOL source (AAP §0.6.5).
  # KRaft mode eliminates the need for a separate Zookeeper container. Topics
  # are auto-created in local dev only; production topics are managed by
  # Terraform (infrastructure/terraform/msk.tf).
  #
  # Image / env-var contract: the official apache/kafka image consumes
  # broker configuration through KAFKA_* environment variables WITHOUT the
  # "_CFG_" infix that the older bitnami/kafka image required. Using the
  # wrong prefix silently no-ops (env vars are dropped), which historically
  # left the broker with default offsets.topic.replication.factor=3 against
  # a single-broker quorum and broke __consumer_offsets auto-creation,
  # rebalance, and ALL @KafkaListener registrations (CP4 QA Issue #14).
  # Every variable below uses the apache/kafka KAFKA_* form and the
  # single-broker durability overrides necessary for the local dev quorum.
  # ---------------------------------------------------------------------------
  kafka:
    # ---------------------------------------------------------------------------
    # Code Review CP7 (MAJOR — Dependency Pinning / AAP §0.5.1):
    # AAP §0.5.1 forbids `:latest` or other floating tags for any container
    # image — every dependency must be pinned to a specific version so local
    # development runs against a known-compatible broker and CI builds are
    # reproducible.
    #
    # Pin: apache/kafka:3.8.1 — the latest 3.8.x patch at the time of this
    # remediation. 3.8.x is the Spring for Apache Kafka 3.3.x baseline
    # (Spring Boot 3.3.5 uses Spring Kafka 3.2.x which is wire-compatible
    # with brokers 3.x). The image is the official Apache Software
    # Foundation distribution that supports KRaft mode without Zookeeper.
    #
    # Upgrade cadence: review when Apache Kafka issues a new 3.8.x patch
    # (security/critical fixes) or when a new minor (3.9.x, 4.0.x) becomes
    # the Spring for Apache Kafka baseline. Update Spring Kafka first,
    # rebuild the test matrix, then bump this tag.
    # ---------------------------------------------------------------------------
    image: apache/kafka:3.8.1
    container_name: carddemo-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode (no Zookeeper) — single node combined controller + broker.
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      # Listeners: 9092 for client traffic, 9093 for inter-broker controller.
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Auto-create topics is enabled for local dev only — production uses
      # Terraform-defined topics (AAP §0.6.5).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Producer durability defaults match the AAP §0.6.5 ordering invariant
      # (acks=all, idempotent producer). Single-broker overrides MUST be 1
      # so __consumer_offsets, __transaction_state, and user topics can be
      # auto-created on a quorum of one (CP4 QA Issue #14 resolution).
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      # KRaft data dir — must match the volume mount below. The apache/kafka
      # image defaults to /tmp/kraft-combined-logs but that is ephemeral
      # tmpfs and prone to wipe across restarts; pin to /var/lib/kafka/data.
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # kafka-broker-api-versions.sh ships with the apache/kafka image at
      # /opt/kafka/bin/ (NOT on PATH — invoke with full path).
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - carddemo-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Spring Boot 3.x application — the Java/Spring Boot target of the COBOL ->
  # Java migration. Built locally from ./Dockerfile (multi-stage Maven + JRE).
  # Reads configuration from src/main/resources/application*.yml with
  # environment-variable overrides set below for the local Compose stack.
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: carddemo:local
    container_name: carddemo-app
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # ---- Spring profile selection ----
      SPRING_PROFILES_ACTIVE: local

      # ---- AWS region + credentials (LocalStack defaults) ----
      AWS_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"

      # ---- AWS endpoint override (routes all AWS SDK calls to LocalStack) ----
      AWS_ENDPOINT_URL: "http://localstack:4566"

      # ---- AAP §0.7.2 mandated environment variables ----
      # Sensitive values are placeholders only — production reads ARNs from
      # AWS Secrets Manager / Parameter Store.
      RDS_SECRET_ARN: "arn:aws:secretsmanager:us-east-1:000000000000:secret:carddemo/rds"
      KMS_KEY_ARN: "arn:aws:kms:us-east-1:000000000000:key/00000000-0000-0000-0000-000000000000"
      MSK_BOOTSTRAP_SERVERS: "kafka:9092"
      S3_OUTPUT_BUCKET: "carddemo-output"
      OPENSEARCH_ENDPOINT: "http://localstack:4566"
      ECS_CLUSTER_NAME: "carddemo-cluster-local"

      # ---- Spring Data + JPA (PostgreSQL via Compose service DNS) ----
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/carddemo"
      SPRING_DATASOURCE_USERNAME: "carddemo"
      SPRING_DATASOURCE_PASSWORD: "carddemo"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
      SPRING_FLYWAY_ENABLED: "true"

      # ---- Spring Data Redis ----
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"

      # ---- Spring Kafka ----
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

      # ---- JVM tuning for container deployment ----
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
    healthcheck:
      # Image already declares its own HEALTHCHECK (see Dockerfile); we
      # restate here so docker compose ps surfaces health status uniformly.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - carddemo-net
    restart: unless-stopped

# -----------------------------------------------------------------------------
# Single bridge network — every service resolves its peers by Compose
# service name (postgres, redis, kafka, localstack, app).
# -----------------------------------------------------------------------------
networks:
  carddemo-net:
    name: carddemo-net
    driver: bridge

# -----------------------------------------------------------------------------
# Named volumes — preserve state across `docker compose down`.
# Use `docker compose down -v` to remove them.
# -----------------------------------------------------------------------------
volumes:
  postgres-data:
    name: carddemo-postgres-data
  localstack-data:
    name: carddemo-localstack-data
  redis-data:
    name: carddemo-redis-data
  kafka-data:
    name: carddemo-kafka-data
