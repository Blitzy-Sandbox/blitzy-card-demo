# ******************************************************************
# * File         : docker-compose.yml
# * Application  : CardDemo
# * Type         : Local runtime topology (Compose Specification)
# * Function     : Stands up the complete substrate that replaces the z/OS
# *                runtime of the frozen COBOL corpus in app/, plus the Java 25
# *                application itself, as six containers on one isolated
# *                network. Derived from app/jcl/OPENFIL.jcl and
# *                app/jcl/CLOSEFIL.jcl, whose SDSF `CEMT SET FIL(...) OPE`
# *                and `CLO` decks made the CICS datasets available to the
# *                region: that operator step becomes declarative
# *                health-conditioned service dependency here. S3 replaces the
# *                generation data groups of app/jcl/DEFGDGB.jcl,
# *                app/jcl/DALYREJS.jcl and app/jcl/REPTFILE.jcl; one SQS FIFO
# *                queue replaces DEFINE TDQUEUE(JOBS) in
# *                app/csd/CARDDEMO.CSD; PostgreSQL replaces the ten VSAM KSDS
# *                clusters of app/catlg/LISTCAT.txt together with the USRSEC
# *                cluster that app/jcl/DUSRSECJ.jcl defines in JCL; and
# *                Jaeger, Prometheus and Grafana supply the observability
# *                layer the corpus lacks, whose whole instrumentation is
# *                DISPLAY plus the 9910-DISPLAY-IO-STATUS renderer of
# *                app/cbl/CBTRN02C.cbl.
