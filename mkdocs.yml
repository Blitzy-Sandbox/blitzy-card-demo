site_name: 'blitzy-card-demo'
# Backstage TechDocs publishes from this nav (catalog-info.yaml sets
# `backstage.io/techdocs-ref: dir:.`), so every document under docs/ must
# be listed here exactly once: an omitted page is built but never linked,
# and MkDocs reports that at INFO level only, so `mkdocs build --strict`
# still exits 0 and the page silently becomes undiscoverable. Verify with:
#   mkdocs build --strict 2>&1 | grep -c 'not included in the' (expect 0).
# DECISION_LOG.md and TRACEABILITY_MATRIX.md are deliberately absent: they
# are root evidence artifacts outside docs_dir, linked from README.md, and
# a `../` entry would not resolve here. Do not add or duplicate them.
nav:
  - Home: index.md
  - Project Guide: project-guide.md
  - Technical Specifications: technical-specifications.md
  - API Contracts: api-contracts.md
  - Architecture Before and After: architecture-before-after.md
  - Onboarding Guide: onboarding-guide.md
  - Validation Gates: validation-gates.md
  - Executive Presentation: executive-presentation.html
plugins:
  - techdocs-core
  - mermaid2
# The mermaid2 plugin alone is not sufficient here. techdocs-core enables
# pymdownx.superfences, which claims every fenced block first, so a ```mermaid
# fence was being rendered as a line-numbered, syntax-highlighted code block -
# the diagram source shown as literal text instead of a diagram. Registering
# mermaid as a custom fence hands those blocks to mermaid2 for client-side
# rendering. Verify with: mkdocs build && grep -c '<pre class="mermaid"' \
# site/technical-specifications/index.html   (expect 1 or more, not 0).
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
